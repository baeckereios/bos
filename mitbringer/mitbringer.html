  MODUL: mitbringer/mitbringer.html — Mitbringer (Gebrauchsmaterial melden, das die Fahrer mitbringen)
  Doku:  mitbringer/MITBRINGER_DOKU.md (dort auch der kanonische Nutzer-Hilfetext)
  Logik: mitbringer/mitbringer_logik.js (BOS_MITBRINGER — DIE Schnittstelle: Tag, Frist, Nachzügler,
         beobachteTag, lesen, schreiben, Druckansicht). Diese Seite rechnet nichts selbst.
  Druck: mitbringer/mitbringer_druck.js meldet den Zettel „mitbringer“ bei BOS_DRUCK an; die Seite druckt
         über denselben Zettel (BOS_DRUCK.zettel.drucke(['mitbringer'])) und baut nichts Zweites.
  Regel: RK §33, §34 (firestore_regeln_2026-11-18_namen.rules) — mitbringer_meldungen (eine Meldung = ein
         Dokument), mitbringer_tage (Ausdruck-Stand), mitbringer_material, mitbringer_einstellungen,
         mitbringer_sicherungen.
  Rechte: lesen jedes freigeschaltete Konto · melden nur Personenkonten · drucken Haken „Mitbringer
          drucken“ · fremde Meldungen ändern/streichen, Nachzügler aufnehmen, Material und Frist pflegen
          Haken „Mitbringer bearbeiten“. KEINE Rolle zählt, auch admin nicht (Ulf 18.11.2026).
          Kachel: Registry-Eintrag ohne roles und ohne haken (für alle da, das Schloss ist die Regel).
  Ohne Netz: ansehen ja, melden und ändern nein (Knöpfe grau mit Grund). Eine nachgereichte Meldung
          würde sonst still zum Nachzügler — es zählt die Serverzeit.
  In Planung (sichtbar auf der Seite): Rückmeldung „eingepackt / fehlt“, Monitor im Lager (#179/#181).
  Keine Daten in dieser Datei: keine Personen, keine Betriebsangaben.

      geschrieben. Neu eingebunden: ../bos_namen.js. Regelstand mitbringer-namen-2026-11-18.

};
function t(k, w) {
  let s = I18N_DE[k]; if (s === undefined) s = k;
  Object.keys(w || {}).forEach(function (x) { s = s.split('{' + x + '}').join(String(w[x])); });
  return s;
}
function wendeI18nAn() { document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); }); }
const esc = L ? L.esc : function (s) { return String(s); };
/* Für Texte mit <b> im Wörterbuch: die Werte werden maskiert, das Gerüst nicht. */
function tHtml(k, w) { const m = {}; Object.keys(w || {}).forEach(function (x) { m[x] = esc(w[x]); }); return t(k, m); }

/* ---------- Zustand ---------- */
const S = {
  kennung: null, konto: null, ich: { grund: '', text: '', name: '', personId: null }, recht: { lesen: false, melden: false, drucken: false, bearbeiten: false },
  geladen: false, regelstand: 'unbekannt', regelGrund: '', netz: navigator.onLine !== false,
  tage: { heute: null, morgen: null }, roh: { heute: null, morgen: null }, wahl: null,   /* wahl: null = Vorschlag */
  einst: L ? L.einstellungenVon(null) : null, material: null,
  reiter: 'liste', sheet: null, schreibt: false, sicher: null
};
function jetzt() { return Date.now(); }
/* Nur für Material, Einstellungen, Startliste: dort steht kein Name, nur die Kennung. */
function ctx() { return { kennung: S.kennung }; }
/* RK §34: Name FRISCH vor jedem Schreibvorgang, der einen Namen trägt (Rufname, sonst Beschreibung).
   Ein dauerhafter Grund (keine Person, mehrere, kein Name) sperrt die Knöpfe mit Text; ein Lesefehler nicht —
   der nächste Versuch liest wieder frisch. */
async function ctxFrisch() {
  try {
    const c = await L.ichFrisch(window.db, S.kennung, S.konto);
    S.ich = { grund: '', text: '', name: c.name, personId: c.personId };
    zeigeKonto();
    return c;
  } catch (err) {
    const g = err && err.ich ? err.ich.grund : '';
    const dauerhaft = ['keine_person', 'mehrere', 'kein_name', 'keine_kennung'].indexOf(g) !== -1;
    S.ich = { grund: dauerhaft ? g : '', text: (err && err.message) || String(err), name: '', personId: null };
    zeigeKonto(); planeRender();
    throw err;
  }
}
function grundName() { return S.ich && S.ich.grund ? S.ich.text : ''; }
function zeigeKonto() {
  const el = document.getElementById('kontoZeile');
  if (!S.kennung) { el.textContent = t('kein_konto'); return; }
  /* Stationskonto: der Ortsname (Notiz) — melden geht dort ohnehin nicht (station_hinweis) */
  if (S.konto && S.konto.art === 'ort') { el.textContent = String(S.konto.name || '') || S.kennung; return; }
  el.textContent = S.ich.name || S.ich.text || '…';
}

/* ---------- Fehler sichtbar (Checkliste §7a) ---------- */
function erklaerung(err) {
  const c = (err && err.code) || '';
  if (c === 'permission-denied') return t('err_perm');
  if (c === 'unavailable') return t('err_netz');
  return '';
}
function rohText(err) { return (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err)); }
function fehlerText(kontext, err) { return kontext + ': ' + [erklaerung(err), rohText(err)].filter(Boolean).join(' · '); }
function zeigeFehler(kontext, err) {
  console.error('[Mitbringer] ' + kontext, err);
  const li = document.createElement('li');
  li.textContent = fehlerText(kontext, err);
  const liste = document.getElementById('fehlerListe');
  liste.insertBefore(li, liste.firstChild);
  while (liste.children.length > 6) liste.removeChild(liste.lastChild);
  document.getElementById('fehlerLeiste').classList.remove('hidden');
}
window.addEventListener('error', function (e) { zeigeFehler(t('err_unbehandelt'), { message: (e.message || 'unbekannt') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')' }); });
window.addEventListener('unhandledrejection', function (e) { zeigeFehler(t('err_unbehandelt'), e.reason || { message: 'unbekannt' }); });
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3500);
}
function meldung(text, art) {
  const el = document.getElementById('meldungLeiste');
  if (!text) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.className = 'hinweis ' + (art || ''); el.textContent = text;
}
function zeigeNetz() {
  const el = document.getElementById('netzLeiste');
  el.textContent = t('netz_weg'); el.classList.toggle('hidden', S.netz);
}
window.addEventListener('online', function () { S.netz = true; zeigeNetz(); planeRender(); if (S.kennung && S.regelstand !== 'passt') pruefeRegelstand(); });
window.addEventListener('offline', function () { S.netz = false; zeigeNetz(); planeRender(); });

/* ---------- Laden und Beobachten ---------- */
let abos = [];
function abonniere() {
  abos.forEach(function (f) { f(); }); abos = [];
  const v = L.vorschlag(jetzt(), S.einst);
  S.tage = { heute: v.heute, morgen: v.morgen };
  S.roh = { heute: null, morgen: null };
  ['heute', 'morgen'].forEach(function (k) {
    const tag = S.tage[k];
    abos.push(L.beobachteTag(window.db, tag, function (bild, roh) {
      if (S.tage[k] !== tag) return;
      S.roh[k] = roh;
      /* Ändert sich die Frist-Einstellung, verschieben sich Vorschlag und Nachzügler — nicht die Tage. */
      if (roh.einst.fristMinute !== S.einst.fristMinute || roh.einst.leerzeilen !== S.einst.leerzeilen || roh.einst.vorgabe !== S.einst.vorgabe) S.einst = roh.einst;
      planeRender();
    }, function (err, was) { zeigeFehler(t('err_laden', { was: was + ' (' + tag + ')' }), err); S.roh[k] = S.roh[k] || { meldungen: [], tagDok: null, einst: S.einst, fehler: true }; planeRender(); }));
  });
  abos.push(L.beobachteMaterial(window.db, function (liste) { S.material = liste; planeRender(); if (S.sheet && S.sheet.art === 'meldung') fuelleMaterialWahl(); },
    function (err, was) { zeigeFehler(t('err_laden', { was: was }), err); S.material = S.material || []; planeRender(); }));
}
function bild(k) { const r = S.roh[k]; return r ? L.tagesbild(S.tage[k], r.meldungen, r.tagDok, r.einst, jetzt()) : null; }
function wahl() { return S.wahl || L.vorschlag(jetzt(), S.einst).vorschlag; }
/* Uhr: Tageswechsel → neu abonnieren; sonst nur neu zeichnen (Frist läuft ab, „Druck ab …“ wird frei). */
setInterval(function () {
  if (!S.geladen || !L) return;
  const v = L.vorschlag(jetzt(), S.einst);
  if (v.heute !== S.tage.heute) { S.wahl = null; abonniere(); }
  planeRender();
}, 20000);

async function pruefeRegelstand() {
  const r = await L.pruefeRegelstand(window.db);
  S.regelstand = r.stand; S.regelGrund = r.grund;
  if (r.stand === 'unbekannt') console.warn('[Mitbringer] Regelstand nicht prüfbar:', r.grund);
  const el = document.getElementById('regelLeiste');
  el.textContent = r.stand === 'unbekannt' ? t('regel_unbekannt', { fassung: L.REGEL_FASSUNG, grund: r.grund }) : t('regel_alt', { fassung: L.REGEL_FASSUNG, datei: L.REGEL_DATEI });
  el.classList.toggle('hidden', r.stand === 'passt');
  planeRender();
}
async function start() {
  wendeI18nAn(); renderHilfe(); zeigeNetz();
  if (!window.db || !window.BOS_AUTH_READY || !L) { zeigeFehler(t('err_laden', { was: 'Grundlagen' }), new Error('window.db, BOS_AUTH_READY oder mitbringer_logik.js fehlt')); return; }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; } catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); }
  S.kennung = nutzer && nutzer.email ? nutzer.email.split('@')[0] : null;
  if (S.kennung) {
    try { S.konto = await L.ladeKonto(window.db, S.kennung); }
    catch (err) { zeigeFehler(t('err_konto'), err); }
  }
  S.recht = L.rechte(S.konto);
  zeigeKonto();
  if (S.kennung && !(S.konto && S.konto.art === 'ort')) {
    try { await ctxFrisch(); } catch (err) { zeigeFehler(t('err_name'), err); }
  }
  const kh = document.getElementById('kontoHinweis');
  if (S.konto && S.konto.art === 'ort') { kh.textContent = t('station_hinweis'); kh.classList.remove('hidden'); }
  abonniere();
  S.geladen = true;
  planeRender();
  if (S.kennung) pruefeRegelstand();
}

/* ---------- Sperrgründe (die Knöpfe sind dann grau und sagen warum) ---------- */
function grundSchreiben() {
  if (!S.netz) return t('grund_netz');
  if (S.regelstand === 'alt') return t('grund_regel');
  return '';
}
function grundMelden() {
  if (!S.kennung) return t('kein_konto');
  if (!S.recht.melden) return t(S.konto && S.konto.art === 'ort' ? 'grund_station' : 'grund_person');
  if (grundName()) return grundName();
  if (S.material === null) return t('grund_laedt');
  if (!L.aktivesMaterial(S.material).length) return t('grund_material');
  return grundSchreiben();
}
function grundDrucken(k, b) {
  const D = window.BOS_MITBRINGER_DRUCK;
  if (!D || !D.angemeldet) return t('grund_druck_modul', { grund: (D && D.fehler) || 'mitbringer_druck.js fehlt' });
  if (k !== 'heute') return t('grund_druck_tag', { uhr: L.uhr(b.fristMs) });
  if (!b.fristVorbei) return t('grund_druck_frist', { uhr: L.uhr(b.fristMs) });
  return grundName() || grundSchreiben();
}

/* ---------- Zeichnen ---------- */
let renderGeplant = false;
function planeRender() { if (renderGeplant) return; renderGeplant = true; requestAnimationFrame(function () { renderGeplant = false; render(); }); }
function zahlText(n) { return n === 0 ? t('tag_zahl_0') : n === 1 ? t('tag_zahl_1') : t('tag_zahl_n', { n: n }); }
function render() {
  if (!S.geladen || !L) return;
  const k = wahl(), b = bild(k);
  document.getElementById('lade').classList.toggle('hidden', !!b);
  document.getElementById('haupt').classList.toggle('hidden', !b);
  if (!b) return;
  document.getElementById('tagwahl').innerHTML = ['heute', 'morgen'].map(function (x) {
    const bx = bild(x);
    return '<button type="button" role="tab" aria-selected="' + (x === k) + '" data-tag="' + x + '" class="' + (x === k ? 'aktiv' : '') + '"><span class="wort">' + esc(t(x)) + '</span><span class="datum">' + esc(L.tagKurz(S.tage[x])) + '</span><span class="zahl">' + esc(bx ? zahlText(bx.anzahl) : '…') + '</span></button>';
  }).join('');
  const tagWort = t(k) + ' (' + L.tagKurz(b.tag) + ')';
  let st = tHtml(b.fristVorbei ? 'frist_vorbei' : 'frist_offen', { tag: tagWort, uhr: L.uhr(b.fristMs) });
  if (b.gedruckt) {
    const g = b.gedruckt;
    st += '<br>' + (g.drucke > 1 ? tHtml('gedruckt_n', { wann: L.datumUhr(g.letzterDruckMs), name: g.druckName || g.druckVon, n: g.drucke, erst: L.uhr(g.ersterDruckMs) }) : tHtml('gedruckt', { wann: L.datumUhr(g.letzterDruckMs), name: g.druckName || g.druckVon }));
    const neu = b.bereiche.reduce(function (n, x) { return n + x.zeilen.filter(function (z) { return z.nochNichtGedruckt; }).length; }, 0);
    if (neu) st += '<br>' + tHtml('nach_druck', { n: neu });
  } else if (b.fristVorbei) st += '<br>' + esc(t('nicht_gedruckt'));
  if (S.einst.vorgabe && S.recht.bearbeiten) st += '<br>' + tHtml('frist_vorgabe', { uhr: L.uhrText(S.einst.fristMinute) });
  document.getElementById('statuszeile').innerHTML = st;
  const r = document.getElementById('reiter');
  r.classList.toggle('hidden', !S.recht.bearbeiten);
  if (!S.recht.bearbeiten) S.reiter = 'liste';
  r.innerHTML = [['liste', 'reiter_liste'], ['material', 'reiter_material']].map(function (x) { return '<button type="button" data-reiter="' + x[0] + '" class="' + (S.reiter === x[0] ? 'aktiv' : '') + '">' + esc(t(x[1])) + '</button>'; }).join('');
  /* Neuzeichnen darf das Tippen in den Einstellungen nicht unterbrechen: Fokus und Schreibmarke merken */
  const aktiv = document.activeElement, fokusId = aktiv && (aktiv.id === 'einstFrist' || aktiv.id === 'einstLeer') ? aktiv.id : null;
  document.getElementById('inhalt').innerHTML = S.reiter === 'material' ? materialHTML() : listeHTML(k, b);
  if (fokusId) { const f = document.getElementById(fokusId); if (f) f.focus(); }
}
function zeileHTML(z) {
  const eigen = z.vonKonto === S.kennung;
  const darfAendern = !z.wartet && ((eigen && S.recht.melden && z.frei) || (S.recht.bearbeiten && !z.gestrichen));
  const marken = [];
  if (z.wartet) marken.push('<span class="marke">' + esc(t('marke_wartet')) + '</span>');
  if (z.gestrichen) marken.push('<span class="marke">' + esc(t('marke_gestrichen', { name: z.gestrichenName, wann: L.uhr(z.gestrichenMs) })) + '</span>');
  else if (z.nachzuegler && !z.aufgenommen) marken.push('<span class="marke warn">' + esc(t('marke_nachzuegler')) + '</span>');
  else if (z.nachzuegler && z.aufgenommen) marken.push('<span class="marke gut">' + esc(t('marke_aufgenommen', { wann: L.uhr(z.aufgenommenMs), name: z.aufgenommenName })) + '</span>');
  if (z.nochNichtGedruckt) marken.push('<span class="marke warn">' + esc(t('marke_neu')) + '</span>');
  const knoepfe = [];
  if (S.recht.bearbeiten && z.nachzuegler && !z.aufgenommen && !z.gestrichen && !z.wartet) knoepfe.push('<button type="button" class="btn btn-outline btn-klein" data-aktion="aufnehmen" data-id="' + esc(z.id) + '"' + (grundName() || grundSchreiben() ? ' disabled' : '') + '>' + esc(t('aufnehmen')) + '</button>');
  if (darfAendern) knoepfe.push('<button type="button" class="icon" data-aktion="aendern" data-id="' + esc(z.id) + '" aria-label="' + esc(t('aendern_titel')) + '">✎</button>');
  return '<div class="zeile' + (z.gestrichen ? ' gestrichen' : '') + (z.nachzuegler && !z.aufgenommen && !z.gestrichen ? ' nachzuegler' : '') + '" data-meldung="' + esc(z.id) + '">' +
    '<div class="menge">' + esc(z.menge) + ' ' + esc(z.einheit) + '</div>' +
    '<div class="text"><div class="name">' + esc(z.material) + '</div>' + (z.notiz ? '<div class="notiz">' + esc(z.notiz) + '</div>' : '') +
    '<div class="unterzeile">' + esc(t('von', { name: z.vonName || z.vonKonto || '', wann: L.datumUhr(z.erstelltMs) })) + (z.geaendertMs ? ' · ' + esc(t('geaendert', { name: z.geaendertName || z.geaendertVon, wann: L.uhr(z.geaendertMs) })) : '') + '</div>' +
    (marken.length ? '<div>' + marken.join('') + '</div>' : '') + '</div>' +
    (knoepfe.length ? '<div class="knoepfe">' + knoepfe.join('') + '</div>' : '') + '</div>';
}
function listeHTML(k, b) {
  let h = '';
  const gm = grundMelden();
  h += '<div class="aktionen"><button type="button" class="btn btn-primary btn-gross" data-aktion="melden"' + (gm ? ' disabled' : '') + '>' + esc(t('melden')) + '</button>';
  if (gm) h += '<div class="grund" id="grundMelden">' + esc(gm) + '</div>';
  if (S.recht.drucken) {
    const gd = grundDrucken(k, b);
    h += '<button type="button" class="btn btn-outline btn-gross" data-aktion="drucken"' + (gd || S.schreibt ? ' disabled' : '') + '>' + esc(t(b.gedruckt ? 'nachdrucken' : 'drucken')) + '</button>';
    if (gd) h += '<div class="grund" id="grundDrucken">' + esc(gd) + '</div>';
  }
  h += '</div>';
  b.bereiche.forEach(function (x) {
    h += '<div class="bereich-titel" data-bereich="' + esc(x.id) + '"><span>' + esc(x.name) + '</span><span class="unterzeile">' + (x.zettel.length ? esc(t('zahl', { n: x.zettel.length })) : '') + '</span></div>';
    if (!x.zeilen.length) h += '<div class="nichts">' + esc(t('nichts')) + '</div>';
    x.zeilen.forEach(function (z) { h += zeileHTML(z); });
  });
  h += '<div class="planung"><div class="unterzeile">' + esc(t('planung_titel')) + '</div><div class="aktionen">' +
    '<button type="button" class="btn btn-outline" disabled aria-disabled="true">' + esc(t('planung_rueck')) + '</button>' +
    '<button type="button" class="btn btn-outline" disabled aria-disabled="true">' + esc(t('planung_monitor')) + '</button></div></div>';
  return h;
}
function materialHTML() {
  const liste = L.sichtbaresMaterial(S.material || []), g = grundSchreiben();
  let h = '<p class="unterzeile" style="margin:8px 0">' + esc(t('mat_hinweis')) + '</p>';
  const fehlt = L.STARTLISTE.some(function (m) { return !(S.material || []).some(function (x) { return x.id === m.id; }); });
  h += '<div class="aktionen"><button type="button" class="btn btn-primary" data-aktion="mat-neu"' + (g ? ' disabled' : '') + '>' + esc(t('mat_neu')) + '</button>';
  if (fehlt) h += '<button type="button" class="btn btn-outline" data-aktion="mat-start"' + (g || S.schreibt ? ' disabled' : '') + '>' + esc(t('mat_start')) + '</button>';
  if (g) h += '<div class="grund">' + esc(g) + '</div>';
  h += '</div>';
  if (!liste.length) h += '<div class="leer">' + esc(t('mat_leer')) + '</div>';
  liste.forEach(function (m) {
    h += '<div class="zeile mat-zeile' + (m.aktiv ? '' : ' aus') + '" data-material="' + esc(m.id) + '"><div class="text"><div class="name">' + esc(m.name) + '</div>' +
      '<div class="unterzeile">' + esc(m.einheiten.join(' · ')) + (m.fest ? ' — ' + esc(t('mat_fest')) : '') + (m.aktiv ? '' : ' — ' + esc(t('mat_aus'))) + '</div></div>' +
      '<div class="knoepfe"><button type="button" class="icon" data-aktion="mat-aendern" data-id="' + esc(m.id) + '" aria-label="' + esc(t('mat_aendern_titel')) + '"' + (g ? ' disabled' : '') + '>✎</button></div></div>';
  });
  h += '<div class="einst"><h3>' + esc(t('einst_titel')) + '</h3><p class="unterzeile">' + esc(t(S.einst.vorgabe ? 'einst_vorgabe' : 'einst_wirkt')) + '</p>' +
    '<div class="einst-raster"><div class="feld-zeile"><label for="einstFrist">' + esc(t('einst_frist')) + '</label><input type="time" id="einstFrist" value="' + esc(S.einstEingabe ? S.einstEingabe.frist : L.uhrText(S.einst.fristMinute)) + '"' + (g ? ' disabled' : '') + '></div>' +
    '<div class="feld-zeile"><label for="einstLeer">' + esc(t('einst_leer')) + '</label><input type="number" id="einstLeer" inputmode="numeric" min="0" max="' + L.GRENZEN.leerzeilenMax + '" value="' + esc(S.einstEingabe ? S.einstEingabe.leer : S.einst.leerzeilen) + '"' + (g ? ' disabled' : '') + '></div></div>' +
    '<div class="meldung" id="einstMeldung"></div>' +
    '<button type="button" class="btn btn-outline" data-aktion="einst-speichern"' + (g || S.schreibt ? ' disabled' : '') + '>' + esc(t('einst_speichern')) + '</button></div>';
  return h;
}

/* ---------- Blatt: Melden / Ändern ---------- */
function oeffneSheet(html, zustand) {
  S.sheet = zustand; S.sicher = null;
  document.getElementById('toast').classList.add('hidden');   /* die Bestätigung von eben soll keine Knöpfe im Blatt verdecken */
  document.getElementById('sheetInhalt').innerHTML = html;
  document.getElementById('sheet').classList.remove('hidden');
}
function schliesseSheet() { S.sheet = null; S.sicher = null; document.getElementById('sheet').classList.add('hidden'); document.getElementById('sheetInhalt').innerHTML = ''; }
function sheetMeldung(text) { const el = document.getElementById('sheetMeldung'); if (el) el.textContent = text || ''; }
function pillen(name, liste, aktiv) {
  return '<div class="pillen" data-pillen="' + name + '">' + liste.map(function (x) { return '<button type="button" data-wert="' + esc(x.id) + '" class="' + (x.id === aktiv ? 'aktiv' : '') + '" aria-pressed="' + (x.id === aktiv) + '">' + esc(x.name) + '</button>'; }).join('') + '</div>';
}
function meldungFinden(id) {
  for (const k of ['heute', 'morgen']) { const b = bild(k); if (!b) continue; for (const x of b.bereiche) for (const z of x.zeilen) if (z.id === id) return z; }
  return null;
}
function oeffneMeldung(id) {
  const z = id ? meldungFinden(id) : null;
  if (id && !z) { toast(t('nichts')); return; }
  let bereich = z ? z.bereich : '';
  if (!z) { try { bereich = localStorage.getItem(SPEICHER_BEREICH) || ''; } catch (e) { /* Speicher gesperrt: dann eben wählen */ } }
  const s = { art: 'meldung', id: id || null, tagWahl: wahl(), bereich: bereich, materialId: z ? z.materialId : '', einheit: z ? z.einheit : '', frei: z ? z.frei : true,
    start: z ? JSON.stringify([z.bereich, z.materialId, z.einheit, String(z.menge), z.freitext]) : JSON.stringify([bereich, '', '', '1', '']) };
  let h = '<h2>' + esc(t(z ? 'aendern_titel' : 'melden_titel')) + '</h2>';
  if (!z) h += '<div class="feld-zeile"><div class="label">' + esc(t('fuer_tag')) + '</div>' + pillen('tag', [{ id: 'heute', name: t('heute') + ' · ' + L.tagKurz(S.tage.heute) }, { id: 'morgen', name: t('morgen') + ' · ' + L.tagKurz(S.tage.morgen) }], s.tagWahl) + '<div class="unterzeile" id="tagHinweis" style="margin-top:6px"></div></div>';
  else if (!z.frei) h += '<div class="hinweis warn" style="margin:0 0 8px">' + esc(t('streichen_hinweis')) + '</div>';
  h += '<div class="feld-zeile"><div class="label">' + esc(t('bereich')) + '</div>' + pillen('bereich', L.BEREICHE, s.bereich) + '</div>';
  h += '<div class="feld-zeile"><label for="materialWahl">' + esc(t('material')) + '</label><select id="materialWahl"></select></div>';
  h += '<div class="feld-zeile"><div class="label">' + esc(t('einheit')) + '</div><div id="einheitWahl"></div></div>';
  h += '<div class="feld-zeile"><label for="mengeFeld">' + esc(t('menge')) + '</label><div class="mengen"><button type="button" data-aktion="minus" aria-label="weniger">−</button><input id="mengeFeld" inputmode="numeric" autocomplete="off" value="' + esc(z ? z.menge : 1) + '"><button type="button" data-aktion="plus" aria-label="mehr">＋</button></div></div>';
  h += '<div class="feld-zeile"><label for="freitextFeld" id="freitextLabel">' + esc(t('freitext')) + '</label><input type="text" id="freitextFeld" maxlength="' + L.GRENZEN.freitext + '" placeholder="' + esc(t('freitext_platz')) + '" value="' + esc(z ? z.freitext : '') + '"></div>';
  h += '<div class="meldung" id="sheetMeldung" role="alert"></div><div class="sheet-knoepfe"><button type="button" class="btn btn-primary" data-aktion="meldung-speichern">' + esc(t(z ? 'speichern' : 'absenden')) + '</button>';
  if (z && z.frei) h += '<button type="button" class="btn btn-gefahr" data-aktion="meldung-loeschen">' + esc(t('loeschen')) + '</button>';
  if (z && !z.frei && S.recht.bearbeiten && !z.gestrichen) h += '<button type="button" class="btn btn-gefahr" data-aktion="meldung-streichen">' + esc(t('streichen')) + '</button>';
  h += '<button type="button" class="btn btn-outline" data-aktion="sheet-zu">' + esc(t('abbrechen')) + '</button></div>';
  oeffneSheet(h, s);
  fuelleMaterialWahl(); zeigeTagHinweis();
}
function materialNachId(id) { return (S.material || []).filter(function (m) { return m.id === id; })[0] || null; }
function fuelleMaterialWahl() {
  const s = S.sheet, sel = document.getElementById('materialWahl'); if (!s || !sel) return;
  const liste = L.aktivesMaterial(S.material || []);
  /* ein abgeschaltetes Material einer alten Meldung bleibt sichtbar, aber nicht speicherbar */
  const jetztM = materialNachId(s.materialId);
  let h = '<option value="">' + esc(t('material_waehlen')) + '</option>';
  if (jetztM && !jetztM.aktiv) h += '<option value="' + esc(jetztM.id) + '">' + esc(jetztM.name) + ' (' + esc(t('mat_aus')) + ')</option>';
  h += liste.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name) + '</option>'; }).join('');
  sel.innerHTML = h; sel.value = s.materialId || '';
  fuelleEinheiten();
}
function fuelleEinheiten() {
  const s = S.sheet; if (!s) return;
  const m = materialNachId(s.materialId), e = m ? m.einheiten : [];
  if (e.indexOf(s.einheit) === -1) s.einheit = e.length ? e[0] : '';
  document.getElementById('einheitWahl').innerHTML = e.length ? pillen('einheit', e.map(function (x) { return { id: x, name: x }; }), s.einheit) : '<span class="unterzeile">—</span>';
  const pflicht = !!m && m.id === L.SONSTIGES;
  document.getElementById('freitextLabel').textContent = t(pflicht ? 'freitext_pflicht' : 'freitext');
}
function zeigeTagHinweis() {
  const s = S.sheet, el = document.getElementById('tagHinweis'); if (!s || !el) return;
  const b = bild(s.tagWahl);
  el.textContent = b && b.fristVorbei ? t('fuer_nachzuegler', { tag: t(s.tagWahl), uhr: L.uhr(b.fristMs) }) : '';
}
function eingabe() {
  const s = S.sheet;
  return { tag: S.tage[s.tagWahl], bereich: s.bereich, materialId: s.materialId, einheit: s.einheit,
    menge: L.mengeAus(document.getElementById('mengeFeld').value), freitext: document.getElementById('freitextFeld').value };
}
const EIN_TEXT = { bereich: 'ein_bereich', material: 'ein_material', material_aus: 'ein_material_aus', einheit: 'ein_einheit', menge: 'ein_menge', freitext_lang: 'ein_freitext_lang', freitext_pflicht: 'ein_freitext_pflicht', tag: 'ein_tag' };
async function meldungSpeichern() {
  const s = S.sheet; if (!s || S.schreibt) return;
  const g = s.id ? (grundName() || grundSchreiben()) : grundMelden();
  if (g) { sheetMeldung(g); return; }
  const e = eingabe(), m = materialNachId(e.materialId);
  const p = L.pruefeEingabe(e, m, !s.id);
  if (p) { sheetMeldung(t(EIN_TEXT[p], { min: L.GRENZEN.mengeMin, max: p === 'menge' ? L.GRENZEN.mengeMax : L.GRENZEN.freitext })); return; }
  S.schreibt = true; sheetMeldung('');
  try {
    if (s.id) { await L.aendere(window.db, await ctxFrisch(), s.id, e, m); schliesseSheet(); toast(t('gespeichert')); }
    else {
      const frist = bild(s.tagWahl).fristMs, tagWort = t(s.tagWahl) + ' (' + L.tagKurz(e.tag) + ')';
      const r = await L.melde(window.db, await ctxFrisch(), e, m);
      try { localStorage.setItem(SPEICHER_BEREICH, e.bereich); } catch (x) { /* egal */ }
      S.wahl = s.tagWahl; schliesseSheet();
      if (r.erstelltMs !== null && r.erstelltMs >= frist) meldung(t('als_nachzuegler', { uhr: L.uhr(r.erstelltMs), frist: L.uhr(frist) }), 'warn');
      else { meldung('', ''); toast(t('gemeldet', { tag: tagWort })); }
    }
  } catch (err) { zeigeFehler(t(s.id ? 'err_aendern' : 'err_melden'), err); sheetMeldung(fehlerText(t(s.id ? 'err_aendern' : 'err_melden'), err)); }
  finally { S.schreibt = false; planeRender(); }
}
/* Löschen und Durchstreichen: zweimal tippen statt Browser-Dialog */
async function meldungWeg(knopf, art) {
  const s = S.sheet; if (!s || !s.id || S.schreibt) return;
  const g = (art === 'loeschen' ? '' : grundName()) || grundSchreiben(); if (g) { sheetMeldung(g); return; }
  if (S.sicher !== art) { S.sicher = art; knopf.textContent = t(art === 'loeschen' ? 'loeschen_sicher' : 'streichen_sicher'); return; }
  S.schreibt = true;
  try {
    if (art === 'loeschen') await L.loesche(window.db, s.id); else await L.streiche(window.db, await ctxFrisch(), s.id);
    schliesseSheet(); toast(t(art === 'loeschen' ? 'geloescht' : 'gestrichen'));
  } catch (err) { zeigeFehler(t(art === 'loeschen' ? 'err_loeschen' : 'err_streichen'), err); sheetMeldung(fehlerText(t(art === 'loeschen' ? 'err_loeschen' : 'err_streichen'), err)); }
  finally { S.schreibt = false; planeRender(); }
}
async function aufnehmen(id) {
  const g = grundName() || grundSchreiben();
  if (S.schreibt) return;
  if (g) { meldung(g, 'warn'); return; }
  S.schreibt = true;
  try { await L.nimmAuf(window.db, await ctxFrisch(), id); toast(t('aufgenommen')); }
  catch (err) { zeigeFehler(t('err_aufnehmen'), err); }
  finally { S.schreibt = false; planeRender(); }
}

/* ---------- Drucken: über den Zettel „mitbringer“ (mitbringer_druck.js), nie selbst ---------- */
async function drucken() {
  if (S.schreibt) return;
  const k = wahl(), b = bild(k), g = b ? grundDrucken(k, b) : t('grund_laedt');
  if (g) { meldung(g, 'warn'); return; }
  S.schreibt = true; planeRender();
  try {
    const r = await window.BOS_MITBRINGER_DRUCK.drucke();
    meldung(t('druck_los', { datei: r.dateiname, n: b.anzahlZettel }), 'gut');
  } catch (err) {
    /* bos_druck.js zeigt Druckfehler selbst im Kasten; steht dort nichts, dann hier */
    if (!document.getElementById('bos-druck-fehler')) zeigeFehler(t('err_drucken'), err); else console.error('[Mitbringer] ' + t('err_drucken'), err);
  } finally { S.schreibt = false; planeRender(); }
}

/* ---------- Material und Einstellungen (Haken „Mitbringer bearbeiten“) ---------- */
function oeffneMaterial(id) {
  const m = id ? materialNachId(id) : null;
  if (id && !m) return;
  const naechste = (L.sichtbaresMaterial(S.material || []).filter(function (x) { return !x.fest; }).reduce(function (n, x) { return Math.max(n, x.reihenfolge); }, 0)) + 10;
  const s = { art: 'material', id: id || null, start: m ? JSON.stringify([m.name, m.einheiten.join(', '), String(m.reihenfolge), m.aktiv]) : JSON.stringify(['', '', String(Math.min(naechste, L.GRENZEN.reihenfolgeMax)), true]) };
  let h = '<h2>' + esc(t(m ? 'mat_aendern_titel' : 'mat_neu_titel')) + '</h2>';
  h += '<div class="feld-zeile"><label for="matName">' + esc(t('mat_name')) + '</label><input type="text" id="matName" maxlength="' + L.GRENZEN.materialName + '" value="' + esc(m ? m.name : '') + '"><div class="unterzeile" id="matIdZeile" style="margin-top:4px">' + (m ? esc(t('mat_id', { id: m.id })) : '') + '</div></div>';
  h += '<div class="feld-zeile"><label for="matEinheiten">' + esc(t('mat_einheiten')) + '</label><input type="text" id="matEinheiten" placeholder="' + esc(t('mat_einheiten_platz')) + '" value="' + esc(m ? m.einheiten.join(', ') : '') + '"></div>';
  h += '<div class="feld-zeile"><label for="matReihenfolge">' + esc(t('mat_reihenfolge')) + '</label><input type="number" id="matReihenfolge" inputmode="numeric" min="0" max="' + L.GRENZEN.reihenfolgeMax + '" value="' + esc(m ? m.reihenfolge : Math.min(naechste, L.GRENZEN.reihenfolgeMax)) + '"></div>';
  h += '<label class="haken-zeile"><input type="checkbox" id="matAktiv"' + (!m || m.aktiv ? ' checked' : '') + (m && m.fest ? ' disabled' : '') + '><span>' + esc(t(m && m.fest ? 'mat_fest' : 'mat_aktiv')) + '</span></label>';
  h += '<div class="meldung" id="sheetMeldung" role="alert"></div><div class="sheet-knoepfe"><button type="button" class="btn btn-primary" data-aktion="mat-speichern">' + esc(t('speichern')) + '</button><button type="button" class="btn btn-outline" data-aktion="sheet-zu">' + esc(t('abbrechen')) + '</button></div>';
  oeffneSheet(h, s);
}
const MAT_TEXT = { id: 'ein_mat_id', name: 'ein_mat_name', einheiten: 'ein_mat_einheiten', einheit_lang: 'ein_mat_einheit_lang', reihenfolge: 'ein_mat_reihenfolge', fest_aus: 'ein_mat_fest_aus' };
async function materialSpeichern() {
  const s = S.sheet; if (!s || S.schreibt) return;
  const g = grundSchreiben(); if (g) { sheetMeldung(g); return; }
  const name = document.getElementById('matName').value.trim();
  const e = { name: name, einheiten: L.einheitenAus(document.getElementById('matEinheiten').value), aktiv: document.getElementById('matAktiv').checked, reihenfolge: parseInt(document.getElementById('matReihenfolge').value, 10) };
  if (isNaN(e.reihenfolge)) e.reihenfolge = -1;
  const id = s.id || L.materialIdAus(name);
  const p = L.pruefeMaterial(id, e);
  if (p) { sheetMeldung(t(MAT_TEXT[p], { max: p === 'name' ? L.GRENZEN.materialName : p === 'einheiten' ? L.GRENZEN.einheiten : p === 'einheit_lang' ? L.GRENZEN.einheit : L.GRENZEN.reihenfolgeMax })); return; }
  if (!s.id && materialNachId(id)) { sheetMeldung(t('mat_doppelt', { id: id })); return; }
  S.schreibt = true; sheetMeldung('');
  try { await L.speichereMaterial(window.db, ctx(), id, e); schliesseSheet(); toast(t('gespeichert')); }
  catch (err) { zeigeFehler(t('err_material'), err); sheetMeldung(fehlerText(t('err_material'), err)); }
  finally { S.schreibt = false; planeRender(); }
}
async function startliste() {
  if (S.schreibt || grundSchreiben()) return;
  S.schreibt = true; planeRender();
  try { const neu = await L.legeStartlisteAn(window.db, ctx()); toast(neu.length ? t('mat_start_ok', { liste: neu.join(', ') }) : t('mat_start_nichts')); }
  catch (err) { zeigeFehler(t('err_start'), err); }
  finally { S.schreibt = false; planeRender(); }
}
async function einstellungenSpeichern() {
  if (S.schreibt) return;
  const el = document.getElementById('einstMeldung'), g = grundSchreiben();
  if (g) { el.textContent = g; return; }
  const frist = L.minuteAus(document.getElementById('einstFrist').value), leer = parseInt(document.getElementById('einstLeer').value, 10);
  if (!L.fristMinuteGueltig(frist)) { el.textContent = t('ein_frist'); return; }
  if (!L.leerzeilenGueltig(leer)) { el.textContent = t('ein_leer', { max: L.GRENZEN.leerzeilenMax }); return; }
  S.schreibt = true; el.textContent = '';
  try { await L.speichereEinstellungen(window.db, ctx(), { fristMinute: frist, leerzeilen: leer }); S.einstEingabe = null; toast(t('gespeichert')); }
  catch (err) { zeigeFehler(t('err_einstellung'), err); el.textContent = fehlerText(t('err_einstellung'), err); }
  finally { S.schreibt = false; planeRender(); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (ev) {
  const tg = ev.target.closest('[data-tag]');
  if (tg) { S.wahl = tg.getAttribute('data-tag'); planeRender(); return; }
  const r = ev.target.closest('[data-reiter]');
  if (r) { S.reiter = r.getAttribute('data-reiter'); planeRender(); return; }
  const pl = ev.target.closest('[data-pillen] button');
  if (pl && S.sheet) {
    const name = pl.parentNode.getAttribute('data-pillen'), wert = pl.getAttribute('data-wert');
    if (name === 'tag') { S.sheet.tagWahl = wert; zeigeTagHinweis(); } else if (name === 'bereich') S.sheet.bereich = wert; else if (name === 'einheit') S.sheet.einheit = wert;
    pl.parentNode.querySelectorAll('button').forEach(function (b) { const an = b === pl; b.classList.toggle('aktiv', an); b.setAttribute('aria-pressed', String(an)); });
    return;
  }
  const el = ev.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id');
  if (a === 'melden') oeffneMeldung(null);
  else if (a === 'aendern') oeffneMeldung(id);
  else if (a === 'aufnehmen') aufnehmen(id);
  else if (a === 'drucken') drucken();
  else if (a === 'minus' || a === 'plus') {
    const f = document.getElementById('mengeFeld'), m = L.mengeAus(f.value);
    f.value = String(Math.max(L.GRENZEN.mengeMin, Math.min(L.GRENZEN.mengeMax, (isNaN(m) ? 0 : m) + (a === 'plus' ? 1 : -1))));
  }
  else if (a === 'meldung-speichern') meldungSpeichern();
  else if (a === 'meldung-loeschen') meldungWeg(el, 'loeschen');
  else if (a === 'meldung-streichen') meldungWeg(el, 'streichen');
  else if (a === 'mat-neu') oeffneMaterial(null);
  else if (a === 'mat-aendern') oeffneMaterial(id);
  else if (a === 'mat-speichern') materialSpeichern();
  else if (a === 'mat-start') startliste();
  else if (a === 'einst-speichern') einstellungenSpeichern();
  else if (a === 'sheet-zu') schliesseSheet();
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'materialWahl' && S.sheet) { S.sheet.materialId = ev.target.value; fuelleEinheiten(); }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'matName' && S.sheet && !S.sheet.id) { const id = L.materialIdAus(ev.target.value); document.getElementById('matIdZeile').textContent = id ? t('mat_id', { id: id }) : ''; }
  if (ev.target.id === 'einstFrist' || ev.target.id === 'einstLeer') S.einstEingabe = { frist: document.getElementById('einstFrist').value, leer: document.getElementById('einstLeer').value };   /* bleibt über Neuzeichnen erhalten */
});
document.getElementById('fehlerZuBtn').addEventListener('click', function () { document.getElementById('fehlerLeiste').classList.add('hidden'); document.getElementById('fehlerListe').innerHTML = ''; });

/* ---------- Halb eingegebenes melden (Checkliste §7b) ---------- */
(function (pruef) {
  if (window.BOS_UNGESPEICHERT) { window.BOS_UNGESPEICHERT.melde(pruef); return; }
  window.addEventListener('beforeunload', function (e) { if (pruef()) { e.preventDefault(); e.returnValue = ''; } });

  return false;
});

function renderHilfe() {
  document.getElementById('helpTitle').textContent = helpData.title;
  document.getElementById('helpContent').innerHTML = helpData.sections.map(function (s) { return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>'; }).join('');
}
document.getElementById('helpOpenBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.remove('hidden'); });
document.getElementById('helpCloseBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.add('hidden'); });
document.getElementById('helpSheet').addEventListener('click', function (e) { if (e.target === this) this.classList.add('hidden'); });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
</body>
</html>
