  Mechanik: ../bos_meldungen.js (window.BOS_MELDUNGEN) — diese Seite liest und
         schreibt NUR über die Melde-Datei, nie direkt in Firestore.
  ZWECK: Kaputtes melden, der Hausmeister sieht es gesammelt (Posteingang
         rot/gelb/grün mit Wort), setzt gesehen/repariert, nennt ein
         Reparaturfenster; darunter ein kurzer Chat für Rückfragen.
  ZUGANG: nur über Haken je Konto (Kontenverwaltung, Stammdaten,
         „🔧 Reparaturanfrage“): Mitlesen & antworten · Melden · Bearbeiten.
         Die Kachel hängt am Registry-Feld haken (bos_access.js), das Schloss
         ist die Firestore-Regel (RK §20).
  AUFRUF: direkt (Lesezeichen, QR) möglich. ?geraet=Etagenofen öffnet gleich
         das Meldeformular mit vorbelegtem Gerät (für die späteren
         QR-Kärtchen an den Geräten; keine Geräteliste in BOS).
  KEINE DATEN IM CODE: keine Namen, keine Geräte, keine Telefonnummern.
  CHANGELOG
    2026-10-11 · 10:27 · v0.3 · Feature (Nachtrag 3, Ulf 11.10. 10:21/10:23)
      ANWEISUNG_2026-10-11_REPARATURANFRAGE_NACHTRAG3.md (KC 10:24).
      - A: Die Zeile „‹ Posteingang“ über den Reitern entfällt. Links in der
        Reiterleiste ein Knopf „‹“ (48 × 48, kein Reiter, durch einen Strich
        abgesetzt, aria-label/title „Zurück zum Posteingang“).
      - B: Zurück-Taste des Handys/Browsers. Öffnen einer Anfrage und Melden
        legen je EINEN Verlaufseintrag an ({ ra: 'anfrage', id } bzw.
        { ra: 'melden' }); popstate führt zum Posteingang. „‹“, „‹ Posteingang“
        und „Abbrechen“ nehmen den eigenen Eintrag zurück (history.back()),
        statt einen neuen anzulegen. Reiterwechsel legt keinen an.
        Direkteinstieg ?geraet= legt keinen an (Melden ist dann die
        Grundansicht, Zurück verlässt die Seite — mit getipptem Text erst
        nach der Browser-Rückfrage „Seite verlassen?“). Nach Neuladen wird die
        Ansicht aus dem Eintrag wiederhergestellt. Ungesendeter Text
        (Rückfrage, Fenster-Grund, Melden-Text) → Rückfrage „verwerfen?“,
        bei „nein“ bleibt alles stehen (Eintrag wird neu angelegt).
        Im Launcher-Fenster: wird das Fenster bei offener Anfrage
        geschlossen, nimmt die Seite ihren Eintrag im pagehide zurück (über
        einen Timer im Launcher, der nur feuert, wenn das Fenster wirklich
        entfernt ist) — sonst verschluckte der tote Eintrag einen Druck.
      - C: Seitentitel unter 380 px kleiner (stieß an „＋ Melden“).
      - Hilfe nachgezogen. Keine Regeländerung, bos_meldungen.js unverändert.
    2026-10-11 · 09:37 · v0.2 · Feature (Nachtrag 2, E23–E25, Ulf 11.10.)
      ANWEISUNG_2026-10-11_REPARATURANFRAGE_NACHTRAG2.md (KC 09:26).
      - Geöffnete Anfrage mit Reitern „Anfrage“ · „Rückfragen“ · „Verlauf“.
        Öffnet immer auf „Anfrage“, springt nie von selbst um. Alle drei
        Flächen bleiben im Dokument (versteckt) — getippter Text in
        Rückfrage, Fenster-Datum und Grund überlebt Reiterwechsel und
        Neuzeichnen. Aktiver Reiter mit Unterstrich, nicht nur Farbe.
      - Kennzeichen „neu“ (nur dieses Gerät, Gerätespeicher
        bos_reparatur_gelesen_v1): „💬 neu“ / „● neu“ im Posteingang für
        Änderungen von jemand anderem seit dem letzten Öffnen; Punkt mit
        Zahl am Reiter „Rückfragen“. Je Anfrage in „Offen“ und „Repariert
        (7 Tage)“ ein Live-Abo auf den jüngsten Verlaufseintrag
        (BOS_MELDUNGEN.neuesterEintrag), im Archiv keins. Gerätespeicher
        gesperrt: keine Kennzeichen, einmal sichtbarer Hinweis mit Grund.
      - Schnellzugriff im Posteingang (Haken Bearbeiten, nur „Offen“):
        rot „👀 gesehen“ + „✓ repariert“, gelb „✓ repariert“. Nach
        „repariert“ Toast mit „zurücknehmen“ (8 s), dieselbe Mechanik wie
        in der Anfrage, mit frischem Kopf.
      - Zeile im Posteingang ist kein <button> mehr: Behälter mit eigener
        Öffnen-Fläche und getrennten Knöpfen (kein Knopf im Knopf).
      - Titel in der Zeile bis zu zwei Zeilen statt einer; „neu“ und
        „dringend“ stehen in einer eigenen kleinen Zeile unter dem Titel
        (am Handy blieb neben Kennzeichen und Statuswort sonst kaum etwas).
      - Toast nimmt seine volle Breite (bis 90 % des Bildschirms) statt
        sich in die halbe Breite zu quetschen.
      - Hilfe nachgezogen. Keine Regeländerung, keine neuen Felder.
    2026-10-10 · 10:43 · v0.1a · Fix (Nachtrag 1)

<style>
  :root {
    --ra-tap: max(52px, var(--bos-tap-min, 44px));
    --ra-rot: var(--bos-red, #d6584a);
    --ra-gelb: #d9a521;
    --ra-gruen: var(--bos-green, #4caf7d);
  }
  html[data-theme="light"] { --ra-gelb: #9a7406; }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; padding-bottom: 80px; background: var(--bos-bg); color: var(--bos-text); font-family: var(--bos-font-body); -webkit-tap-highlight-color: transparent; }

  header { background: var(--bos-surface); border-bottom: 1px solid var(--bos-border); padding: var(--bos-space-sm, 14px) var(--bos-space-md, 18px); position: sticky; top: 0; z-index: 20; }
  .kopf-zeile { display: flex; align-items: center; gap: var(--bos-space-sm, 14px); }
  .kopf-titel { flex: 1 1 0; min-width: 0; }
  header h1 { margin: 0; font-size: var(--bos-font-xl, 1.3rem); }
  .eyebrow { font-family: var(--bos-font-label); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: var(--bos-font-xs, .72rem); color: var(--bos-amber); }
  .wer { font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-dim); margin-top: 2px; }
  .abzeichen { display: inline-block; border: 1px solid var(--bos-border-strong); border-radius: 999px; padding: 1px 8px; margin-left: 4px; font-family: var(--bos-font-label); font-weight: 700; font-size: var(--bos-font-2xs, .66rem); letter-spacing: .04em; text-transform: uppercase; color: var(--bos-text-dim); }
  .kopf-knoepfe { display: flex; gap: var(--bos-space-2xs, 6px); align-items: center; }
  .rund-btn { min-width: var(--ra-tap); min-height: var(--ra-tap); font-size: 1.2rem; }
  .bos-btn { min-height: 44px; }
  .bos-btn:disabled { opacity: .45; cursor: not-allowed; }

  .leiste { margin: var(--bos-space-sm, 14px) var(--bos-space-md, 18px) 0; border-radius: var(--bos-radius-sm); padding: var(--bos-space-xs, 9px) var(--bos-space-sm, 14px); font-size: var(--bos-font-sm, .82rem); line-height: 1.5; background: var(--bos-surface); border-left: 4px solid var(--bos-amber); }
  .leiste.rot { border-left-color: var(--ra-rot); }
  #fehlerLeiste { border: 1px solid var(--ra-rot); border-left-width: 4px; }
  #fehlerLeiste ul { margin: 4px 0 0; padding-left: 18px; }
  #fehlerLeiste li { word-break: break-word; margin-bottom: 4px; }
  #fehlerLeiste a { color: var(--bos-amber-bright); font-weight: 700; word-break: break-all; }
  .fehler-kopf { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  .klein { font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); }
  .link-btn { background: none; border: none; color: var(--bos-amber-bright); font-family: var(--bos-font-label); font-weight: 700; cursor: pointer; padding: 8px 4px; min-height: 44px; font-size: var(--bos-font-sm, .82rem); }

  main { padding: var(--bos-space-md, 18px); max-width: 860px; margin: 0 auto; }
  .status { color: var(--bos-text-dim); font-size: var(--bos-font-sm, .82rem); padding: var(--bos-space-sm, 14px) 0; }
  .kasten { background: var(--bos-surface); border: 1px solid var(--bos-border); border-radius: var(--bos-radius-md); padding: var(--bos-space-md, 18px); line-height: 1.55; }
  .kasten.rot { border-color: var(--ra-rot); }
  section.block { margin-top: var(--bos-space-lg, 22px); }
  .block-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: var(--bos-space-xs, 9px); }
  .block-kopf h2 { margin: 0; font-size: var(--bos-font-lg, 1.15rem); font-family: var(--bos-font-display); }
  .leer { color: var(--bos-text-faint); font-size: var(--bos-font-sm, .82rem); padding: var(--bos-space-xs, 9px) 0; }

  /* Posteingang: eine Zeile je Anfrage, Farbe IMMER mit Wort (Ulf, 08:00).
     Nachtrag 2: die Zeile ist ein Behälter (kein Knopf) mit eigener
     Öffnen-Fläche und — beim Hausmeister in „Offen“ — getrennten Knöpfen. */
  .zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; padding: 6px 8px 6px 6px; margin-bottom: 6px; background: var(--bos-surface); color: var(--bos-text); border: 1px solid var(--bos-border); border-left: 6px solid var(--bos-border-strong); border-radius: var(--bos-radius-sm); }
  .zeile:hover { border-color: var(--bos-amber); }
  .z-oeffnen { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: var(--bos-space-sm, 12px); min-height: var(--ra-tap); padding: 4px 6px; background: none; border: none; border-radius: var(--bos-radius-sm); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .z-oeffnen:focus-visible { outline: 2px solid var(--bos-amber); outline-offset: 2px; }
  .z-schnell { flex: 0 0 auto; margin-left: auto; display: flex; gap: 8px; }
  .z-schnell .bos-btn { min-height: 44px; min-width: 44px; padding-left: 12px; padding-right: 12px; }
  .z-marken { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .neu-marke { flex: none; font-family: var(--bos-font-label); font-weight: 800; letter-spacing: .03em; font-size: var(--bos-font-xs, .72rem); padding: 2px 8px; border-radius: 999px; background: var(--bos-amber); color: #1a1208; white-space: nowrap; }
  .zeile.st-gemeldet { border-left-color: var(--ra-rot); }
  .zeile.st-gesehen { border-left-color: var(--ra-gelb); }
  .zeile.st-repariert { border-left-color: var(--ra-gruen); }
  .z-haupt { flex: 1 1 auto; min-width: 0; }
  .z-titel { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; font-weight: 600; word-break: break-word; }
  .z-unter { display: block; font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-dim); margin-top: 2px; }
  .statuswort { flex: none; font-family: var(--bos-font-label); font-weight: 800; letter-spacing: .04em; text-transform: uppercase; font-size: var(--bos-font-xs, .72rem); padding: 3px 9px; border-radius: 999px; border: 2px solid currentColor; }
  .statuswort.st-gemeldet { color: var(--ra-rot); }
  .statuswort.st-gesehen { color: var(--ra-gelb); }
  .statuswort.st-repariert { color: var(--ra-gruen); }
  .dringend { flex: none; font-family: var(--bos-font-label); font-weight: 800; text-transform: uppercase; font-size: var(--bos-font-2xs, .66rem); letter-spacing: .05em; color: #fff; background: var(--ra-rot); border-radius: 4px; padding: 2px 6px; }

  /* geöffnete Anfrage — Reiter (Nachtrag 2). Aktiv = Unterstrich UND Farbe.
     Nachtrag 3 (A): links der Zurück-Knopf „‹“, durch einen Strich abgesetzt.
     Er steht AUSSERHALB der tablist — er ist kein Reiter. */
  .reiter-leiste { display: flex; align-items: stretch; border-bottom: 1px solid var(--bos-border); margin: 0 0 var(--bos-space-sm, 14px); }
  .zurueck-knopf { flex: 0 0 48px; min-width: 44px; min-height: 48px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-right: 1px solid var(--bos-border-strong); margin: 8px 4px 8px 0; padding: 0; color: var(--bos-amber-bright); font-size: 1.6rem; line-height: 1; cursor: pointer; }
  .zurueck-knopf:focus-visible { outline: 2px solid var(--bos-amber); outline-offset: -2px; }
  .reiter { flex: 1 1 auto; min-width: 0; display: flex; gap: 2px; }
  .reiter button { flex: 1 1 0; min-width: 0; min-height: 48px; padding: 6px 2px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--bos-text-dim); font-family: var(--bos-font-label); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: var(--bos-font-sm, .82rem); cursor: pointer; }
  .reiter button[aria-selected="true"] { color: var(--bos-text); border-bottom-color: var(--bos-amber); }
  .reiter button:focus-visible { outline: 2px solid var(--bos-amber); outline-offset: -2px; }
  .reiter .punkt { display: inline-block; white-space: nowrap; margin-left: 4px; padding: 0 7px; border-radius: 999px; background: var(--bos-amber); color: #1a1208; font-size: var(--bos-font-xs, .72rem); letter-spacing: 0; }
  .zurueck { margin-bottom: var(--bos-space-xs, 9px); }
  .anfrage-text { font-size: var(--bos-font-lg, 1.1rem); white-space: pre-wrap; word-break: break-word; margin: 6px 0 10px; }
  .eckdaten { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: var(--bos-font-sm, .85rem); }
  .eckdaten dt { color: var(--bos-text-dim); }
  .eckdaten dd { margin: 0; }
  .schritte { display: flex; gap: 0; margin: var(--bos-space-md, 18px) 0 var(--bos-space-sm, 12px); }
  .schritt { flex: 1 1 0; text-align: center; font-family: var(--bos-font-label); font-weight: 700; font-size: var(--bos-font-xs, .72rem); text-transform: uppercase; letter-spacing: .04em; color: var(--bos-text-faint); position: relative; padding-top: 22px; }
  .schritt::before { content: ''; position: absolute; top: 4px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--bos-border-strong); background: var(--bos-bg); }
  .schritt::after { content: ''; position: absolute; top: 11px; left: calc(50% + 9px); right: calc(-50% + 9px); height: 2px; background: var(--bos-border-strong); }
  .schritt:last-child::after { display: none; }
  .schritt.erreicht { color: var(--bos-text); }
  .schritt.erreicht.st-gemeldet::before { background: var(--ra-rot); border-color: var(--ra-rot); }
  .schritt.erreicht.st-gesehen::before { background: var(--ra-gelb); border-color: var(--ra-gelb); }
  .schritt.erreicht.st-repariert::before { background: var(--ra-gruen); border-color: var(--ra-gruen); }
  .schritt.uebersprungen { text-decoration: line-through; }
  .knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; margin: var(--bos-space-sm, 12px) 0; }
  .feld { margin-bottom: var(--bos-space-sm, 12px); }
  .feld label { display: block; margin-bottom: 4px; }
  .zeitleiste { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--bos-border-strong); }
  .zeitleiste li { position: relative; padding: 0 0 10px 10px; font-size: var(--bos-font-sm, .85rem); line-height: 1.45; }
  .zeitleiste li::before { content: ''; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--bos-text-faint); }
  .zeitleiste .wann { color: var(--bos-text-dim); font-size: var(--bos-font-xs, .72rem); display: block; }
  .zeitleiste .grund { color: var(--bos-text-dim); }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .blase { max-width: 85%; background: var(--bos-surface-raised); border: 1px solid var(--bos-border); border-radius: 12px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
  .blase.meine { align-self: flex-end; border-color: var(--bos-amber); }
  .blase .wann { display: block; font-size: var(--bos-font-2xs, .66rem); color: var(--bos-text-dim); margin-bottom: 2px; }
  textarea.bos-input { min-height: 90px; resize: vertical; }
  .zaehler { text-align: right; }
  .wahl { display: flex; gap: 8px; flex-wrap: wrap; }
  .wahl .bos-btn[aria-pressed="true"] { background: var(--bos-amber); border-color: var(--bos-amber); color: #1a1208; }
  .warnhinweis { border-left: 4px solid var(--ra-gelb); background: var(--bos-surface); padding: 8px 12px; border-radius: var(--bos-radius-sm); font-size: var(--bos-font-sm, .82rem); margin-bottom: var(--bos-space-sm, 12px); }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: flex-end; }
  .sheet { background: var(--bos-surface); border-top: 1px solid var(--bos-border); border-radius: 18px 18px 0 0; padding: var(--bos-space-lg, 22px) var(--bos-space-md, 20px) calc(24px + env(safe-area-inset-bottom)); width: 100%; max-width: 640px; margin: 0 auto; max-height: 80vh; overflow-y: auto; }
  .sheet h2 { font-family: var(--bos-font-display); margin: 0 0 12px; }
  .sheet h3 { font-size: var(--bos-font-md, .95rem); margin: 14px 0 4px; }
  .sheet p { color: var(--bos-text-dim); line-height: 1.55; margin: 0 0 8px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; background: var(--bos-surface-raised); border: 1px solid var(--bos-amber); color: var(--bos-text); padding: 10px 16px; border-radius: 10px; z-index: 60; max-width: 90vw; display: flex; align-items: center; gap: 12px; }
  #toast[hidden] { display: none !important; }
  #toastText { white-space: nowrap; }
  #toastKnopf { min-height: 44px; }
  /* Nachtrag 3 (C): am schmalen Handy stieß der Titel an „＋ Melden“; die
     Reiter brauchen dort weniger Sperrung, damit „Rückfragen ● 2“ ganz steht. */
  @media (max-width: 380px) {
    header h1 { font-size: 1.05rem; }
    .kopf-zeile { gap: 8px; }
    .reiter button { letter-spacing: .01em; font-size: .74rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

/* ---------- Werkzeuge ---------- */
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* Toast. Liegt außerhalb von #main — aktion() sperrt ihn nicht, das
   Neuzeichnen löscht ihn nicht. Nachtrag 2: wahlweise mit EINEM Knopf. */
let toastUhr = null;
let toastAktion = null;
function toast(text) { toastMitKnopf(text, null, null, 4200); }
function toastMitKnopf(text, knopfText, beiKlick, dauer) {
  const el = document.getElementById('toast');
  const k = document.getElementById('toastKnopf');
  document.getElementById('toastText').textContent = text;
  toastAktion = beiKlick || null;
  k.textContent = knopfText || '';
  k.hidden = !knopfText;
  el.hidden = false;
  clearTimeout(toastUhr);
  toastUhr = setTimeout(function () { el.hidden = true; toastAktion = null; }, dauer || 4200);
}
document.getElementById('toastKnopf').addEventListener('click', function () {
  const fn = toastAktion;
  if (!fn || S.arbeitet) return;          // läuft gerade etwas: Toast bleibt stehen
  toastAktion = null;
  clearTimeout(toastUhr);
  document.getElementById('toast').hidden = true;
  fn();
});

/* ---------- Fehler auf den Bildschirm (Projektregel, Checkliste §7a) ---------- */
function zeigeFehler(was, err) {
  console.error('[Reparaturanfrage]', was, err);
  const e = (err && err.art) ? err : M.einordnen(err);
  const li = document.createElement('li');
  li.innerHTML = '<b>' + esc(was) + ':</b> ' + esc(e.meldung || e.message || String(err)) +
    (e.original ? ' <span class="klein">(' + esc(e.original) + ')</span>' : '') +
    (e.link ? '<br><a href="' + esc(e.link) + '" target="_blank" rel="noopener">' + esc(t('index_link')) + ' ↗</a>' : '');
  document.getElementById('fehlerListe').appendChild(li);
  document.getElementById('fehlerLeiste').hidden = false;
}
document.getElementById('fehlerZuBtn').addEventListener('click', function () {
  document.getElementById('fehlerLeiste').hidden = true;
  document.getElementById('fehlerListe').innerHTML = '';
});
window.onerror = function (msg, quelle, zeile, spalte, err) {
  zeigeFehler(t('err_unbehandelt'), err || new Error(String(msg) + ' (' + (quelle || '') + ':' + (zeile || '') + ')'));
};
window.addEventListener('unhandledrejection', function (ev) { zeigeFehler(t('err_unbehandelt'), ev.reason); });

/* ---------- Zustand ---------- */
const S = {
  ich: null,
  offen: [], gruen: [], archiv: [], archivLetzter: null, archivMehr: false, archivAn: false,
  verbindung: { offen: {}, gruen: {} },
  ansicht: 'liste',      // 'liste' | 'anfrage' | 'melden'
  offeneId: null,
  verlauf: [], verlaufAbo: null,
  tab: 'anfrage',        // Nachtrag 2: 'anfrage' | 'rueckfragen' | 'verlauf'
  rueckBasis: 0,         // fremde Nachrichten jünger als das zählen am Reiter
  letzte: {},            // id → { e: jüngster Verlaufseintrag|null, bereit, abo }
  listenDa: { offen: false, gruen: false }, aufgeraeumt: false, letzteFehler: false,
  melden: { text: '', geraet: '', weiterarbeiten: null },
  arbeitet: false,
  geraetAusCode: ''
};

function wort(status) { return M.woerterbuch(KANAL)[status] || status; }
function statusMarke(status) {
  return '<span class="statuswort st-' + esc(status) + '">' + esc(wort(status)) + '</span>';
}
function alleKoepfe() { return S.offen.concat(S.gruen, S.archiv); }
function findeKopf(id) {
  const liste = alleKoepfe();
  for (let i = 0; i < liste.length; i++) if (liste[i].id === id) return liste[i];
  return null;
}
/* Nachtrag 1 (10.10.2026): Das Gerät nur voranstellen, wenn der Text nicht schon
   damit beginnt (ohne Groß/Klein, ohne Randleerzeichen) — sonst „Kneter 2 — Kneter 2 …“. */
function titelVon(k) {
  const geraet = String(k.geraet || '').trim();
  const text = String(k.text || '');
  if (!geraet) return text;
  if (text.trim().toLocaleLowerCase('de').indexOf(geraet.toLocaleLowerCase('de')) === 0) return text;
  return geraet + ' — ' + text;
}

/* ---------- „Neu“: Gerätespeicher (Nachtrag 2, E24) ----------
   Ein Schlüssel, nur dieses Gerät:
     bos_reparatur_gelesen_v1 = { _start: ms, <anfrageId>: { g, f, fa, s } }
       _start  erster Start auf diesem Gerät (Gerätezeit). Was älter ist,
               gilt als gelesen — sonst wäre beim ersten Mal alles „neu“.
       g       gelesen bis (Serverzeit des jüngsten Eintrags beim Öffnen)
       f, fa   jüngster FREMDER Eintrag, den diese Seite gesehen hat, und
               seine Art — bleibt, wenn danach ein eigener Eintrag kam
               (z. B. „repariert“ aus dem Posteingang, ohne zu öffnen)
       s       zuletzt in „Offen“/„Repariert“ gesehen (Gerätezeit) — zum
               Aufräumen nach 30 Tagen
   Jeder Zugriff in try/catch. Gesperrt (privates Fenster, voll): keine
   Kennzeichen, EINMAL ein sichtbarer Hinweis mit dem Grund. */
const MERK_SCHLUESSEL = 'bos_reparatur_gelesen_v1';
const MERK_AUFRAEUMEN_MS = 30 * 24 * 3600e3;
const Merk = { daten: null, aus: false, gemeldet: false };
function merkMelden(text, err) {
  console.error('[Reparaturanfrage] Gerätespeicher:', err);
  if (Merk.gemeldet) return;
  Merk.gemeldet = true;
  const h = document.getElementById('hinweisLeiste');
  h.textContent = (h.textContent ? h.textContent + ' · ' : '') + text; h.hidden = false;
}
function grundVon(err) { return (err && err.message) ? err.message : String(err); }
function merkAus(err) {
  Merk.aus = true; Merk.daten = null;
  merkMelden(t('merk_aus', { grund: grundVon(err) }), err);
}
function merkSchreiben() {
  if (Merk.aus || !Merk.daten) return;
  try { window.localStorage.setItem(MERK_SCHLUESSEL, JSON.stringify(Merk.daten)); } catch (e) { merkAus(e); }
}
function merkLaden() {
  let roh;
  try { roh = window.localStorage.getItem(MERK_SCHLUESSEL); } catch (e) { merkAus(e); return; }
  if (roh === null) { Merk.daten = { _start: Date.now() }; merkSchreiben(); return; }
  try {
    const d = JSON.parse(roh);
    if (!d || typeof d !== 'object' || Array.isArray(d) || typeof d._start !== 'number') throw new Error('Inhalt unbrauchbar');
    Merk.daten = d;
  } catch (e) {
    // beschädigt: neu anlegen wie beim ersten Start, damit es beim nächsten Mal wieder geht
    Merk.daten = { _start: Date.now() };
    merkMelden(t('merk_kaputt', { grund: grundVon(e) }), e);
    merkSchreiben();
  }
}
function merkVon(id) { return Merk.daten ? Merk.daten[id] : undefined; }
function gelesenBis(id) {
  const m = merkVon(id);
  return (m && typeof m.g === 'number') ? m.g : (Merk.daten ? Merk.daten._start : Infinity);
}
function neuFuer(k) {
  if (Merk.aus || !Merk.daten || !S.ich) return null;
  const L = S.letzte[k.id];
  if (!L || !L.bereit) return null;
  return M.neuMarke(k, L.e, merkVon(k.id), S.ich.kennung, Merk.daten._start);
}
function sichtbareIds() {
  const ids = {};
  S.offen.forEach(function (k) { ids[k.id] = k; });
  S.gruen.forEach(function (k) { if (!M.imArchiv(k)) ids[k.id] = k; });
  return ids;
}
/* Gelesen bis zum jüngsten bekannten Eintrag (Serverzeit) — beim Öffnen und
   solange die Anfrage offen ist (E24: „Beim Öffnen verschwindet ihr
   Kennzeichen, der gemerkte Zeitpunkt rückt auf den neuesten Eintrag vor“). */
function gelesenVorruecken(id) {
  if (Merk.aus || !Merk.daten) return false;
  const k = findeKopf(id);
  let neuest = k ? (M.ms(k.erstellt) || 0) : 0;
  const L = S.letzte[id];
  if (L && L.e && !L.e.ausstehend && M.ms(L.e.ts) !== null) neuest = Math.max(neuest, M.ms(L.e.ts));
  if (S.offeneId === id) S.verlauf.forEach(function (e) { if (!e.ausstehend && M.ms(e.ts) !== null) neuest = Math.max(neuest, M.ms(e.ts)); });
  const m = Merk.daten[id] || (Merk.daten[id] = { g: Merk.daten._start, s: Date.now() });
  let geaendert = false;
  if (typeof m.g !== 'number') { m.g = Merk.daten._start; geaendert = true; }
  if (neuest > m.g) { m.g = neuest; geaendert = true; }
  if (typeof m.f === 'number' && m.f <= m.g) { delete m.f; delete m.fa; geaendert = true; }
  return geaendert;
}
/* Merkt fremde Einträge, rückt bei offener Anfrage vor, räumt einmal auf. */
function pflegeMerk() {
  if (Merk.aus || !Merk.daten || !S.ich) return;
  const jetzt = Date.now();
  const ids = sichtbareIds();
  let geaendert = false;
  Object.keys(ids).forEach(function (id) {
    let m = Merk.daten[id];
    if (!m) { m = Merk.daten[id] = { g: Merk.daten._start, s: jetzt }; geaendert = true; }
    if (!(jetzt - (m.s || 0) < 24 * 3600e3)) { m.s = jetzt; geaendert = true; }
    const L = S.letzte[id];
    if (L && L.bereit && L.e && !L.e.ausstehend && L.e.von && L.e.von !== S.ich.kennung) {
      const ts = M.ms(L.e.ts);
      if (ts !== null && ts > m.g && ts > (m.f || 0)) { m.f = ts; m.fa = L.e.art; geaendert = true; }
    }
  });
  if (S.ansicht === 'anfrage' && S.offeneId && gelesenVorruecken(S.offeneId)) geaendert = true;
  if (!S.aufgeraeumt && S.listenDa.offen && S.listenDa.gruen) {
    S.aufgeraeumt = true;
    Object.keys(Merk.daten).forEach(function (id) {
      if (id === '_start' || ids[id]) return;
      const m = Merk.daten[id];
      if (!m || typeof m !== 'object' || !(jetzt - (m.s || 0) < MERK_AUFRAEUMEN_MS)) { delete Merk.daten[id]; geaendert = true; }
    });
  }
  if (geaendert) merkSchreiben();
}
/* Je Anfrage in „Offen“ und „Repariert (7 Tage)“ ein Live-Abo auf den
   jüngsten Verlaufseintrag; im Archiv keins. Zahl der Abos = N + M. */
let renderGeplant = false;
function planeRender() {
  if (renderGeplant) return;
  renderGeplant = true;
  Promise.resolve().then(function () { renderGeplant = false; render(); });
}
function syncLetzte() {
  const ids = sichtbareIds();
  Object.keys(S.letzte).forEach(function (id) {
    if (!ids[id]) { const L = S.letzte[id]; if (L.abo) L.abo(); delete S.letzte[id]; }
  });
  Object.keys(ids).forEach(function (id) {
    if (S.letzte[id]) return;
    const L = { e: null, bereit: false, abo: null };
    S.letzte[id] = L;              // vor dem Abo: die Antwort kann sofort kommen
    L.abo = M.neuesterEintrag(id, function (e) {
      if (S.letzte[id] !== L) return;
      L.e = e; L.bereit = true;
      pflegeMerk();
      planeRender();
    }, function (err) {
      if (S.letzteFehler) return;   // einmal zeigen, nicht je Anfrage
      S.letzteFehler = true;
      zeigeFehler(t('err_laden', { was: t('neu_was') }), err);
    });
  });
}

/* ---------- Zeichnen ---------- */
/* Live-Daten zeichnen neu. Tippt jemand gerade (Fokus in einem Feld der
   Seite), wird das Neuzeichnen bis zum Verlassen des Feldes aufgeschoben —
   sonst springt der Cursor weg (Muster teigecke_seite.js). */
let aufgeschoben = false;
function tipptGerade() {
  const a = document.activeElement;
  const main = document.getElementById('main');
  return !!(a && main.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
document.addEventListener('focusout', function () {
  setTimeout(function () { if (aufgeschoben && !tipptGerade()) { aufgeschoben = false; render(true); } }, 0);
});
function render(erzwingen) {
  renderVerbindung();
  const main = document.getElementById('main');
  if (!S.ich) return;
  if (!erzwingen && tipptGerade()) { aufgeschoben = true; return; }
  aufgeschoben = false;
  if (!S.ich.rechte.lesen) {
    main.innerHTML = '<div class="kasten rot">' + esc(S.ich.freigeschaltet ? t('kein_haken') : t('nicht_frei')) + '</div>';
    return;
  }
  if (S.ansicht === 'melden') return renderMelden(main);
  if (S.ansicht === 'anfrage') return renderAnfrage(main);
  renderListe(main);
}

/* Nachtrag 2: Behälter statt Knopf. Öffnen-Fläche und Schnell-Knöpfe sind
   Geschwister (kein <button> im <button>). opt.neu: Kennzeichen „neu“;
   opt.schnell: Knöpfe gesehen/repariert (nur Hausmeister, nur „Offen“). */
function zeileHTML(k, opt) {
  opt = opt || {};
  const jetzt = Date.now();
  const unter = [esc(k.vonName || k.von || '')];
  if (k.status === 'repariert') unter.push(esc(wort('repariert') + ' ' + M.uhrText(k.repariertAm)));
  else unter.push(esc(M.alterText(k.erstellt, jetzt)));
  if (k.fenster && k.status !== 'repariert') unter.push('🕒 ' + esc(t('bis', { datum: M.fensterText(k.fenster) })));
  const neu = opt.neu ? neuFuer(k) : null;
  let html = '<div class="zeile st-' + esc(k.status) + '" data-zeile="' + esc(k.id) + '">' +
    '<button type="button" class="z-oeffnen" data-oeffnen="' + esc(k.id) + '">' +
    '<span class="z-haupt"><span class="z-titel">' + esc(titelVon(k)) + '</span>' +
    '<span class="z-unter">' + unter.join(' · ') + '</span>' +
    // Kennzeichen in eigener Zeile unter dem Titel — am Handy bleibt dem Titel sonst kaum Platz
    ((neu || k.dringlichkeit === 'dringend') ? '<span class="z-marken">' +
      (neu ? '<span class="neu-marke" data-neu="' + esc(neu.art) + '" title="' + esc(t(neu.art === 'nachricht' ? 'neu_nachricht_aria' : 'neu_sonst_aria')) + '">' +
        esc(t(neu.art === 'nachricht' ? 'neu_nachricht' : 'neu_sonst')) + '</span>' : '') +
      (k.dringlichkeit === 'dringend' ? '<span class="dringend">' + esc(t('dringend')) + '</span>' : '') + '</span>' : '') +
    '</span>' + statusMarke(k.status) + '</button>';
  if (opt.schnell && (k.status === 'gemeldet' || k.status === 'gesehen')) {
    html += '<div class="z-schnell">';
    if (k.status === 'gemeldet') html += '<button type="button" class="bos-btn" data-schnell="gesehen" data-id="' + esc(k.id) + '" aria-label="' + esc(t('s_aria', { was: t('s_gesehen'), titel: titelVon(k) })) + '">' + esc(t('s_gesehen')) + '</button>';
    html += '<button type="button" class="bos-btn bos-btn--amber" data-schnell="repariert" data-id="' + esc(k.id) + '" aria-label="' + esc(t('s_aria', { was: t('s_repariert'), titel: titelVon(k) })) + '">' + esc(t('s_repariert')) + '</button>';
    html += '</div>';
  }
  return html + '</div>';
}

function renderListe(main) {
  const offen = M.sortiere(S.offen);
  const gruen = M.sortiere(S.gruen.filter(function (k) { return !M.imArchiv(k); }));
  const schnell = !!S.ich.rechte.bearbeiten;
  let html = '<section class="block"><div class="block-kopf"><h2>' + esc(t('offen_titel')) + '</h2><span class="klein">' + offen.length + '</span></div>' +
    (offen.length ? offen.map(function (k) { return zeileHTML(k, { neu: true, schnell: schnell }); }).join('') : '<div class="leer">' + esc(t('offen_leer')) + '</div>') + '</section>';
  html += '<section class="block"><div class="block-kopf"><h2>' + esc(t('gruen_titel')) + '</h2><span class="klein">' + gruen.length + '</span></div>' +
    (gruen.length ? gruen.map(function (k) { return zeileHTML(k, { neu: true }); }).join('') : '<div class="leer">' + esc(t('gruen_leer')) + '</div>') + '</section>';
  html += '<section class="block"><div class="block-kopf"><h2>' + esc(t('archiv_titel')) + '</h2>' +
    '<button type="button" class="link-btn" id="archivBtn">' + esc(S.archivAn ? t('archiv_verbergen') : t('archiv_zeigen')) + '</button></div>';
  if (S.archivAn) {
    html += '<div class="klein">' + esc(t('archiv_hinweis')) + '</div>' +
      (S.archiv.length ? S.archiv.map(function (k) { return zeileHTML(k); }).join('') : '<div class="leer">' + esc(t('archiv_leer')) + '</div>') +
      (S.archivMehr ? '<button type="button" class="bos-btn" id="archivMehrBtn">' + esc(t('archiv_mehr')) + '</button>' : '');
  }
  html += '</section>';
  main.innerHTML = html;
  const ab = document.getElementById('archivBtn');
  if (ab) ab.addEventListener('click', schalteArchiv);
  const mb = document.getElementById('archivMehrBtn');
  if (mb) mb.addEventListener('click', ladeArchivSeite);
}

function schritteHTML(k) {
  const st = k.status;
  const gesehenErreicht = st === 'gesehen' || (st === 'repariert' && S.verlauf.some(function (e) { return e.art === 'status' && e.nachher === 'gesehen'; }));
  const gesehenUebersprungen = st === 'repariert' && !gesehenErreicht;
  return '<div class="schritte" aria-label="Fortschritt">' +
    '<div class="schritt erreicht st-gemeldet">' + esc(wort('gemeldet')) + '</div>' +
    '<div class="schritt st-gesehen' + (gesehenErreicht ? ' erreicht' : '') + (gesehenUebersprungen ? ' uebersprungen' : '') + '">' + esc(wort('gesehen')) + '</div>' +
    '<div class="schritt st-repariert' + (st === 'repariert' ? ' erreicht' : '') + '">' + esc(wort('repariert')) + '</div></div>';
}

function eintragText(e) {
  if (e.art === 'status') return t('e_status', { vorher: wort(e.vorher), nachher: wort(e.nachher) });
  if (e.art === 'dringlichkeit') return t('e_dringlichkeit', { vorher: e.vorher, nachher: e.nachher });
  if (e.art === 'fenster') {
    if (!e.vorher) return t('e_fenster_neu', { nachher: M.fensterText(e.nachher) });
    if (!e.nachher) return t('e_fenster_weg', { vorher: M.fensterText(e.vorher) });
    return t('e_fenster_verschoben', { vorher: M.fensterText(e.vorher), nachher: M.fensterText(e.nachher) });
  }
  return e.art;
}

function renderAnfrage(main) {
  const k = findeKopf(S.offeneId);
  if (!k) {
    main.innerHTML = '<button type="button" class="link-btn zurueck" data-zurueck="1">' + esc(t('zurueck')) + '</button><div class="kasten">' + esc(t('nicht_gefunden')) + '</div>';
    return verbindeZurueck();
  }
  const r = S.ich.rechte;
  const archiv = M.imArchiv(k);
  const archivAb = M.archivAb(k);
  const wa = { ja: t('wa_ja'), eingeschraenkt: t('wa_eingeschraenkt'), nein: t('wa_nein') }[k.weiterarbeiten] || k.weiterarbeiten;
  // Nachtrag 2 (E23): drei Reiter. Alle drei Flächen stehen im Dokument,
  // nur die aktive ist sichtbar — so bleibt getippter Text beim Wechsel stehen.
  const n = zaehleNeueRueckfragen();
  function reiterKnopf(name, text, extra) {
    return '<button type="button" role="tab" id="reiter-' + name + '" data-reiter="' + name + '" aria-controls="flaeche-' + name + '" aria-selected="' + (S.tab === name) + '">' + text + (extra || '') + '</button>';
  }
  function flaeche(name, inhalt) {
    return '<div role="tabpanel" id="flaeche-' + name + '" data-flaeche="' + name + '" aria-labelledby="reiter-' + name + '"' + (S.tab === name ? '' : ' hidden') + '>' + inhalt + '</div>';
  }
  // Nachtrag 3 (A): „‹“ links in der Leiste, NICHT in der tablist (kein Reiter)
  let html = '<div class="reiter-leiste">' +
    '<button type="button" class="zurueck-knopf" data-zurueck="1" aria-label="' + esc(t('zurueck_aria')) + '" title="' + esc(t('zurueck_aria')) + '">‹</button>' +
    '<div class="reiter" role="tablist">' +
      reiterKnopf('anfrage', esc(t('reiter_anfrage'))) +
      reiterKnopf('rueckfragen', esc(t('reiter_rueck')), '<span class="punkt" id="rueckPunkt" aria-label="' + esc(t('reiter_punkt_aria', { n: n })) + '"' + (n ? '' : ' hidden') + '>' + esc(t('reiter_punkt', { n: n })) + '</span>') +
      reiterKnopf('verlauf', esc(t('reiter_verlauf'))) +
    '</div></div>';
  let anfrageHtml = '<div class="kasten">' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' + statusMarke(k.status) +
      (k.dringlichkeit === 'dringend' ? '<span class="dringend">' + esc(t('dringend')) + '</span>' : '') + '</div>' +
    '<div class="anfrage-text">' + esc(k.text) + '</div>' +
    '<dl class="eckdaten">' +
      (k.geraet ? '<dt>' + esc(t('geraet')) + '</dt><dd>' + esc(k.geraet) + '</dd>' : '') +
      '<dt>' + esc(t('gemeldet_von')) + '</dt><dd>' + esc(k.vonName || k.von) + '</dd>' +
      '<dt>' + esc(t('gemeldet_am')) + '</dt><dd>' + esc(M.uhrText(k.erstellt)) + '</dd>' +
      '<dt>' + esc(t('weiterarbeiten')) + '</dt><dd>' + esc(wa) + '</dd>' +
      '<dt>' + esc(t('dringlichkeit')) + '</dt><dd>' + esc(k.dringlichkeit === 'dringend' ? t('dringend') : t('normal')) + '</dd>' +
      '<dt>' + esc(t('fenster')) + '</dt><dd>' + esc(k.fenster ? t('bis', { datum: M.fensterText(k.fenster) }) : t('kein_fenster')) + '</dd>' +
    '</dl>' + schritteHTML(k);

  if (r.bearbeiten && !archiv) {
    anfrageHtml += '<div class="knopfreihe">';
    if (k.status === 'gemeldet') anfrageHtml += '<button type="button" class="bos-btn" data-status="gesehen">' + esc(t('k_gesehen')) + '</button>';
    if (k.status !== 'repariert') anfrageHtml += '<button type="button" class="bos-btn bos-btn--amber" data-status="repariert">' + esc(t('k_repariert')) + '</button>';
    if (k.status === 'repariert' && archivAb) anfrageHtml += '<button type="button" class="bos-btn" data-status="gesehen">' + esc(t('k_zurueck', { datum: M.uhrText(archivAb) })) + '</button>';
    anfrageHtml += '<button type="button" class="bos-btn" id="dringBtn">' + esc(k.dringlichkeit === 'dringend' ? t('k_normal') : t('k_dringend')) + '</button>';
    anfrageHtml += '</div>';
    if (k.status !== 'repariert') {
      anfrageHtml += '<div class="feld"><label class="bos-label" for="fensterDatum">' + esc(t('fenster_datum')) + '</label>' +
        '<input type="date" class="bos-input" id="fensterDatum" min="' + esc(M.heute()) + '" value="' + esc(k.fenster || '') + '"></div>' +
        '<div class="feld"><label class="bos-label" for="fensterGrund">' + esc(t('fenster_grund')) + '</label>' +
        '<input type="text" class="bos-input" id="fensterGrund" maxlength="' + M.GRENZEN.grund + '"></div>' +
        '<div class="knopfreihe"><button type="button" class="bos-btn" id="fensterBtn">' + esc(k.fenster ? t('fenster_verschieben') : t('fenster_setzen')) + '</button>' +
        (k.fenster ? '<button type="button" class="bos-btn bos-btn--ghost" id="fensterWegBtn">' + esc(t('fenster_entfernen')) + '</button>' : '') + '</div>';
    }
  }
  anfrageHtml += '</div>';
  html += flaeche('anfrage', anfrageHtml);

  // Zeitleiste: Kopf („gemeldet“) + alle Einträge außer Nachrichten
  const ereignisse = S.verlauf.filter(function (e) { return e.art !== 'nachricht'; });
  const verlaufHtml = '<ul class="zeitleiste">' +
    '<li><span class="wann">' + esc(M.uhrText(k.erstellt)) + ' · ' + esc(k.vonName || k.von) + '</span>' + esc(t('e_gemeldet')) + '</li>' +
    ereignisse.map(function (e) {
      return '<li><span class="wann">' + esc(M.uhrText(e.ts)) + ' · ' + esc(e.vonName || e.von) + '</span>' + esc(eintragText(e)) +
        (e.grund ? ' <span class="grund">— ' + esc(e.grund) + '</span>' : '') + '</li>';
    }).join('') + '</ul>';

  // Chat
  const nachrichten = S.verlauf.filter(function (e) { return e.art === 'nachricht'; });
  let chatHtml = '<div class="chat">' +
    (nachrichten.length ? nachrichten.map(function (e) {
      return '<div class="blase' + (e.von === S.ich.kennung ? ' meine' : '') + '"><span class="wann">' + esc(e.vonName || e.von) + ' · ' + esc(M.uhrText(e.ts)) + '</span>' + esc(e.text) + '</div>';
    }).join('') : '<div class="leer">' + esc(t('chat_leer')) + '</div>') + '</div>';
  if (archiv) {
    chatHtml += '<div class="leer">' + esc(t('chat_zu')) + '</div>';
  } else {
    chatHtml += '<div class="feld" style="margin-top:12px;"><textarea class="bos-input" id="chatText" maxlength="' + M.GRENZEN.nachricht + '" placeholder="' + esc(t('chat_platzhalter')) + '"></textarea>' +
      '<div class="klein zaehler" id="chatZaehler">' + esc(t('zeichen', { n: 0, max: M.GRENZEN.nachricht })) + '</div>' +
      '<button type="button" class="bos-btn bos-btn--amber" id="chatBtn">' + esc(t('senden')) + '</button></div>';
  }
  html += flaeche('rueckfragen', chatHtml) + flaeche('verlauf', verlaufHtml);

  // Eingaben über das Neuzeichnen retten (Live-Daten zeichnen neu)
  const alt = { chat: wert('chatText'), datum: wert('fensterDatum'), grund: wert('fensterGrund') };
  main.innerHTML = html;
  if (alt.chat !== null) setzeWert('chatText', alt.chat);
  if (alt.datum !== null) setzeWert('fensterDatum', alt.datum);
  if (alt.grund !== null) setzeWert('fensterGrund', alt.grund);
  verbindeZurueck();
  main.querySelectorAll('[data-reiter]').forEach(function (b) {
    b.addEventListener('click', function () { zeigeReiter(b.getAttribute('data-reiter')); });
  });
  main.querySelectorAll('[data-status]').forEach(function (b) {
    b.addEventListener('click', function () { aktion(function () { return M.status(k, b.getAttribute('data-status')); }); });
  });
  const db = document.getElementById('dringBtn');
  if (db) db.addEventListener('click', function () { aktion(function () { return M.dringlichkeit(k, k.dringlichkeit === 'dringend' ? 'normal' : 'dringend'); }); });
  const fb = document.getElementById('fensterBtn');
  if (fb) fb.addEventListener('click', function () {
    aktion(function () { return M.fenster(k, wert('fensterDatum') || '', wert('fensterGrund') || ''); }, function () { setzeWert('fensterGrund', ''); });
  });
  const fw = document.getElementById('fensterWegBtn');
  if (fw) fw.addEventListener('click', function () {
    aktion(function () { return M.fenster(k, '', wert('fensterGrund') || ''); }, function () { setzeWert('fensterGrund', ''); setzeWert('fensterDatum', ''); });
  });
  const ct = document.getElementById('chatText');
  if (ct) {
    const zaehle = function () { document.getElementById('chatZaehler').textContent = t('zeichen', { n: ct.value.length, max: M.GRENZEN.nachricht }); };
    ct.addEventListener('input', zaehle); zaehle();
    document.getElementById('chatBtn').addEventListener('click', function () {
      aktion(function () { return M.nachricht(k, ct.value); }, function (erg) {
        setzeWert('chatText', ''); toast(erg && erg.gesehenGesetzt ? t('gesehen_auto') : t('gespeichert'));
      }, true);
    });
  }
}
/* ---------- Reiter (Nachtrag 2, E23) ---------- */
/* Fremde Nachrichten, jünger als der Lesezeitpunkt VOR dem Öffnen. Auf dem
   Reiter „Rückfragen“ selbst ist alles Sichtbare gelesen. */
function zaehleNeueRueckfragen() {
  if (Merk.aus || !Merk.daten || !S.ich) return 0;
  const nachrichten = S.verlauf.filter(function (e) { return e.art === 'nachricht' && !e.ausstehend && M.ms(e.ts) !== null; });
  if (S.tab === 'rueckfragen') nachrichten.forEach(function (e) { S.rueckBasis = Math.max(S.rueckBasis, M.ms(e.ts)); });
  return nachrichten.filter(function (e) { return e.von !== S.ich.kennung && M.ms(e.ts) > S.rueckBasis; }).length;
}
/* Punkt am Reiter direkt nachziehen — auch wenn das Neuzeichnen gerade
   aufgeschoben ist (jemand tippt), soll er live erscheinen. */
function aktualisiereReiterPunkt() {
  const el = document.getElementById('rueckPunkt');
  if (!el) return;
  const n = zaehleNeueRueckfragen();
  el.textContent = t('reiter_punkt', { n: n });
  el.setAttribute('aria-label', t('reiter_punkt_aria', { n: n }));
  el.hidden = !n;
}
/* Wechsel ohne Neuzeichnen: nur sichtbar/unsichtbar. Getipptes bleibt. */
function zeigeReiter(name) {
  S.tab = name;
  document.querySelectorAll('[data-reiter]').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-reiter') === name)); });
  document.querySelectorAll('[data-flaeche]').forEach(function (f) { f.hidden = f.getAttribute('data-flaeche') !== name; });
  aktualisiereReiterPunkt();
}

function wert(id) { const el = document.getElementById(id); return el ? el.value : null; }
function setzeWert(id, v) { const el = document.getElementById(id); if (el) el.value = v; }
function verbindeZurueck() {
  document.querySelectorAll('[data-zurueck]').forEach(function (b) { b.addEventListener('click', zurueckZurListe); });
}

  if (!M.sauber(m.text, 10000)) fehlt.push(t('m_fehlt_text'));
  if (!m.weiterarbeiten) fehlt.push(t('m_fehlt_wahl'));

  main.innerHTML = '<button type="button" class="link-btn zurueck" data-zurueck="1">' + esc(t('zurueck')) + '</button>' +

  document.getElementById('mText').addEventListener('input', function () { m.text = this.value; zaehle(); pruefeKnopf(); });
  document.getElementById('mGeraet').addEventListener('input', function () { m.geraet = this.value; });

      function (id) {
        S.melden = { text: '', geraet: '', weiterarbeiten: null };
        toast(t('gesendet'));
        oeffne(id);   // ersetzt den Melden-Eintrag (Zurück → Posteingang)
      }, true);
  });
}

function renderVerbindung() {
  const el = document.getElementById('verbindungLeiste');
  const metas = [S.verbindung.offen, S.verbindung.gruen];
  const teile = [];
  if (navigator.onLine === false || metas.some(function (m) { return m.ausCache; })) teile.push(t('offline'));
  if (metas.some(function (m) { return m.ausstehend; })) teile.push(t('ausstehend'));
  el.textContent = teile.join(' · ');
  el.hidden = !teile.length;
}

/* ---------- Handlungen ---------- */
/* Einheitlich: Knöpfe sperren, ausführen, Fehler sichtbar, Erfolg melden. */
function aktion(fn, danach, eigenerToast) {
  if (S.arbeitet) return;
  S.arbeitet = true;
  document.querySelectorAll('#main button').forEach(function (b) { b.disabled = true; });
  Promise.resolve().then(fn).then(function (erg) {
    S.arbeitet = false;
    if (!eigenerToast) toast(t('gespeichert'));
    if (danach) danach(erg);
    render(true);
  }, function (err) {
    S.arbeitet = false;
    zeigeFehler(err && err.art === 'ungueltig' ? 'Eingabe' : 'Speichern', err);
    render(true);
  });
}
function oeffne(id, opt) {
  if (!(opt && opt.ohneEintrag)) eintragSetzen({ ra: 'anfrage', id: id });
  S.ansicht = 'anfrage';
  S.offeneId = id;
  S.verlauf = [];
  S.tab = 'anfrage';                       // E23: öffnet IMMER auf „Anfrage“
  S.rueckBasis = gelesenBis(id);           // Zeitpunkt VOR dem Öffnen (Punkt am Reiter)
  pflegeMerk();                            // Öffnen = gelesen (Kennzeichen weg)
  if (S.verlaufAbo) S.verlaufAbo();
  S.verlaufAbo = M.verlauf(id, function (liste) {
    S.verlauf = liste;
    pflegeMerk();
    aktualisiereReiterPunkt();
    render();
  }, function (err) { zeigeFehler(t('err_laden', { was: 'Verlauf' }), err); });
  render(true);
  window.scrollTo(0, 0);
}
/* E25: Schnellzugriff aus dem Posteingang — dieselbe Mechanik wie in der
   geöffneten Anfrage (aktion → M.status), der Kopf frisch aus der Liste. */
function schnell(id, neu) {
  const k = findeKopf(id);
  if (!k) { zeigeFehler('Speichern', new Error(t('nicht_gefunden'))); return; }
  const vorher = Object.assign({}, k);
  aktion(function () { return M.status(k, neu); }, function (erg) {
    if (neu === 'repariert') toastMitKnopf(t('t_repariert'), t('t_zuruecknehmen'), function () { zuruecknehmen(id, vorher, erg); }, 8000);
    else toast(t('gespeichert'));
  }, true);
}
/* Fund 4 (KC): Nach „repariert“ hat der Kopf ein neues letzterEintrag. Den
   FRISCHEN Kopf nehmen (inzwischen in „Repariert“). Hat die Liste noch nicht
   nachgezogen, den Kopf aus dem eigenen Schreibvorgang bauen. */
function zuruecknehmen(id, vorher, erg) {
  const frisch = findeKopf(id);
  const kopf = (frisch && frisch.status === 'repariert') ? frisch
    : Object.assign({}, vorher, { status: 'repariert', repariertAm: Date.now(), letzterEintrag: (erg && erg.letzterEintrag) || vorher.letzterEintrag });
  aktion(function () { return M.status(kopf, 'gesehen'); }, function () { toast(t('t_zurueck_ok')); }, true);
}
function zurListe() {
  if (S.verlaufAbo) { S.verlaufAbo(); S.verlaufAbo = null; }
  S.ansicht = 'liste'; S.offeneId = null; S.verlauf = [];
  render(true);
}
function zumMelden(opt) {
  if (!(opt && opt.ohneEintrag)) eintragSetzen({ ra: 'melden' });
  if (S.verlaufAbo) { S.verlaufAbo(); S.verlaufAbo = null; }
  S.ansicht = 'melden';
  render(true);
  window.scrollTo(0, 0);
}
/* ---------- Zurück-Taste (Nachtrag 3, Teil B) ----------
   Öffnen und Melden legen je EINEN Verlaufseintrag an; die Zurück-Taste
   (popstate) führt zum Posteingang. „‹“, „‹ Posteingang“ und „Abbrechen“
   nehmen den eigenen Eintrag zurück (history.back()) — so wächst der
   Verlauf beim Hin und Her nicht. Im Posteingang gibt es keinen eigenen
   Eintrag: Zurück verlässt die Seite wie bisher (keine Falle). Läuft die
   Seite im Launcher-Fenster (<iframe>), liegen die Einträge im Verlauf des
   ganzen Tabs; die Zurück-Taste kommt trotzdem hier als popstate an
   (Probe B1). */
const VERLAUF = { bestaetigt: 0 };   // Zeitpunkt der Bestätigung durch „‹“/„Abbrechen“ (gilt 3 s)
function eigenerEintrag() {
  try { return !!(history.state && history.state.ra); } catch (e) { return false; }
}
/* Aus einer eigenen Ansicht in die nächste (Melden → gesendete Anfrage):
   ersetzen statt stapeln, damit EIN Druck auf Zurück reicht. */
function eintragSetzen(zustand) {
  try {
    if (eigenerEintrag()) history.replaceState(zustand, '');
    else history.pushState(zustand, '');
  } catch (e) { console.error('[Reparaturanfrage] Verlauf nicht nutzbar:', e); }
}
/* Poka-Yoke: steht noch etwas Getipptes da, das nicht gesendet ist? */
function ungesendet() {
  if (S.ansicht === 'anfrage') return !!(String(wert('chatText') || '').trim() || String(wert('fensterGrund') || '').trim());
  if (S.ansicht === 'melden') return !!(String(S.melden.text || '').trim() || (String(S.melden.geraet || '').trim() && S.melden.geraet !== S.geraetAusCode));
  return false;
}
function verwerfen() {
  if (S.ansicht === 'melden') S.melden = { text: '', geraet: S.geraetAusCode || '', weiterarbeiten: null };
}
/* Knopf „‹“, „‹ Posteingang“, „Abbrechen“. */
function zurueckZurListe() {
  if (ungesendet() && !window.confirm(t('verwerfen_frage'))) return;
  verwerfen();
  if (eigenerEintrag()) { VERLAUF.bestaetigt = Date.now(); history.back(); return; }  // popstate zeichnet
  zurListe();
}
window.addEventListener('popstate', function (ev) {
  const st = ev.state;
  const bestaetigt = Date.now() - VERLAUF.bestaetigt < 3000;
  VERLAUF.bestaetigt = 0;
  // Vorwärts-Taste: zurück in die Ansicht des Eintrags, ohne neuen anzulegen
  if (st && st.ra === 'anfrage' && st.id) { oeffne(st.id, { ohneEintrag: true }); return; }
  if (st && st.ra === 'melden') { zumMelden({ ohneEintrag: true }); return; }
  if (S.ansicht === 'liste') return;
  if (!bestaetigt && ungesendet() && !window.confirm(t('verwerfen_frage'))) {
    // „nein“: den Eintrag wieder anlegen — Ansicht und Text bleiben stehen
    try { history.pushState(S.ansicht === 'anfrage' ? { ra: 'anfrage', id: S.offeneId } : { ra: 'melden' }, ''); } catch (e) {}
    return;
  }
  if (!bestaetigt) verwerfen();
  zurListe();
});
/* Verlässt die Zurück-Taste die Seite ganz (kein eigener Eintrag — z. B.
   Direkteinstieg ?geraet=, oder Tab schließen) und steht ungesendeter Text
   da: die Browser-Rückfrage „Seite verlassen?“. Nur dann — sonst nie. */
window.addEventListener('beforeunload', function (ev) {
  if (!ungesendet()) return;
  ev.preventDefault();
  ev.returnValue = '';
});
/* Launcher-Fenster geschlossen, während der eigene Eintrag der aktuelle ist:
   Ohne Gegenmittel bliebe ein toter Eintrag im Verlauf des Tabs, und der
   erste Druck auf Zurück täte nichts (Probe B1, Fall 2). Darum hier den
   Eintrag zurücknehmen — über einen Timer IM LAUNCHER: Code dieses
   Fensters läuft nach dem Entfernen nicht mehr (B1: sofortiges back() und
   ein Funktions-Timer wirken nicht, ein Text-Timer im Launcher schon). Der
   Timer prüft zuerst, ob das Fenster wirklich aus dem Launcher entfernt
   ist; navigiert der Launcher selbst weg, stirbt der Timer mit ihm. Fremder
   oder gesperrter Gastgeber: dann bleibt es beim verschluckten Druck. */
window.addEventListener('pagehide', function () {
  try {
    if (window.top === window || !eigenerEintrag() || !window.frameElement) return;
    const oben = window.top;
    oben.__bosRaFenster = window.frameElement;
    oben.setTimeout('try { if (window.__bosRaFenster && !window.__bosRaFenster.isConnected) history.back(); } finally { window.__bosRaFenster = null; }', 0);
  } catch (e) { /* kein Zugriff auf den Gastgeber */ }
});

function schalteArchiv() {
  S.archivAn = !S.archivAn;
  if (S.archivAn && !S.archiv.length) return ladeArchivSeite();
  render(true);
}
function ladeArchivSeite() {
  return M.archivSeite(KANAL, S.archivLetzter).then(function (seite) {
    S.archiv = S.archiv.concat(seite.liste);
    S.archivLetzter = seite.letzter;
    S.archivMehr = seite.mehr;
    render();
  }, function (err) { zeigeFehler(t('err_laden', { was: t('archiv_titel') }), err); });
}
document.getElementById('main').addEventListener('click', function (e) {
  if (S.ansicht !== 'liste') return;
  const s = e.target.closest('[data-schnell]');
  if (s) { if (!s.disabled) schnell(s.getAttribute('data-id'), s.getAttribute('data-schnell')); return; }
  const b = e.target.closest('[data-oeffnen]');
  if (b) oeffne(b.getAttribute('data-oeffnen'));
});
document.getElementById('meldenBtn').addEventListener('click', zumMelden);

/* ---------- Start ---------- */
function geraetAusAdresse() {
  try {
    const p = new URLSearchParams(window.location.search);
    return M.sauber(p.get('geraet') || '', M.GRENZEN.geraet);
  } catch (e) { return ''; }
}
function start() {
  if (!M) { zeigeFehler('Start', new Error('bos_meldungen.js ist nicht geladen.')); return; }
  S.geraetAusCode = geraetAusAdresse();
  M.pruefeRegelstand().then(function (stand) {
    const el = document.getElementById('regelLeiste');
    el.textContent = t('regel_alt', { fassung: M.REGEL_FASSUNG, datei: M.REGEL_DATEI });
    el.hidden = stand !== 'alt';
  });
  M.ich().then(function (ich) {
    S.ich = ich;
    document.getElementById('ladeStatus') && document.getElementById('ladeStatus').remove();
    const r = ich.rechte;
    document.getElementById('werZeile').innerHTML = esc(t('du_als', { name: ich.name })) +
      (r.lesen ? '<span class="abzeichen">' + esc(t('haken_lesen')) + '</span>' : '') +
      (r.melden ? '<span class="abzeichen">' + esc(t('haken_melden')) + '</span>' : '') +
      (r.bearbeiten ? '<span class="abzeichen">' + esc(t('haken_bearbeiten')) + '</span>' : '');
    document.getElementById('meldenBtn').hidden = !r.melden;
    (ich.warnungen || []).forEach(function (w) {
      const h = document.getElementById('hinweisLeiste');
      h.textContent = (h.textContent ? h.textContent + ' · ' : '') + w; h.hidden = false;
    });
    if (!r.lesen) { render(); return; }
    merkLaden();   // Nachtrag 2: „neu“ — scheitert der Gerätespeicher, läuft die Seite ohne Kennzeichen weiter
    M.offen(KANAL, function (liste, meta) { S.offen = liste; S.verbindung.offen = meta; S.listenDa.offen = true; syncLetzte(); pflegeMerk(); render(); },
      function (err) { zeigeFehler(t('err_laden', { was: t('offen_titel') }), err); });
    M.grueneWoche(KANAL, function (liste, meta) { S.gruen = liste; S.verbindung.gruen = meta; S.listenDa.gruen = true; syncLetzte(); pflegeMerk(); render(); },
      function (err) { zeigeFehler(t('err_laden', { was: t('gruen_titel') }), err); });
    // Nach Neuladen: die Ansicht aus dem eigenen Eintrag wiederherstellen
    // (sonst stünde die Liste da, und der erste Druck auf Zurück täte nichts).
    if (eigenerEintrag()) {
      const st = history.state;
      if (st.ra === 'anfrage' && st.id) { oeffne(st.id, { ohneEintrag: true }); return; }
      if (st.ra === 'melden' && r.melden) { if (S.geraetAusCode) S.melden.geraet = S.geraetAusCode; zumMelden({ ohneEintrag: true }); return; }
    }
    if (S.geraetAusCode) {
      // Direkteinstieg (QR-Kärtchen): Melden ist die Grundansicht, KEIN
      // eigener Eintrag — Zurück verlässt die Seite (Bau-Doku N3, Bauplan B).
      if (r.melden) { S.melden.geraet = S.geraetAusCode; zumMelden({ ohneEintrag: true }); return; }
      const h = document.getElementById('hinweisLeiste');
      h.textContent = t('geraet_ohne_melden', { geraet: S.geraetAusCode }); h.hidden = false;
    }
    render();
  }, function (err) {
    const ls = document.getElementById('ladeStatus');
    if (ls) ls.remove();
    zeigeFehler('Konto lesen', err);
  });
  // Alter („seit 3 Tagen“) und Archivgrenze laufen weiter, auch ohne neue Daten.
  setInterval(function () { render(); }, 60000);  // beim Tippen aufgeschoben, siehe render()
}
window.addEventListener('online', renderVerbindung);
window.addEventListener('offline', renderVerbindung);
start();
</script>
