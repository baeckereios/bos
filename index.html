<script>
  /* Stufe 1f (Crumble #62): Platz für den Loch-Crumble in der Karte „Neu hier?“ VOR dem ersten Bild
     reservieren (Symbolkasten 84 px, 74 px Platz für die Blase über der Karte) — sonst spränge die
     Karte, wenn er nachgeladen ist. Aus nur bei bos_crumble_tuer = 'aus' (Gerätewert vom Launcher);
     Speicher gesperrt → an. Lädt er nicht, nimmt bos_tuer_crumble.js bzw. der Lader unten die Klasse
     wieder weg. */
  (function () { var an = true; try { an = localStorage.getItem('bos_crumble_tuer') !== 'aus'; } catch (e) {}
    if (an) document.documentElement.classList.add('mit-crumble'); })();
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bos-bg);
    color: var(--bos-text);
    font-family: var(--bos-font-body);
    -webkit-font-smoothing: antialiased;
  }

  /* Der Raum: eine einzige Spalte, optisch etwas oberhalb der Mitte —
     tiefer gesetzt wirkt eine Anmeldung schwerfällig. */
  .raum {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    padding: var(--bos-space-xl) var(--bos-space-md);
  }

  .mitte {
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    align-self: center;
    padding-bottom: 6vh;
  }

  /* --- Die Glut: der einzige Moment, an dem die Seite laut wird ----
     Ein warmer Schein hinter der Wortmarke, der sehr langsam atmet.
     Restwärme im Ofen, nicht Leuchtreklame. */
  .marke { position: relative; text-align: center; margin-bottom: var(--bos-space-xl); }

  .marke::before {
    content: '';
    position: absolute;
    left: 50%; top: 48%;
    width: 320px; height: 320px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      var(--bos-amber-glow) 0%,
      var(--bos-amber-glow-soft) 38%,
      transparent 68%);
    animation: glut 9s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes glut {
    0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.09); }
  }

  @media (prefers-reduced-motion: reduce) {
    .marke::before { animation: none; opacity: 0.7; }
  }

  .wortmarke {
    position: relative; z-index: 1;
    font-family: var(--bos-font-display);
    font-weight: 900;
    font-size: clamp(2.1rem, 11vw, 2.9rem);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
  }

  .gruss {
    position: relative; z-index: 1;
    margin: var(--bos-space-sm) 0 0;
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-sm);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--bos-text-faint);
  }

  /* --- Formular --------------------------------------------------- */
  .feld { margin-bottom: var(--bos-space-sm); }

  .feld label {
    display: block;
    margin-bottom: var(--bos-space-2xs);
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-xs);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--bos-text-dim);
  }

  .feld input {
    width: 100%;
    min-height: var(--bos-tap-min);
    padding: 0 var(--bos-space-sm);
    background: var(--bos-surface);
    border: 1px solid var(--bos-border);
    border-radius: var(--bos-radius-md);
    color: var(--bos-text);
    font-family: var(--bos-font-body);
    font-size: var(--bos-font-md);
    transition: border-color var(--bos-transition-fast), box-shadow var(--bos-transition-fast);
  }

  .feld input:focus {
    outline: none;
    border-color: var(--bos-amber);
    box-shadow: 0 0 0 3px var(--bos-amber-glow-soft);
  }

  .feld input:focus-visible { outline: 2px solid var(--bos-amber-bright); outline-offset: 2px; }

  /* Stufe 1f (K76): Anmelden und Mobil nebeneinander, je halbe Breite, gleiche Höhe. Tab-Reihenfolge
     Kennung → Passwort → Anmelden → Mobil bleibt (Reihenfolge im Markup). */
  .knopfreihe {
    display: flex;
    gap: 10px;
    margin-top: var(--bos-space-md);
  }
  .knopfreihe > .tuer,
  .knopfreihe > .nebenweg { flex: 0 0 calc(50% - 5px); box-sizing: border-box; min-width: 0; margin-top: 0; }

  .tuer {
    width: 100%;
    min-height: var(--bos-tap-min);
    margin-top: var(--bos-space-md);
    background: var(--bos-amber);
    border: none;
    border-radius: var(--bos-radius-md);
    color: #15100a;
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-md);
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background var(--bos-transition-fast), transform var(--bos-transition-fast);
  }

  .tuer:hover:not(:disabled) { background: var(--bos-amber-bright); }
  .tuer:active:not(:disabled) { transform: translateY(1px); }
  .tuer:disabled { opacity: 0.5; cursor: default; }
  .tuer:focus-visible { outline: 2px solid var(--bos-amber-bright); outline-offset: 3px; }

  /* Zweiter Weg — heute nur ein Platzhalter, siehe Kommentar im Skript. */
  .nebenweg {
    width: 100%;
    min-height: var(--bos-tap-min);
    margin-top: var(--bos-space-xs);
    background: transparent;
    border: 1px dashed var(--bos-border-strong);
    border-radius: var(--bos-radius-md);
    color: var(--bos-text-dim);
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-sm);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    flex-wrap: wrap;            /* Stufe 1f: „(in Planung)“ rutscht von selbst in die zweite Zeile, wenn es nicht passt */
    align-items: center;
    align-content: center;
    justify-content: center;
    column-gap: var(--bos-space-2xs);
    row-gap: 1px;
    padding: 4px 8px;
    line-height: 1.15;
    white-space: nowrap;
    transition: border-color var(--bos-transition-fast), color var(--bos-transition-fast);
  }

  .nebenweg:hover { border-color: var(--bos-amber); color: var(--bos-text); }
  .nebenweg:focus-visible { outline: 2px solid var(--bos-amber-bright); outline-offset: 3px; }

  .nebenweg .planung {
    font-family: var(--bos-font-body);
    font-size: var(--bos-font-xs);
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--bos-text-faint);
  }

  /* --- Einstieg zur Demo-Tour ---------------------------------------
     Bewusst groß und warm, kein Fußnoten-Link: Wer BOS nicht kennt,
     soll sofort sehen, wofür es da ist (Ulf, 10.10.2026). Durchgezogener
     Rand, weil die Tour fertig ist — gestrichelt heißt bei uns „in Planung“. */
  .einblick {
    display: flex;
    align-items: center;
    gap: var(--bos-space-sm);
    margin-top: var(--bos-space-lg);
    padding: var(--bos-space-sm) var(--bos-space-md);
    background: var(--bos-amber-glow-soft);
    border: 1px solid var(--bos-amber);
    border-radius: var(--bos-radius-md);
    color: var(--bos-text);
    text-decoration: none;
    transition: background var(--bos-transition-fast), transform var(--bos-transition-fast);
  }
  .einblick:hover { background: var(--bos-amber-glow); }
  .einblick:active { transform: translateY(1px); }
  .einblick:focus-visible { outline: 2px solid var(--bos-amber-bright); outline-offset: 3px; }

  .einblick-symbol { flex: 0 0 52px; width: 52px; height: 52px; }
  .einblick-symbol svg { width: 100%; height: 100%; overflow: visible; }
  /* Stufe 1f (K77/K78): mit Crumble (Klasse aus der Kopfzeile) ist der Symbolkasten von Anfang an 84 px,
     das alte Kreis-Symbol (52 px) steht mittig darin, bis die Büsten da sind; 20 px Abstand zum Text;
     über der Karte fest 74 px Platz für die Blase (Ulf 15:15: „Finde ich sogar gut, dass es fest ist“).
     Das Loch selbst zeichnet hamster_figur/loch/loch.css.
     K86 (19.10.): html.crumble-platz hält denselben Platz, wenn das Zeitlimit greift, nachdem schon getippt wurde
     (Lader unten) — mit-crumble ist dann weg (die Tür-Datei steigt aus), der Platz bleibt, nichts springt. */
  html.mit-crumble .einblick, html.crumble-platz .einblick { gap: 20px; position: relative; margin-top: var(--tuer-blasenraum, 74px); }
  html.mit-crumble .einblick-symbol, html.crumble-platz .einblick-symbol { flex: 0 0 84px; width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; }
  html.mit-crumble .einblick-symbol svg, html.crumble-platz .einblick-symbol svg { width: 52px; height: 52px; flex: 0 0 52px; }
  .einblick-symbol .kreis-sat {
    transform-origin: 26px 26px;
    animation: einblick-kreisen 7s linear infinite;
  }
  @keyframes einblick-kreisen { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .einblick-symbol .kreis-sat { animation: none; }
  }

  .einblick-text { flex: 1; min-width: 0; }
  .einblick-neu {
    display: block;
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--bos-amber-bright);
  }
  .einblick-titel {
    display: block;
    margin-top: 2px;
    font-family: var(--bos-font-display);
    font-weight: 600;
    font-size: var(--bos-font-lg);
    line-height: 1.2;
    text-wrap: balance;   /* Stufe 1f (Z4): kein einzelnes Wort allein in der letzten Zeile */
  }
  .einblick-unter {
    display: block;
    margin-top: 4px;
    font-size: var(--bos-font-sm);
    color: var(--bos-text-dim);
    line-height: 1.4;
    text-wrap: balance;
  }
  .einblick-pfeil {
    flex: 0 0 auto;
    font-size: 28px;
    line-height: 1;
    color: var(--bos-amber);
  }

  /* --- Meldung: Fehler sichtbar, nicht in der Konsole -------------- */
  .meldung {
    margin-top: var(--bos-space-sm);
    padding: var(--bos-space-xs) var(--bos-space-sm);
    border-radius: var(--bos-radius-sm);
    font-size: var(--bos-font-sm);
    line-height: 1.5;
    display: none;
  }

  .meldung.sichtbar { display: block; }

  .meldung.hinweis { background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.45); color: #f1dc9a; }
  .meldung.fehler {
    background: rgba(214,88,74,0.12);
    border: 1px solid rgba(214,88,74,0.4);
    color: #f0a49a;
  }

  .meldung.laeuft {
    background: var(--bos-surface);
    border: 1px solid var(--bos-border);
    color: var(--bos-text-dim);
  }

  .technisch {
    display: block;
    margin-top: var(--bos-space-2xs);
    font-size: var(--bos-font-xs);
    color: var(--bos-text-faint);
    word-break: break-word;
  }

  /* K84 (19.10.): Prüfzeile (?crumble=pruefen) — unter der Spalte im unteren Innenabstand, absolut,
     damit sie nichts verschiebt (die Spalte ist senkrecht zentriert).
     K87 (19.10.): kurz gefasst, 4 px unter der Wechsel-Zeile, Zeilenhöhe 1,25 (zwei Zeilen passen bei 360 × 640
     in den sichtbaren Rest von 34 px); reicht es trotzdem nicht, macht der Lader die Schrift schrittweise
     kleiner (passeZeile, bis 9 px) — die Zeile bleibt im Bild und verlängert die Seite nie. */
  .mitte { position: relative; }
  .tuer-pruef {
    position: absolute; left: 0; right: 0; top: calc(100% - 6vh + 4px);
    margin: 0; text-align: center; pointer-events: none;
    font-family: var(--bos-font-body); font-size: var(--bos-font-xs); line-height: 1.25;
    color: var(--bos-text-faint); opacity: .85;
  }

  .wechsel {
    margin: var(--bos-space-md) 0 0;
    text-align: center;
    font-size: var(--bos-font-sm);
  }

  .wechsel a {
    color: var(--bos-text-faint);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
    transition: color var(--bos-transition-fast), border-color var(--bos-transition-fast);
  }

  .wechsel a:hover, .wechsel a:focus-visible {
    color: var(--bos-text-dim);
    border-bottom-color: var(--bos-border-strong);
  }

  .wechsel[hidden] { display: none; }

  /* --- Meldungsband ------------------------------------------------ */
  .band {
    align-self: end;
    max-width: 380px;
    width: 100%;
    margin: 0 auto;
    padding-top: var(--bos-space-md);
    border-top: 1px solid var(--bos-border);
    font-size: var(--bos-font-sm);
    color: var(--bos-text-dim);
    line-height: 1.6;
  }

  .band[hidden] { display: none; }
  .band p { margin: 0 0 var(--bos-space-2xs); }
  .band p:last-child { margin-bottom: 0; }

  .band .wann {
    font-family: var(--bos-font-label);
    font-size: var(--bos-font-xs);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bos-text-faint);
    margin-right: var(--bos-space-2xs);
  }
</style>
</head>
<body>

<div class="raum">
  <main class="mitte">
    <div class="marke">

      <p class="gruss" id="gruss">Willkommen</p>

    <div class="feld">

             autocapitalize="none" autocorrect="off" spellcheck="false"
             inputmode="email" placeholder="deine Kennung">

      <input type="password" id="passwort" autocomplete="current-password">

    <!-- Einstieg zur öffentlichen Demo-Tour (tour/tour.html). Ohne
         Anmeldung erreichbar, liest und schreibt keine Daten. -->
    <a class="einblick" href="tour/tour.html">

          <circle cx="26" cy="26" r="9" fill="#d98e2b"/>
          <g class="kreis-sat">
            <circle cx="26" cy="4" r="4.5" fill="#5DCAA5"/>
            <circle cx="45" cy="37" r="3.5" fill="#f3ead8"/>
            <circle cx="7" cy="37" r="3.5" fill="#EF9F27"/>
          </g>
        </svg>
      </span>
      <span class="einblick-text">
        <span class="einblick-neu">Neu hier?</span>
        <span class="einblick-titel">Schau, dafür bin ich da.</span>
        <span class="einblick-unter">Kurze Geschichten zeigen, was BäckereiOS kann – ohne Anmeldung.</span>
      </span>
      <span class="einblick-pfeil" aria-hidden="true">›</span>

    <p class="wechsel"><a href="?wechseln=1" id="wechselLink">Abmelden und andere Kennung verwenden</a></p>

  <aside class="band" id="band" hidden></aside>

<!-- Firebase: nur App + Auth. Firestore wird hier nicht gebraucht,
     die Seite liest und schreibt keine Daten. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- MUSS vor bos_firebase_config.js stehen: verhindert, dass die
     Konfiguration von dieser Seite aus wieder hierher zurückleitet
     (Endlosschleife). -->

<script src="bos_firebase_config.js"></script>
<!-- Rollen-Liste für das Symbol im Profileintrag, Kontenmodul und die
     gemeinsame Mechanik, die den Launcher-Profileintrag schreibt.
     Seit 19.09.2026: die Tür legt den Eintrag an, nicht erst der
     Launcher — sonst sperrt der Zugriffs-Guard beim NFC-Direktaufruf
     auf einem Gerät aus, das den Launcher noch nie gesehen hat. -->
<script src="bos_launcher_roles.js"></script>
<script src="bos_accounts.js"></script>
<!-- 15.10.2026 (#72 Stufe B): Farbprofile — die Tür trägt das wirksame Profil
     in den Profileintrag ein (NFC-/QR-Einstieg). Die Tür selbst bleibt Honig,
     sie lädt kein bos_theme_sync.js. -->
<script src="bos_farbprofile.js"></script>
<script src="bos_konto_profil.js"></script>

<script>
(function () {
  'use strict';

  /* Endung der synthetischen Adressen. Das bestehende Admin-Konto
     (angelegt 31.08.2026) nutzt '@baeckereios.intern' — deshalb hier
     dieselbe Endung und nicht das im Starter vorgeschlagene
     '.invalid'. Zwei Endungen nebeneinander wären eine Fehlerquelle
     ohne Gegenwert. */
  var KENNUNG_ENDUNG = '@baeckereios.intern';

  var STARTSEITE = 'launcher.html';

  /* Firebase kann bei fehlendem oder schlechtem Netz sehr lange
     weiterprobieren, ohne abzubrechen. Ohne diesen Zeitausfall steht
     dann ewig "Meldet an …" da — eine stumme Sackgasse ohne jede
     Auskunft. Fund im Praxistest, 17.09.2026. */
  var GEDULD_MS = 12000;

  /* Kurze Pause, bevor eine bestehende Sitzung durchgewinkt wird.
     Zwei Gründe: man sieht, ALS WER man angemeldet ist (steht sonst
     nirgends im System), und man kommt überhaupt an den Kontowechsel
     heran. Ohne die Pause war die Tür für Angemeldete unsichtbar —
     Fund im Praxistest, 17.09.2026. */
  var DURCHWINK_MS = 2000;

  /* MELDUNGSBAND — später aus Firestore speisen. Solange die Liste
     leer ist, erscheint der Bereich gar nicht. Format je Eintrag:
     { wann: 'kurzer Zeitbezug', text: 'die Meldung' }
     Einsprungstelle für den späteren Umbau: diese Konstante durch
     einen Firestore-Lesevorgang ersetzen und zeigeBand() aufrufen. */
  var MELDUNGEN = [];

  var kennungFeld  = document.getElementById('kennung');
  var passwortFeld = document.getElementById('passwort');
  var btn          = document.getElementById('anmeldenBtn');
  var meldungBox   = document.getElementById('meldung');
  var grussZeile   = document.getElementById('gruss');
  var bandBox      = document.getElementById('band');
  var wechselZeile = document.querySelector('.wechsel');

  /* --- Begrüßung nach der echten Uhrzeit -------------------------- */
  function setzeGruss() {
    var stunde = new Date().getHours();
    var text;
    if (stunde >= 22 || stunde < 4)       text = 'Gute Nacht';
    else if (stunde < 9)                  text = 'Guten Morgen';
    else if (stunde < 12)                 text = 'Guten Vormittag';
    else if (stunde < 18)                 text = 'Guten Tag';
    else                                  text = 'Guten Abend';
    grussZeile.textContent = text;
  }

  /* --- Meldungen -------------------------------------------------- */
  function zeigeMeldung(text, art, technisch) {
    meldungBox.className = 'meldung sichtbar ' + art;
    meldungBox.textContent = text;
    if (technisch) {
      var span = document.createElement('span');
      span.className = 'technisch';
      span.textContent = technisch;
      meldungBox.appendChild(span);
    }
  }

  function versteckeMeldung() {
    meldungBox.className = 'meldung';
    meldungBox.textContent = '';
  }

  /* Firebase-Codes in Klartext. Alles Unbekannte bekommt zusätzlich
     die technische Meldung angehängt — nie nur "fehlgeschlagen". */
  function uebersetze(fehler) {
    var code = (fehler && fehler.code) || '';
    switch (code) {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':
        return 'Kennung oder Passwort stimmt nicht.';
      case 'auth/invalid-email':
        return 'Diese Kennung hat kein gültiges Format.';
      case 'auth/user-disabled':
        return 'Diese Kennung ist gesperrt.';
      case 'auth/too-many-requests':
        return 'Zu viele Versuche. Ein paar Minuten warten, dann noch einmal.';
      case 'auth/network-request-failed':
        return 'Keine Verbindung. Netz prüfen und noch einmal versuchen.';
      default:
        return 'Anmeldung fehlgeschlagen.';
    }
  }

  /* --- Türsteher Crumble (18.10.2026, #62 Stufe 1e) ----------------
     Nur Schmuck: jeder Aufruf ist eingepackt und tut ohne Crumble nichts.
     Fall-Schlüssel kommen aus dem Firebase-Code bzw. der auslösenden Stelle,
     nie aus dem Meldungstext. Der Lader steht ganz unten. */
  window.BOS_TUER_ZUSTAND = window.BOS_TUER_ZUSTAND || {};
  function crumbleFall(schluessel) {
    try { if (schluessel && window.BOS_TUER_CRUMBLE) window.BOS_TUER_CRUMBLE.fall(schluessel); } catch (e) {}
  }
  function fallAusCode(fehler) {
    switch ((fehler && fehler.code) || '') {
      case 'auth/invalid-credential':
      case 'auth/wrong-password':
      case 'auth/user-not-found':         return 'falsch';
      case 'auth/invalid-email':          return 'format';
      case 'auth/user-disabled':          return 'gesperrt';
      case 'auth/too-many-requests':      return 'zu_viele';
      case 'auth/network-request-failed': return 'netz';
      default:                            return '';   // unbekannt: er schweigt
    }
  }

  /* --- Weiterleitungsziel ----------------------------------------- */
  /* Nur seiteneigene, relative Pfade. Ein absoluter oder fremder Wert
     würde die Seite zu einem offenen Weiterleiter machen. */
  function zielPfad() {
    var roh = new URLSearchParams(window.location.search).get('weiter');
    if (!roh) return STARTSEITE;

    /* ZUERST säubern, DANN prüfen — 19.09.2026.
       Browser entfernen Tabulator, Zeilenumbruch und Wagenrücklauf,
       bevor sie eine Adresse auflösen (URL-Standard). Ohne diesen
       Schritt prüfen wir einen anderen Wert als den, der später
       benutzt wird: "java<TAB>script:alert(1)" passiert die
       Schema-Prüfung unbeschadet und wird vom Browser danach wieder
       zu javascript:alert(1) — ausgeführt im Kontext der Seite, mit
       Zugriff auf die angemeldete Sitzung. */
    roh = roh.replace(/[\t\n\r]/g, '').trim();
    if (!roh) return STARTSEITE;

    /* Übrige Steuerzeichen werden vom Browser nicht entfernt, sondern
       kodiert — sie können also kein Schema wiederherstellen. Trotzdem
       abweisen statt umschreiben: in einem Dateipfad haben sie nichts
       zu suchen, und Abweisen ist ehrlicher als stilles Verändern. */
    if (/[\u0000-\u001F\u007F]/.test(roh)) return STARTSEITE;

    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(roh)) return STARTSEITE; // http:, javascript: …
    if (roh.charAt(0) === '/' || roh.indexOf('//') === 0) return STARTSEITE;
    if (roh.indexOf('..') !== -1) return STARTSEITE;
    /* T-116, 19.09.2026: Rückschrägstrich verwerfen. Browser wandeln \ in /
       um, also wird aus weiter=\\fremde-seite.tld ein //fremde-seite.tld —
       eine Adresse ohne Protokoll, und die Tür leitet nach außen weiter.
       Genau das offene Weiterleiten, das diese Prüfung verhindern soll. */
    if (roh.indexOf('\\') !== -1) return STARTSEITE;
    return roh;
  }

  /* Vor dem Weiterleiten den Launcher-Profileintrag sicherstellen.
     Der Zugriffs-Guard auf jeder Satellitenseite liest die Rolle
     synchron aus dem localStorage; ohne Eintrag ist sie null und der
     Guard sperrt — auch jemanden, der die Seite bedienen darf. Betrifft
     genau den NFC-Weg auf einem frischen Gerät. Fund 19.09.2026. */
  function weiter() {
    var ziel = zielPfad();
    var nutzer = firebase.auth().currentUser;

    if (!nutzer || !window.BOS_KONTO_PROFIL) {
      window.location.replace(ziel);
      return;
    }

    var abgeschickt = false;
    function los() {
      if (abgeschickt) return;
      abgeschickt = true;
      window.location.replace(ziel);
    }

    zeigeMeldung('Berechtigung wird geladen …', 'laeuft');

    /* Der Profileintrag darf den Weg nicht blockieren: was nach drei
       Sekunden nicht da ist, holt der Launcher später nach. Die Grenze
       bleibt, aber sie ist nicht mehr stumm (T-117) — sonst landet man
       ohne Erklärung auf einer Seite, die anschließend "Berechtigung
       unbekannt" zeigt, und weiß nicht, warum. */
    var geduld = setTimeout(function () {
      if (abgeschickt) return;
      zeigeMeldung('Berechtigung konnte nicht rechtzeitig geladen werden. ' +
                   'Es geht trotzdem weiter — bei Bedarf im Launcher neu laden.',
                   'fehler');
      setTimeout(los, 1600);
    }, 3000);

    window.BOS_KONTO_PROFIL.stelleSicher(window.db, nutzer)
      .then(function (ergebnis) {
        clearTimeout(geduld);
        if (abgeschickt) return;
        /* Schritt 2 (§11.5): Konto da, aber ohne Haken — ein Hinweis,
           kein Fehler. Weiter geht es trotzdem (der Launcher zeigt dann
           nur die offenen Kacheln). */
        if (ergebnis && ergebnis.geladen && ergebnis.kontoVorhanden && ergebnis.freigeschaltet === false) {
          zeigeMeldung('Noch nicht freigeschaltet — dein Konto ist angelegt, aber noch nicht aktiv. ' +
                       'Sag Ulf Bescheid.', 'hinweis');
          crumbleFall('freischalten');
          setTimeout(los, 2600);
          return;
        }
        if (!ergebnis || !ergebnis.geladen) {
          zeigeMeldung('Berechtigung konnte nicht geladen werden — ' +
                       'es gilt der zuletzt bekannte Stand.', 'fehler',
                       ergebnis && ergebnis.fehler
                         ? ((ergebnis.fehler.message) || String(ergebnis.fehler))
                         : '');
          setTimeout(los, 1600);
          return;
        }
        los();
      })
      .catch(function (fehler) {
        clearTimeout(geduld);
        if (abgeschickt) return;
        console.error('[BOS Anmeldung] Profileintrag nicht geschrieben', fehler);
        zeigeMeldung('Berechtigung konnte nicht gespeichert werden.', 'fehler',
                     (fehler && fehler.message) || String(fehler));
        setTimeout(los, 1600);
      });
  }

  /* --- Meldungsband ----------------------------------------------- */
  function zeigeBand(eintraege) {
    if (!eintraege || !eintraege.length) return;
    bandBox.textContent = '';
    eintraege.forEach(function (m) {
      var p = document.createElement('p');
      if (m.wann) {
        var wann = document.createElement('span');
        wann.className = 'wann';
        wann.textContent = m.wann;
        p.appendChild(wann);
      }
      p.appendChild(document.createTextNode(m.text || ''));
      bandBox.appendChild(p);
    });
    bandBox.hidden = false;
  }

  /* --- Anmeldung -------------------------------------------------- */
  function anmelden() {
    var kennung = kennungFeld.value.trim();
    var passwort = passwortFeld.value;

    if (!kennung)  { zeigeMeldung('Kennung eingeben.', 'fehler'); kennungFeld.focus(); return; }
    if (!passwort) { zeigeMeldung('Passwort eingeben.', 'fehler'); passwortFeld.focus(); return; }

    var adresse = kennung.indexOf('@') === -1 ? kennung + KENNUNG_ENDUNG : kennung;

    btn.disabled = true;
    zeigeMeldung('Meldet an …', 'laeuft');

    var fertig = false;
    var uhr = setTimeout(function () {
      if (fertig) return;
      fertig = true;
      btn.disabled = false;
      zeigeMeldung(
        'Keine Antwort von Firebase. Meist fehlt dem Gerät gerade die ' +
        'Internetverbindung — die Seite selbst läuft ja lokal weiter. ' +
        'Netz prüfen und noch einmal versuchen.',
        'fehler',
        'Zeitausfall nach ' + (GEDULD_MS / 1000) + ' Sekunden. Adresse: ' + adresse
      );
      crumbleFall('netz');
    }, GEDULD_MS);

    firebase.auth().signInWithEmailAndPassword(adresse, passwort)
      .then(function () {
        if (fertig) return;   /* Zeitausfall war schneller — nicht überschreiben */
        fertig = true; clearTimeout(uhr);
        zeigeMeldung('Angemeldet. Einen Moment …', 'laeuft');
        crumbleFall('angemeldet');
        weiter();
      })
      .catch(function (fehler) {
        if (fertig) return;
        fertig = true; clearTimeout(uhr);
        btn.disabled = false;
        passwortFeld.value = '';
        console.error('[BOS Anmeldung] fehlgeschlagen:', fehler);
        zeigeMeldung(
          uebersetze(fehler),
          'fehler',
          (fehler && fehler.code ? fehler.code + ' — ' : '') + ((fehler && fehler.message) || String(fehler))
        );
        crumbleFall(fallAusCode(fehler));
        passwortFeld.focus();
      });
  }

  /* --- Start ------------------------------------------------------ */
  setzeGruss();
  zeigeBand(MELDUNGEN);

  /* --- Mobile Ansicht ---------------------------------------------
     PLATZHALTER, 18.09.2026. Noch kein Verhalten, bewusst so — der
     Knopf ist eine Erinnerung an die geplante, stark vereinfachte
     Darstellung fürs Handy. Später wird das hier ein Abzweig: gleiche
     Anmeldung, danach eine andere Oberfläche statt des Launchers.

     Zum Scharfschalten genügt es, ZIEL_MOBIL zu setzen und den
     Klick-Handler unten auf weiter() umzustellen — dann landet man
     nach der Anmeldung dort statt im Launcher. */
  var ZIEL_MOBIL = null;   // z. B. 'mobil.html'

  document.getElementById('mobilBtn').addEventListener('click', function () {
    if (ZIEL_MOBIL) {
      window.location.replace(ZIEL_MOBIL);
      return;
    }
    zeigeMeldung('Die mobile Ansicht ist noch nicht gebaut — ' +
                 'bis dahin führt „Anmelden" in den gewohnten Launcher.', 'laeuft');
  });

  btn.addEventListener('click', anmelden);
  [kennungFeld, passwortFeld].forEach(function (feld) {
    feld.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') anmelden();
    });
    feld.addEventListener('input', versteckeMeldung);
  });

  /* Schon angemeldet? Dann gar nicht erst fragen — ausser beim
     ausdrücklichen Kontowechsel (?wechseln=1). Ohne diesen Weg wäre
     die Tür eine Sackgasse: wer angemeldet ist, käme nie an das
     Formular, um sich mit einer anderen Kennung anzumelden.
     Fund im ersten Praxistest, 17.09.2026.

     Betrifft auch die bestehenden anonymen Sitzungen — solange
     Anonymous Auth in der Konsole aktiv bleibt, kommt ein Gerät mit
     alter Sitzung ohne Anmeldung durch. Genau das ist der Rückweg,
     falls hier etwas klemmt. */
  function beobachteAnmeldung() {
    firebase.auth().onAuthStateChanged(function (nutzer) {
      if (nutzer) {
        var wer = nutzer.email || (nutzer.isAnonymous ? 'anonyme Sitzung (alter Stand)' : nutzer.uid);
        zeigeMeldung('Angemeldet als ' + wer + '. Weiter zum Launcher …', 'laeuft');
        window.BOS_TUER_ZUSTAND.durchwinken = true;
        crumbleFall('durchwinken');
        btn.disabled = true;
        kennungFeld.disabled = true;
        passwortFeld.disabled = true;
        setTimeout(weiter, DURCHWINK_MS);
      } else {
        kennungFeld.disabled = false;
        passwortFeld.disabled = false;
        kennungFeld.focus();
      }
    });
  }

  if (new URLSearchParams(window.location.search).get('wechseln')) {
    /* Erst abmelden, DANN beobachten — sonst gewinnt der alte Nutzer
       das Rennen und leitet weiter, bevor signOut() durch ist. */
    if (wechselZeile) wechselZeile.hidden = true;
    zeigeMeldung('Meldet ab …', 'laeuft');
    btn.disabled = true;
    firebase.auth().signOut()
      .then(function () {
        versteckeMeldung();
        btn.disabled = false;
        beobachteAnmeldung();
      })
      .catch(function (fehler) {
        btn.disabled = false;
        console.error('[BOS Anmeldung] Abmelden fehlgeschlagen:', fehler);
        zeigeMeldung(
          'Abmelden fehlgeschlagen.',
          'fehler',
          (fehler && fehler.code ? fehler.code + ' — ' : '') + ((fehler && fehler.message) || String(fehler))
        );
        beobachteAnmeldung();
      });
  } else {
    beobachteAnmeldung();
  }

  /* --- Crumble nachladen (18.10.2026, #62 Stufe 1e/1f; Zeitlimit und Prüfschalter 19.10.) ----
     Erst nach 'load' und im Leerlauf, als async-Skript — das Formular ist
     längst bedienbar. Aus, wenn das letzte Konto an diesem Gerät Crumble
     ausgeschaltet hatte (Gerätewert vom Launcher). Ladefehler: ein Hinweis
     in der Konsole, sonst nichts (F1).
     ZEITLIMIT (K83, 19.10.): Steht 8 s nach dem Start des Laders das Loch
     nicht (.einblick-symbol ohne Klasse loch), geht die Tür zurück wie vor 1f
     (mit-crumble weg) und was danach noch ankommt, wird in dieser Seitenansicht
     nicht mehr gezeigt. Anlass: nach einem GitSync lieferte der Zwischenspeicher
     bis zu 10 Minuten eine alte bos_tuer_crumble.js (1e) zur neuen Tür — Platz
     über der Karte, aber kein Crumble (Ulf 19.10., 00:56). Eine Tür-Datei ohne
     Stand (BOS_TUER_CRUMBLE.stand) gilt als fremd → sofort zurück.
     PRÜFSCHALTER (K84): ?crumble=pruefen merkt sich das Gerät (localStorage
     bos_crumble_pruefen = '1', gilt auch in der PWA), ?crumble=normal löscht.
     Dann steht unter der Wechsel-Zeile eine kleine graue Zeile: Schalter,
     Stand der Tür-Datei, Ladeschritte, bei Ausfall der Grund mit der echten
     Meldung. Ohne Schalter bleibt alles still. Nichts davon im Anmeldeweg.
     NUR ZURÜCK, WENN KEINER TIPPT (K86, 19.10., Ulf): Greift das Zeitlimit, nachdem
     jemand die Seite schon angefasst hat (Tipp/Klick/Taste/Eingabe seit dem Laden,
     oder das Feld mit dem Fokus ist nicht leer), bleibt der Platz stehen
     (html.crumble-platz statt mit-crumble, Kreis-Symbol im 84-px-Kasten) — sonst
     spränge die senkrecht zentrierte Spalte unter dem Finger um bis zu 35 px.
     Der Fokus, den die Seite selbst beim Öffnen ins Kennungsfeld setzt, zählt
     NICHT als Anfassen (sonst bliebe der Platz bei jedem Zeitlimit stehen).
     Ladefehler (404, kaputt) und die Tür-Datei ohne Stand schalten weiter sofort
     zurück (K86: „bleiben wie geliefert“). */
  try {
    var LIMIT_MS = 8000;
    var wurzel = document.documentElement;
    var lesen = function (k) { try { return window.localStorage ? localStorage.getItem(k) : null; } catch (e) { return undefined; } };
    var pruefen = false;
    try {
      var q = (location.search.match(/[?&]crumble=([a-z]+)/) || [])[1];
      if (q === 'pruefen') localStorage.setItem('bos_crumble_pruefen', '1');
      if (q === 'normal') localStorage.removeItem('bos_crumble_pruefen');
      pruefen = q === 'pruefen' || (q !== 'normal' && localStorage.getItem('bos_crumble_pruefen') === '1');
    } catch (e) { pruefen = /[?&]crumble=pruefen/.test(location.search); }
    var schalterWert = lesen('bos_crumble_tuer');
    var L = window.BOS_TUER_LADEN = {
      start: 0, abgebrochen: false, fertig: false, grund: '', stand: '',
      schritte: { datei: false, css: false, texte: false, buesten: 0, buestenSoll: 11, eingesetzt: false },
      melde: function (schritt, wert) { L.schritte[schritt] = wert; zeile(); },
      fehler: function (text) { if (!L.grund) L.grund = text; zeile(); },
      fertigMeldung: function () { L.fertig = true; L.ms = Math.round(performance.now() - L.start); zeile(); },
      pruefen: pruefen
    };
    /* K86: Hat jemand die Seite schon angefasst? (ab hier, also vor 'load'; nur solange das Zeitlimit offen ist) */
    var angefasst = '';
    var ANFASSEN = ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'input', 'paste'];
    var merkeAnfassen = function (e) { if (!angefasst) angefasst = e.type; };
    var anfassenAus = function () { ANFASSEN.forEach(function (t) { document.removeEventListener(t, merkeAnfassen, true); }); };
    if (schalterWert !== 'aus') ANFASSEN.forEach(function (t) { document.addEventListener(t, merkeAnfassen, { capture: true, passive: true }); });
    var feldMitInhalt = function () {
      var a = document.activeElement;
      return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.value);
    };
    var zeileEl = null;
    /* K87: Zeile bleibt im Bild — reicht der Platz bis zum unteren Fensterrand (bzw. bis zum Seitenende, wenn die
       Spalte ohnehin länger ist als das Fenster) nicht, wird die Schrift schrittweise kleiner, bis 9 px. */
    var passeZeile = function () {
      if (!zeileEl) return;
      try {
        zeileEl.style.fontSize = '';
        var y = window.pageYOffset || 0, zr = zeileEl.getBoundingClientRect();
        var raum = document.querySelector('.raum'), raumUnten = raum ? raum.getBoundingClientRect().bottom + y : document.documentElement.scrollHeight;
        var grenze = (zr.top + y < window.innerHeight ? Math.min(window.innerHeight, raumUnten) : raumUnten) - 2;
        var px = parseFloat(getComputedStyle(zeileEl).fontSize) || 11;
        while (zeileEl.getBoundingClientRect().bottom + y > grenze && px - 0.5 >= 9) { px -= 0.5; zeileEl.style.fontSize = px + 'px'; }
      } catch (e) {}
    };
    var zeile = function () {
      if (!pruefen) return;
      try {
        if (!zeileEl) {
          zeileEl = document.createElement('p');
          zeileEl.className = 'tuer-pruef'; zeileEl.id = 'tuerPruef'; zeileEl.setAttribute('role', 'status');
          var mitte = document.querySelector('.mitte'); (mitte || document.body).appendChild(zeileEl);
          window.addEventListener('resize', passeZeile);
        }
        /* K87: kurz — „Crumble · Tür 1f · CSS ✓ · Texte ✓ · 11/11 · geladen in 66 ms“; Schalter nur, wenn er nicht auf „nicht gesetzt (gilt als an)“ steht */
        var t = 'Crumble';
        if (schalterWert === undefined) t += ' · Speicher gesperrt (gilt als an)';
        else if (schalterWert !== null) t += ' · Schalter: ' + schalterWert;
        if (schalterWert === 'aus') { zeileEl.textContent = t + ' · an diesem Gerät ausgeschaltet — nichts geladen'; passeZeile(); return; }
        var st = L.schritte;
        t += ' · Tür ' + (L.stand || (st.datei ? 'geladen' : (L.start ? 'lädt …' : 'wartet auf load')));
        /* Bei Ausfall statt der Schritte nur der Grund (er nennt den fehlenden Schritt); Pfad ohne „hamster_figur/“ — die Konsole hat ihn ganz */
        if (L.grund && !L.fertig) { t += ' · NICHT GELADEN: ' + L.grund.replace(/hamster_figur\//g, ''); zeileEl.textContent = t; passeZeile(); return; }
        t += ' · CSS ' + (st.css ? '✓' : '–') + ' · Texte ' + (st.texte ? '✓' : '–') + ' · ' + st.buesten + '/' + st.buestenSoll;
        if (L.fertig) t += ' · geladen in ' + L.ms + ' ms';
        zeileEl.textContent = t;
        passeZeile();
      } catch (e) {}
    };
    var fehlt = function () {
      var st = L.schritte;
      if (!st.datei) return 'bos_tuer_crumble.js';
      if (!st.css) return 'hamster_figur/loch/loch.css';
      if (!st.texte) return 'hamster_figur/loch/loch.json';
      if (st.buesten < st.buestenSoll) return 'Büsten (' + st.buesten + '/' + st.buestenSoll + ')' + (st.wartetAuf ? ', zuletzt offen: ' + st.wartetAuf : '');
      return 'Einsetzen in die Karte';
    };
    var zurueck = function (grund, platzBleibt) {
      if (L.abgebrochen || L.fertig || L.grund) return;   // schon ausgefallen und gemeldet (z. B. 404) — keine zweite Konsolenzeile
      L.abgebrochen = true;
      if (platzBleibt) { L.platzBleibt = true; wurzel.classList.add('crumble-platz'); }   // K86: erst den Platz halten, dann mit-crumble weg — kein Sprung
      wurzel.classList.remove('mit-crumble');
      try { var bs = document.querySelectorAll('.bos-tuer-buehne'); for (var i = 0; i < bs.length; i++) bs[i].parentNode.removeChild(bs[i]); } catch (e) {}   // Bühne einer alten 1e-Datei
      var c = window.BOS_TUER_CRUMBLE;
      if (!c || !c.stand) window.BOS_TUER_CRUMBLE = { fall: function () {}, stand: 'abgeschaltet', _zustand: function () { return { bereit: false, abgeschaltet: true }; } };   // kommt die Datei noch, steigt sie sofort aus
      console.warn('[tuer-crumble] ' + grund + ' — die Tür läuft ohne Crumble' + (platzBleibt ? ', der Platz bleibt (es wurde schon getippt: ' + platzBleibt + ').' : '.'));
      L.fehler(grund + (platzBleibt ? ' · Platz bleibt (es wurde schon getippt)' : ''));
    };
    var statusVon = function (url, wenn) {   // nur im Prüfmodus: HTTP-Status nachfragen (script/link geben keinen)
      if (!pruefen || !window.fetch) return wenn('');
      fetch(url, { method: 'HEAD', cache: 'no-store' }).then(function (r) { wenn('HTTP ' + r.status); }).catch(function (e) { wenn((e && e.message) || 'Netzfehler'); });
    };
    L.statusVon = statusVon;
    var ladeTuerCrumble = function () {
      if (schalterWert === 'aus') { zeile(); return; }
      L.start = performance.now(); zeile();
      /* Platzhalter OHNE Stand vor dem Laden: Eine alte 1e-Datei (prüft nur „gibt es BOS_TUER_CRUMBLE?“) steigt damit sofort
         aus — keine Bühne, kein Modul, keine eigene Konsolenzeile. Die 1f-Datei ersetzt den Platzhalter (sie prüft auf .stand). */
      if (!window.BOS_TUER_CRUMBLE) window.BOS_TUER_CRUMBLE = { fall: function () {}, _zustand: function () { return { bereit: false, platzhalter: true }; } };
      var s = document.createElement('script');
      s.src = 'bos_tuer_crumble.js';
      s.async = true;
      s.onload = function () {
        L.schritte.datei = true;
        var c = window.BOS_TUER_CRUMBLE;
        if (!L.abgebrochen && (!c || !c.stand)) zurueck('Tür-Datei ohne Stand (älterer Stand im Zwischenspeicher? nach einem GitSync bis 10 min möglich)');
        else { L.stand = (c && c.stand) || ''; zeile(); }
      };
      s.onerror = function () {
        if (L.abgebrochen) return;
        L.abgebrochen = true;
        wurzel.classList.remove('mit-crumble');   // Stufe 1f: Platz über der Karte zurück
        console.warn('[tuer-crumble] bos_tuer_crumble.js nicht ladbar — die Tür läuft ohne Crumble.');
        statusVon('bos_tuer_crumble.js', function (st) { L.fehler('bos_tuer_crumble.js nicht ladbar' + (st ? ' (' + st + ')' : '')); });
      };
      document.body.appendChild(s);
      setTimeout(function () {
        anfassenAus();
        if (document.querySelector('.einblick-symbol.loch')) return;
        var wie = angefasst || (feldMitInhalt() ? 'Feld mit Fokus nicht leer' : '');   // K86
        zurueck('Zeitlimit ' + (LIMIT_MS / 1000) + ' s — es fehlte: ' + fehlt(), wie);
      }, LIMIT_MS);
    };
    var spaeter = function () {
      if (window.requestIdleCallback) window.requestIdleCallback(ladeTuerCrumble, { timeout: 1500 });
      else setTimeout(ladeTuerCrumble, 600);

  } catch (e) { console.warn('[tuer-crumble] Lader', e); }
})();
