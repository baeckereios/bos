  .datum-zeile input[type="date"] {

  .gw-eintrag.leer { color: var(--vm-text-schwach); border-top: none; }

  .bottom-sheet {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);

  .bottom-sheet-inhalt {
    background: var(--vm-oberflaeche);

  .bottom-sheet-inhalt h3 { font-family: var(--vm-font-label); letter-spacing: .02em; color: var(--vm-primary-hell); margin-bottom: var(--bos-space-3xs, 4px); }
  .bottom-sheet-inhalt p { color: var(--vm-text); line-height: 1.5; }
  #hilfeSchliessen { position: absolute; top: 12px; right: 12px; }

  [hidden] { display: none !important; }
</style>

  /* -----------------------------------------------------------
   * 2) Rollen-Check — läuft bereits VOR diesem Skript, siehe
   *    <script src="../bos_standalone_login.js"> im Kopf der Datei
   *    (bis 03.09.2026 war das bos_access_guard.js — seit Thema 2,
   *    04.09.2026, ersetzt, da diese Seite jetzt auch standalone per
   *    NFC/QR geöffnet werden kann).
   *    Der Login/Guard blockiert sich bei Bedarf selbst per eigenem
   *    Overlay (kein Aufruf/keine Rückgabe nötig) — die frühere Version
   *    hier rief eine erfundene, nicht existierende API auf
   *    (BOS_ACCESS_GUARD.pruefeRolle()) und ist ersatzlos entfernt.
   *    Das #zugriffGesperrt-Element in der Seite ist damit ebenfalls
   *    überflüssig geworden (bringt sein eigenes Overlay mit) und
   *    bleibt unsichtbar/ungenutzt stehen.
   * --------------------------------------------------------- */

  /* -----------------------------------------------------------
   * 3) Grundzustand
   * --------------------------------------------------------- */
  const WOCHENTAGE = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];

  const zustand = {
    produkte: [],           // gefilterte Liste (manuelleErfassung === true)
    besondererTag: null,    // null = noch nicht gewählt (Poka-Yoke aktiv)
    pruefungLaeuft: false
  };

  const el = {
    datumInput: document.getElementById('datumInput'),
    wochentagAnzeige: document.getElementById('wochentagAnzeige'),
    feiertagsHinweis: document.getElementById('feiertagsHinweis'),
    mehrfachWarnung: document.getElementById('mehrfachWarnung'),
    btnNormalerTag: document.getElementById('btnNormalerTag'),
    btnBesondererTag: document.getElementById('btnBesondererTag'),
    besondererTagStatus: document.getElementById('besondererTagStatus'),
    produktListe: document.getElementById('produktListe'),
    keineProdukteHinweis: document.getElementById('keineProdukteHinweis'),
    speichernBtn: document.getElementById('speichernBtn'),
    speicherStatus: document.getElementById('speicherStatus'),
    ausreisserModal: document.getElementById('ausreisserModal'),
    ausreisserListe: document.getElementById('ausreisserListe'),
    btnZurueckPruefen: document.getElementById('btnZurueckPruefen'),
    btnTrotzdemSpeichern: document.getElementById('btnTrotzdemSpeichern'),
    hilfeBtn: document.getElementById('hilfeBtn'),
    hilfeSheet: document.getElementById('hilfeSheet'),
    hilfeSchliessen: document.getElementById('hilfeSchliessen'),

    grundlageInhalt: document.getElementById('grundlageInhalt'),
    grundlageSchliessen: document.getElementById('grundlageSchliessen')
  };

  function heutigesDatumISO() {
    const jetzt = new Date();
    const offset = jetzt.getTimezoneOffset();
    const lokal = new Date(jetzt.getTime() - offset * 60000);
    return lokal.toISOString().slice(0, 10);
  }

  function wochentagVonISODatum(isoDatum) {
    const [jahr, monat, tag] = isoDatum.split('-').map(Number);
    const d = new Date(jahr, monat - 1, tag);
    return WOCHENTAGE[d.getDay()];
  }

  /* -----------------------------------------------------------
   * 4) Feiertags-/Ferien-Hinweis (rein informativ, setzt NIE das
   *    besondererTag-Flag automatisch — aktive Wahl bleibt beim
   *    Nutzer, siehe SESSION_2026-08-18_VERBRAUCHSUEBERSICHT_DOKU.md §3.1)
   *
   *    29.08.2026 — verdrahtet: die Datenquelle (bos_zeitkontext_
   *    referenz.js) ist jetzt eingebunden (siehe Kopf der Datei), der
   *    bisherige Platzhalter (lieferte immer null) ist ersetzt durch
   *    einen echten Umkreis-Lookup. Umkreis-Toleranz war im Konzept als
   *    offener Punkt markiert ("z. B. ±3 Tage") — hier auf 3 Tage
   *    festgelegt, änderbar über FEIERTAGS_UMKREIS_TAGE.
   *    Graceful Degradation bleibt erhalten: fehlt die Referenzdatei
   *    (BOS_IST_BESONDERER_TAG undefiniert), liefert die Funktion
   *    weiterhin null — kein Hinweis, kein Fehler.
   * --------------------------------------------------------- */
  const FEIERTAGS_UMKREIS_TAGE = 3;

  function lokalesISODatum(d) {
    // Bewusst KEIN d.toISOString() — konvertiert auf UTC und führt in
    // deutschen Zeitzonen nachts zu Off-by-one-Fehlern (bekannter Bug,
    // siehe FEHLENDE_TAGE_DOKU.md).
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function pruefeFeiertagsNaehe(isoDatum) {
    if (!isoDatum || typeof window.BOS_IST_BESONDERER_TAG !== 'function') return null;
    const [jahr, monat, tag] = isoDatum.split('-').map(Number);
    const basis = new Date(jahr, monat - 1, tag);
    for (let versatz = -FEIERTAGS_UMKREIS_TAGE; versatz <= FEIERTAGS_UMKREIS_TAGE; versatz++) {
      const d = new Date(basis);
      d.setDate(d.getDate() + versatz);
      const info = window.BOS_IST_BESONDERER_TAG(lokalesISODatum(d));
      if (info) return 'liegt in der Nähe von ' + info.name;
    }
    return null;
  }

  function aktualisiereFeiertagsHinweis() {
    const hinweis = pruefeFeiertagsNaehe(el.datumInput.value);
    if (hinweis) {
      el.feiertagsHinweis.textContent = 'ℹ️ ' + hinweis;
      el.feiertagsHinweis.hidden = false;
    } else {
      el.feiertagsHinweis.hidden = true;
    }
  }

  /* -----------------------------------------------------------
   * 5) Weiche Mehrfach-Prüfung (max. 1x/Tag, Fumbling-Schutz)
   * --------------------------------------------------------- */
  async function pruefeVorhandenenEintrag() {
    el.mehrfachWarnung.hidden = true;
    const datum = el.datumInput.value;
    if (!datum) return;
    try {
      const snap = await window.db.collection('bos_events')
        .where('type', '==', 'verbrauch_manuell')
        .where('datum', '==', datum)
        .limit(1)
        .get();
      if (!snap.empty) {
        const data = snap.docs[0].data();
        let uhrzeit = '';
        if (data.ts && typeof data.ts.toDate === 'function') {
          uhrzeit = ' um ' + data.ts.toDate().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
        }
        el.mehrfachWarnung.textContent = 'Für dieses Datum wurde bereits einmal erfasst' + uhrzeit + '. Ein weiterer Eintrag ist möglich, wird aber zusätzlich gespeichert (kein Überschreiben).';
        el.mehrfachWarnung.hidden = false;
      }
    } catch (fehler) {
      console.warn('Mehrfach-Prüfung fehlgeschlagen, wird übersprungen:', fehler);
    }
  }

  /* -----------------------------------------------------------
   * 6) Poka-Yoke „Besonderer Tag"
   * --------------------------------------------------------- */
  function waehleBesondererTag(wert) {
    zustand.besondererTag = wert;
    el.btnNormalerTag.classList.toggle('aktiv', wert === false);
    el.btnBesondererTag.classList.toggle('aktiv', wert === true);
    el.besondererTagStatus.textContent = wert === true
      ? 'Gewählt: Ferien / besonderer Tag'
      : 'Gewählt: Normaler Tag';
    el.produktListe.hidden = false;
    aktualisiereSpeichernButton();
  }

  el.btnNormalerTag.addEventListener('click', () => waehleBesondererTag(false));
  el.btnBesondererTag.addEventListener('click', () => waehleBesondererTag(true));

  /* -----------------------------------------------------------
   * 6a) Stück/Bleche-Umschalter — Umschaltbarkeits-Regel
   *
   *    Grund: Blechzählen ist strukturell ungenauer als Stückzählen
   *    (eine Schätzung bleibt eine Schätzung, egal wie viele Nach-
   *    kommastellen die Umrechnung erzeugt) — echte Genauigkeit gibt
   *    es nur, wenn tatsächlich Einzelstücke gezählt wurden. Dieser
   *    Umschalter gibt die Wahl, in der Einheit einzutragen, die im
   *    Moment sicher bekannt ist.
   *
   *    Nur für Produkte mit gesetzter, nicht-Stück-Einheit — sonst
   *    unverändertes Zahlenfeld wie bisher. Gegen die echte
   *    produkt_config.json geprüft (29.08.2026): einheit fehlt bei
   *    53/87 Produkten (Datenlücke in der Config, nicht hier zu
   *    raten), ist "stueck" bei 16, "bleche" bei 16, "Rote Dielen"
   *    bei 2. stueckProBlech ist bei allen 87 Produkten gesetzt.
   * --------------------------------------------------------- */
  function istEinheitenUmschaltbar(produkt) {
    const e = (produkt.einheit || '').trim().toLowerCase();
    if (!e || e === 'stueck' || e === 'stück') return false;
    if (!produkt.stueckProBlech) return false; // Sicherheitsnetz, keine Umrechnungsbasis ohne diesen Wert
    return true;
  }

  /* -----------------------------------------------------------
   * 7) Produktliste laden (Opt-in über Feld manuelleErfassung).
   *    05.10.2026 (Stufe 1): aus Firestore über bos_produkte.js statt aus
   *    der Datei. Ein Ladefehler zeigt die echte Meldung — vorher stand
   *    bei jedem Fehler „keine Produkte freigeschaltet“ (K8).
   * --------------------------------------------------------- */
  async function ladeProdukte() {
    let alleProdukte = [];
    try {
      if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
      const ergebnis = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' });
      alleProdukte = ergebnis.liste;
      const hinweis = window.BOS_PRODUKTE.hinweisText(ergebnis);
      if (hinweis) window.BOS_PRODUKTE.zeigeMeldung(hinweis, 'hinweis');
    } catch (fehler) {
      console.error('Produktliste konnte nicht geladen werden:', fehler);
      el.keineProdukteHinweis.textContent = '⚠ ' + (window.BOS_PRODUKTE ? window.BOS_PRODUKTE.fehlerText(fehler) : ((fehler && fehler.message) || String(fehler)));
      el.keineProdukteHinweis.hidden = false;
      return;
    }

    zustand.produkte = (alleProdukte || []).filter(p => p.manuelleErfassung === true);

    if (zustand.produkte.length === 0) {
      el.keineProdukteHinweis.hidden = false;
      return;
    }

    el.produktListe.innerHTML = '';
    zustand.produkte.forEach(produkt => {
      const zeile = document.createElement('div');
      zeile.className = 'produkt-zeile';
      zeile.dataset.legacyKey = produkt.legacyKey;

      const name = document.createElement('span');
      name.className = 'produkt-name';
      name.textContent = produkt.name || produkt.legacyKey;

      const menge = document.createElement('input');
      menge.type = 'number';
      menge.min = '0';
      menge.step = '1';
      menge.inputMode = 'numeric';
      menge.className = 'produkt-menge';
      menge.setAttribute('aria-label', 'Menge für ' + (produkt.name || produkt.legacyKey));

      const ausreisserLabel = document.createElement('label');
      ausreisserLabel.className = 'ausreisser-toggle';
      const ausreisserCheckbox = document.createElement('input');
      ausreisserCheckbox.type = 'checkbox';
      ausreisserCheckbox.className = 'ausreisser-checkbox';
      ausreisserLabel.appendChild(ausreisserCheckbox);
      ausreisserLabel.appendChild(document.createTextNode('⚠️'));

      zeile.appendChild(name);
      zeile.appendChild(menge);

      if (istEinheitenUmschaltbar(produkt)) {
        zeile.dataset.umschaltbar = 'true';
        zeile.dataset.stueckProBlech = produkt.stueckProBlech;
        zeile.dataset.einheitModus = 'bleche'; // Default: unverändertes Verhalten wie bisher

        const einheitToggle = document.createElement('button');
        einheitToggle.type = 'button';
        einheitToggle.className = 'einheit-toggle';
        einheitToggle.textContent = 'Bleche';
        einheitToggle.setAttribute('aria-label', 'Eingabe-Einheit umschalten für ' + (produkt.name || produkt.legacyKey) + ', aktuell Bleche');

        const ungenauHinweis = document.createElement('span');
        ungenauHinweis.className = 'einheit-ungenau-hinweis';
        ungenauHinweis.textContent = 'sehr ungenau';

        einheitToggle.addEventListener('click', () => {
          const neuerModus = zeile.dataset.einheitModus === 'bleche' ? 'stueck' : 'bleche';
          zeile.dataset.einheitModus = neuerModus;
          einheitToggle.textContent = neuerModus === 'bleche' ? 'Bleche' : 'Stück';
          einheitToggle.setAttribute('aria-label', 'Eingabe-Einheit umschalten für ' + (produkt.name || produkt.legacyKey) + ', aktuell ' + einheitToggle.textContent);
          ungenauHinweis.hidden = (neuerModus !== 'bleche') ? true : false;
        });

        zeile.appendChild(einheitToggle);
        zeile.appendChild(ungenauHinweis);
      } else {
        const einheit = document.createElement('span');
        einheit.className = 'produkt-einheit';
        einheit.textContent = produkt.einheit || '';
        zeile.appendChild(einheit);
      }

      zeile.appendChild(ausreisserLabel);
      el.produktListe.appendChild(zeile);
    });
  }

  function aktualisiereSpeichernButton() {
    el.speichernBtn.disabled = (zustand.besondererTag === null) || zustand.pruefungLaeuft;
  }

  /* -----------------------------------------------------------
   * 8) Speichern (inkl. automatischer Ausreißer-Check)
   * --------------------------------------------------------- */
  function sammleEintraege() {
    const eintraege = [];
    el.produktListe.querySelectorAll('.produkt-zeile').forEach(zeile => {
      const mengeInput = zeile.querySelector('.produkt-menge');
      const wert = mengeInput.value;
      if (wert === '' || wert === null) return; // nicht ausgefüllt -> überspringen
      const mengeEingegeben = Number(wert);
      if (Number.isNaN(mengeEingegeben) || mengeEingegeben < 0) return;

      // Stück->Bleche-Umrechnung: der Ausreißer-Check (SCHWELLE_ABSOLUT) ist auf
      // Bleche-Größenordnung geeicht, siehe BOS_VERBRAUCH_DURCHSCHNITT_DOKU.md §5
      // Punkt 4 — deshalb ist IMMER das Bleche-Äquivalent die maßgebliche, gespeicherte
      // und verglichene Zahl, nie der rohe Stückwert. mengeRoh/erfasstAls bleiben nur
      // zur Nachvollziehbarkeit erhalten, fließen nirgends in Vergleich/Schnitt ein.
      //
      // WICHTIG: nur bei umschaltbaren Zeilen gesetzt. Für alle anderen Produkte
      // (u. a. die Schlawiner-Familie mit nativer Stück-Einheit) bliebe ein
      // hartkodiertes erfasstAls:'bleche' schlicht falsch — die haben gar keine
      // Bleche-Grundlage. Verhalten dort bewusst unverändert zu vorher.
      const umschaltbar = zeile.dataset.umschaltbar === 'true';
      const einheitModus = umschaltbar ? (zeile.dataset.einheitModus || 'bleche') : null;
      let menge = mengeEingegeben;
      if (umschaltbar && einheitModus === 'stueck') {
        const stueckProBlech = Number(zeile.dataset.stueckProBlech);
        menge = stueckProBlech > 0 ? mengeEingegeben / stueckProBlech : mengeEingegeben;
      }

      const eintrag = {
        legacyKey: zeile.dataset.legacyKey,
        menge: menge,
        ausreisser: zeile.querySelector('.ausreisser-checkbox').checked
      };
      if (umschaltbar) {
        eintrag.erfasstAls = einheitModus;
        eintrag.mengeRoh = mengeEingegeben;
      }
      eintraege.push(eintrag);
    });
    return eintraege;
  }

  async function pruefeAlleAufAusreisser(wochentag, eintraege) {
    const zuPruefen = eintraege.filter(e => !e.ausreisser); // manuell schon geflaggte nicht erneut nachfragen
    const ergebnisse = await Promise.all(zuPruefen.map(e =>
      window.BOS_VERBRAUCH.pruefeAusreisser(window.db, e.legacyKey, wochentag, e.menge)
        .then(res => ({ eintrag: e, ergebnis: res }))
    ));
    return ergebnisse.filter(r => r.ergebnis.pruefungAktiv && r.ergebnis.auffaellig);
  }

  function formatiereEintragAnzeige(eintrag) {
    if (eintrag.erfasstAls === 'stueck') {
      return eintrag.mengeRoh + ' Stück (≈ ' + eintrag.menge.toFixed(2) + ' Bleche)';
    }
    if (eintrag.erfasstAls === 'bleche') {
      return eintrag.menge + ' Bleche';
    }
    return String(eintrag.menge); // unverändert wie bisher, kein Einheiten-Kontext bekannt
  }

  function zeigeAusreisserModal(auffaelligeListe) {
    el.ausreisserListe.innerHTML = '';
    const wochentag = wochentagVonISODatum(el.datumInput.value);
    auffaelligeListe.forEach(({ eintrag, ergebnis }) => {
      const produkt = zustand.produkte.find(p => p.legacyKey === eintrag.legacyKey);
      const box = document.createElement('div');
      box.className = 'ausreisser-eintrag';
      const name = produkt ? (produkt.name || produkt.legacyKey) : eintrag.legacyKey;
      box.innerHTML = '<strong>' + name + '</strong>' +
        'Eingegeben: ' + formatiereEintragAnzeige(eintrag) + ' · bisheriger Schnitt (' + ergebnis.anzahl + ' Werte): ' + ergebnis.durchschnitt.toFixed(1) + ' Bleche' +
        '<button type="button" class="grundlage-link">' + t('grundlageAnzeigen') + '</button>';
      el.ausreisserListe.appendChild(box);

      // Grundlage-Abfrage bewusst erst bei Tipp auf den Link, nicht schon
      // beim Öffnen des Modals — sie ist teurer (7 Wochentage x Query statt
      // 1) und wird nur gebraucht, wenn tatsächlich nachgesehen werden will.
      box.querySelector('.grundlage-link').addEventListener('click', () => {
        zeigeGrundlage(eintrag.legacyKey, name, wochentag);
      });
    });
    el.ausreisserModal.hidden = false;
  }

  /* -----------------------------------------------------------
   * 8a) Grundlage anzeigen — Transparenz-Ansicht hinter dem Ausreißer-
   *     Alarm, Vorbild "Der Wurm" aus dem Altsystem (ohne Maskottchen,
   *     siehe SESSION_2026-08-31_BERECHNUNGSGRUNDLAGE_ANZEIGE.md).
   * --------------------------------------------------------- */
  const WOCHENTAGE_KURZ = { Montag: 'Mo', Dienstag: 'Di', Mittwoch: 'Mi', Donnerstag: 'Do', Freitag: 'Fr', Samstag: 'Sa', Sonntag: 'So' };

  function formatDatumKurz(isoStr) {
    const teile = isoStr.split('-');
    return teile[2] + '.' + teile[1] + '.';
  }

  async function zeigeGrundlage(legacyKey, produktName, hervorgehobenerWochentag) {
    el.grundlageTitel.textContent = t('grundlageTitel') + ' — ' + produktName;
    el.grundlageInhalt.innerHTML = '<p class="status-text">' + t('grundlageLaedt') + '</p>';
    el.grundlageSheet.hidden = false;

    let grundlage;
    try {
      grundlage = await window.BOS_VERBRAUCH.holeBerechnungsgrundlage(window.db, legacyKey);
    } catch (fehler) {
      console.warn('Grundlage konnte nicht geladen werden:', fehler);
      el.grundlageInhalt.innerHTML = '<p class="warn-hinweis">' + t('grundlageFehler') + '</p>';
      return;
    }

    const modusText = grundlage.modus === 'stichprobe'
      ? t('grundlageModusStichprobe')
          .replace('{n}', grundlage.einstellungen.stichprobeAnzahl)
          .replace('{w}', grundlage.einstellungen.suchfensterWochen)
      : t('grundlageModusKontiguierlich').replace('{t}', grundlage.einstellungen.kontiguierlichTage);

    let html = '<p class="status-text">' + modusText + '</p>';
    if (grundlage.juengstes) {
      html += '<p class="status-text">' + t('grundlageZeitraum') + ': ' +
        formatDatumKurz(grundlage.aeltestes) + ' – ' + formatDatumKurz(grundlage.juengstes) + '</p>';
    }

    html += '<div class="grundlage-wochentage">';
    grundlage.wochentage.forEach(w => {
      const offen = w.wochentag === hervorgehobenerWochentag;
      const badge = w.ziel === null
        ? w.gefunden + ' Werte'
        : w.gefunden + '/' + w.ziel + (w.vollstaendig ? ' ✓' : ' ⚠️');
      html += '<div class="gw-zeile' + (offen ? ' offen' : '') + '" data-gw-toggle="' + w.wochentag + '">';
      html += '<div class="gw-kopf"><span>' + WOCHENTAGE_KURZ[w.wochentag] + '</span>' +
        '<span class="gw-badge' + (w.vollstaendig ? '' : ' warnung') + '">' + badge + '</span></div>';
      html += '<div class="gw-liste">';
      if (w.werte.length === 0) {
        html += '<div class="gw-eintrag leer">' + t('grundlageKeineWerte') + '</div>';
      } else {
        w.werte.forEach(x => {
          html += '<div class="gw-eintrag"><span>' + formatDatumKurz(x.datum) + '</span><span>' + x.wert + '</span></div>';
        });
      }
      html += '</div></div>';
    });
    html += '</div>';

    el.grundlageInhalt.innerHTML = html;
    el.grundlageInhalt.querySelectorAll('[data-gw-toggle]').forEach(zeile => {
      zeile.querySelector('.gw-kopf').addEventListener('click', () => zeile.classList.toggle('offen'));
    });
  }

  async function schreibeDokument(eintraege) {
    const datum = el.datumInput.value;
    const wochentag = wochentagVonISODatum(datum);
    await window.db.collection('bos_events').add({
      type: 'verbrauch_manuell',
      datum: datum,
      wochentag: wochentag,
      besondererTag: zustand.besondererTag,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      eintraege: eintraege
    });
  }

  async function starteSpeichern() {
    if (zustand.besondererTag === null) return;

    const eintraege = sammleEintraege();
    if (eintraege.length === 0) {
      el.speicherStatus.textContent = 'Keine Mengen eingegeben — nichts zu speichern.';
      return;
    }

    zustand.pruefungLaeuft = true;
    aktualisiereSpeichernButton();
    el.speicherStatus.textContent = 'Prüfe Werte …';

    const wochentag = wochentagVonISODatum(el.datumInput.value);
    let auffaellig = [];
    try {
      auffaellig = await pruefeAlleAufAusreisser(wochentag, eintraege);
    } catch (fehler) {
      console.warn('Ausreißer-Check fehlgeschlagen, wird übersprungen:', fehler);
    }

    if (auffaellig.length > 0) {
      zustand.pruefungLaeuft = false;
      aktualisiereSpeichernButton();
      el.speicherStatus.textContent = '';
      zeigeAusreisserModal(auffaellig);
      zustand._ausstehendeEintraege = eintraege;
      zustand._auffaelligeKeys = auffaellig.map(a => a.eintrag.legacyKey);
      return;
    }

    await tatsaechlichSpeichern(eintraege);
  }

  async function tatsaechlichSpeichern(eintraege) {
    el.speicherStatus.textContent = 'Speichert …';
    try {
      await schreibeDokument(eintraege);
      el.speicherStatus.textContent = '✓ Gespeichert.';
      formularZuruecksetzen();
    } catch (fehler) {
      console.error('Speichern fehlgeschlagen:', fehler);
      el.speicherStatus.textContent = 'Fehler beim Speichern — bitte erneut versuchen.';
    } finally {
      zustand.pruefungLaeuft = false;
      aktualisiereSpeichernButton();
    }
  }

  function formularZuruecksetzen() {
    zustand.besondererTag = null;
    el.btnNormalerTag.classList.remove('aktiv');
    el.btnBesondererTag.classList.remove('aktiv');
    el.besondererTagStatus.textContent = '';
    el.produktListe.hidden = true;
    el.produktListe.querySelectorAll('.produkt-menge').forEach(i => i.value = '');
    el.produktListe.querySelectorAll('.ausreisser-checkbox').forEach(c => c.checked = false);
    aktualisiereSpeichernButton();
  }

  el.speichernBtn.addEventListener('click', starteSpeichern);

  el.btnZurueckPruefen.addEventListener('click', () => {
    el.ausreisserModal.hidden = true;
    zustand._ausstehendeEintraege = null;
    zustand._auffaelligeKeys = null;
  });

  el.btnTrotzdemSpeichern.addEventListener('click', async () => {
    el.ausreisserModal.hidden = true;
    const eintraege = zustand._ausstehendeEintraege || [];
    const auffaelligeKeys = zustand._auffaelligeKeys || [];
    // Bestätigte Ausreißer bekommen automatisch das Ausreisser-Flag,
    // damit spätere Auswertungen sie korrekt einordnen können.
    eintraege.forEach(e => {
      if (auffaelligeKeys.includes(e.legacyKey)) e.ausreisser = true;
    });
    zustand.pruefungLaeuft = true;
    await tatsaechlichSpeichern(eintraege);
  });

  /* -----------------------------------------------------------
   * 9) Hilfe-Bottom-Sheet
   * --------------------------------------------------------- */
  el.hilfeBtn.addEventListener('click', () => { el.hilfeSheet.hidden = false; });
  el.hilfeSchliessen.addEventListener('click', () => { el.hilfeSheet.hidden = true; });
  el.grundlageSchliessen.addEventListener('click', () => { el.grundlageSheet.hidden = true; });

  /* -----------------------------------------------------------
   * 10) Init
   * --------------------------------------------------------- */
  el.datumInput.addEventListener('change', () => {
    el.wochentagAnzeige.textContent = el.datumInput.value ? wochentagVonISODatum(el.datumInput.value) : '';
    aktualisiereFeiertagsHinweis();
    pruefeVorhandenenEintrag();
  });

  async function init() {
    el.datumInput.value = heutigesDatumISO();
    el.wochentagAnzeige.textContent = wochentagVonISODatum(el.datumInput.value);
    aktualisiereFeiertagsHinweis();

    await ladeProdukte();
    await window.BOS_AUTH_READY;
    await pruefeVorhandenenEintrag();
  }

  init();

})();
</script>
</body>
</html>
