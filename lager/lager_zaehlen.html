  Doku:  lager/LAGER_ZAEHLEN_DOKU.md (dort auch der kanonische Nutzer-Hilfetext)
  Logik: lager/lager_logik.js (Zählliste, Stand-Kennung, Zählgang); Liste + Karte: ../bos_zaehlkarte.js
  Regel: RK §31 (firestore_regeln_2026-11-11_lager_zaehlen.rules) — zählen darf, wer den Standort in

         nur angehängt (lager_zaehlungen) und setzt im selben Vorgang lager_stand/<artikel>__<ort>.
  Nur zählen: kein Stift, keine Pflege (Konzept 30.10., 15:20). Kachel über Registry-Feld haken:
  ['lagerZaehlen'] (Wahrheitswert im Konto; die Liste der Standorte ist das Schloss).
  Ohne Netz (Variante A, Ulf 11.11., 06:41): Firestore puffert im Speicher der offenen Seite;
  die Seite zeigt ⏳ und fragt beim Schließen, solange etwas wartet. Kein Zeitlimit als Fehler.
  CHANGELOG

      (code — message) in der Regel-Leiste statt nur console.warn (Projektregel Fehlermeldungen).

<script>
'use strict';
/* ==================================================================
   Lager zählen — Seitenlogik. Liste und Karte: bos_zaehlkarte.js (gemeinsamer
   Baustein, kennt keine Datenbank). Hier: Laden, Rechte, Standortwahl,
   Schreiben (Zählung + Stand in EINEM Batch), Fehler, „wartet aufs Netz“.
   Keine Daten in dieser Datei: keine Standort-, Orts- oder Artikelnamen.
   ================================================================== */
const LG = window.BOS_LAGER_LOGIK;
const ZK = window.BOS_ZAEHLKARTE;
const COL = LG.COL;
const REGEL_FASSUNG = 'lager-zaehlen-2026-11-11';
const REGEL_DATEI = 'firestore_regeln_2026-11-11_lager_zaehlen.rules';   /* neueste Datei, die REGEL_FASSUNG erfüllt (RK §13) */
const WARTE_HINWEIS_MS = 20000;   /* danach „kein Netz, wird gesammelt“ — KEIN Fehler (Variante A) */
const SPEICHER_STANDORT = 'bos_lager_zaehlen_standort';

/* ---------- i18n (Checkliste §6) ---------- */
const I18N_DE = {
  titel: 'Lager zählen', lade: 'Lade Daten …', fehler_titel: '⚠︎ Fehler', ausblenden: 'ausblenden', schliessen: 'Schließen',
  wechseln: 'Standort wechseln', kein_konto: 'Keine Anmeldung erkannt.',
  kein_standort: 'Dir ist noch kein Standort zum Zählen freigegeben. Das stellt die Kontenverwaltung ein.',
  keine_orte: 'Hier gibt es noch keine Lagerorte. Lagerorte und ihren Standort pflegt die Seite „Lager“.',
  wartet: '⏳ {n} Tipps warten aufs Netz. Seite offen lassen.',
  wartet_eins: '⏳ 1 Tipp wartet aufs Netz. Seite offen lassen.',
  wartet_lange: ' Kein Netz — die Tipps werden gesammelt und nachgeschickt, sobald wieder Netz da ist.',
  abgelehnt: 'Nicht gezählt: {grund}',
  regel_alt: '⚠︎ Die Firestore-Regeln passen nicht zu dieser Seite (erwartet: Regelstand „{fassung}“). Zählen wird abgelehnt. Bitte in der Firebase-Konsole die Regeldatei {datei} einsetzen.',
  regel_unbekannt: 'Regelstand „{fassung}“ ließ sich nicht prüfen (wohl kein Netz). Zählen geht trotzdem; was die Datenbank ablehnt, steht dann am Eintrag. [{grund}]',
  err_perm: 'Keine Berechtigung — die Datenbank hat abgelehnt. Mögliche Gründe: kein Haken für diesen Standort, oder die Regeln sind älter als diese Seite.',
  err_netz: 'Keine Verbindung zum Server (WLAN?).',
  err_laden: 'Laden „{was}“', err_zaehlen: 'Zählen', err_unbehandelt: 'Unerwarteter Fehler', err_konto: 'Konto lesen',
  zk_keine_eintraege: '(noch keine Artikel)', zk_ende: 'Fertig mit {standort}.', zk_weiter_in: 'Weiter in {ort}',
  zk_getippt: 'Getippt: {w} — der nächste Tipp hier ersetzt ihn.', zk_nichts_zurueck: 'Noch kein Tipp zum Zurücknehmen.'
};
function t(k, w) {
  let s = I18N_DE[k]; if (s === undefined) s = k;
  Object.keys(w || {}).forEach(function (x) { s = s.split('{' + x + '}').join(String(w[x])); });
  return s;
}
function wendeI18nAn() { document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); }); }
const esc = LG.esc;

/* ---------- Zustand ---------- */
const S = {
  kennung: null, konto: null, geladen: false, regelstand: 'unbekannt',
  standorte: [], orte: [], artikel: [], stand: {},   /* stand: { artikelId__ortId: { wert, tsMs, ausstehend } } */
  standortId: null,
  wartet: {},        /* zaehlungId → { sid, seit } */
  abgelehnt: {},     /* artikelId__ortId → Text */
  geladenTeile: {}
};

/* ---------- Fehler sichtbar (Checkliste §7a) ---------- */
function erklaerung(err) {
  const c = (err && err.code) || '';
  if (c === 'permission-denied') return t('err_perm');
  if (c === 'unavailable') return t('err_netz');
  return '';
}
function fehlerText(kontext, err) {
  const roh = (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err));
  return kontext + ': ' + [erklaerung(err), roh].filter(Boolean).join(' · ');
}
function zeigeFehler(kontext, err) {
  console.error('[Lager zählen] ' + kontext, err);
  const li = document.createElement('li');
  li.textContent = fehlerText(kontext, err);
  const liste = document.getElementById('fehlerListe');
  liste.insertBefore(li, liste.firstChild);
  while (liste.children.length > 6) liste.removeChild(liste.lastChild);
  document.getElementById('fehlerLeiste').classList.remove('hidden');
}
window.addEventListener('error', function (e) { zeigeFehler(t('err_unbehandelt'), { message: (e.message || 'unbekannt') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')' }); });
window.addEventListener('unhandledrejection', function (e) { zeigeFehler(t('err_unbehandelt'), e.reason || { message: 'unbekannt' }); });
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3000);
}

/* ---------- Laden ---------- */
function tsMs(ts) {
  if (ts && typeof ts.toMillis === 'function') return ts.toMillis();
  if (ts && typeof ts.seconds === 'number') return ts.seconds * 1000 + Math.floor((ts.nanoseconds || 0) / 1e6);
  return Date.now();   /* gerade selbst geschrieben, Serverzeit noch unterwegs */
}
let abos = [];
function abo(col, ziel) {
  return window.db.collection(col).onSnapshot({ includeMetadataChanges: true }, function (snap) {
    if (ziel === 'stand') {
      const m = {};
      snap.forEach(function (d) {
        const x = d.data({ serverTimestamps: 'estimate' }) || {};
        m[d.id] = { wert: x.wert, tsMs: tsMs(x.ts), ausstehend: !!(d.metadata && d.metadata.hasPendingWrites), zaehlungId: x.zaehlungId };
      });
      S.stand = m;
    } else {
      const a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); });
      S[ziel] = a;
    }
    S.geladenTeile[ziel] = true;
    planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: col }), err); S.geladenTeile[ziel] = true; planeRender(); });
}
function abonniere() {
  abos.forEach(function (f) { f(); });
  abos = [abo(COL.standorte, 'standorte'), abo(COL.orte, 'orte'), abo(COL.artikel, 'artikel'), abo(COL.stand, 'stand')];
}
async function pruefeRegelstand() {
  try { await window.db.collection('bos_regelstand').doc(REGEL_FASSUNG).get({ source: 'server' }); S.regelstand = 'passt'; }
  catch (err) {
    S.regelstand = err && err.code === 'permission-denied' ? 'alt' : 'unbekannt';
    if (S.regelstand === 'unbekannt') { console.warn('[Lager zählen] Regelstand nicht prüfbar:', err && err.message); S.regelGrund = (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err)); }
  }
  const el = document.getElementById('regelLeiste');
  el.textContent = S.regelstand === 'unbekannt' ? t('regel_unbekannt', { fassung: REGEL_FASSUNG, grund: S.regelGrund || '' }) : t('regel_alt', { fassung: REGEL_FASSUNG, datei: REGEL_DATEI });
  el.classList.toggle('hidden', S.regelstand === 'passt');
}
async function start() {
  wendeI18nAn(); renderHilfe();
  if (!window.db || !window.BOS_AUTH_READY || !LG || !ZK) { zeigeFehler(t('err_laden', { was: 'Grundlagen' }), new Error('window.db, BOS_AUTH_READY, lager_logik.js oder bos_zaehlkarte.js fehlt')); return; }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; } catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); }
  S.kennung = nutzer && nutzer.email ? nutzer.email.split('@')[0] : null;
  document.getElementById('kontoZeile').textContent = S.kennung || t('kein_konto');
  if (S.kennung) {
    try { const k = await window.db.collection('bos_accounts').doc(S.kennung).get(); S.konto = k.exists ? k.data() : null; }
    catch (err) { zeigeFehler(t('err_konto'), err); }
  }
  try { const w = localStorage.getItem(SPEICHER_STANDORT); if (w) S.standortId = w; } catch (e) { /* Speicher gesperrt: dann eben wählen */ }
  abonniere();
  S.geladen = true;
  planeRender();
  if (S.kennung) pruefeRegelstand();
}

/* ---------- Rechte und Standort ---------- */
function konto() { return S.konto && S.konto.freigeschaltet === true ? S.konto : null; }
function erlaubte() { return konto() ? LG.erlaubteStandorte(konto(), S.standorte) : []; }
function waehle(id) {
  S.standortId = id;
  try { if (id) localStorage.setItem(SPEICHER_STANDORT, id); else localStorage.removeItem(SPEICHER_STANDORT); } catch (e) { /* egal */ }
  if (karte) karte.neuerGang();
  planeRender();
}

/* ---------- Daten für den Baustein ---------- */
function standort() { return LG.nachId(S.standorte)[S.standortId] || null; }
function zaehlDaten() {
  const st = standort();
  return {
    standort: st ? { id: st.id, name: st.name } : null,
    orte: st ? LG.zaehlliste(st.id, S.orte, S.artikel).map(function (g) {
      return { id: g.ort.id, name: g.ort.name, eintraege: g.artikel.map(function (a) { return { id: a.id, name: a.name, unter: LG.gebindeText(a), _artikel: a }; }) };
    }) : []
  };
}
function zaehlStatus(e, ort) {
  const sid = LG.standId(e.id, ort.id), st = S.stand[sid];
  const s = LG.zaehlStatus(st ? { wert: st.wert, tsMs: st.tsMs } : null, Date.now(), LG.GRENZEN.zaehlgangStunden);
  return { zeichen: s.zeichen, wert: s.wert, ausstehend: !!(st && st.ausstehend), fehler: S.abgelehnt[sid] || '' };
}

/* ---------- Schreiben: Zählung (nur anhängen) + Stand in EINEM Batch (RK §31) ---------- */
function beiTipp(e, ort, wert, info) {
  const db = window.db;
  const ortDok = LG.nachId(S.orte)[ort.id] || {};   /* Standort des ORTES (die Regel prüft genau den) */
  const zRef = db.collection(COL.zaehlungen).doc(), zid = zRef.id;
  const sid = LG.standId(e.id, ort.id);
  const z = LG.zaehlungDokument({ artikelId: e.id, ortId: ort.id, standortId: ortDok.standortId || '', wert: wert, ersetzt: info && info.ersetzt, geraetZeit: Date.now(), konto: S.kennung });
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  batch.set(zRef, Object.assign({}, z, { ts: ts }));
  batch.set(db.collection(COL.stand).doc(sid), Object.assign(LG.standDokument(zid, z), { ts: ts }));
  delete S.abgelehnt[sid];
  S.wartet[zid] = { sid: sid, seit: Date.now() };
  zeigeWartet();
  batch.commit().then(function () {
    delete S.wartet[zid]; zeigeWartet(); planeRender();
  }, function (err) {
    delete S.wartet[zid];
    S.abgelehnt[sid] = t('abgelehnt', { grund: [erklaerung(err), (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err))].filter(Boolean).join(' · ') });
    zeigeFehler(t('err_zaehlen') + ' „' + e.name + '“ (' + ort.name + ')', err);
    zeigeWartet(); planeRender();
  });
  return { id: zid };
}
function anzahlWartet() { return Object.keys(S.wartet).length; }
function zeigeWartet() {
  const n = anzahlWartet(), el = document.getElementById('wartetLeiste');
  if (!n) { el.classList.add('hidden'); return; }
  const lange = Object.keys(S.wartet).some(function (k) { return Date.now() - S.wartet[k].seit > WARTE_HINWEIS_MS; });
  el.textContent = (n === 1 ? t('wartet_eins') : t('wartet', { n: n })) + (lange ? t('wartet_lange') : '');
  el.classList.remove('hidden');
}
setInterval(function () { if (anzahlWartet()) zeigeWartet(); }, 5000);

/* ---------- Rendern ---------- */
let karte = null;
let renderGeplant = false;
function planeRender() { if (renderGeplant) return; renderGeplant = true; requestAnimationFrame(function () { renderGeplant = false; render(); }); }
function fertigGeladen() { return ['standorte', 'orte', 'artikel', 'stand'].every(function (k) { return S.geladenTeile[k]; }); }
function render() {
  if (!S.geladen) return;
  const lade = document.getElementById('lade'), wahl = document.getElementById('wahl'), zl = document.getElementById('zaehlen'), hz = document.getElementById('hinweisZeile');
  if (!fertigGeladen()) return;
  lade.classList.add('hidden');
  const erl = erlaubte();
  hz.classList.add('hidden'); wahl.classList.add('hidden'); zl.classList.add('hidden');
  if (!S.kennung) { hz.textContent = t('kein_konto'); hz.classList.remove('hidden'); return; }
  if (!erl.length) { hz.textContent = t('kein_standort'); hz.classList.remove('hidden'); return; }
  if (S.standortId && !erl.some(function (s) { return s.id === S.standortId; })) S.standortId = null;
  if (!S.standortId && erl.length === 1) S.standortId = erl[0].id;
  if (!S.standortId) {
    wahl.innerHTML = erl.map(function (s) { return '<button type="button" class="standort-knopf" data-standort="' + esc(s.id) + '">' + esc(s.name) + '</button>'; }).join('');
    wahl.classList.remove('hidden');
    return;
  }
  zl.classList.remove('hidden');
  document.getElementById('standortName').textContent = standort().name;
  document.getElementById('wechselBtn').classList.toggle('hidden', erl.length < 2);
  const d = zaehlDaten();
  if (!d.orte.length) { document.getElementById('zkListe').innerHTML = '<div class="leer">' + esc(t('keine_orte')) + '</div>'; return; }
  if (!karte) {
    karte = ZK.erzeuge({
      liste: document.getElementById('zkListe'), karte: document.getElementById('zkKarte'), t: t,
      daten: zaehlDaten,
      plan: function (e) { return ZK.einstufig(e._artikel && e._artikel.zaehlRaster); },
      eingabe: { nachkomma: LG.GRENZEN.nachkomma, max: LG.GRENZEN.wertMax },
      status: zaehlStatus, beiTipp: beiTipp, hinweis: toast
    });
  }
  karte.aktualisiere();
}
document.getElementById('wahl').addEventListener('click', function (ev) { const b = ev.target.closest('[data-standort]'); if (b) waehle(b.getAttribute('data-standort')); });
document.getElementById('wechselBtn').addEventListener('click', function () { if (karte) karte.schliesse(); waehle(null); });
document.getElementById('fehlerZuBtn').addEventListener('click', function () { document.getElementById('fehlerLeiste').classList.add('hidden'); document.getElementById('fehlerListe').innerHTML = ''; });

  if (window.BOS_UNGESPEICHERT) { window.BOS_UNGESPEICHERT.melde(pruef); return; }
  window.addEventListener('beforeunload', function (e) { if (pruef()) { e.preventDefault(); e.returnValue = ''; } });
})(function () { return anzahlWartet() > 0; });

/* ---------- Hilfe (Checkliste §7; kanonische Fassung in LAGER_ZAEHLEN_DOKU.md) ---------- */
const helpData = {
  title: 'Lager zählen — was ist das hier?',
  sections: [
    { heading: 'Wofür ist diese Seite?', text: 'Hier zählst du, was in einem Lager liegt. Du wählst den Standort, läufst die Lagerorte in der Reihenfolge des Rundgangs ab und tippst je Artikel, wie viele Gebinde da sind: Säcke, Kartons, Eimer. Gepflegt wird hier nichts, das macht die Seite „Lager“.' },
    { heading: 'Standort wählen', text: 'Oben stehen die Standorte, an denen du zählen darfst. Ist es nur einer, geht es gleich los. „Standort wechseln“ bringt dich zurück zur Auswahl. Wer wo zählen darf, steht in der Kontenverwaltung.' },
    { heading: 'Die Liste', text: 'Je Lagerort stehen die Artikel, die dort fest hingehören. Rechts steht ○ für noch nicht gezählt, – für bewusst 0 und die Zahl mit ✓ für gezählt. Gezählt gilt 12 Stunden lang; danach steht der Artikel wieder auf ○, damit du beim nächsten Mal siehst, was offen ist. Die alte Zahl steht nicht da, damit wirklich gezählt und nicht nur bestätigt wird.' },
    { heading: 'Die Karte', text: 'Antippen öffnet die Karte. Die Zahlenknöpfe gehen von 0 bis zur Palettengröße, „voll“ ist die ganze Palette mit einem Tipp. Ein Tipp speichert und springt zum nächsten Artikel, nach dem letzten Artikel eines Ortes zum nächsten Ort. Mit ‹ › blätterst du ohne zu zählen, ✕ schließt.' },
    { heading: 'Zahlenfeld', text: 'Passt kein Knopf, tippst du die Zahl ins Feld und drückst OK oder die Eingabetaste. Halbe gehen mit Komma, zum Beispiel 2,5 — eine Stelle hinter dem Komma.' },
    { heading: '0 ist nicht „nicht gezählt“', text: 'Liegt nichts da, tippst du 0. Dann steht – in der Liste. Einen Artikel, den du nicht anfasst, speichert die Seite gar nicht; er bleibt ○. Das ist wichtig, damit später kein falscher Verbrauch herauskommt.' },
    { heading: 'Vertippt?', text: '„↶ Zurück“ bringt dich zur Karte deines letzten Tipps, die Zahl ist markiert. Tipp dort die richtige Zahl, sie ersetzt die falsche. Mehrmals Zurück geht auch.' },
    { heading: 'Ohne Netz', text: 'Hat das Lager kein Netz, zählst du einfach weiter. Oben steht dann „⏳ … Tipps warten aufs Netz“, und die Tipps gehen raus, sobald wieder Netz da ist. Lass die Seite so lange offen; schließt du sie vorher, fragt sie nach. Öffnen musst du die Seite mit Netz, am besten vor der Tür.' },
    { heading: 'Wenn etwas schiefgeht', text: 'Fehler stehen oben im roten Kasten, mit der echten Meldung. Wird ein Tipp abgelehnt, steht am Artikel ⚠︎ mit dem Grund, und der Tipp zählt nicht. „Keine Berechtigung“ heißt meistens: kein Haken für diesen Standort.' }
  ]
};
function renderHilfe() {
  document.getElementById('helpTitle').textContent = helpData.title;
  document.getElementById('helpContent').innerHTML = helpData.sections.map(function (s) { return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>'; }).join('');
}
document.getElementById('helpOpenBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.remove('hidden'); });
document.getElementById('helpCloseBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.add('hidden'); });
document.getElementById('helpSheet').addEventListener('click', function (e) { if (e.target === this) this.classList.add('hidden'); });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
