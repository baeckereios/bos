/* ---------- Fehler sichtbar (Checkliste §7a) ---------- */
function erklaerung(err) {
  const c = (err && err.code) || '';
  if (c === 'permission-denied') return t('err_perm');
  if (c === 'unavailable') return t('err_netz');
  if (c === 'zeitlimit') return t('err_zeit', { s: SCHREIB_ZEITLIMIT_MS / 1000 });
  return '';
}
function fehlerText(kontext, err) {
  const roh = (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err));
  return kontext + ': ' + [erklaerung(err), roh].filter(Boolean).join(' · ');
}
function zeigeFehler(kontext, err) {
  console.error('[Lager] ' + kontext, err);
  const li = document.createElement('li');
  li.textContent = fehlerText(kontext, err);
  const liste = document.getElementById('fehlerListe');
  liste.insertBefore(li, liste.firstChild);
  while (liste.children.length > 6) liste.removeChild(liste.lastChild);
  document.getElementById('fehlerLeiste').classList.remove('hidden');
}
window.addEventListener('error', function (e) { zeigeFehler(t('err_unbehandelt'), { message: (e.message || 'unbekannt') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')' }); });
window.addEventListener('unhandledrejection', function (e) { zeigeFehler(t('err_unbehandelt'), e.reason || { message: 'unbekannt' }); });
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 4200);
}
function online() { return navigator.onLine !== false && !S.verbindung.offline; }
function mitZeitlimit(promise) {
  let timer;
  const zeit = new Promise(function (_, reject) { timer = setTimeout(function () { const e = new Error('Zeitlimit ' + (SCHREIB_ZEITLIMIT_MS / 1000) + ' s überschritten'); e.code = 'zeitlimit'; reject(e); }, SCHREIB_ZEITLIMIT_MS); });
  return Promise.race([promise, zeit]).finally(function () { clearTimeout(timer); });
}

/* ---------- Schreiben: Sicherung + Dokument in EINEM Batch (RK §30) ----------
   Muster teigecke_seite.js schreibe(): sicherungId zeigt auf eine Sicherung, die in
   genau diesem Vorgang entsteht und auf genau dieses Dokument zeigt; vorher =
   rohes Serverdokument (oder null beim Anlegen). auftraege: [{ col, id, daten, aktion, vorher }] */
function ohneId(dok) { if (!dok) return null; const k = Object.assign({}, dok); delete k.id; return k; }
function nurFelder(col, daten) {
  const d = {};
  LG.FELDER[col].forEach(function (k) { if (daten[k] !== undefined) d[k] = daten[k]; });
  return d;
}
function sperrGrund() {
  if (!S.kennung) return t('kein_konto');
  if (!S.istAdmin) return t('nur_lesen');
  if (!online()) return t('offline');
  return '';
}
async function schreibe(auftraege) {
  const g = sperrGrund();
  if (g) { const e = new Error(g); e.code = 'gesperrt'; throw e; }
  const db = window.db;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  const ids = [];
  auftraege.forEach(function (a) {
    const sichRef = db.collection(COL.sicherungen).doc();
    const zielRef = a.id ? db.collection(a.col).doc(a.id) : db.collection(a.col).doc();
    batch.set(sichRef, { collection: a.col, dokId: zielRef.id, aktion: a.aktion, vorher: ohneId(a.vorher), konto: S.kennung, ts: ts });
    batch.set(zielRef, Object.assign(nurFelder(a.col, a.daten), { sicherungId: sichRef.id, geaendertVon: S.kennung, geaendertAm: ts }));
    ids.push(zielRef.id);
  });
  await mitZeitlimit(batch.commit());
  return ids;
}
/* mehrere Vorgänge nacheinander (je einer mit Sicherung), mit Fortschritt */
async function schreibeReihe(auftraege, fortschritt) {
  let i = 0;
  for (const a of auftraege) { i++; if (fortschritt) fortschritt(i, auftraege.length); await schreibe([a]); }
  return i;
}

/* ---------- Laden: Live-Abos ---------- */
let abos = [];
function mitId(snap) { const a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); }); return a; }
function abo(col, ziel) {
  return window.db.collection(col).onSnapshot({ includeMetadataChanges: true }, function (snap) {
    S.verbindung.offline = !!snap.metadata.fromCache && !navigator.onLine;
    S[ziel] = mitId(snap);
    planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: col }), err); });
}
function abonniere() {
  abos.forEach(function (f) { f(); });
  abos = [abo(COL.artikel, 'artikel'), abo(COL.orte, 'orte'), abo(COL.standorte, 'standorte'), abo(COL.kategorien, 'kategorien'), abo(COL.lieferanten, 'lieferanten'),
    abo(COL_TEIGECKE.blaetter, 'blaetter'), abo(COL_TEIGECKE.orte, 'teigeckeOrte'), abo(COL_TEIGECKE.teige, 'teige')];
}
async function ladeProdukte() {
  if (!window.BOS_PRODUKTE) { zeigeFehler(t('err_produkte'), new Error('bos_produkte.js nicht geladen')); return; }
  try { const e = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' }); S.produkte = e.liste || []; planeRender(); }
  catch (err) { zeigeFehler(t('err_produkte'), { code: err.art, message: err.meldung || err.message }); }
}
async function pruefeRegelstand() {
  try { await window.db.collection('bos_regelstand').doc(REGEL_FASSUNG).get({ source: 'server' }); S.regelstand = 'passt'; }
  catch (err) { S.regelstand = err && err.code === 'permission-denied' ? 'alt' : 'unbekannt'; if (S.regelstand === 'unbekannt') console.warn('[Lager] Regelstand nicht prüfbar:', err && err.message); }
  const el = document.getElementById('regelLeiste');
  el.textContent = t('regel_alt', { fassung: REGEL_FASSUNG, datei: REGEL_DATEI });
  el.classList.toggle('hidden', S.regelstand !== 'alt');
}
async function start() {
  wendeI18nAn(); renderHilfe();
  document.getElementById('suchfeld').placeholder = t('suche');
  document.getElementById('gebindeVorschlaege').innerHTML = LG.GEBINDE_VORSCHLAEGE.map(function (g) { return '<option value="' + esc(g) + '">'; }).join('');
  if (!window.db || !window.BOS_AUTH_READY) { zeigeFehler(t('err_laden', { was: 'bos_firebase_config.js' }), new Error('window.db oder window.BOS_AUTH_READY fehlt')); return; }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; } catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); }
  S.kennung = nutzer && nutzer.email ? nutzer.email.split('@')[0] : null;
  if (S.kennung) {
    try { const k = await window.db.collection('bos_accounts').doc(S.kennung).get(); const d = k.exists ? k.data() : null; S.istAdmin = !!(d && d.role === 'admin' && d.freigeschaltet === true); }
    catch (err) { zeigeFehler(t('err_konto'), err); }
  }
  document.getElementById('kontoZeile').textContent = S.kennung ? S.kennung + (S.istAdmin ? ' · admin' : '') : t('kein_konto');
  const nl = document.getElementById('nurLesen');
  nl.textContent = S.kennung ? t('nur_lesen') : t('kein_konto');
  nl.classList.toggle('hidden', S.istAdmin);
  abonniere();
  ladeProdukte();
  S.geladen = true;
  render();
  if (S.kennung) pruefeRegelstand();

let renderGeplant = false;

   Nur aktive: LG.aktiv(alleEintraege(col)). */
function alleEintraege(col) { return S[nameVon(col)]; }
function nameVon(col) { return { lager_artikel: 'artikel', lager_orte: 'orte', lager_standorte: 'standorte', lager_kategorien: 'kategorien', lager_lieferanten: 'lieferanten' }[col]; }
function colVon(ansicht) { return { artikel: COL.artikel, orte: COL.orte, standorte: COL.standorte, kategorien: COL.kategorien, lieferanten: COL.lieferanten }[ansicht]; }
function smap() { return LG.nachId(S.standorte); }
/* Gruppe eines Lagerorts für ▲▼: sein aktiver Standort, sonst „ohne“ */
function ortGruppe(o) { const st = smap()[o.standortId]; return st && !st.geloescht ? o.standortId : '_ohne'; }
function fokusIn(el) { const a = document.activeElement; return !!(a && el && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); }
function render() {
  if (!S.geladen) return;
  renderTabs();
  renderUmschalter();
  const neu = document.getElementById('neuBtn');
  neu.textContent = t({ artikel: 'neu_artikel', orte: 'neu_ort', standorte: 'neu_standort', kategorien: 'neu_kategorie', lieferanten: 'neu_lieferant' }[S.ansicht] || 'neu_artikel');
  neu.disabled = !!sperrGrund() || S.ansicht === 'uebernahme';
  if (!fokusIn(document.getElementById('inhalt'))) {
    if (S.ansicht === 'artikel') renderArtikel();
    else if (S.ansicht === 'uebernahme') renderUebernahmeReiter();
    else renderListe(S.ansicht);
  }

function renderTabs() {
  const n = kandidaten().length;
  const reiter = ['artikel', 'orte', 'standorte', 'kategorien', 'lieferanten'].concat(n ? ['uebernahme'] : []);
  if (!n && S.ansicht === 'uebernahme') S.ansicht = 'artikel';
  const anzahl = { artikel: LG.aktiv(S.artikel).length, orte: LG.aktiv(S.orte).length, standorte: LG.aktiv(S.standorte).length, kategorien: LG.aktiv(S.kategorien).length, lieferanten: LG.aktiv(S.lieferanten).length, uebernahme: n };

    return '<button type="button" class="tab-btn' + (S.ansicht === r ? ' aktiv' : '') + '" data-aktion="ansicht" data-wert="' + r + '">' + esc(t('reiter_' + r)) + ' <span class="anzahl">[' + anzahl[r] + ']</span></button>';
  }).join('');
}
function renderUmschalter() {
  const el = document.getElementById('umschalter');
  el.innerHTML = S.ansicht !== 'artikel' ? '' : ['ort', 'kategorie'].map(function (w) {
    return '<button type="button" class="btn btn-outline' + (S.sortierung === w ? ' aktiv' : '') + '" data-aktion="sortierung" data-wert="' + w + '" aria-pressed="' + (S.sortierung === w) + '">' + esc(t('nach_' + w)) + '</button>';
  }).join(' ');

function renderStatus() {
  const akt = LG.aktiv(S.artikel), kat = km(), om = omap();
  const teile = [t('status_artikel', { n: akt.length })];
  const ohneKat = akt.filter(function (a) { return !kat[a.kategorieId] || kat[a.kategorieId].geloescht; }).length;
  const ohneBer = akt.filter(function (a) { return !a.bereich; }).length;

function zahlAus(text) { const s = String(text == null ? '' : text).trim().replace(',', '.'); if (!s) return undefined; const n = Number(s); return isFinite(n) ? n : NaN; }

/* ---------- Speichern ---------- */
function bauDokument(k) {
  const e = k.entwurf;
  if (k.col === COL.lieferanten) {
    const falsch = LG.TAGE.filter(function (tag) { const x = e.liefertage[tag]; return x && !LG.istGanz(x.bisMinute); });
    if (falsch.length) return { fehler: ['Uhrzeit fehlt oder ist falsch bei ' + falsch.map(function (x) { return LG.TAG_TEXT[x]; }).join(', ') + ' (Form 14:00).'] };
  }
  if (k.col === COL.artikel) {
    if (Number.isNaN(e.inhaltMenge) || (e.inhaltMenge !== undefined && !(e.inhaltMenge > 0))) return { fehler: ['Inhalt je Gebinde muss eine Zahl über 0 sein.'] };
    if (e.zaehlRaster !== undefined && !(LG.istGanz(e.zaehlRaster) && e.zaehlRaster >= 1 && e.zaehlRaster <= LG.GRENZEN.zaehlRasterMax)) return { fehler: ['Raster: ganze Zahl von 1 bis ' + LG.GRENZEN.zaehlRasterMax + '.'] };
  }
  const d = LG.BAUER[k.col](e);
  if (k.roh) d.geloescht = k.roh.geloescht === true;
  return { daten: d, fehler: LG.pruefe(k.col, d, k.id, alleEintraege(k.col)) };
}
async function speichereKarte() {
  const k = S.karte; if (!k || S.speichertGerade) return;
  karteFehler('');
  const b = bauDokument(k);
  if (b.fehler.length) { karteFehler(b.fehler.join(' ')); return; }
  if (k.roh && LG.inhaltGleich(b.daten, k.roh)) { toast(t('nichts_geaendert')); k.geaendert = false; aktualisiereKarteKopf(); return; }
  await fuehreAus(k, b.daten, k.id ? 'aendern' : 'anlegen', k.id ? t('gespeichert') : t('angelegt'));
}
async function archiviereKarte() {
  const k = S.karte; if (!k || !k.id || !k.roh || S.speichertGerade) return;
  karteFehler('');
  const zurueck = k.roh.geloescht === true;
  if (!zurueck) {
    const sp = LG.archivSperre(k.col, k.id, { artikel: S.artikel, teige: S.teige, orte: S.orte });
    if (sp) { karteFehler(sp); return; }
  } else {
    const gleich = LG.aktiv(alleEintraege(k.col)).filter(function (x) { return x.id !== k.id && LG.norm(x.name) === LG.norm(k.roh.name); })[0];
    if (gleich) { karteFehler('„' + k.roh.name + '“ gibt es schon.'); return; }
  }
  const d = LG.BAUER[k.col](k.roh); d.geloescht = !zurueck;
  await fuehreAus(k, d, zurueck ? 'wiederherstellen' : 'archivieren', zurueck ? t('wiederhergestellt') : t('archiviert'));
}
async function fuehreAus(k, daten, aktion, okText) {
  S.speichertGerade = true; aktualisiereKarteKopf();
  try {
    const ids = await schreibe([{ col: k.col, id: k.id, daten: daten, aktion: aktion, vorher: k.roh }]);
    S.speichertGerade = false;
    toast(okText);
    if (!k.id) { k.id = ids[0]; }
    schliesseKarte(true);
  } catch (err) {
    S.speichertGerade = false;
    if (err && err.code === 'permission-denied' && k.id) {
      let frisch = null;
      try { const snap = await window.db.collection(k.col).doc(k.id).get({ source: 'server' }); frisch = snap.exists ? Object.assign({ id: k.id }, snap.data()) : null; }
      catch (e2) { zeigeFehler(t('err_gegenlesen'), e2); }
      if (frisch && (!k.roh || frisch.sicherungId !== k.roh.sicherungId)) {
        console.error('[Lager] abgelehnt: veralteter Stand', err);
        k.roh = frisch; markiereGeaendert(); zeichneKarte();
        karteFehler(t('konflikt', { wer: frisch.geaendertVon || '?' }));
        return;
      }
    }
    karteFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(t('err_speichern'), err);
    aktualisiereKarteKopf();
  }
}
/* Reihenfolge ▲▼ (Orte, Kategorien): zwei Dokumente tauschen ihre sort-Zahl, ein Vorgang */
async function verschiebeSort(col, id, r) {
  let liste = LG.aktiv(alleEintraege(col)).slice().sort(LG.nachSort);
  /* Stufe 2: Lagerorte tauschen nur innerhalb ihres Standorts (so wie die Liste sie zeigt) */
  if (col === COL.orte) { const x = liste.filter(function (o) { return o.id === id; })[0]; if (x) { const g = ortGruppe(x); liste = liste.filter(function (o) { return ortGruppe(o) === g; }); } }
  const i = liste.findIndex(function (x) { return x.id === id; }), j = i + r;
  if (i < 0 || j < 0 || j >= liste.length) return;
  const a = liste[i], b = liste[j];
  let sa = LG.istZahl(a.sort) ? a.sort : 0, sb = LG.istZahl(b.sort) ? b.sort : 0;
  if (sa === sb) { sa = (i + 1) * 10; sb = (j + 1) * 10; }
  const da = LG.BAUER[col](a), db2 = LG.BAUER[col](b);
  da.sort = sb; db2.sort = sa;
  try { await schreibe([{ col: col, id: a.id, daten: da, aktion: 'aendern', vorher: a }, { col: col, id: b.id, daten: db2, aktion: 'aendern', vorher: b }]); }
  catch (err) { zeigeFehler(t('err_speichern'), err); }
}
/* B16 + K2: nur Kategorien; legt nur Namen an, die nicht schon AKTIV da sind (Archiv zählt nicht) */
async function legeStartlisteAn(col) {
  if (col !== COL.kategorien) return;
  if (LG.aktiv(alleEintraege(col)).length) return;
  const vorlage = LG.startlisteFehlende(LG.STARTLISTE_KATEGORIEN, alleEintraege(col));
  if (!vorlage.length) return;
  if (!window.confirm(t('startliste_frage', { n: vorlage.length, liste: vorlage.map(function (x) { return x.name; }).join(', ') }))) return;
  const auftraege = vorlage.map(function (v, i) { return { col: col, id: null, daten: LG.BAUER[col](Object.assign({ sort: (i + 1) * 10 }, v)), aktion: 'anlegen', vorher: null }; });
  try { const n = await schreibeReihe(auftraege, function (i, n) { document.getElementById('statusBar').textContent = t('reihe_laeuft', { i: i, n: n }); }); toast(t('startliste_fertig', { n: n })); }
  catch (err) { zeigeFehler(t('err_speichern'), err); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-aktion]');

  title: 'Lager — was ist das hier?',
  sections: [
    { heading: 'Wofür ist diese Seite?', text: 'Hier steht jeder Artikel, der irgendwo bei uns lagert: Rohstoffe, Kühlware, TK-Ware, Konserven, Verpackung, Reinigung. Zu jedem Artikel pflegst du, was er ist (Kategorie), wo er fest liegt (Lagerorte), in welchem Gebinde er kommt, wie er gezählt wird und von welchem Lieferanten. Gezählt wird auf der eigenen Seite „Lager zählen“; diese Seite ist die Liste, auf die sie sich stützt.' },
    { heading: 'Die Reiter', text: '„Artikel“ ist die eigentliche Liste. „Lagerorte“ sind die Räume und Regale, in denen der Vorrat steht, in der Reihenfolge des Rundgangs. „Standorte“ sind die Gebäude, zu denen die Lagerorte gehören. „Kategorien“ sagen, was etwas ist und ob es Kühlung oder Tiefkühlung braucht. „Lieferanten“ tragen ihre Liefertage und bis wann bestellt sein muss. Solange Zutaten der Teigecke noch nicht im Lager stehen, gibt es einen weiteren Reiter „Aus der Teigecke übernehmen“.' },
    { heading: 'Standorte', text: 'Ein Standort ist ein Gebäude, zum Beispiel die Backstube oder ein Vorratslager. Jeder Lagerort gehört zu einem Standort; das wählst du in der Karte des Lagerorts. Solange keiner gewählt ist, steht der Ort unter „Noch ohne Standort“, und an ihm kann nicht gezählt werden. Der Standort sagt nichts über die Temperatur: ein TK-Raum kann in jedem Standort stehen. Gezählt wird je Standort, und wer wo zählen darf, steht in der Kontenverwaltung.' },
    { heading: 'Nach Ort oder nach Kategorie', text: 'Im Reiter Artikel schaltest du oben um. „Nach Ort“ zeigt die Artikel so, wie man beim Zählen durch die Räume geht; ein Artikel an zwei Orten steht unter beiden. „Nach Kategorie“ zeigt sie so, wie man pflegt und bestellt. Ganz oben stehen jeweils die Artikel, denen noch etwas fehlt (ohne festen Ort, noch ohne Kategorie). Das Suchfeld sucht über alle Artikel.' },
    { heading: 'Eine Karte bearbeiten', text: 'Antippen öffnet die Karte. Oben blätterst du mit ‹ › durch die Liste, ✕ schließt. Die Reiter der Karte: Stammdaten (Name, Kategorie, Bereich, Gebinde und Inhalt), Lagerung (feste Lagerorte, Zählart), Bezug (Lieferanten mit Artikelnummer, einer ist Standard) und Teigecke. „💾 Speichern“ schreibt genau diese Karte; vorher wird die alte Fassung automatisch gesichert. Steht oben „noch nicht gespeichert“, fragt die Seite nach, bevor du weggehst.' },
    { heading: 'Gebinde und Inhalt', text: 'Gebinde ist das, was du beim Zählen in der Hand hast: Sack, Karton, Eimer. Inhalt ist, was drin ist: 25 kg, 180 Stück. Beides zusammen steht in der Liste, zum Beispiel „Sack · 25 kg“.' },
    { heading: 'Zählart', text: '„Raster bis 24“ heißt: Beim Zählen gibt es Knöpfe zum Antippen von 0 bis 24 und einen Knopf „voll“ — gut für Säcke auf der Palette. „Zahlenfeld“ heißt: Zahl eintippen. Ein Zahlenfeld gibt es beim Zählen immer zusätzlich. Gezählt wird auf der Seite „Lager zählen“.' },
    { heading: 'Der gelbe Hinweis „Lagerort“', text: 'Gehört ein Artikel zu einer Kategorie, die Kühlung braucht, und liegt er fest an einem ungekühlten Ort, zeigt die Seite ⚠︎. Dasselbe bei TK-Ware an einem Ort ohne Tiefkühlung. Das ist nur ein Hinweis, keine Sperre — manchmal ist es richtig so.' },
    { heading: 'Lieferanten und „bestellt bis“', text: 'Am Lieferanten hakst du die Liefertage an. Daneben steht für jeden Liefertag, bis wann bestellt sein muss: Wochentag und Uhrzeit, zum Beispiel „bis Sonntag 14:00“. Das steht am Lieferanten, nicht an jedem Artikel — ändert sich ein Tag, änderst du ihn einmal. In der Artikelkarte siehst du die Tage des Standard-Lieferanten zum Lesen.' },
    { heading: 'Teigecke', text: 'Ist ein Artikel „in der Teigecke handverwogen“, sieht ihn die Teigecke: in der Rezept-Auswahl, auf der Seite „Orte“ und im BrotTeigRechner. Name, Gebinde und Gruppe pflegst du nur hier. Das Zuhause (welcher Wagen) setzen die Kollegen mit dem Haken 🧺 Wagen & Zutaten auf der Seite Teigecke · Orte; hier steht es nur zum Lesen. „Steckt in …“ zeigt, in welchen Teigen die Zutat steht und welche Brote aus diesen Teigen kommen.' },
    { heading: 'Aus der Teigecke übernehmen', text: 'Einmalig: Die Zutaten, die es in der Teigecke schon gibt, kommen mit „Übernehmen“ ins Lager — mit derselben Kennung, also bleiben alle Rezepte gültig. Name, Inhalt, Gruppe und Archiv werden mitgenommen; Kategorie und Bereich bleiben offen, die trägst du danach ein. Die Teigecke selbst wird dabei nicht angefasst. Bis zur Übernahme kann in der Teigecke niemand ein Zuhause setzen; das ist gewollt.' },
    { heading: 'Archivieren statt löschen', text: 'Gelöscht wird nichts. Ein Standort lässt sich erst archivieren, wenn kein Lagerort mehr zu ihm gehört; ein Lagerort, wenn kein Artikel mehr fest dort liegt; eine Kategorie, wenn kein Artikel mehr dazugehört; ein Lieferant, wenn er keinen Artikel mehr liefert; ein Artikel, wenn er in keinem Teig mehr steht. Archiviertes steht unten im Archiv und lässt sich wiederherstellen.' },
    { heading: 'Wer darf was?', text: 'Sehen darf das Lager jeder mit Konto. Ändern darf nur die Rolle admin — dieselbe Regel wie bei den Produkten. Fehlt dir die Rolle, steht oben ein Hinweis, und alle Felder sind gesperrt. Zählen ist etwas anderes: dafür gibt es je Standort einen Haken in der Kontenverwaltung.' },
    { heading: 'Wenn etwas schiefgeht', text: 'Fehler erscheinen oben in einem roten Kasten, mit der echten Meldung des Systems. „Keine Berechtigung“ heißt: keine Rolle admin, oder die Regeln in der Datenbank sind älter als diese Seite — dann steht oben zusätzlich ein roter Hinweis mit der Regeldatei, die eingesetzt werden muss. „Inzwischen von … geändert“ heißt: jemand war schneller; die Seite hat den frischen Stand geladen, deine Eingaben stehen noch da, einfach prüfen und noch einmal speichern. Ohne Netz lässt sich nichts ändern.' }
  ]
};
function renderHilfe() {
  document.getElementById('helpTitle').textContent = helpData.title;
  document.getElementById('helpContent').innerHTML = helpData.sections.map(function (s) { return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>'; }).join('');
}
document.getElementById('helpOpenBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.remove('hidden'); });
document.getElementById('helpCloseBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.add('hidden'); });
document.getElementById('helpSheet').addEventListener('click', function (e) { if (e.target === this) this.classList.add('hidden'); });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
