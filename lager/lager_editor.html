  <div style="display:flex; align-items:center; gap:10px;">
    <div class="meta"><div data-i18n="untertitel">Artikel, Lagerorte, Kategorien, Lieferanten</div><div id="kontoZeile">—</div></div>
    <button id="helpOpenBtn" class="help-btn" title="Hilfe" aria-label="Hilfe">❓</button>
  </div>
</header>

<div id="regelLeiste" class="hinweis rot hidden" role="alert"></div>
<div id="nurLesen" class="hinweis akzent hidden" role="status"></div>
<div id="fehlerLeiste" class="hidden" role="alert">
  <div class="kopf"><span data-i18n="fehler_titel">⚠︎ Fehler</span><button type="button" class="btn btn-outline" id="fehlerZuBtn" style="min-height:32px;padding:4px 10px" data-i18n="ausblenden">ausblenden</button></div>
  <ul id="fehlerListe"></ul>
</div>

<div class="toolbar">
  <button type="button" class="btn btn-outline pfad-btn" id="pfadBtn" data-aktion="baum-auf" aria-expanded="false" aria-controls="baumSpalte">—</button>
  <button type="button" class="btn btn-outline" data-aktion="neu-laden" data-i18n="neu_laden">↻ Neu laden</button>
  <input type="search" id="suchfeld" autocomplete="off" aria-label="Suchen">
  <span id="statusBar">—</span>
</div>
<div class="lager-rahmen">
  <nav id="baumSpalte" aria-label="Ordner">
    <div class="baum-kopf"><span data-i18n="baum_titel">Ordner</span><button type="button" class="karte-close" data-aktion="baum-zu" aria-label="Schließen">✕</button></div>
    <div id="baum"></div>
  </nav>
  <main id="inhalt"><div class="leer" data-i18n="lade">Lade Daten …</div></main>
</div>

<div id="karteOverlay" class="sheet-overlay hidden">
  <div class="karte-sheet" role="dialog" aria-modal="true" aria-labelledby="karteName">
    <div class="karte-kopf">
      <button type="button" class="karte-nav-btn" id="karteZurueckBtn" data-aktion="karte-nav" data-r="-1" aria-label="Vorheriger">‹</button>
      <div class="karte-titel"><div class="karte-name" id="karteName">—</div><div class="karte-unter" id="karteUnter"></div></div>
      <button type="button" class="karte-nav-btn" id="karteVorBtn" data-aktion="karte-nav" data-r="1" aria-label="Nächster">›</button>
      <button type="button" class="karte-close" data-aktion="karte-zu" aria-label="Schließen">✕</button>
    </div>
    <div class="karte-aktionen">
      <button type="button" class="btn btn-amber" id="karteSpeichernBtn" data-aktion="speichern">💾</button>
      <button type="button" class="btn btn-outline" id="karteArchivBtn" data-aktion="archiv"></button>
      <span id="karteHinweis"></span>
    </div>
    <div id="karteFehler" class="hidden" role="alert"></div>
    <div class="karte-tabs" id="karteTabs"></div>
    <div class="karte-body" id="karteBody"></div>
  </div>
</div>

<div id="uebernahmeOverlay" class="sheet-overlay hidden">
  <div class="ue-sheet" role="dialog" aria-modal="true" aria-labelledby="ueTitel">
    <div class="ue-kopf" id="ueTitel"></div>
    <div class="ue-inhalt" id="ueInhalt"></div>
    <div class="ue-fuss">
      <button type="button" class="btn btn-amber" id="ueLosBtn" data-aktion="ue-los"></button>
      <button type="button" class="btn btn-outline" id="ueZuBtn" data-aktion="ue-zu"></button>
      <div id="ueStatus" role="status"></div>
    </div>
  </div>
</div>

<div id="helpSheet" class="sheet-overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h2 id="helpTitle"></h2>
    <div id="helpContent"></div>
    <button type="button" class="btn btn-outline" id="helpCloseBtn" data-i18n="schliessen">Schließen</button>
  </div>
</div>
<div id="menueOverlay" class="sheet-overlay hidden">
  <div class="sheet menue-sheet" role="dialog" aria-modal="true" aria-labelledby="menueTitel">
    <div class="sheet-handle"></div>
    <h2 id="menueTitel"></h2>
    <div id="menueInhalt"></div>
    <button type="button" class="btn btn-outline" data-aktion="menue-zu" data-i18n="abbrechen">Abbrechen</button>
  </div>
</div>
<div id="auswahlOverlay" class="sheet-overlay hidden">
  <div class="sheet auswahl-sheet" role="dialog" aria-modal="true" aria-labelledby="auswahlTitel">
    <div class="sheet-handle"></div>
    <h2 id="auswahlTitel"></h2>
    <div id="auswahlHinweis" class="inhalt-hinweis"></div>
    <div id="auswahlBaum"></div>
    <button type="button" class="btn btn-outline" data-aktion="auswahl-zu" data-i18n="abbrechen">Abbrechen</button>
  </div>
</div>
<div id="toast" class="hidden" role="status"></div>
<datalist id="gebindeVorschlaege"></datalist>

/* ---------- Schreiben: Sicherung + Dokument in EINEM Batch (RK §30) ----------
   Muster teigecke_seite.js schreibe(): sicherungId zeigt auf eine Sicherung, die in
   genau diesem Vorgang entsteht und auf genau dieses Dokument zeigt; vorher =
   rohes Serverdokument (oder null beim Anlegen). auftraege: [{ col, id, daten, aktion, vorher }] */
function ohneId(dok) { if (!dok) return null; const k = Object.assign({}, dok); delete k.id; return k; }

function sperrGrund() {

async function schreibe(auftraege) {
  const g = sperrGrund();
  if (g) { const e = new Error(g); e.code = 'gesperrt'; throw e; }
  const db = window.db;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const batch = db.batch();
  const ids = [];
  auftraege.forEach(function (a) {
    const sichRef = db.collection(COL.sicherungen).doc();
    const zielRef = a.id ? db.collection(a.col).doc(a.id) : db.collection(a.col).doc();
    batch.set(sichRef, { collection: a.col, dokId: zielRef.id, aktion: a.aktion, vorher: ohneId(a.vorher), konto: S.kennung, ts: ts });
    batch.set(zielRef, Object.assign(nurFelder(a.col, a.daten), { sicherungId: sichRef.id, geaendertVon: S.kennung, geaendertAm: ts }));

}

/* ---------- Rendern: Baum + Inhalt (Ordneransicht, #168, L16) ----------

let renderGeplant = false;

  if (S.da.teigeckeOrte && S.da.blaetter) { d.blaetter = S.blaetter; d.teigeckeOrte = S.teigeckeOrte; }   /* Zuhause: Wagen in Unterzeile und Ordner Teigecke */

function teilText(x) { return (x.zeichen ? x.zeichen + ' ' : '') + (x.name != null ? x.name : t(x.schluessel, x.werte)); }

/* ---------- Merken je Gerät (try/catch: Speicher kann gesperrt sein) ---------- */

function merke(schluessel, wert) { try { localStorage.setItem(schluessel, wert); } catch (e) { console.warn('[Lager] Merken nicht möglich:', e && e.message); } }
function gemerkteOffen() {
  let a = [];

  if (a.indexOf(UEBERSICHT_ZU) === -1 && a.indexOf('a:uebersicht') === -1) a.push('a:uebersicht');

  const punkt = function (wert, text, an) { return '<button type="button" class="btn btn-outline menue-punkt' + (an ? ' an' : '') + '" data-aktion="wagen-setzen" data-wert="' + esc(wert) + '"' + (an ? ' aria-pressed="true"' : '') + '>' + esc(text) + (an ? ' · ' + esc(t('zh_jetzt')) : '') + '</button>'; };

  document.getElementById('menueOverlay').classList.remove('hidden');

async function schreibeZuhause(artikelId, ortId) {
  const g = zuhauseGrund(artikelId);
  if (g) { const e = new Error(g); e.code = 'gesperrt'; throw e; }
  const roh = LG.nachId(S.blaetter)[artikelId] || null;
  const b = LG.blattMitZuhause(roh, ortId);
  const db = window.db;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const sichRef = db.collection(COL_TEIGECKE.sicherungen).doc();
  const ref = db.collection(COL_TEIGECKE.blaetter).doc(artikelId);
  const batch = db.batch();
  batch.set(sichRef, { collection: COL_TEIGECKE.blaetter, dokId: artikelId, aktion: b.aktion, vorher: b.vorher, konto: S.kennung, ts: ts });
  batch.set(ref, Object.assign({}, b.daten, { sicherungId: sichRef.id, geaendertVon: S.kennung, geaendertAm: ts }));
  try { await mitZeitlimit(batch.commit()); }
  catch (err) {
    /* Abgelehnt: war ein anderes Gerät schneller (Blatt inzwischen anders)? Dann Konflikt statt Rätsel (wie Orte). */
    if (err && err.code === 'permission-denied') {
      let frisch = null;
      try { const sn = await db.collection(COL_TEIGECKE.blaetter).doc(artikelId).get({ source: 'server' }); frisch = sn.exists ? sn.data() : null; }
      catch (e2) { zeigeFehler(t('err_gegenlesen'), e2); }
      if (frisch && (!roh || frisch.sicherungId !== roh.sicherungId)) {
        S.blaetter = S.blaetter.filter(function (x) { return x.id !== artikelId; }).concat([Object.assign({ id: artikelId }, frisch)]);
        const k = new Error(t('zh_konflikt', { wer: frisch.geaendertVon || '?' })); k.code = 'konflikt'; throw k;
      }
    }
    throw err;
  }
  return b;
}
async function setzeZuhause(artikelId, ortId) {
  const a = LG.nachId(S.artikel)[artikelId]; if (!a) return;
  try {
    await schreibeZuhause(artikelId, ortId);
    const w = ortId ? LG.nachId(S.teigeckeOrte)[ortId] : null;
    toast(w ? t('zh_gesetzt', { name: a.name, wagen: w.kennung }) : t('zh_entfernt', { name: a.name }));

}

async function legeHierher() {
  const h = S.hierher; if (!h) return;
  const ids = Array.from(h.auswahl);
  const st = document.getElementById('hierherStatus');
  if (!ids.length) { if (st) st.textContent = t('hierher_nichts'); return; }

function oeffneAuswahl(art) {
  const m = S.menue; if (!m) return;
  const a = LG.nachId(S.artikel)[m.id]; if (!a) return;
  schliesseMenue();

/* Eingaben in den Entwurf übernehmen (ohne Neuzeichnen, damit der Fokus bleibt) */
function zahlAus(text) { const s = String(text == null ? '' : text).trim().replace(',', '.'); if (!s) return undefined; const n = Number(s); return isFinite(n) ? n : NaN; }
function nimmEingabe(el) {
  const k = S.karte; if (!k) return;
  const e = k.entwurf, f = el.getAttribute('data-feld');
  if (f) {
    if (f === 'inhaltMenge') { const n = zahlAus(el.value); if (n === undefined) delete e.inhaltMenge; else e.inhaltMenge = n; }
    else if (f === 'zaehlRaster') { const n = zahlAus(el.value); if (n === undefined) delete e.zaehlRaster; else e.zaehlRaster = n; }
    else if (f === 'gebinde' || f === 'kontakt') { if (el.value.trim()) e[f] = el.value; else delete e[f]; }
    else if (f === 'inhaltEinheit' || f === 'bestellweg' || f === 'standortId') { if (el.value) e[f] = el.value; else delete e[f]; }
    else e[f] = el.value;
  }
  if (el.hasAttribute('data-quelle')) e.quellen[el.getAttribute('data-quelle')] = el.value;
  if (el.hasAttribute('data-bis-tag')) { const x = e.liefertage[el.getAttribute('data-bis-tag')]; if (x) x.bisTag = el.value; }
  if (el.hasAttribute('data-bis-zeit')) { const x = e.liefertage[el.getAttribute('data-bis-zeit')]; if (x) x.bisMinute = LG.minuteAus(el.value); }
  markiereGeaendert();
}
function aenderungMitZeichnen(fn) { const k = S.karte; if (!k) return; fn(k.entwurf); markiereGeaendert(); zeichneKarte(); }

/* ---------- Speichern ---------- */
function bauDokument(k) {
  const e = k.entwurf;
  if (k.col === COL.lieferanten) {
    const falsch = LG.TAGE.filter(function (tag) { const x = e.liefertage[tag]; return x && !LG.istGanz(x.bisMinute); });
    if (falsch.length) return { fehler: ['Uhrzeit fehlt oder ist falsch bei ' + falsch.map(function (x) { return LG.TAG_TEXT[x]; }).join(', ') + ' (Form 14:00).'] };
  }
  if (k.col === COL.artikel) {
    if (Number.isNaN(e.inhaltMenge) || (e.inhaltMenge !== undefined && !(e.inhaltMenge > 0))) return { fehler: ['Inhalt je Gebinde muss eine Zahl über 0 sein.'] };
    if (e.zaehlRaster !== undefined && !(LG.istGanz(e.zaehlRaster) && e.zaehlRaster >= 1 && e.zaehlRaster <= LG.GRENZEN.zaehlRasterMax)) return { fehler: ['Raster: ganze Zahl von 1 bis ' + LG.GRENZEN.zaehlRasterMax + '.'] };
  }
  const d = LG.BAUER[k.col](e);
  if (k.roh) d.geloescht = k.roh.geloescht === true;
  return { daten: d, fehler: LG.pruefe(k.col, d, k.id, alleEintraege(k.col)) };
}
async function speichereKarte() {
  const k = S.karte; if (!k || S.speichertGerade) return;
  karteFehler('');
  const b = bauDokument(k);
  if (b.fehler.length) { karteFehler(b.fehler.join(' ')); return; }
  if (k.roh && LG.inhaltGleich(b.daten, k.roh)) { toast(t('nichts_geaendert')); k.geaendert = false; aktualisiereKarteKopf(); return; }
  await fuehreAus(k, b.daten, k.id ? 'aendern' : 'anlegen', k.id ? t('gespeichert') : t('angelegt'));
}
async function archiviereKarte() {
  const k = S.karte; if (!k || !k.id || !k.roh || S.speichertGerade) return;
  karteFehler('');
  const zurueck = k.roh.geloescht === true;
  if (!zurueck) {
    const sp = LG.archivSperre(k.col, k.id, { artikel: S.artikel, teige: S.teige, orte: S.orte });
    if (sp) { karteFehler(sp); return; }
  } else {
    const gleich = LG.aktiv(alleEintraege(k.col)).filter(function (x) { return x.id !== k.id && LG.norm(x.name) === LG.norm(k.roh.name); })[0];
    if (gleich) { karteFehler('„' + k.roh.name + '“ gibt es schon.'); return; }
  }
  const d = LG.BAUER[k.col](k.roh); d.geloescht = !zurueck;
  await fuehreAus(k, d, zurueck ? 'wiederherstellen' : 'archivieren', zurueck ? t('wiederhergestellt') : t('archiviert'));
}
async function fuehreAus(k, daten, aktion, okText) {
  S.speichertGerade = true; aktualisiereKarteKopf();
  try {
    const ids = await schreibe([{ col: k.col, id: k.id, daten: daten, aktion: aktion, vorher: k.roh }]);
    S.speichertGerade = false;
    toast(okText);
    if (!k.id) { k.id = ids[0]; }
    schliesseKarte(true);
  } catch (err) {
    S.speichertGerade = false;
    if (err && err.code === 'permission-denied' && k.id) {
      let frisch = null;
      try { const snap = await window.db.collection(k.col).doc(k.id).get({ source: 'server' }); frisch = snap.exists ? Object.assign({ id: k.id }, snap.data()) : null; }
      catch (e2) { zeigeFehler(t('err_gegenlesen'), e2); }
      if (frisch && (!k.roh || frisch.sicherungId !== k.roh.sicherungId)) {
        console.error('[Lager] abgelehnt: veralteter Stand', err);
        k.roh = frisch; markiereGeaendert(); zeichneKarte();
        karteFehler(t('konflikt', { wer: frisch.geaendertVon || '?' }));
        return;
      }
    }
    karteFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(t('err_speichern'), err);
    aktualisiereKarteKopf();
  }
}
/* Reihenfolge ▲▼ (Orte, Kategorien): zwei Dokumente tauschen ihre sort-Zahl, ein Vorgang */
async function verschiebeSort(col, id, r) {
  let liste = LG.aktiv(alleEintraege(col)).slice().sort(LG.nachSort);
  /* Stufe 2: Lagerorte tauschen nur innerhalb ihres Standorts (so wie die Liste sie zeigt) */
  if (col === COL.orte) { const x = liste.filter(function (o) { return o.id === id; })[0]; if (x) { const g = ortGruppe(x); liste = liste.filter(function (o) { return ortGruppe(o) === g; }); } }
  const i = liste.findIndex(function (x) { return x.id === id; }), j = i + r;
  if (i < 0 || j < 0 || j >= liste.length) return;
  const a = liste[i], b = liste[j];
  let sa = LG.istZahl(a.sort) ? a.sort : 0, sb = LG.istZahl(b.sort) ? b.sort : 0;
  if (sa === sb) { sa = (i + 1) * 10; sb = (j + 1) * 10; }
  const da = LG.BAUER[col](a), db2 = LG.BAUER[col](b);
  da.sort = sb; db2.sort = sa;
  try { await schreibe([{ col: col, id: a.id, daten: da, aktion: 'aendern', vorher: a }, { col: col, id: b.id, daten: db2, aktion: 'aendern', vorher: b }]); }
  catch (err) { zeigeFehler(t('err_speichern'), err); }
}
/* B16 + K2: nur Kategorien; legt nur Namen an, die nicht schon AKTIV da sind (Archiv zählt nicht) */
async function legeStartlisteAn(col) {
  if (col !== COL.kategorien) return;
  if (LG.aktiv(alleEintraege(col)).length) return;
  const vorlage = LG.startlisteFehlende(LG.STARTLISTE_KATEGORIEN, alleEintraege(col));
  if (!vorlage.length) return;
  if (!window.confirm(t('startliste_frage', { n: vorlage.length, liste: vorlage.map(function (x) { return x.name; }).join(', ') }))) return;
  const auftraege = vorlage.map(function (v, i) { return { col: col, id: null, daten: LG.BAUER[col](Object.assign({ sort: (i + 1) * 10 }, v)), aktion: 'anlegen', vorher: null }; });
  try { const n = await schreibeReihe(auftraege, function (i, n) { document.getElementById('statusBar').textContent = t('reihe_laeuft', { i: i, n: n }); }); toast(t('startliste_fertig', { n: n })); }
  catch (err) { zeigeFehler(t('err_speichern'), err); }
}

  if (z.art === 'o') return { orte: [z.id] };
  if (z.art === 'k') return { kategorieId: z.id };
  if (z.art === 'l') { const q = {}; q[z.id] = ''; return { quellen: q, standardLieferantId: z.id }; }
  return {};
}
function vorgabeOrt() {
  const z = LG.zerlegeOrdner(S.ordner) || {};
  if (z.art === 's') return { standortId: z.id };
  if (z.art === 't') return { standortId: z.id, temperatur: z.temperatur };

}

async function fuehreUebernahmeAus() {

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion');
  const k = S.karte;
  switch (a) {
    case 'ordner': waehleOrdner(el.getAttribute('data-wert')); break;
    case 'ordner-karte': karteZuOrdner(S.ordner); break;
    case 'folge-oeffnen': { const z = LG.zerlegeOrdner(S.ordner); if (z && z.art === 'o') oeffneKarte(COL.orte, z.id, { reiter: 'k_artikelfolge' }); break; }
    case 'neu-artikel': oeffneKarte(COL.artikel, null, { vorgabe: vorgabeArtikel() }); break;
    case 'neu-ort': oeffneKarte(COL.orte, null, { vorgabe: vorgabeOrt() }); break;
    case 'neu-abschnitt': { const z = LG.zerlegeOrdner(S.ordner); if (z && z.art === 'a') oeffneKarte(COL[z.id], null); break; }
    case 'baum-auf': setzeBaumOffen(!S.baumOffen); break;
    case 'baum-zu': setzeBaumOffen(false); break;
    case 'sortierung': S.sortierung = el.getAttribute('data-wert'); merke(SPEICHER_SORTIERUNG, S.sortierung); render(); break;
    case 'neu-laden': abonniere(); ladeProdukte(); toast(t('lade')); break;
    case 'oeffne': if (ev.target.closest('[data-aktion="sort"]') || ev.target.closest('[data-aktion="menue"]')) break; oeffneKarte(el.getAttribute('data-col'), el.getAttribute('data-id')); break;
    case 'sort': ev.stopPropagation(); verschiebeSort(el.getAttribute('data-col'), el.getAttribute('data-id'), Number(el.getAttribute('data-r'))); break;
    case 'menue': ev.stopPropagation(); oeffneMenue(el.getAttribute('data-id'), el.getAttribute('data-ort')); break;
    case 'menue-zu': schliesseMenue(); break;
    case 'menue-wagen': { const m = S.menue; schliesseMenue(); if (m) oeffneWagenWahl(m.id); break; }
    case 'wagen-waehlen': oeffneWagenWahl(el.getAttribute('data-id')); break;
    case 'wagen-setzen': { const id = S.wagenWahl; schliesseMenue(); if (id) setzeZuhause(id, el.getAttribute('data-wert')); break; }
    case 'zutaten-hierher': oeffneHierher(el.getAttribute('data-wert')); break;
    case 'hierher-chip': { const h = S.hierher; if (!h) break; const id = el.getAttribute('data-id'); if (h.auswahl.has(id)) h.auswahl.delete(id); else h.auswahl.add(id); el.setAttribute('aria-pressed', String(h.auswahl.has(id))); break; }
    case 'hierher-los': legeHierher(); break;
    case 'menue-karte': { const m = S.menue; schliesseMenue(); if (m) oeffneKarte(COL.artikel, m.id); break; }
    case 'menue-verschieben': oeffneAuswahl('verschieben'); break;
    case 'menue-dazu': oeffneAuswahl('dazu'); break;
    case 'menue-weg': { const m = S.menue; schliesseMenue(); if (m) aendereOrte('weg', m.id, m.ortId, null); break; }
    case 'auswahl-zu': schliesseAuswahl(); break;
    case 'startliste': legeStartlisteAn(el.getAttribute('data-col')); break;
    case 'karte-zu': schliesseKarte(false); break;
    case 'karte-nav': karteNav(Number(el.getAttribute('data-r'))); break;
    case 'karte-reiter': if (k) { k.reiter = el.getAttribute('data-wert'); zeichneKarte(); } break;
    case 'speichern': speichereKarte(); break;
    case 'archiv': archiviereKarte(); break;
    case 'ort-chip': aenderungMitZeichnen(function (e) { const id = el.getAttribute('data-id'); const i = e.orte.indexOf(id); if (i === -1) e.orte.push(id); else e.orte.splice(i, 1); }); break;
    case 'quelle-dazu': { const s = document.getElementById('quelleNeu'); if (s && s.value) aenderungMitZeichnen(function (e) { e.quellen[s.value] = ''; if (!e.standardLieferantId) e.standardLieferantId = s.value; }); break; }
    case 'quelle-weg': aenderungMitZeichnen(function (e) { const id = el.getAttribute('data-id'); delete e.quellen[id]; if (e.standardLieferantId === id) e.standardLieferantId = Object.keys(e.quellen)[0] || ''; }); break;
    case 'folge': aenderungMitZeichnen(function (e) { const ids = LG.artikelInFolge(e, LG.artikelAmOrt(k.id, S.artikel)).map(function (x) { return x.id; }); e.folge = LG.verschiebe(ids, Number(el.getAttribute('data-i')), Number(el.getAttribute('data-r'))); }); break;
    case 'folge-alphabet': aenderungMitZeichnen(function (e) { delete e.folge; }); break;
    case 'ue-oeffnen': oeffneUebernahme(); break;
    case 'ue-los': fuehreUebernahmeAus(); break;
    case 'ue-zu': schliesseUebernahme(); break;
  }
});

  sections: [
    { heading: 'Wofür ist diese Seite?', text: 'Hier steht jeder Artikel, der irgendwo bei uns lagert: Rohstoffe, Kühlware, TK-Ware, Konserven, Verpackung, Reinigung. Zu jedem Artikel pflegst du, was er ist (Kategorie), wo er fest liegt (Lagerorte), in welchem Gebinde er kommt, wie er gezählt wird und von welchem Lieferanten. Gezählt wird auf der eigenen Seite „Lager zählen“; diese Seite ist die Liste, auf die sie sich stützt.' },
    { heading: 'Der Baum', text: 'Die Seite ist aufgebaut wie ein Dateimanager. Links (auf schmalem Bildschirm hinter dem Pfad oben, ein Tipp darauf klappt ihn auf) steht der Baum: oben im Abschnitt „Übersicht“ die festen Ordner „Alle Artikel“ und „Unsortiert“, dazu Ordner, die nur auftauchen, wenn es dort etwas gibt (Prüfen, Ohne Kategorie, Bereich offen, Lagerorte ohne Standort, Aus der Teigecke übernehmen, Teigecke, Archiv). Darunter die Standorte, unter jedem Standort die Temperaturen (ungekühlt, gekühlt, TK) und darin die Lagerorte, ganz unten Kategorien und Lieferanten. Den Namen antippen öffnet den Ordner, ▸ klappt nur auf und zu. Jeder Abschnitt (Übersicht, Standorte, Kategorien, Lieferanten) klappt mit ▸ auf und zu; bei „Übersicht“ auch ein Tipp auf den Namen, denn der Kopf ist selbst kein Ordner. Liegt der offene Ordner in einem zugeklappten Abschnitt, klappt er beim Öffnen des Baums von selbst auf. Die Zahl daneben ist die Zahl der Artikel. Die Seite merkt sich auf diesem Gerät, welcher Ordner offen war.' },
    { heading: '✎ und ⋯', text: '✎ öffnet immer direkt die Karte: am Standort, am Lagerort, an Kategorie und Lieferant, oben im Ordner und in den Listen. ⋯ öffnet immer ein Menü: an einem Artikel „Karte öffnen“, „Verschieben nach …“, „Liegt auch hier …“ und „Hier entfernen“, bei Teigecke-Zutaten dazu „🥖 Wagen wählen …“. ＋ legt an, und zwar gleich am richtigen Platz: „＋ Lagerort“ unter einem Standort hat den Standort schon gesetzt, „＋ Artikel“ in einem Lagerort den Ort.' },
    { heading: 'Standorte', text: 'Ein Standort ist ein Gebäude, zum Beispiel die Backstube oder ein Vorratslager. Jeder Lagerort gehört zu einem Standort; das wählst du in der Karte des Lagerorts. Solange keiner gewählt ist, steht der Ort im Ordner „Lagerorte ohne Standort“, und an ihm kann nicht gezählt werden. Der Standort sagt nichts über die Temperatur: ein TK-Raum kann in jedem Standort stehen. Tippst du unter einem Standort auf „❄ gekühlt“, siehst du alles, was an diesem Standort gekühlt liegt, nach Ort. Im Standort selbst stehen seine Lagerorte in der Reihenfolge des Rundgangs; mit ▲▼ änderst du sie. Gezählt wird je Standort, und wer wo zählen darf, steht in der Kontenverwaltung.' },
    { heading: 'Alle Artikel: nach Ort oder nach Kategorie', text: 'Im Ordner „Alle Artikel“ schaltest du oben um. „Nach Ort“ zeigt die Artikel so, wie man beim Zählen durch die Räume geht. „Nach Kategorie“ zeigt sie so, wie man pflegt und bestellt. Ganz oben stehen jeweils die Artikel, denen noch etwas fehlt (ohne festen Ort, noch ohne Kategorie).' },
    { heading: 'Ein Artikel an mehreren Orten', text: 'Liegt ein Artikel an zwei Orten, steht er in beiden Ordnern, mit „⇄ liegt auch in …“. Es ist trotzdem nur ein Artikel; eine Änderung an der Karte gilt überall.' },
    { heading: 'Verschieben und „Liegt auch hier“', text: 'Über ⋯ am Artikel. „Verschieben nach …“ und „Liegt auch hier …“ zeigen denselben Baum zum Auswählen; ✓ heißt, er liegt dort schon. „Hier entfernen“ nimmt ihn nur aus diesem Ort; liegt er sonst nirgends, steht er danach in „Unsortiert“. Wurde er am alten Ort im laufenden Zählgang schon gezählt, fragt die Seite vorher: Die Zählung bleibt beim alten Ort, am neuen ist er noch nicht gezählt. Liegt der neue Ort an einem anderen Standort, steht das in der Frage. „Unsortiert“ ist der Ordner, den du abarbeitest, bevor gezählt werden kann: Dort stehen die Artikel ohne festen Lagerort.' },
    { heading: 'Suchen', text: 'Das Suchfeld sucht in allem: Artikel (Name, Gebinde, Artikelnummer), Lagerorte, Standorte, Kategorien und Lieferanten. Jeder Treffer zeigt, wo er steht, zum Beispiel „Backstube › ❄ gekühlt › Kühlung 1“; ein Artikel an zwei Orten steht zweimal da. Archiviertes sucht es nicht mit, sagt aber, wie viele Treffer dort wären.' },
    { heading: 'Eine Karte bearbeiten', text: 'Einen Artikel antippen öffnet seine Karte. Oben blätterst du mit ‹ › durch den offenen Ordner (ein Artikel, der dort mehrfach steht, kommt nur einmal dran), ✕ schließt. Die Reiter der Karte: Stammdaten (Name, Kategorie, Bereich, Gebinde und Inhalt), Lagerung (feste Lagerorte, Zählart), Bezug (Lieferanten mit Artikelnummer, einer ist Standard) und Teigecke. „💾 Speichern“ schreibt genau diese Karte; vorher wird die alte Fassung automatisch gesichert. Steht oben „noch nicht gespeichert“, fragt die Seite nach, bevor du weggehst.' },
    { heading: 'Gebinde und Inhalt', text: 'Gebinde ist das, was du beim Zählen in der Hand hast: Sack, Karton, Eimer. Inhalt ist, was drin ist: 25 kg, 180 Stück. Beides zusammen steht in der Liste, zum Beispiel „Sack · 25 kg“.' },
    { heading: 'Zählart', text: '„Raster bis 24“ heißt: Beim Zählen gibt es Knöpfe zum Antippen von 0 bis 24 und einen Knopf „voll“ — gut für Säcke auf der Palette. „Zahlenfeld“ heißt: Zahl eintippen. Ein Zahlenfeld gibt es beim Zählen immer zusätzlich. Gezählt wird auf der Seite „Lager zählen“.' },
    { heading: 'Der gelbe Hinweis „Lagerort“', text: 'Gehört ein Artikel zu einer Kategorie, die Kühlung braucht, und liegt er fest an einem ungekühlten Ort, zeigt die Seite ⚠︎. Dasselbe bei TK-Ware an einem Ort ohne Tiefkühlung. Das ist nur ein Hinweis, keine Sperre — manchmal ist es richtig so. Alle Artikel mit diesem Hinweis stehen im Ordner „Prüfen“.' },
    { heading: 'Lieferanten und „bestellt bis“', text: 'Am Lieferanten hakst du die Liefertage an. Daneben steht für jeden Liefertag, bis wann bestellt sein muss: Wochentag und Uhrzeit, zum Beispiel „bis Sonntag 14:00“. Das steht am Lieferanten, nicht an jedem Artikel — ändert sich ein Tag, änderst du ihn einmal. In der Artikelkarte siehst du die Tage des Standard-Lieferanten zum Lesen.' },
    { heading: 'Teigecke', text: 'Ist ein Artikel „in der Teigecke handverwogen“, sieht ihn die Teigecke: in der Rezept-Auswahl, auf der Seite „Orte“ und im BrotTeigRechner. Name, Gebinde und Gruppe pflegst du nur hier. Auch das Zuhause (welcher Wagen) setzt du hier: im Reiter Teigecke oder über ⋯ mit „Wagen wählen …“, das wird sofort gespeichert. Dafür brauchst du die Rolle admin und den Haken 🧺 Wagen & Zutaten. Mehrere auf einmal: Ordner „Teigecke“, dort steht jeder Wagen mit seinen Zutaten und „＋ Zutaten hierher …“. Silo-Zutaten brauchen kein Zuhause. Die Wagen selbst, ihre Reihenfolge auf dem Schild und das Drucken bleiben auf der Seite Teigecke · Orte, die das Zuhause nur noch anzeigt. „Steckt in …“ zeigt, in welchen Teigen die Zutat steht und welche Brote aus diesen Teigen kommen.' },
    { heading: 'Aus der Teigecke übernehmen', text: 'Den Ordner gibt es nur, solange Zutaten der Teigecke noch nicht im Lager stehen. Einmalig: Die Zutaten, die es in der Teigecke schon gibt, kommen mit „Übernehmen“ ins Lager — mit derselben Kennung, also bleiben alle Rezepte gültig. Name, Inhalt, Gruppe und Archiv werden mitgenommen; Kategorie und Bereich bleiben offen, die trägst du danach ein. Die Teigecke selbst wird dabei nicht angefasst. Erst nach der Übernahme lässt sich ein Zuhause setzen; das ist gewollt.' },
    { heading: 'Archivieren statt löschen', text: 'Gelöscht wird nichts. Ein Standort lässt sich erst archivieren, wenn kein Lagerort mehr zu ihm gehört; ein Lagerort, wenn kein Artikel mehr fest dort liegt; eine Kategorie, wenn kein Artikel mehr dazugehört; ein Lieferant, wenn er keinen Artikel mehr liefert; ein Artikel, wenn er in keinem Teig mehr steht. Archiviertes steht im Ordner „Archiv“ und lässt sich dort über die Karte wiederherstellen.' },
    { heading: 'Wer darf was?', text: 'Sehen darf das Lager jeder mit Konto. Ändern darf nur die Rolle admin — dieselbe Regel wie bei den Produkten. Fehlt dir die Rolle, steht oben ein Hinweis, und alle Felder sind gesperrt. Zählen ist etwas anderes: dafür gibt es je Standort einen Haken in der Kontenverwaltung. Den Wagen einer Teigecke-Zutat setzt, wer Rolle admin und den Haken 🧺 Wagen & Zutaten hat.' },
    { heading: 'Wenn etwas schiefgeht', text: 'Fehler erscheinen oben in einem roten Kasten, mit der echten Meldung des Systems. „Keine Berechtigung“ heißt: keine Rolle admin, oder die Regeln in der Datenbank sind älter als diese Seite — dann steht oben zusätzlich ein roter Hinweis mit der Regeldatei, die eingesetzt werden muss. „Inzwischen von … geändert“ heißt: jemand war schneller; die Seite hat den frischen Stand geladen, deine Eingaben stehen noch da, einfach prüfen und noch einmal speichern. Ohne Netz lässt sich nichts ändern. Lässt sich beim Öffnen nicht prüfen, ob die Regeln passen (meist kein Netz), steht oben ein Satz mit dem Grund.' }
  ]
};
function renderHilfe() {
  document.getElementById('helpTitle').textContent = helpData.title;
  document.getElementById('helpContent').innerHTML = helpData.sections.map(function (s) { return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>'; }).join('');
}
document.getElementById('helpOpenBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.remove('hidden'); });
document.getElementById('helpCloseBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.add('hidden'); });
document.getElementById('helpSheet').addEventListener('click', function (e) { if (e.target === this) this.classList.add('hidden'); });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
