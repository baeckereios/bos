  Doku:  lager/LAGER_ANFORDERN_DOKU.md (dort auch der kanonische Nutzer-Hilfetext)
  Logik: lager/lager_logik.js (Liste, Bestand je Ort, Hauptort, „Bitte nachbestellen“, Druckansicht)
  Regel: RK §32, §34 (firestore_regeln_2026-11-18_namen.rules) — lager_listen/{standortId}__{a|b}{n}:
         je Standort und Art genau eine offene Liste; jede Änderung genau EIN Eintrag (letzte);
         „Abschließen“ setzt die Liste auf zu und legt im selben Vorgang die nächste offene an (Transaktion).
         Die abgeschlossene Liste IST die Buchung. Korrekturen (lager_korrekturen) nur anlegen,
         Mindestmengen (lager_mindest) mit Haken „Lager bestellen“ oder Rolle admin.
  Rechte: Haken „Lager anfordern“ je Standort (lagerAnfordernStandorte), „Lager bestellen“ (lagerBestellen);
          Rolle admin darf alles. Kachel über Registry-Feld haken: ['lagerAnfordern', 'lagerBestellen'].
  Ohne Netz: nichts ändern (Knöpfe grau mit Grund) — das Abschließen ist eine Transaktion (Bauplan §6.5).
  Drucken: erst buchen, dann BOS_DRUCK.drucken (Iframe, nie window.print). Nachdruck bucht nie.
  Name (RK §34): auf Eintrag, Abschluss und Korrektur steht der Rufname, sonst die Beschreibung der EIGENEN
          Person (frisch vor jedem Schreiben, ichFrisch → BOS_NAMEN.ichSelbst), am Stationskonto (Art „Ort“, ohne
          Person) die Notiz = der Ortsname. Dazu die Personen-Nummer (vonPerson, abgeschlossenPerson, person; Ort: null).

}
function rohText(err) { return (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err)); }
function fehlerText(kontext, err) { return kontext + ': ' + [erklaerung(err), rohText(err)].filter(Boolean).join(' · '); }
function zeigeFehler(kontext, err) {
  console.error('[Lager anfordern] ' + kontext, err);
  const li = document.createElement('li');
  li.textContent = fehlerText(kontext, err);
  const liste = document.getElementById('fehlerListe');
  liste.insertBefore(li, liste.firstChild);
  while (liste.children.length > 6) liste.removeChild(liste.lastChild);
  document.getElementById('fehlerLeiste').classList.remove('hidden');
}
window.addEventListener('error', function (e) { zeigeFehler(t('err_unbehandelt'), { message: (e.message || 'unbekannt') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')' }); });
window.addEventListener('unhandledrejection', function (e) { zeigeFehler(t('err_unbehandelt'), e.reason || { message: 'unbekannt' }); });
let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.add('hidden'); }, 3500);
}
function meldung(text, art, knopf) {
  const el = document.getElementById('meldungLeiste');
  if (!text) { el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.className = 'hinweis ' + (art || '');
  el.innerHTML = esc(text) + (knopf ? ' <button type="button" class="btn btn-outline btn-klein" data-aktion="' + esc(knopf.aktion) + '" data-id="' + esc(knopf.id) + '">' + esc(knopf.text) + '</button>' : '');
}

/* ---------- Laden ---------- */
function tsMs(ts) {
  if (ts && typeof ts.toMillis === 'function') return ts.toMillis();
  if (ts && typeof ts.seconds === 'number') return ts.seconds * 1000 + Math.floor((ts.nanoseconds || 0) / 1e6);
  return null;
}
function listeAus(d) {
  const x = d.data({ serverTimestamps: 'estimate' }) || {};
  const pos = {};
  Object.keys(x.pos || {}).forEach(function (k) { const p = x.pos[k] || {}; pos[k] = Object.assign({}, p, { tsMs: tsMs(p.ts) }); });
  return Object.assign({}, x, { id: d.id, pos: pos, abgeschlossenMs: tsMs(x.abgeschlossenAm), _am: x.abgeschlossenAm || null });
}
let abos = [], aboListen = [], aboArchiv = [];
function abo(col, ziel) {
  return window.db.collection(col).onSnapshot({ includeMetadataChanges: false }, function (snap) {
    const a = [];
    snap.forEach(function (d) {
      const x = d.data({ serverTimestamps: 'estimate' }) || {};
      if (ziel === 'stand') a.push(Object.assign({}, x, { id: d.id, tsMs: tsMs(x.ts) }));
      else a.push(Object.assign({ id: d.id }, x));
    });
    S[ziel] = a;
    S.geladenTeile[ziel] = true;
    if (ziel === 'stand') neuT0();
    planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: col }), err); S.geladenTeile[ziel] = true; if (ziel === 'stand' || ziel === 'mindest') S.bestandFehler = rohText(err); planeRender(); });
}
function abonniere() {
  abos.forEach(function (f) { f(); });
  abos = [abo(COL.standorte, 'standorte'), abo(COL.orte, 'orte'), abo(COL.artikel, 'artikel'), abo(COL.lieferanten, 'lieferanten'), abo(COL.stand, 'stand'), abo(COL.mindest, 'mindest')];
  abos.push(window.db.collection(COL.listen).where('status', '==', 'offen').onSnapshot(function (snap) {
    const a = []; snap.forEach(function (d) { a.push(listeAus(d)); });
    S.offeneAlle = a; S.geladenTeile.offen = true;
    aboArchivNeu(); planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: COL.listen }), err); S.geladenTeile.offen = true; planeRender(); }));
}
/* Buchungen seit T0 (älteste Zählung, Bauplan §3.4): abgeschlossene Listen und Korrekturen — ein Feld je Abfrage, kein Index */
function neuT0() {
  const t0 = LG.bestandAb(S.stand);
  if (t0 === S.t0 || (S.t0 !== undefined && S.t0 !== null && t0 !== null && t0 >= S.t0)) return;   /* nur weiter zurück neu abonnieren */
  S.t0 = t0;
  aboListen.forEach(function (f) { f(); }); aboListen = [];
  if (t0 === null) { S.gebucht = []; S.korrekturen = []; S.geladenTeile.gebucht = true; S.geladenTeile.korr = true; return; }
  const ab = new Date(t0 - 1);
  aboListen.push(window.db.collection(COL.listen).where('abgeschlossenAm', '>', ab).onSnapshot(function (snap) {
    const a = []; snap.forEach(function (d) { a.push(listeAus(d)); });
    S.gebucht = a; S.geladenTeile.gebucht = true; S.bestandFehler = S.bestandFehler.indexOf(COL.listen) === 0 ? '' : S.bestandFehler; planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: COL.listen + ' (gebucht)' }), err); S.bestandFehler = COL.listen + ': ' + rohText(err); S.geladenTeile.gebucht = true; planeRender(); }));
  aboListen.push(window.db.collection(COL.korrekturen).where('wirktAb', '>', ab).onSnapshot(function (snap) {
    const a = []; snap.forEach(function (d) { const x = d.data() || {}; a.push(Object.assign({ id: d.id }, x, { wirktMs: tsMs(x.wirktAb) })); });
    S.korrekturen = a; S.geladenTeile.korr = true; planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: COL.korrekturen }), err); S.bestandFehler = COL.korrekturen + ': ' + rohText(err); S.geladenTeile.korr = true; planeRender(); }));
}
/* Archiv: die zwei Listen vor der offenen (je Art), dazu ihre Korrekturen */
let archivSchluessel = '';
function aboArchivNeu() {
  const ids = [];
  ['anforderung', 'bestellung'].forEach(function (art) {
    const o = S.standortId ? LG.offeneListe(S.offeneAlle, S.standortId, art) : null;
    if (o) for (let n = o.nummer - 1; n >= Math.max(1, o.nummer - 2); n--) ids.push(LG.listeId(S.standortId, art, n));
  });
  const k = ids.join('|');
  if (k === archivSchluessel) return;
  archivSchluessel = k;
  aboArchiv.forEach(function (f) { f(); }); aboArchiv = [];
  S.archiv = {}; S.archivKorr = {};
  ids.forEach(function (id) {
    aboArchiv.push(window.db.collection(COL.listen).doc(id).onSnapshot({}, function (d) {
      if (d.exists) S.archiv[id] = listeAus(d); else delete S.archiv[id];
      planeRender();
    }, function (err) { zeigeFehler(t('err_laden', { was: id }), err); }));
    aboArchiv.push(window.db.collection(COL.korrekturen).where('listeId', '==', id).onSnapshot(function (snap) {
      const a = []; snap.forEach(function (d) { const x = d.data() || {}; a.push(Object.assign({ id: d.id }, x, { wirktMs: tsMs(x.wirktAb) })); });
      S.archivKorr[id] = a; planeRender();
    }, function (err) { zeigeFehler(t('err_laden', { was: COL.korrekturen + ' ' + id }), err); }));
  });
}
async function pruefeRegelstand() {
  try { await window.db.collection('bos_regelstand').doc(REGEL_FASSUNG).get({ source: 'server' }); S.regelstand = 'passt'; }
  catch (err) {
    S.regelstand = err && err.code === 'permission-denied' ? 'alt' : 'unbekannt';
    if (S.regelstand === 'unbekannt') { console.warn('[Lager anfordern] Regelstand nicht prüfbar:', err && err.message); S.regelGrund = rohText(err); }
  }
  const el = document.getElementById('regelLeiste');
  el.textContent = S.regelstand === 'unbekannt' ? t('regel_unbekannt', { fassung: REGEL_FASSUNG, grund: S.regelGrund || '' }) : t('regel_alt', { fassung: REGEL_FASSUNG, datei: REGEL_DATEI });
  el.classList.toggle('hidden', S.regelstand === 'passt');

}
function zeigeNetz() {
  document.getElementById('netzLeiste').textContent = t('netz_weg');
  document.getElementById('netzLeiste').classList.toggle('hidden', S.netz);
}
window.addEventListener('online', function () { S.netz = true; zeigeNetz(); planeRender(); });
window.addEventListener('offline', function () { S.netz = false; zeigeNetz(); planeRender(); });
async function start() {
  wendeI18nAn(); renderHilfe(); zeigeNetz();
  if (!window.db || !window.BOS_AUTH_READY || !LG) { zeigeFehler(t('err_laden', { was: 'Grundlagen' }), new Error('window.db, BOS_AUTH_READY oder lager_logik.js fehlt')); return; }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; } catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); }
  S.kennung = nutzer && nutzer.email ? nutzer.email.split('@')[0] : null;
  if (S.kennung) {
    try { const k = await window.db.collection('bos_accounts').doc(S.kennung).get(); S.konto = k.exists ? k.data() : null; }
    catch (err) { zeigeFehler(t('err_konto'), err); }
  }
  zeigeKonto();
  if (S.kennung) { try { await ichFrisch(); } catch (err) { zeigeFehler(t('err_name'), err); } }
  try { const w = localStorage.getItem(SPEICHER_STANDORT); if (w) S.standortId = w; } catch (e) { /* Speicher gesperrt: dann eben wählen */ }
  abonniere();
  S.geladen = true;

/* ---------- Rechte ---------- */
function konto() { return S.konto && S.konto.freigeschaltet === true ? S.konto : null; }
function istAdmin() { return !!konto() && konto().role === 'admin'; }
function darfAnfordern(sid) { const k = konto(); return !!k && (k.role === 'admin' || (Array.isArray(k.lagerAnfordernStandorte) && k.lagerAnfordernStandorte.indexOf(sid) !== -1)); }
function darfBestellen() { const k = konto(); return !!k && (k.role === 'admin' || k.lagerBestellen === true); }
function darf(art, sid) { return art === 'bestellung' ? darfBestellen() : darfAnfordern(sid); }
function erlaubte() { return LG.aktiv(S.standorte).filter(function (s) { return darfAnfordern(s.id) || darfBestellen(); }).sort(LG.nachSort); }
/* RK §34: Name FRISCH vor jedem Schreibvorgang mit Namen — Rufname, sonst Beschreibung der eigenen Person;
   Stationskonto (Art „Ort“, keine Person): Notiz = Ortsname. Ein dauerhafter Grund sperrt Eintragen, Abschließen
   und Korrektur mit Text; ein Lesefehler nicht (der nächste Versuch liest wieder frisch). → { personId, name } */
async function ichFrisch() {
  const N = window.BOS_NAMEN;
  if (!N || typeof N.ichSelbst !== 'function') throw Object.assign(new Error('bos_namen.js (ab v1.3, ichSelbst) ist nicht geladen — Seite neu laden.'), { code: 'lager/name-modul' });
  const r = await N.ichSelbst(window.db, S.kennung, { konto: S.konto, ortErlaubt: true });
  if (r.grund) {
    const dauerhaft = ['keine_person', 'mehrere', 'kein_name', 'ort_ohne_name', 'keine_kennung'].indexOf(r.grund) !== -1;
    S.ich = { grund: dauerhaft ? r.grund : '', text: r.text, name: '', personId: null };
    zeigeKonto(); planeRender();
    throw Object.assign(new Error(r.text), { code: r.grund === 'lesefehler' && r.fehler && r.fehler.code ? r.fehler.code : 'lager/name-' + r.grund });   /* Lesefehler: echter Code */
  }
  S.ich = { grund: '', text: '', name: r.name, personId: r.personId };
  zeigeKonto();
  return { personId: r.personId, name: r.name };
}
function grundName() { return S.ich && S.ich.grund ? S.ich.text : ''; }
function zeigeKonto() {
  const el = document.getElementById('kontoZeile');
  if (!S.kennung) { el.textContent = t('kein_konto'); return; }
  el.textContent = S.ich.name || S.ich.text || '…';
}
/* wie sperrGrund, dazu der Name (Eintrag, Abschluss, Korrektur tragen einen Namen) */
function sperrGrundName(art) { return sperrGrund(art) || grundName(); }
/* Warum geht Schreiben gerade nicht? '' = es geht */
function sperrGrund(art) {
  if (!darf(art, S.standortId)) return t('grund_recht');
  if (!S.netz) return t('grund_netz');
  if (S.regelstand === 'alt') return t('grund_regel');
  return '';
}

/* ---------- Standort ---------- */
function waehle(id) {
  S.standortId = id; S.reiter = 'liste'; meldung('');
  try { if (id) localStorage.setItem(SPEICHER_STANDORT, id); else localStorage.removeItem(SPEICHER_STANDORT); } catch (e) { /* egal */ }
  aboArchivNeu();
  planeRender();
}
function standort() { return LG.nachId(S.standorte)[S.standortId] || null; }
function om() { return LG.nachId(LG.aktiv(S.orte)); }
function am() { return LG.nachId(S.artikel); }
function offen(art) { return S.standortId && S.offeneAlle ? LG.offeneListe(S.offeneAlle, S.standortId, art) : null; }

/* Erste Liste eines Standorts (Nummer 1) anlegen, wenn es noch keine gibt — in einer Transaktion */
function sorgeFuerListe(art) {
  const sid = S.standortId, schl = sid + '|' + art;
  if (!sid || !S.offeneAlle || offen(art) || S.anlegen[schl] || sperrGrund(art) || S.regelstand !== 'passt') return;
  S.anlegen[schl] = true;
  const db = window.db, ref = db.collection(COL.listen).doc(LG.listeId(sid, art, 1));
  db.runTransaction(function (tx) {
    return tx.get(ref).then(function (s) { if (!s.exists) tx.set(ref, LG.neueListeDokument(art, sid, 1)); });
  }).catch(function (err) { zeigeFehler(t('err_anlegen') + ' (' + ART_TEXT[art] + ' 1)', err); });
}

/* ---------- Bestand ---------- */
function bestandDaten(extraListe) {
  return { artikel: S.artikel, orte: S.orte, standorte: S.standorte, lieferanten: S.lieferanten, stand: S.stand,
    listen: S.gebucht.concat(extraListe ? [extraListe] : []).filter(function (l, i, a) { return a.map(function (x) { return x.id; }).indexOf(l.id) === i; }),
    korrekturen: S.korrekturen, mindest: S.mindest };
}
function bestandJetzt(extraListe) {
  if (S.bestandFehler) return { fehler: S.bestandFehler };
  try { const d = bestandDaten(extraListe); const b = LG.bestand(d, S.standortId); return { b: b, nb: LG.nachbestellen(b, d) }; }
  catch (err) { zeigeFehler(t('err_bestand'), err); return { fehler: rohText(err) }; }
}

/* ---------- Schreiben: ein Eintrag (RK §32: genau ein Schlüssel in pos, genannt in letzte) ---------- */
async function schreibeEintrag(liste, posId, eintrag) {
  const db = window.db, ref = db.collection(COL.listen).doc(liste.id), upd = { letzte: posId };
  upd['pos.' + posId] = eintrag ? Object.assign(LG.eintragDokument(eintrag), { ts: firebase.firestore.FieldValue.serverTimestamp() }) : firebase.firestore.FieldValue.delete();
  S.schreibt = true; planeRender();
  try { await ref.update(upd); return true; }
  catch (err) {
    zeigeFehler(t('err_eintrag') + ' (' + ART_TEXT[liste.art] + ' ' + liste.nummer + ')', err);
    if (eintrag) setzeSheetMeldung(fehlerText(t('err_eintrag'), err));
    return false;
  } finally { S.schreibt = false; planeRender(); }
}

/* ---------- Abschließen: Transaktion (Liste zu + nächste offen), erst danach drucken ---------- */
async function abschliessen(art) {
  const l = offen(art); if (!l) return;
  const db = window.db, sid = S.standortId, ref = db.collection(COL.listen).doc(l.id), naechste = db.collection(COL.listen).doc(LG.listeId(sid, art, l.nummer + 1));
  let ergebnis = null, ich = null;
  S.schreibt = true; schliesseSheet(); planeRender();
  try {
    ich = await ichFrisch();   /* vor der Transaktion: darin geht keine Abfrage (RK §34) */
    await db.runTransaction(function (tx) {
      return tx.get(ref).then(function (s) {
        if (!s.exists) throw Object.assign(new Error(ART_TEXT[art] + ' ' + l.nummer + ' gibt es nicht'), { code: 'bos/fehlt' });
        const x = listeAus(s);
        if (x.status !== 'offen') { ergebnis = { schonZu: true, liste: x }; return; }
        if (!Object.keys(x.pos || {}).length) throw Object.assign(new Error(t('grund_leer')), { code: 'bos/leer' });
        tx.update(ref, Object.assign(LG.abschlussFelder(S.kennung, ich.name, ich.personId), { abgeschlossenAm: firebase.firestore.FieldValue.serverTimestamp() }));
        tx.set(naechste, LG.neueListeDokument(art, sid, l.nummer + 1));
        ergebnis = { schonZu: false, liste: x };
      });
    });
  } catch (err) {
    zeigeFehler(t('err_abschluss') + ' (' + ART_TEXT[art] + ' ' + l.nummer + ')', err);
    meldung(fehlerText(t('err_abschluss'), err) + ' — nichts gebucht, nichts gedruckt.', 'rot');
    S.schreibt = false; planeRender(); return;
  }
  S.schreibt = false;
  if (ergebnis.schonZu) {
    meldung(t('gerade_zu', { art: ART_TEXT[art], n: l.nummer, name: ergebnis.liste.abgeschlossenName || '?' }), 'warn',
      art === 'anforderung' ? { aktion: 'nachdruck', id: l.id, text: t('nachdrucken') } : null);
    planeRender(); return;
  }
  /* Abschlusszeit vom Server holen (für Ausdruck und „nach dieser Liste“); misslingt das, Gerätezeit mit Vermerk */
  let gebucht = Object.assign({}, ergebnis.liste, { status: 'zu', abgeschlossenVon: S.kennung, abgeschlossenPerson: ich.personId, abgeschlossenName: ich.name, abgeschlossenMs: Date.now() }), zeitVermerk = ' (Gerätezeit)';
  try { const s2 = await ref.get(); if (s2.exists) { gebucht = listeAus(s2); zeitVermerk = ''; } }
  catch (err) { console.warn('[Lager anfordern] Abschlusszeit nicht gelesen:', rohText(err)); }
  if (art === 'anforderung') {
    meldung(t('abgeschlossen_ok', { art: ART_TEXT[art], n: l.nummer, m: l.nummer + 1 }), 'gut', { aktion: 'nachdruck', id: l.id, text: t('nachdrucken') });
    drucke(gebucht, false, zeitVermerk);
  } else meldung(t('gebucht_ok', { n: l.nummer, m: l.nummer + 1 }), 'gut');
  planeRender();
}
function zeitText(ms) {
  if (typeof ms !== 'number') return '';
  try { return new Intl.DateTimeFormat('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }).format(new Date(ms)); }
  catch (e) { return new Date(ms).toLocaleString('de-DE'); }
}
function zeitKurz(ms) {
  if (typeof ms !== 'number') return '';
  try { return new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' }).format(new Date(ms)); }
  catch (e) { return new Date(ms).toLocaleString('de-DE'); }
}
/* Druck: Ausdruck = genau die gebuchte Liste. nachdruck: bucht nichts, „Bitte nachbestellen“ mit dem Stand jetzt. */
function drucke(liste, nachdruck, zeitVermerk) {
  try {
    const bj = bestandJetzt(nachdruck ? null : liste);
    const html = LG.druckHTML(liste, { artikel: S.artikel, orte: S.orte }, {
      standortName: (standort() || {}).name || '', zeitText: zeitText(liste.abgeschlossenMs) + (zeitVermerk || ''), name: liste.abgeschlossenName || '',
      nachdruck: !!nachdruck, nb: bj.nb || null, bestandFehler: bj.fehler || ''
    });
    if (!window.BOS_DRUCK || typeof window.BOS_DRUCK.drucken !== 'function') throw Object.assign(new Error('bos_druck.js nicht geladen — Seite neu laden, dann „Nachdrucken“'), { code: 'bos/skripte' });
    window.BOS_DRUCK.drucken({ inhaltHTML: html, appName: 'Lager anfordern', titel: ART_TEXT[liste.art] + ' ' + liste.nummer, mitKopf: false, farbig: false, ausrichtung: 'portrait', extraCSS: LG.DRUCK_CSS });
  } catch (err) { zeigeFehler(t('err_drucken'), err); meldung(fehlerText(t('err_drucken'), err) + ' — die Liste ist trotzdem gebucht. „Nachdrucken“ versucht es nochmal.', 'rot', { aktion: 'nachdruck', id: liste.id, text: t('nachdrucken') }); }
}

/* ---------- Korrektur (Fehlmeldung, Rücknahme) ---------- */
async function speichereKorrektur(liste, posId, nur) {
  const k = LG.korrekturDokument(liste, posId, nur);
  if (!k) return false;
  let ich;
  try { ich = await ichFrisch(); } catch (err) { zeigeFehler(t('err_korrektur'), err); setzeSheetMeldung(fehlerText(t('err_korrektur'), err)); return false; }
  const doc = Object.assign(k, { wirktAb: liste._am, konto: S.kennung, person: ich.personId, name: ich.name, ts: firebase.firestore.FieldValue.serverTimestamp() });
  try { await window.db.collection(COL.korrekturen).doc(LG.korrekturId(liste.id, posId)).set(doc); return true; }
  catch (err) { zeigeFehler(t('err_korrektur'), err); setzeSheetMeldung(fehlerText(t('err_korrektur'), err)); return false; }
}
/* ---------- Mindestmenge ---------- */
async function speichereMindest(artikelId, menge, knopf) {
  const d = Object.assign(LG.mindestDokument(artikelId, S.standortId, menge), { geaendertVon: S.kennung, geaendertAm: firebase.firestore.FieldValue.serverTimestamp() });
  if (knopf) knopf.disabled = true;
  try { await window.db.collection(COL.mindest).doc(LG.mindestId(artikelId, S.standortId)).set(d); delete S.mindEingabe[artikelId]; toast(t('mind_gespeichert')); planeRender(); }
  catch (err) { zeigeFehler(t('err_mindest'), err); }
  finally { if (knopf) knopf.disabled = false; }
}

/* ---------- Sheets ---------- */
function oeffneSheet(html, info) { S.sheet = info || { art: 'info' }; document.getElementById('sheetInhalt').innerHTML = html; document.getElementById('sheet').classList.remove('hidden'); }
function schliesseSheet() { S.sheet = null; document.getElementById('sheet').classList.add('hidden'); document.getElementById('sheetInhalt').innerHTML = ''; }
function setzeSheetMeldung(text) { const el = document.querySelector('#sheetInhalt .meldung'); if (el) el.textContent = text; }
document.getElementById('sheet').addEventListener('click', function (e) { if (e.target === this) schliesseSheet(); });

/* Auswahl: Artikel des Standorts nach Hauptort (Rundgang), Suche über alle aktiven Artikel */
function auswahlHTML(art, such, alle) {
  const sid = S.standortId, orte = om(), n = LG.norm(such);

  if (!S.geladen) return;

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (ev) {
  const r = ev.target.closest('[data-reiter]');
  if (r) { S.reiter = r.getAttribute('data-reiter'); planeRender(); return; }
  const el = ev.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id');
  if (a === 'auswahl') oeffneAuswahl(id);
  else if (a === 'auswahl-alle') { if (S.sheet) S.sheet.alle = true; document.getElementById('auswahlListe').innerHTML = auswahlHTML(S.sheet.listenArt, document.getElementById('suchFeld').value, true); }
  else if (a === 'waehle-artikel') oeffneMenge(S.sheet.listenArt, id, null);
  else if (a === 'eintrag-aendern') {
    const art = el.getAttribute('data-art'), l = offen(art), p = l && l.pos[id];
    if (p) oeffneMenge(art, p.artikelId, id); else toast(t('liste_keine'));
  }
  else if (a === 'minus' || a === 'plus') {
    const f = document.getElementById('mengeFeld'), m = LG.mengeAus(f.value);
    const neu = (isFinite(m) ? m : 0) + (a === 'plus' ? 1 : -1);
    f.value = LG.mengeText(Math.max(1, Math.min(LG.GRENZEN.mengeMax, Math.round(neu * 10) / 10)));
  }
  else if (a === 'eintrag-speichern') eintragSpeichern();
  else if (a === 'eintrag-loeschen') { const s = S.sheet, l = offen(s.listenArt); if (l && !sperrGrund(s.listenArt)) schreibeEintrag(l, s.posId, null).then(function (ok) { if (ok) schliesseSheet(); }); }
  else if (a === 'abschluss') oeffneAbschluss(id);
  else if (a === 'ja-abschliessen') abschliessen(id);
  else if (a === 'nachdruck') { const l = S.archiv[id] || (S.gebucht || []).filter(function (x) { return x.id === id; })[0]; if (l) drucke(l, true, ''); else zeigeFehler(t('err_drucken'), { code: 'bos/fehlt', message: 'Liste ' + id + ' ist noch nicht geladen — gleich nochmal versuchen' }); }
  else if (a === 'korrektur') oeffneKorrektur(el.getAttribute('data-liste'), id);
  else if (a === 'korr-speichern') korrekturSpeichern();
  else if (a === 'mindest') {
    const f = document.querySelector('[data-mindest="' + CSS.escape(id) + '"]'), m = LG.mengeAus(f.value === '' ? '0' : f.value);
    if (!LG.mindestGueltig(m)) { zeigeFehler(t('err_mindest'), { code: 'bos/eingabe', message: t('mind_falsch', { max: LG.GRENZEN.mindestMax }) }); return; }
    speichereMindest(id, m, el);
  }
  else if (a === 'sheet-zu') schliesseSheet();
});
document.addEventListener('input', function (ev) { const f = ev.target.closest && ev.target.closest('[data-mindest]'); if (f) S.mindEingabe[f.getAttribute('data-mindest')] = f.value; });
document.getElementById('wahl').addEventListener('click', function (ev) { const b = ev.target.closest('[data-standort]'); if (b) waehle(b.getAttribute('data-standort')); });
document.getElementById('wechselBtn').addEventListener('click', function () { waehle(null); });
document.getElementById('fehlerZuBtn').addEventListener('click', function () { document.getElementById('fehlerLeiste').classList.add('hidden'); document.getElementById('fehlerListe').innerHTML = ''; });

/* ---------- Halb eingegebene Menge melden (Checkliste §7b) ---------- */
(function (pruef) {
  if (window.BOS_UNGESPEICHERT) { window.BOS_UNGESPEICHERT.melde(pruef); return; }
  window.addEventListener('beforeunload', function (e) { if (pruef()) { e.preventDefault(); e.returnValue = ''; } });
})(function () {
  if (S.schreibt || Object.keys(S.mindEingabe).length) return true;
  const s = S.sheet; if (!s) return false;
  const f = document.getElementById(s.art === 'korrektur' ? 'nurFeld' : 'mengeFeld');
  return !!f && (s.art === 'menge' || s.art === 'korrektur') && f.value !== s.start;
});

/* ---------- Hilfe (Checkliste §7; kanonische Fassung in LAGER_ANFORDERN_DOKU.md) ---------- */
const helpData = {
  title: 'Lager anfordern — was ist das hier?',
  sections: [
    { heading: 'Wofür ist diese Seite?', text: 'Sie ersetzt den Zettel. Wer etwas aus dem Lager braucht, schreibt es auf die offene Liste, in Gebinden: Sack, Karton, Eimer. Wer die Liste abholt, drückt „Abschließen und drucken“. Dann wird alles genau einmal vom Bestand abgebucht und gedruckt, und eine neue, leere Liste ist sofort offen.' },
    { heading: 'Standort', text: 'Oben steht der Standort, für den die Liste gilt. Darfst du an mehreren anfordern, wählst du ihn am Anfang; „Standort wechseln“ bringt dich zurück. Wer wo anfordern darf, steht in der Kontenverwaltung.' },
    { heading: 'Anfordern', text: '„＋ Anfordern“ öffnet die Auswahl, nach Lagerorten sortiert, mit Suche. Artikel antippen, Menge mit − und ＋ oder ins Feld tippen (halbe mit Komma), „Auf die Liste“. Am Eintrag steht, wo der Artikel liegt („→ Regal 1“) und wer ihn eingetragen hat.' },
    { heading: 'Liegt an mehreren Orten?', text: 'Dann steht beim Eintragen eine Auswahl der Lagerorte da. Vorgabe ist der Hauptort, das ist der erste Ort in der Artikelkarte des Lagers. Wird die Ware woanders genommen, stell hier den richtigen Ort ein — danach rechnet BOS den Bestand je Ort.' },
    { heading: 'Ändern und löschen', text: 'Mit ✎ am Eintrag änderst du Menge oder Ort, „Löschen“ nimmt ihn von der Liste. Wie beim Zettel darf das jeder, der anfordern darf. Auf der Liste steht danach dein Name.' },
    { heading: 'Abschließen und drucken', text: 'Nach der Rückfrage wird die Liste abgeschlossen und gebucht, dann druckt der Drucker. Hat jemand anderes im selben Moment abgeschlossen, steht oben „hat eben … abgeschlossen“ — gebucht wird trotzdem nur einmal. Kommt kein Papier, „Nachdrucken (bucht nicht)“.' },
    { heading: 'Der Ausdruck', text: 'Je Lagerort die Artikel mit Kästchen zum Abhaken. Darunter „Bitte nachbestellen“ mit allem, was nach dieser Liste unter der Mindestmenge liegt, und „Noch nie gezählt“ für Artikel mit Mindestmenge, die noch keine Zählung haben.' },
    { heading: 'Archiv und „fehlte“', text: 'Im Archiv stehen die zwei letzten Listen. Fehlte etwas oder war es weniger, tippst du am Eintrag „fehlte / nur … statt …“ und trägst ein, was wirklich genommen wurde (0 = fehlte ganz). Das wird zurückgebucht. Je Eintrag geht das einmal.' },
    { heading: 'Bestellen und Mindestmengen', text: 'Mit dem Haken „Lager bestellen“ gibt es zwei Reiter mehr. „Bestellen“: eintragen, was beim Lieferanten bestellt ist, dann „Bestellung buchen“ — es zählt sofort zum Bestand. Im Archiv darunter nimmst du eine Position zurück oder trägst ein, was wirklich kam. „Mindestmengen“: je Artikel die Menge, unter der er auf „Bitte nachbestellen“ kommt.' },
    { heading: 'Ohne Netz und Fehler', text: 'Ohne Verbindung kannst du die Liste ansehen, aber nichts ändern — die Knöpfe sind grau und sagen warum. Fehler stehen oben im roten Kasten, mit der echten Meldung. „Keine Berechtigung“ heißt meistens: kein Haken für diesen Standort, oder die Liste wurde gerade abgeschlossen.' }
  ]
};
function renderHilfe() {
  document.getElementById('helpTitle').textContent = helpData.title;
  document.getElementById('helpContent').innerHTML = helpData.sections.map(function (s) { return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>'; }).join('');
}
document.getElementById('helpOpenBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.remove('hidden'); });
document.getElementById('helpCloseBtn').addEventListener('click', function () { document.getElementById('helpSheet').classList.add('hidden'); });
document.getElementById('helpSheet').addEventListener('click', function (e) { if (e.target === this) this.classList.add('hidden'); });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
