<style>
  body { padding-bottom: 100px; margin: 0; background: var(--bos-bg); }

  .nfc-header { background:var(--bos-surface); border-bottom:1px solid var(--bos-border); padding:14px 16px; position: sticky; top: 0; z-index: 100; }
  .nfc-header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .nfc-title  { font-family:var(--bos-font-display); font-weight:900; font-size:1.3rem; color:var(--bos-text); line-height:1.1; }
  .nfc-sub    { font-family:var(--bos-font-label); font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--bos-text-dim); margin-top:3px; }
  .nfc-back   { font-family:var(--bos-font-label); font-weight:800; font-size:0.72rem; color:var(--bos-text-dim); text-decoration:none; white-space:nowrap; padding-top:4px; -webkit-tap-highlight-color:transparent; }
  .nfc-back:active { color:var(--bos-amber); }

  .brain-status { padding:8px 16px; text-align:center; font-size:0.75rem; font-family:var(--bos-font-label); font-weight:700; letter-spacing:0.5px; border-bottom:2px solid var(--bos-border); }
  .brain-status.loading { color:var(--bos-amber); background:color-mix(in srgb, var(--bos-amber) 6%, transparent); }
  .brain-status.ready   { color:var(--bos-green);  background:rgba(77,184,122,0.06); }
  .brain-status.error   { color:var(--bos-red);    background:rgba(201,74,74,0.06); }

  .froster-bar { padding:9px 16px; border-bottom:2px solid var(--bos-border); }
  .froster-bar-inner { max-width:600px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .froster-label { font-family:var(--bos-font-label); font-weight:900; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--bos-text-dim); flex-shrink:0; }
  .f-toggle { flex:1; display:flex; gap:6px; }
  .f-btn { flex:1; padding:8px 6px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); border-radius:10px; font-family:var(--bos-font-label); font-weight:900; font-size:0.78rem; color:var(--bos-text-dim); cursor:pointer; -webkit-tap-highlight-color:transparent; transition:0.15s; }
  .f-btn.yes.active { border-color:var(--bos-green); background:rgba(77,184,122,0.1); color:var(--bos-green); }
  .f-btn.no.active  { border-color:var(--bos-warn, var(--bos-amber)); background:color-mix(in srgb, var(--bos-warn, var(--bos-amber)) 10%, transparent); color:var(--bos-warn, var(--bos-amber)); }

  .settings-bar { padding:7px 16px; border-bottom:2px solid var(--bos-border); }
  .settings-bar-inner { max-width:600px; margin:0 auto; display:flex; align-items:center; gap:10px; }
  .settings-label { display:flex; align-items:center; gap:7px; cursor:pointer; font-family:var(--bos-font-label); font-weight:900; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.8px; color:var(--bos-text-dim); }
  .settings-label input[type=checkbox] { width:15px; height:15px; accent-color:var(--bos-amber); }

  .container { max-width:600px; margin:0 auto; padding:12px; }

  .prod-card { background:var(--bos-surface); border:2px solid var(--bos-border); border-radius:18px; margin-bottom:14px; overflow:hidden; box-shadow:0 3px 12px var(--bos-shadow-sm); }
  .prod-card::before { content:''; display:block; height:3px; background:var(--bos-border-strong); transition:background 0.3s; }
  .prod-card.ok::before        { background:linear-gradient(90deg,var(--bos-green),rgba(77,184,122,0.1)); }
  .prod-card.warn::before      { background:linear-gradient(90deg,var(--bos-red),rgba(201,74,74,0.1)); }
  .prod-card.knapp-card::before{ background:linear-gradient(90deg,var(--bos-warn, var(--bos-amber)),color-mix(in srgb, var(--bos-warn, var(--bos-amber)) 10%, transparent)); }

  .prod-name   { font-family:var(--bos-font-display); font-weight:900; font-size:1.05rem; padding:11px 14px 2px; color:var(--bos-text); }
  .prod-status { font-family:var(--bos-font-label); font-size:0.68rem; font-weight:700; color:var(--bos-text-dim); padding:0 14px 8px; }
  .prod-status.ok    { color:var(--bos-green); }
  .prod-status.err   { color:var(--bos-red); }
  .prod-status.knapp { color:var(--bos-warn, var(--bos-amber)); }
  .verlaesslich-hint { font-family:var(--bos-font-label); font-size:0.65rem; font-weight:800; padding:0 14px 8px; }

  .bestand-row { display:flex; align-items:center; gap:8px; padding:2px 14px 10px; flex-wrap:wrap; }
  .bestand-label { font-family:var(--bos-font-label); font-weight:900; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.8px; color:var(--bos-text-dim); }
  .bestand-input { width:64px; padding:4px 6px; border-radius:8px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); color:var(--bos-text); font-family:var(--bos-font-display); font-weight:900; font-size:0.95rem; text-align:center; }
  .bestand-unit { font-family:var(--bos-font-label); font-size:0.65rem; font-weight:700; color:var(--bos-text-dim); }
  .bestand-hint { font-family:var(--bos-font-label); font-size:0.65rem; font-weight:700; color:var(--bos-warn, var(--bos-amber)); overflow-wrap:anywhere; }
  .bestand-hint a { color:var(--bos-warn, var(--bos-amber)); text-decoration:underline; }
  .bestand-row.warn .bestand-input { border-color:var(--bos-red); }

  .section { padding:0 12px 10px; }
  .slabel { font-family:var(--bos-font-label); font-weight:900; font-size:0.62rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--bos-amber); margin-bottom:5px; }

  .day-row { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .day-btn { height:50px; border-radius:10px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; -webkit-tap-highlight-color:transparent; transition:all 0.12s; user-select:none; padding:0; }
  .day-btn .db-icon { font-size:1rem; line-height:1; display:block; min-height:1rem; }
  .day-btn .db-day  { font-family:var(--bos-font-label); font-weight:900; font-size:0.72rem; color:var(--bos-text-dim); line-height:1; }
  .day-btn .db-date { font-family:var(--bos-font-label); font-weight:700; font-size:0.55rem; color:var(--bos-text-dim); opacity:0.55; }
  .day-btn.on { background:color-mix(in srgb, var(--bos-amber) 10%, transparent); border-color:var(--bos-amber); }
  .day-btn.on .db-day  { color:var(--bos-amber); }
  .day-btn.on .db-date { opacity:0.8; color:var(--bos-amber); }
  .day-btn.disabled { opacity:0.22; cursor:not-allowed; }
  .day-btn.ist-zu { opacity:0.35; }
  .day-btn:not(.disabled):active { transform:scale(0.88); }

  .ziel-row { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .ziel-btn { height:50px; border-radius:9px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; -webkit-tap-highlight-color:transparent; transition:all 0.12s; padding:0; }
  .ziel-btn .z-day  { font-family:var(--bos-font-label); font-weight:900; font-size:0.74rem; color:var(--bos-text-dim); line-height:1; }
  .ziel-btn .z-date { font-family:var(--bos-font-label); font-weight:700; font-size:0.56rem; color:var(--bos-text-dim); opacity:0.6; }
  .ziel-btn.on { background:var(--bos-amber); border-color:var(--bos-amber); }
  .ziel-btn.on .z-day  { color:white; }
  .ziel-btn.on .z-date { color:rgba(255,255,255,0.85); opacity:1; }
  .ziel-btn:active { transform:scale(0.88); }

  /* ── VORSCHLAG-FELDER ── */
  .vorschlag-wrap { border-top:1.5px solid var(--bos-border-strong); padding:10px 12px 4px; }
  .card-gleichm { display:flex; align-items:center; gap:6px; padding:0 14px 8px; cursor:pointer; font-family:var(--bos-font-label); font-weight:800; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--bos-text-dim); -webkit-tap-highlight-color:transparent; }
  .card-gleichm input[type=checkbox] { width:14px; height:14px; accent-color:var(--bos-amber); }
  .vorschlag-hint { font-family:var(--bos-font-label); font-size:0.68rem; font-weight:700; color:var(--bos-green); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
  .inline-warn { font-family:var(--bos-font-label); font-size:0.7rem; font-weight:700; padding:5px 8px; border-radius:8px; margin-bottom:6px; }
  .inline-warn.luecke { background:rgba(201,74,74,0.1); color:var(--bos-red); }
  .inline-warn.knapp  { background:color-mix(in srgb, var(--bos-warn, var(--bos-amber)) 10%, transparent); color:var(--bos-warn, var(--bos-amber)); }
  .hint-right { font-weight:700; color:var(--bos-text-dim); font-size:0.65rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }

  .vd-grid { display:grid; gap:8px; }
  .vd-grid.cols-1 { grid-template-columns:1fr; }
  .vd-grid.cols-2 { grid-template-columns:1fr 1fr; }
  .vd-grid.cols-3 { grid-template-columns:1fr 1fr 1fr; }

  .vday-cell { background:var(--bos-surface-raised); border-radius:12px; padding:8px 8px 6px; border:1.5px solid var(--bos-border-strong); }
  .vday-cell.is-auto   { border-color:var(--bos-amber);  background:color-mix(in srgb, var(--bos-amber) 5%, transparent); }
  .vday-cell.is-soft   { border-color:#60a5fa; border-style:dashed; background:rgba(96,165,250,0.06); }   /* 15.10.2026 (#72 F12): „von Hand“ an der Form erkennbar, nicht nur am Blau (Profil Stahl) */
  .vday-cell.is-locked { border-color:var(--bos-green);  background:rgba(77,184,122,0.06); }
  .vday-cell.is-warn   { border-color:var(--bos-red) !important; background:rgba(201,74,74,0.06) !important; }

  .vday-label { font-family:var(--bos-font-label); font-weight:900; font-size:0.72rem; color:var(--bos-text-dim); text-align:center; margin-bottom:4px; }
  .vday-label span { font-size:0.58rem; opacity:0.7; }
  .vday-input { width:100%; height:44px; border:none; background:transparent; color:var(--bos-text); font-family:var(--bos-font-display); font-weight:900; font-size:1.6rem; text-align:center; box-sizing:border-box; outline:none; padding:0; }
  .vday-input.is-soft   { color:#60a5fa; }   /* 15.10.2026: dunkel wie der Rahmen (vorher #1d4ed8, Kontrast 2,3) */
  html[data-theme="light"] .vday-input.is-soft { color:#1d4ed8; }
  .vday-input.is-locked { color:var(--bos-green); }

  .vday-footer { display:flex; align-items:center; justify-content:space-between; margin-top:3px; }
  .vday-min       { font-family:var(--bos-font-label); font-size:0.6rem; font-weight:700; color:var(--bos-text-dim); opacity:0.65; }
  .vday-min.warn  { color:var(--bos-red); opacity:1; }
  .vday-lock { background:none; border:none; cursor:pointer; font-size:0.8rem; opacity:0.28; padding:0; -webkit-tap-highlight-color:transparent; }

<script>
var STATION_CFG  = 'Frühschicht';
var heute        = new Date(); heute.setHours(0,0,0,0);
var WT_KURZ      = ['Mo','Di','Mi','Do','Fr','Sa','So'];
var WT_LANG      = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];

// ── Planungswoche (Fix 05.09.2026, Ulf) ─────────────────────────────
// Vorher war "wochenMo" schlicht der Montag der Kalenderwoche, die HEUTE
// enthält. Das Planungsfenster läuft aber Fr 00:01–Di 23:59 (siehe
// naechsterDienstag()/planungsfenster() weiter unten) — an einem Fr/Sa/So
// war "diese Kalenderwoche" damit faktisch schon vorbei, obwohl genau dann
// die KOMMENDE Woche geplant werden soll. Kollegen konnten freitags keine
// Produktionstage für die nächste Woche mehr auswählen (nur noch Fr/Sa der
// zu Ende gehenden Woche). Siehe SESSION_2026-09-05_PRODUKTIONSPLANER_
// WOCHENANKER_FIX.md.
// planWocheMontag() verankert die Zielwoche stattdessen robust am
// Planungsfenster selbst: Montag der Planungswoche = der Tag vor dem
// Dienstag, an dem das aktuell laufende Fenster schließt. Das liefert an
// jedem Wochentag innerhalb des Fensters (Fr–Di) dieselbe, korrekte Woche.
// naechsterDienstag() ist eine Funktionsdeklaration (weiter unten im
// selben Script) und dank Hoisting hier bereits nutzbar.
function planWocheMontag(von) {
  var mo = naechsterDienstag(von);
  mo.setDate(mo.getDate() - 1);
  mo.setHours(0, 0, 0, 0);
  return mo;
}
var wochenMo = planWocheMontag(heute);   // Montag der Planungswoche ("Produktionstage")

// 03.09.2026 — Kurskorrektur gegenüber der ursprünglichen Annahme "weiches
// Ende"). Dieselbe Berechnung wie in uebersicht.html, dort auch für den
// Countdown genutzt — bewusst dupliziert (kein Modul-System, jede Seite
// bleibt eigenständig), nicht als gemeinsame Datei ausgelagert.
function naechsterDienstag(von) {
  var d = new Date(von);
  var tag = (d.getDay() + 6) % 7;
  var diff = (2 - 1 - tag + 7) % 7;
  d.setDate(d.getDate() + diff);
  d.setHours(23, 59, 0, 0);
  if (d < von) d.setDate(d.getDate() + 7);
  return d;
}
function planungsfenster(von) {
  var ende = naechsterDienstag(von);
  var start = new Date(ende);
  start.setDate(start.getDate() - 4);
  start.setHours(0, 1, 0, 0);
  return { start: start, ende: ende, offen: von >= start && von <= ende };
}

// ── BESTELLUNGEN LADEN (08.11.2026) ─────────────────────────────────
// Planungsspanne: Fr vor der Planungswoche … So der Woche danach (17 Tage).
// Gleichheits-Filter + `in`, ohne orderBy (Doku §10). Braucht Firestore doch
// einen Index, steht der Link im Hinweis oben (fehlertextMitLink).
function planungsSpanneStation() { return BR.planungsSpanne(wochenMo); }
// Antwortet die Datenbank gar nicht (kein Netz, kein Zwischenspeicher), lädt die Seite
// nach ANTWORT_MS trotzdem weiter: Bestellungen gelten als nicht geladen, Einreichen
// ist gesperrt. Kommt die Antwort später, verschwindet die Sperre von selbst.
var ANTWORT_MS = 10000;
var KEINE_ANTWORT = 'keine Antwort der Datenbank nach 10 Sekunden — Netz prüfen. Sobald die Bestellungen ankommen, ist das Einreichen wieder frei.';
function starteBestellungen(db) {
  return new Promise(function (fertig) {
    var erste = true;
    function einmal() { if (erste) { erste = false; fertig(); } }
    setTimeout(function () {
      if (!erste) return;
      BESTELL_STAND = { geladen: false, fehler: KEINE_ANTWORT };
      einmal();
    }, ANTWORT_MS);
    try {
      BESTELL_ABMELDEN = db.collection('bos_events')
        .where('type', '==', BR.TYP)
        .where('station', '==', STATION_CFG)
        .where('datum', 'in', planungsSpanneStation())
        .onSnapshot(function (snap) {
          var neu = [];
          snap.forEach(function (doc) { var d = doc.data(); d.id = doc.id; neu.push(d); });
          neu = BR.sortiere(neu);
          var vorher = JSON.stringify(BESTELLUNGEN.map(function (b) { return [b.id, b.datum, b.menge, b.notiz, b.legacyKey, BR.alsMillis(b.ts)]; }));
          var jetzt = JSON.stringify(neu.map(function (b) { return [b.id, b.datum, b.menge, b.notiz, b.legacyKey, BR.alsMillis(b.ts)]; }));
          BESTELLUNGEN = neu;
          var warFehler = !!BESTELL_STAND.fehler;
          BESTELL_STAND = { geladen: true, fehler: null };
          if (!erste && (vorher !== jetzt || warFehler)) { recalcAll(); renderSeitenHinweise(); }
          einmal();
        }, function (e) {
          console.error('[Station] Bestellungen:', e);
          BESTELL_STAND = { geladen: false, fehler: fehlerGrund(e) + (e && e.code && String(e.message || '').indexOf(e.code) < 0 ? ' (' + e.code + ')' : '') };
          if (!erste) { recalcAll(); renderSeitenHinweise(); }
          einmal();
        });
    } catch (e) {
      console.error('[Station] Bestellungen (Abfrage):', e);
      BESTELL_STAND = { geladen: false, fehler: fehlerGrund(e) };
      einmal();
    }
  });
}
// 09.11.2026 (Schritt 4): zwei zusätzliche Live-Abfragen nur für die Positionszahl der Aufträge.
// Ändert sich eine Zahl, werden nur die Karten mit einer Bestellung dieses Auftrags neu gebaut.
function starteAuftragsZaehlung(db) {
  if (typeof BR.positionenJeAuftrag !== 'function') { AUFTRAG_POS.fehler = 'bestell_regeln.js ist alt geladen (ohne Aufträge) — App schließen und neu öffnen'; return; }
  function neuZaehlen() {
    var alt = AUFTRAG_POS.zahl;
    AUFTRAG_POS.zahl = BR.positionenJeAuftrag(AUFTRAG_POS.bestellungen, AUFTRAG_POS.sonstige);
    var geaendert = {};
    BESTELLUNGEN.forEach(function (b) { if (b.auftragId && alt[b.auftragId] !== AUFTRAG_POS.zahl[b.auftragId]) geaendert[b.legacyKey] = true; });
    PRODUKTE.forEach(function (p) { if (geaendert[p.legacyKey]) rebuildCard(p.bosId); });
  }
  function fehler(e) {
    console.error('[Station] Positionen der Aufträge:', e);
    var war = AUFTRAG_POS.fehler;
    AUFTRAG_POS.fehler = fehlerGrund(e) + (e && e.code && String(e.message || '').indexOf(e.code) < 0 ? ' (' + e.code + ')' : '');
    if (war !== AUFTRAG_POS.fehler) PRODUKTE.forEach(function (p) { if (BESTELLUNGEN.some(function (b) { return b.legacyKey === p.legacyKey && b.auftragId; })) rebuildCard(p.bosId); });
  }
  [['bestellungen', BR.TYP], ['sonstige', BR.TYP_SONSTIGES]].forEach(function (q) {
    try {
      db.collection('bos_events').where('type', '==', q[1]).where('datum', 'in', planungsSpanneStation())
        .onSnapshot(function (snap) {
          var l = [];
          snap.forEach(function (doc) { var d = doc.data(); d.id = doc.id; l.push(d); });
          AUFTRAG_POS[q[0]] = l;
          if (AUFTRAG_POS.fehler) { AUFTRAG_POS.fehler = null; PRODUKTE.forEach(function (p) { rebuildCard(p.bosId); }); }
          neuZaehlen();
        }, fehler);
    } catch (e) { fehler(e); }
  });
}
// Eigene Einreichungen aus allen Wochen, die einen Tag der Spanne abdecken können
// (bestell_regeln.js wochenFuerTage, bei W = Planungswoche: W−14 … W+14), je Woche
// die neueste. Dieselbe Auswahl wie Übersicht, Seite Bestellungen und Froster-Ziele.
// 08.11.2026 (Schritt 2): mit Dokument-ID (_docId, für die Doppel-Prüfung) und dem
// letzten Stand der Planungswoche. Erfolg → EINREICHUNGEN_GELADEN (Einreichen frei).
// Antwortet die Datenbank nicht in ANTWORT_MS, lädt die Seite weiter (gesperrt);
// kommt die Antwort später, gibt einreichungenSpaet() frei. ~~Promise.race, späte
// Antwort setzte die Kennzeichen still~~
var KEINE_ANTWORT_EINR = 'keine Antwort der Datenbank nach 10 Sekunden — Netz prüfen. Sobald die letzten Einreichungen ankommen, ist das Einreichen wieder frei.';
function ladeEinreichungenKZ(db) {
  EINREICHUNGEN_LAEUFT = true;
  return new Promise(function (fertig) {
    var beantwortet = false;
    var uhr = setTimeout(function () {
      if (beantwortet) return;
      beantwortet = true;
      EINREICHUNGEN_LAEUFT = false;   // „Nochmal versuchen“ wieder frei, auch wenn die Abfrage noch hängt
      EINREICHUNGEN_GELADEN = false;
      EINREICHUNGEN_KZ = [];
      EINREICHUNGEN_FEHLER = KEINE_ANTWORT_EINR;
      fertig();
    }, ANTWORT_MS);
    var abfrage;
    try {
      abfrage = db.collection('bos_events')
        .where('type', '==', 'produktionsplan_einreichung')
        .where('station', '==', STATION_CFG)
        .where('woche', 'in', BR.wochenFuerTage(planungsSpanneStation()))
        .get();
    } catch (e) { abfrage = Promise.reject(e); }
    abfrage.then(function (snap) {
      var liste = [];
      snap.forEach(function (doc) { var d = doc.data(); d._docId = doc.id; liste.push(d); });
      EINREICHUNGEN_KZ = BR.neuesteJeStationUndWoche(liste);
      EINREICHUNGEN_FEHLER = null;
      EINREICHUNGEN_GELADEN = true;
      EINREICHUNGEN_LAEUFT = false;
      if (beantwortet) { einreichungenSpaet(); return; }
      beantwortet = true; clearTimeout(uhr); fertig();
    }).catch(function (e) {
      console.error('[Station] Letzte Einreichungen:', e);
      EINREICHUNGEN_LAEUFT = false;
      EINREICHUNGEN_GELADEN = false;
      EINREICHUNGEN_KZ = [];
      EINREICHUNGEN_FEHLER = fehlerGrund(e) + (e && e.code && String(e.message || '').indexOf(e.code) < 0 ? ' (' + e.code + ')' : '');
      if (beantwortet) { recalcAll(); renderSeitenHinweise(); return; }
      beantwortet = true; clearTimeout(uhr); fertig();
    });
  });
}
function einreichungenNochmal() {
  if (EINREICHUNGEN_LAEUFT) return;
  var lauf = ladeEinreichungenKZ(window.db);
  renderSeitenHinweise();
  lauf.then(function () {
    if (EINREICHUNGEN_GELADEN) einreichungenSpaet();
    else { renderSeitenHinweise(); updateExportBar(); }
  });
}
// Einreichungen kamen nach dem ersten Aufbau an (spät oder über „Nochmal versuchen“).
// Noch nichts geändert → übernehmen wie beim Öffnen; sonst nur anbieten.
function einreichungenSpaet() {
  var e = letzteEinreichungDerWoche();
  if (e && e._docId !== BEKANNTE_ID) {
    var unveraendert = (gemerkterAbdruck === null) || (planungsAbdruck() === gemerkterAbdruck);
    if (unveraendert) {
      ladeStand(e, 'geladen');
      if (gemerkterAbdruck !== null) gemerkterAbdruck = abdruckWieGeoeffnet();   // wie in neuLaden()
    } else {
      SPAET_ANGEBOT = e;
    }
  }
  recalcAll(); renderSeitenHinweise();
}

// ── LETZTEN STAND LADEN (08.11.2026, Schritt 2) ─────────────────────
// Rechnen in plan_laden.js (in Node geprüft); hier nur Auswahl und Anwenden.
function letzteEinreichungDerWoche() {
  var w = isoDatum(wochenMo);
  return EINREICHUNGEN_KZ.filter(function (e) { return e.woche === w; })[0] || null;
}
// Was die Station heute anbietet — dieselbe Regel wie die Knöpfe in buildCard():
// Backtag nicht vergangen, nicht Sonntag, nicht geschlossen; Ziel = Knöpfe der Woche danach.
function angebotHeute() {
  var backtage = [];
  for (var bi = 0; bi < 6; bi++) {
    var off = dieseWocheOffsets[bi];
    if (off >= 0 && (TAGESTYPEN[off] || 'normal') !== 'zu') backtage.push(off);
  }
  return { backtage: backtage, zieltage: naechsteWocheOffsets.slice() };
}
function planungLeeren(s) { s.zielOff = null; s.prodTage = {}; s.manuelleWerte = {}; s.gesperrtWerte = {}; s.gleichmaessig = false; }
// Übernimmt den Planungsstand einer Einreichung (null = leer). Bestand, Fehlmenge,
// Froster-Antwort und Bestellungen fasst diese Funktion nicht an.
function ladeStand(einreichung, art) {
  var angebot = angebotHeute();
  var hinweise = {};
  PRODUKTE.forEach(function (prod) {
    var s = state[prod.bosId];
    planungLeeren(s);
    var p = (einreichung && einreichung.produkte) ? einreichung.produkte[prod.legacyKey] : null;
    if (!p) return;   // nicht in der Einreichung → startet leer
    var r = PL.umrechnen(p, einreichung, heute, angebot);
    if (r.fehler) { hinweise[prod.bosId] = [r.fehler]; return; }
    s.zielOff = r.zielOff; s.prodTage = r.prodTage; s.manuelleWerte = r.manuelleWerte; s.gesperrtWerte = r.gesperrtWerte; s.gleichmaessig = r.gleichmaessig;
    if (r.hinweise.length) hinweise[prod.bosId] = r.hinweise;
  });
  if (!einreichung) { LADE_STAND = null; BEKANNTE_ID = null; return; }
  var aufSeite = {}; PRODUKTE.forEach(function (p) { aufSeite[p.legacyKey] = true; });
  var fehlend = Object.keys(einreichung.produkte || {}).filter(function (lk) { return !aufSeite[lk]; })
    .map(function (lk) { var p = einreichung.produkte[lk]; return (p && p.name) ? p.name : lk; });
  LADE_STAND = { id: einreichung._docId || null, von: einreichung.eingereichtVon || null, ts: einreichung.ts,
                 produkte: einreichung.produkte || {}, art: art, leer: false, hinweise: hinweise,
                 oben: fehlend.length ? ['Nicht übernommen, weil nicht mehr auf dieser Seite: ' + fehlend.join(', ')] : [] };
  BEKANNTE_ID = LADE_STAND.id;
}
function leerFrage(an) { LEER_FRAGE = !!an; renderSeitenHinweise(); }
function leerAnfangen() {
  PRODUKTE.forEach(function (p) { planungLeeren(state[p.bosId]); });
  if (LADE_STAND) { LADE_STAND.leer = true; LADE_STAND.hinweise = {}; LADE_STAND.oben = []; }
  LEER_FRAGE = false;
  recalcAll(); renderSeitenHinweise();
}
// „Neu laden“ (Doppel-Prüfung) bzw. „Laden“ (spät angekommen): ersetzt NUR den
// Planungsstand (ladeStand: Backtage, Ziel, Hand- und Sperrwerte, gleichmäßig).
// Froster-Antwort, Fehlmenge und Bestand (auch von Hand) bleiben — sie beschreiben
// den Froster heute Nacht und kommen nie aus einer Einreichung (Kontroll-Chat
// 08.11., 16:57). ~~Bestand zurück auf automatisch, Fehlmenge 0~~ (16:45, verwarf
// z. B. „Fehlt für Samstag? 3“ still).
function neuLaden(e) {
  if (!e) return;
  ladeStand(e, 'geladen');
  var w = isoDatum(wochenMo);
  EINREICHUNGEN_KZ = EINREICHUNGEN_KZ.filter(function (x) { return x.woche !== w; }).concat([e]);
  DOPPEL = null; SPAET_ANGEBOT = null; LEER_FRAGE = false;
  if (gemerkterAbdruck !== null) gemerkterAbdruck = abdruckWieGeoeffnet();
  recalcAll(); renderSeitenHinweise(); renderDoppel();
}
// Vergleichsstand nach dem Laden: planungsAbdruck() so, wie die Seite mit diesem
// Planungsstand frisch geöffnet aussähe (Bestand aus Zählung + Produktion,
// Fehlmenge leer, dieselbe Froster-Antwort) — dieselbe Grundlage wie der erste
// Abdruck nach „Bestätigen“. Weicht der echte Stand davon ab (Fehlmenge stehen
// geblieben, Bestand von Hand), gilt er zu Recht als nicht eingereicht.
function abdruckWieGeoeffnet() {
  var gemerkt = {};
  PRODUKTE.forEach(function (p) {
    var s = state[p.bosId], d = DATEN[p.bosId] || {};
    gemerkt[p.bosId] = [s.startBestand, s.fehlmengeAbs];
    s.startBestand = (typeof d.automatisch === 'number') ? d.automatisch : null;
    s.fehlmengeAbs = 0;
  });
  var abdruck = planungsAbdruck();
  PRODUKTE.forEach(function (p) {
    var s = state[p.bosId];
    s.startBestand = gemerkt[p.bosId][0]; s.fehlmengeAbs = gemerkt[p.bosId][1];
  });
  return abdruck;
}

// ── DOPPEL-PRÜFUNG VOR DEM EINREICHEN (08.11.2026, Schritt 2, E5) ────
// Neueste Einreichung dieser Station und Woche, vom Server (nicht aus dem
// Zwischenspeicher — sonst sähe die Station den Kollegen nicht). Verglichen
// wird die Dokument-ID, nicht die Uhrzeit.
var KEINE_ANTWORT_PRUEF = 'keine Antwort der Datenbank nach 10 Sekunden — Netz prüfen und nochmal tippen.';
function holeNeuesteDerWoche() {
  var zeitlimit = new Promise(function (_, nein) { setTimeout(function () { nein(new Error(KEINE_ANTWORT_PRUEF)); }, ANTWORT_MS); });
  return Promise.race([zeitlimit, window.db.collection('bos_events')
    .where('type', '==', 'produktionsplan_einreichung')
    .where('station', '==', STATION_CFG)
    .where('woche', '==', isoDatum(wochenMo))
    .get({ source: 'server' })
    .then(function (snap) {
      var liste = [];
      snap.forEach(function (doc) { var d = doc.data(); d._docId = doc.id; liste.push(d); });
      return BR.neuesteJeStation(liste)[STATION_CFG] || null;
    })]);
}
function renderDoppel() {
  var box = document.getElementById('doppel-panel');
  if (!box) return;
  if (!DOPPEL) { box.innerHTML = ''; return; }
  var seit = !BEKANNTE_ID ? 'Seit dem Öffnen der Seite' : (LADE_STAND && LADE_STAND.art === 'eigene') ? 'Seit deiner Einreichung' : 'Seit dem Laden';
  box.innerHTML = '<div class="doppel-panel" id="hinweis-doppelt">' + seit + ' hat ' + escText(DOPPEL.eingereichtVon || 'jemand') + ' um ' + escText(fmtWann(DOPPEL.ts)) + ' neu eingereicht.'
    + '<div class="sh-knoepfe"><button class="sh-btn haupt" id="doppel-neu-laden" onclick="neuLaden(DOPPEL)">Neu laden — deine Planungsänderungen gehen verloren (Bestand und Fehlmenge bleiben)</button>'
    + '<button class="sh-btn" id="doppel-trotzdem" onclick="doppelTrotzdem()">Trotzdem einreichen</button></div></div>';
}
function doppelTrotzdem() {
  var id = DOPPEL ? DOPPEL._docId : null;
  DOPPEL = null; renderDoppel();
  planungEinreichen({ trotzdem: id });
}

// Anteil der Bestellungen an einem Produkt (über bestell_regeln.js).
function bestellAnteil(bosId) {
  if (!BR) return null;
  var s = state[bosId];
  return BR.fuerKette(BESTELLUNGEN, bosId, heute, s ? s.zielOff : null, frosterFertig);
}
// Fehlmenge zählt nur bei „Ja“ (Ulf 03.11., 04:19).
function wirksameFehlmenge(bosId) {
  var s = state[bosId];
  return (frosterFertig === true && s && s.fehlmengeAbs > 0) ? s.fehlmengeAbs : 0;
}

// 13.10.2026 (#64): Versionsschutz ~~pruefeWochenbedarf()~~ — seit 08.11.2026 (Schritt 3)
// wörtlich in plan_pruefung.js (BOS_PLAN_PRUEFUNG.pruefeWochenbedarf, von ladeBedarf gerufen).
// 13.10.2026: echte Fehlermeldung für die Oberfläche (Projektregel err.message).
function fehlerGrund(e) {
  return (e && e.message) ? e.message : String(e);
}
// Einheit kommt aus dem Freitext-Feld `einheit` — vor dem Einsetzen in HTML entschärfen.
function escEinheit(s) {
  return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; });
}

function renderAll() {
  var c = document.getElementById('prod-container');
  c.innerHTML = '';
  PRODUKTE.forEach(function(prod){ c.appendChild(buildCard(prod.bosId)); });
  updateExportBar();
}
function recalcAll() {
  PRODUKTE.forEach(function(prod){ rebuildCard(prod.bosId); });
  updateExportBar();
}
function rebuildCard(bosId) {
  var old = document.getElementById('card-' + bosId);
  if (old) old.replaceWith(buildCard(bosId));
  updateExportBar();
}

function getResult(bosId) {
  var prod = PRODUKTE.find(function(x){ return x.bosId === bosId; });
  if (!prod) return null;
  var s = state[bosId];
  if (s.zielOff === null) return null;
  if (s.startBestand === null) return null;   // 08.11.2026: Bestand fehlt → nicht rechnen
  var d = DATEN[bosId];
  if (!d) return null;
  var bst = bestellAnteil(bosId);
  return window.BOS_KETTE.berechne({
    needs: d.needs,
    startBestand: s.startBestand,
    fehlmengeAbs: wirksameFehlmenge(bosId),   // 08.11.2026: nur bei Ja
    zusatzBedarf: bst ? bst.zusatz : {},      // 08.11.2026: Bestellungen an ihrem Tag
    frosterFertig: frosterFertig === true,
    zielOff: s.zielOff,
    prodTage: s.prodTage,
    manuelleWerte: s.manuelleWerte,
    gesperrtWerte: s.gesperrtWerte,
    gleichmaessig: !!s.gleichmaessig,
    heute: heute,
    tagesTypen: TAGESTYPEN
  });
}

// 06.09.2026 · Diagnose-Fix: Firestore-Fehlermeldungen wie "The query
// requires an index. You can create it here: https://..." enthalten oft
// einen langen, leerzeichenlosen Link, der auf dem Handy sonst nur
// unantippbarer Fließtext wäre. Macht daraus einen echten <a>-Tag.
function fehlertextMitLink(text) {
  return text.replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">Index anlegen</a>');
}

// 08.11.2026 (Schritt 2): „12 gezählt (Di 03:00) + 20 produziert seit der Zählung = 32“.
// Ohne Produktion seit der Zählung wie bisher nichts. Von Hand → das sagt die Karte.
function wtZeit(ms) {
  var d = new Date(ms);
  return WT_KURZ_JS[d.getDay()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function bestandZeile(bosId) {
  var s = state[bosId], d = DATEN[bosId] || {};
  if (s.bestandVonHand) return '<span class="bestand-zeile hand" data-bestandzeile="' + bosId + '">✎ von Hand eingetragen — ersetzt Zählung und Produktion</span>';
  if (d.produktionFehler) return '<span class="bestand-hint voll" data-bestandzeile="' + bosId + '">⚠ Produktion seit der Zählung nicht lesbar — Bestand bleibt leer, bitte zählen oder von Hand eintragen: ' + fehlertextMitLink(escText(d.produktionFehler)) + '</span>';
  if (!d.frisch) return '';
  var html = '';
  // 08.11.2026 (Schritt 3, 4.4): Zählung vor der Vorbereitung — nur Hinweis, keine Korrektur
  var vh = PP ? PP.vorbereitungsHinweis({ veraltet: false, ts: d.zaehlTs, vorbereitungFertig: d.vorbereitungFertig }, d.gruppe, heute, frosterFertig, s.bestandVonHand) : null;
  if (vh) html += '<span class="bestand-hint voll" data-vorbereitung="' + bosId + '">⚠ ' + escText(vh) + '</span>';
  if (d.gezaehlt && d.gezaehlt.length) {
    var summe = Math.round((d.zaehlung + d.produktion) * 100) / 100;
    html += '<span class="bestand-zeile" data-bestandzeile="' + bosId + '">' + rd2(d.zaehlung) + ' gezählt (' + wtZeit(d.zaehlTs) + ') + ' + rd2(d.produktion) + ' produziert seit der Zählung = ' + rd2(summe)
          + (summe !== d.automatisch ? ' (gerundet ' + d.automatisch + ')' : '') + '</span>';
  }
  function nicht(liste, text) {
    if (!liste || !liste.length) return '';
    var menge = liste.reduce(function (a, e) { return a + e.menge; }, 0);
    return '<span class="bestand-hint voll">' + liste.length + (liste.length === 1 ? ' Eintrag' : ' Einträge') + ' der Froster-Produktion (' + rd2(menge) + ') ' + text + ' — nicht eingerechnet</span>';
  }
  var andere = (d.andereEinheit || []).map(function (e) { return String(e.einheit); }).filter(function (v, i, a) { return a.indexOf(v) === i; });
  html += nicht(d.andereEinheit, 'in anderer Einheit (' + escText(andere.join(', ')) + ')');
  html += nicht(d.ohneEinheit, 'ohne Einheit');
  return html;
}

function buildCard(bosId) {
  var prod = PRODUKTE.find(function(x){ return x.bosId === bosId; });
  if (!prod) return document.createElement('div');
  // 13.10.2026 (#64): Einheit des Produkts statt fest „Bl.“ (Kurzform aus
  // bos_produkte.js, Ulf 12:04: Stk., Bl., Dl., LoBl., KuBl., SchlaBl. …).
  var eh = escEinheit(prod.einheit.kurz);
  var s = state[bosId];
  var datenEintrag = DATEN[bosId] || {};
  var startBest = s.startBestand;
  var bestandVeraltet = datenEintrag.veraltet !== false; // true = veraltet ODER nie gezählt

  var result = getResult(bosId);
  var prodKeys = Object.keys(s.prodTage).filter(function(k){ return s.prodTage[k]; });
  var prodCount = prodKeys.length;
  var hasWarn = result && result.warnungen.length > 0;
  var isOk    = result && prodCount > 0 && !hasWarn;

  var card = document.createElement('div');
  card.id = 'card-' + bosId;
  var hatLuecke = result && result.warnungen.some(function(w){ return w.typ === 'luecke'; });
  var hatKnapp  = result && !hatLuecke && result.warnungen.some(function(w){ return w.typ === 'knapp'; });
  card.className = 'prod-card' + (isOk ? ' ok' : hatLuecke ? ' warn' : hatKnapp ? ' knapp-card' : '');

  var statusTxt = 'Produktionstage und Ziel wählen', statusCls = '';
  var bestandFehlt = (s.startBestand === null);   // 08.11.2026
  if (bestandFehlt) { statusTxt = '✕ Bestand fehlt — bitte zählen oder eintragen'; statusCls = ' err'; card.className = 'prod-card warn'; }
  else if (s.zielOff !== null && !prodCount) statusTxt = 'Produktionstage wählen';
  else if (prodCount && s.zielOff === null) statusTxt = 'Zieldatum wählen';
  else if (isOk)      { statusTxt = '✓ Kette vollständig gedeckt · Bestand: ' + startBest + ' ' + eh; statusCls = ' ok'; }
  else if (hatLuecke) { statusTxt = '✕ Lücke — Produktion erhöhen oder Tag hinzufügen'; statusCls = ' err'; }
  else if (hatKnapp)  { statusTxt = '⚠\uFE0E Bestand 0 an ' + result.warnungen.length + ' Tag' + (result.warnungen.length > 1 ? 'en' : '') + ' — Produktionstag nötig'; statusCls = ' knapp'; }

  // 06.09.2026 · Feature (Ulf: "ne Warnung wäre nett"): dasselbe Muster wie
  // in schnellrechner.html (srRenderErgebnis()) — verlaesslich[] sagt pro
  // Wochentag, ob die Mindeststichprobe erreicht wurde. Ohne diese Warnung
  // sieht "0 Bl. nötig" (bzw. Stk./Dl. …) identisch aus, egal ob echt geprüft oder schlicht
  // keine Verbrauchsdaten vorhanden (z.B. Datenquelle ohne Erfassung).
  var verl = datenEintrag.verlaesslich;
  var alleUnzuverlaessig = !!(verl && verl.length > 0 && verl.every(function(v){ return v === false; }));
  var teilweiseUnzuverlaessig = !alleUnzuverlaessig && !!(verl && verl.some(function(v){ return v === false; }));
  // 15.10.2026 (V2, B7): ohne Quellennamen — an der Station steht nicht, woher die Zahl kommt.

  var html = '<div class="prod-name">' + prod.name + '</div>';
  var fmW = wirksameFehlmenge(bosId);   // 08.11.2026: „+3 Bl. Fehlmenge eingerechnet“
  html += '<div class="prod-status' + statusCls + '">' + statusTxt
        + (fmW > 0 && !bestandFehlt ? ' · <span class="fm-zusatz">+' + fmW + ' ' + eh + ' Fehlmenge eingerechnet</span>' : '') + '</div>';
  if (alleUnzuverlaessig) {
    html += '<div class="verlaesslich-hint" style="color:var(--bos-red);">✕ Keine ausreichenden Bedarfszahlen — Ergebnis nicht verlässlich!</div>';
  } else if (teilweiseUnzuverlaessig) {
    html += '<div class="verlaesslich-hint" style="color:var(--bos-warn, var(--bos-amber));">⚠\uFE0E Für einzelne Wochentage fehlen verlässliche Bedarfszahlen — teilweise geschätzt.</div>';
  }

  // 08.11.2026 (Schritt 2): beim Laden weggefallene Werte und „eingereicht: …“ (nur Anzeige)
  var ladeH = LADE_STAND && LADE_STAND.hinweise[bosId];
  if (ladeH && ladeH.length) html += '<div class="lade-hinweise" data-lade-hinweise="' + bosId + '">' + ladeH.map(function (t) { return '⚠ ' + escText(t); }).join('<br>') + '</div>';
  var vergl = LADE_STAND && LADE_STAND.produkte[prod.legacyKey];
  if (vergl) html += '<div class="vergleich-zeile" data-vergleich="' + bosId + '">' + escText(PL.vergleichszeile(vergl)) + '</div>';

  // ── BESTAND (editierbar, Warnung bei veraltet/nie gezählt) ──
  // 08.11.2026: leer, wenn keine Zählung unter 24 Std. (startBestand null)
  html += '<div class="bestand-row' + (bestandVeraltet ? ' warn' : '') + (bestandFehlt ? ' fehlt' : '') + '">'
        + '<span class="bestand-label">❄️ Bestand</span>'
        + '<input class="bestand-input" type="number" min="0" inputmode="numeric" placeholder="—" value="' + (bestandFehlt ? '' : startBest) + '"'
        + ' data-bestand="' + bosId + '" oninput="onBestandInput(\'' + bosId + '\', this)">'
        + '<span class="bestand-unit">' + eh + '</span>'
        + (bestandVeraltet ? '<span class="bestand-hint">' + (datenEintrag.fehlerText ? ('⚠ Abfrage fehlgeschlagen: ' + fehlertextMitLink(datenEintrag.fehlerText)) : (datenEintrag.gefunden ? 'älter als 24 Std. — bitte zählen und eintragen' : 'nie gezählt — bitte eintragen')) + '</span>' : '')
        + '<span class="bestand-hint" id="bestand-abgewiesen-' + bosId + '" style="display:none;">Nur Werte ab 0</span>'
        + bestandZeile(bosId)   // 08.11.2026 (Schritt 2)
        + '</div>';

  // ── FEHLMENGE (08.11.2026: nur bei „Froster fertig = Ja“, für morgen, eigene Optik) ──
  // ~~„➕ Fehlmenge … zusätzlich nötig“ im Grau des Bestands, immer sichtbar~~ (wurde übersehen,
  // diente zwei Zwecken). Bestellungen haben jetzt ihren eigenen Block.
  if (frosterFertig === true) {
    var mo = morgenDatum();
    html += '<div class="fehlmenge-row">'
          + '<span class="fehlmenge-label">⚠ Fehlt für ' + WT_LANG_JS[mo.getDay()] + '?</span>'
          + '<input class="bestand-input" type="number" min="0" inputmode="numeric" placeholder="0" value="' + (s.fehlmengeAbs > 0 ? s.fehlmengeAbs : '') + '"'
          + ' data-fehlmenge="' + bosId + '" oninput="onFehlmengeInput(\'' + bosId + '\', this)">'
          + '<span class="bestand-unit">' + eh + ' fehlen für ' + fmtD(mo) + '</span>'
          + '</div>';
  }

  html += baueBestellBlock(bosId, eh);

  // ── PRODUKTIONSTAGE (Planungswoche, siehe wochenMo oben) ──
  html += '<div class="section"><div class="slabel">Produktionstage</div><div class="day-row">';
  for (var bi = 0; bi < 7; bi++) {
    var off = dieseWocheOffsets[bi];
    var d   = offsetToDate(off);
    // Zeitkontext: ist dieser Tag geschlossen? (ersetzt die alte wochenconfigMap)
    var istZuTag  = (TAGESTYPEN[off] || 'normal') === 'zu';
    var isDisabled = (off < 0) || (bi === 6) || istZuTag;
    var isOn = !isDisabled && !!s.prodTage[off];
    var cls  = 'day-btn' + (isOn ? ' on' : '') + (isDisabled ? ' disabled' : '') + (istZuTag ? ' ist-zu' : '');
    var icon = istZuTag ? '🔒' : (isOn ? '🥐' : '&nbsp;');
    var click = isDisabled ? '' : 'onclick="tapDay(\'' + bosId + '\',' + off + ')"';
    html += '<div class="' + cls + '" ' + click + '>'
          + '<span class="db-icon">' + icon + '</span>'
          + '<span class="db-day">' + WT_KURZ[bi] + '</span>'
          + '<span class="db-date">' + fmtD(d) + '</span>'
          + '</div>';
  }
  html += '</div></div>';

  // ── ZIEL (Woche NACH der Planungswoche) ──
  html += '<div class="section"><div class="slabel">Bis wann reicht der Bestand?</div><div class="ziel-row">';
  for (var bi = 0; bi < 7; bi++) {
    var off = naechsteWocheOffsets[bi];
    var d   = offsetToDate(off);
    var on  = s.zielOff === off ? ' on' : '';
    html += '<button class="ziel-btn' + on + '" onclick="setZiel(\'' + bosId + '\',' + off + ')">'
          + '<span class="z-day">' + WT_KURZ[bi] + '</span>'
          + '<span class="z-date">' + fmtD(d) + '</span>'
          + '</button>';
  }
  html += '</div></div>';

  // ── VORSCHLAG-FELDER ──
  if (result && prodCount > 0) {
    var prodOffsets = Object.keys(s.prodTage).map(Number).filter(function(o){ return s.prodTage[o]; }).sort(function(a,b){ return a-b; });
    var colsCls = prodOffsets.length >= 3 ? 'cols-3' : prodOffsets.length === 2 ? 'cols-2' : 'cols-1';

    html += '<label class="card-gleichm">'
          + '<input type="checkbox" ' + (s.gleichmaessig ? 'checked' : '') + ' onchange="toggleGleichmaessig(\'' + bosId + '\')">'
          + '⚖ Gleichmäßige Belastung</label>';

    html += '<div class="vorschlag-wrap">';
    html += '<div class="vorschlag-hint">🥐 Vorschlag<span class="hint-right" onclick="toggleAkk(\'' + bosId + '\')">Kette prüfen ▾</span></div>';
    html += '<div class="vd-grid ' + colsCls + '">';

    prodOffsets.forEach(function(off) {
      var t = result.kette[off];
      if (!t) return;
      var cellCls  = t.istGesperrt ? 'is-locked' : t.istManuell ? 'is-soft' : 'is-auto';
      var inputCls = t.istGesperrt ? 'is-locked' : t.istManuell ? 'is-soft' : '';
      var lockIcon = t.istGesperrt ? '🔒' : '🔓';
      var lockCls  = 'vday-lock' + ((t.istGesperrt || t.istManuell) ? ' active' : '');

      // ── MINIMUM ──────────────────────────────────────────────────────
      // Mindestproduktion = max(0, Brutto-Verbrauch bis nächster Prod-Tag − vorhandener Bestand)
      // Brutto-Verbrauch: Summe vbAn(off+1) .. vbAn(naechsterProdTag)
      // Vorhandener Bestand: Bestand VOR dieser Produktion (Bestand nach − Produktion + Verbrauch)
      var nextOff = prodOffsets.find(function(o){ return o > off; });
      var bisOff  = nextOff !== undefined ? nextOff : s.zielOff;
      var futureBedarf = 0;
      for (var j = off + 1; j <= bisOff; j++) {
        if (result.kette[j]) futureBedarf += result.kette[j].verbrauch || 0;
      }
      // bestandNachMorgen = tiefster Punkt vor dieser Produktion (direkt aus Logik)
      var puffer = Math.max(0, t.bestandNachMorgen);
      var minBed = rdAuf(Math.max(0, futureBedarf - puffer));
      var unterMin = t.vorschlag < minBed;

      // Zell-Klasse: bei Unterschreitung des Minimums rot einrahmen
      var warnCellCls = unterMin && !t.istGesperrt ? ' is-warn' : '';
      var minCls = unterMin ? 'vday-min warn' : 'vday-min';

      html += '<div class="vday-cell ' + cellCls + warnCellCls + '">'
            + '<div class="vday-label">' + t.tagKurz + ' <span>' + fmtD(t.datum) + '</span></div>'
            + '<input class="vday-input ' + inputCls + '" type="number" min="0" value="' + t.vorschlag + '"'
            + ' data-bid="' + bosId + '" data-off="' + off + '"'
            + ' oninput="onInput(\'' + bosId + '\',' + off + ',this)" onfocus="this.select()">'
            + '<div class="vday-footer">'
            + '<span class="' + minCls + '">' + (unterMin ? '⚠\uFE0E min ' + minBed : 'min ' + minBed) + ' ' + eh + '</span>'
            + '<button class="' + lockCls + '" onclick="toggleLock(\'' + bosId + '\',' + off + ')">' + lockIcon + '</button>'
            + '</div></div>';
    });
    html += '</div></div>';

    // Akkordeon
    html += '<button class="akk-toggle" onclick="toggleAkk(\'' + bosId + '\')" id="akk-btn-' + bosId + '">'
          + '<span>Kette prüfen</span><span class="akk-arrow" id="akk-arr-' + bosId + '">▾</span></button>';
    html += '<div class="akk-body" id="akk-' + bosId + '">';
    result.kette.forEach(function(t) {
      var rowCls = 'chain-row';
      if (t.istHeute)             rowCls += ' row-heute';
      else if (t.istZu)           rowCls += ' row-zu';
      else if (t.prodTag)         rowCls += ' row-prod';
      if (t.warnung === 'luecke') rowCls += ' row-luecke';
      if (t.gedecktDurchFroster)  rowCls += ' row-froster';
      var prodTxt = t.prodTag ? '<span class="cr-prod">' + t.vorschlag + '</span>' : '<span class="cr-prod empty">—</span>';
      var verb;
      if (t.gedecktDurchFroster) verb = '❄';
      else if (t.istZu)          verb = '🔒';
      else if (t.istHamster)     verb = rd(t.verbrauch) + ' 🐹';
      else                       verb = t.verbrauch ? rd(t.verbrauch) : '—';
      if (t.zusatz > 0)          verb = verb + '<span class="cr-bst" title="davon Bestellung"> 📋' + rd(t.zusatz) + '</span>';   // 08.11.2026: Bestellung des Tages (steckt im Verbrauch)

      // Bestand-Anzeige:
      // Bei Produktionstagen zeigen wir den Bestand VOR Produktion (nach Morgen-Verbrauch)
      // damit klar ist: "mit diesem Bestand öffnet der Laden, DANN wird produziert"
      var bestandZeigen, bCls;
      if (t.prodTag && !t.istHeute) {
        // Zwischenstand nach Morgen (VOR Produktion) — erst runden, dann
        // einfärben, sonst könnte z.B. "0" rot markiert sein (war vorher -0.3)
        var bNM = rd(t.bestandNachMorgen);
        var bNMCls = bNM < 0 ? 'neg' : bNM === 0 ? 'nul' : 'pos';
        // Endstand nach Produktion
        var bEnd = rd(t.bestand);
        var bEndCls = bEnd > 0 ? 'pos' : bEnd === 0 ? 'nul' : 'neg';
        bestandZeigen = '<span class="cr-best ' + bNMCls + '" title="vor Produktion">' + bNM + '</span>'
                      + '<span style="font-size:0.55rem;color:var(--bos-text-dim);margin:0 2px;">→</span>'
                      + '<span class="cr-best ' + bEndCls + '" title="nach Produktion">' + bEnd + '</span>';
      } else {
        var bWert = rd(t.bestand);
        bCls = bWert > 0 ? 'pos' : bWert === 0 ? 'nul' : 'neg';
        bestandZeigen = '<span class="cr-best ' + bCls + '">' + bWert + '</span>';
      }

      html += '<div class="' + rowCls + '">'
            + '<span class="cr-tag">' + t.tagKurz + '</span>'
            + '<span class="cr-date">' + fmtD(t.datum) + '</span>'
            + '<span class="cr-verb">' + verb + '</span>'
            + prodTxt
            + bestandZeigen
            + '</div>';
    });
    html += '</div>';

    if (!result.warnungen.length) {
      html += '<div class="warn-row ok">✓ Alle Tage gedeckt · Endlager: ' + rd(result.endlager) + ' ' + eh + '</div>';
    } else {
      result.warnungen.forEach(function(w) {
        html += '<div class="warn-row ' + (w.typ === 'luecke' ? 'luecke' : 'knapp') + '">'
              + (w.typ === 'luecke' ? '✕ Lücke ' + w.tag + ' ' + w.datum + ': ' + rdAuf(Math.abs(w.delta)) + ' ' + eh + ' fehlen' : '⚠\uFE0E ' + w.tag + ' ' + w.datum + ': Bestand 0 — nächster Produktionstag nötig')
              + '</div>';
      });
    }
    html += '<div class="card-footer">'
          + '<div class="footer-sum">Produktion: <span>' + rd(result.gesamtProduktion) + '</span> ' + eh + '</div>'
          + '<button class="btn-reset" onclick="resetCard(\'' + bosId + '\')">↺ Reset</button>'
          + '</div>';
  }

  card.innerHTML = html;
  if (state[bosId]._akkOpen) {
    var body = card.querySelector('#akk-' + bosId);
    var arr  = card.querySelector('#akk-arr-' + bosId);
    if (body) body.classList.add('open');
    if (arr)  arr.classList.add('open');
  }
  return card;
}

// ── INTERAKTION ─────────────────────────────────
function setFroster(v) {
  if (frosterFertig === null) return;   // 08.11.2026: erst über den Dialog beantworten
  frosterFertig = v;
  zeichneFrosterLeiste();
  recalcAll();   // Ja → Nein: Fehlmenge-Zeilen weg, Werte bleiben in state, zählen aber nicht
}

function tapDay(bosId, offset) {
  var s = state[bosId];
  if (s.prodTage[offset]) {
    delete s.prodTage[offset]; delete s.manuelleWerte[offset]; delete s.gesperrtWerte[offset];
  } else {
    s.prodTage[offset] = true;
  }
  rebuildCard(bosId);
}

function setZiel(bosId, off) {
  var s = state[bosId];
  s.zielOff = (s.zielOff === off) ? null : off;
  if (s.zielOff !== null) {
    [s.prodTage, s.manuelleWerte, s.gesperrtWerte].forEach(function(obj) {
      Object.keys(obj).forEach(function(k) { if (parseInt(k) > s.zielOff) delete obj[k]; });
    });
  }
  rebuildCard(bosId);
}

function toggleGleichmaessig(bosId) {
  state[bosId].gleichmaessig = !state[bosId].gleichmaessig;
  rebuildCard(bosId);
}

// FIX TASTATUR: Debounce — Rebuild erst nach 700ms Tipp-Pause
function onInput(bosId, offset, el) {
  var val = parseInt(el.value), s = state[bosId];
  if (!isNaN(val) && val >= 0) {
    s.manuelleWerte[offset] = val;
    if (s.gesperrtWerte[offset] !== undefined) s.gesperrtWerte[offset] = val;
  } else {
    delete s.manuelleWerte[offset]; delete s.gesperrtWerte[offset];
  }
  // Kein sofortiges Rebuild — erst nach Pause damit Tastatur offen bleibt
  clearTimeout(rebuildTimers[bosId]);
  rebuildTimers[bosId] = setTimeout(function() {
    rebuildCard(bosId);
  }, 700);
}

// Bestand manuell korrigieren (v.a. bei veraltet/nie gezählt nötig)
function onBestandInput(bosId, el) {
  // 08.11.2026: leer = Bestand fehlt (nicht 0); Minus wird abgewiesen (Feld rot, Wert zählt nicht)
  var roh = String(el.value || '').trim();
  var hinweis = document.getElementById('bestand-abgewiesen-' + bosId);
  var val = parseInt(roh, 10);
  var unsinn = (el.validity && el.validity.badInput) || (roh !== '' && (isNaN(val) || val < 0));
  el.classList.toggle('abgewiesen', !!unsinn);
  if (hinweis) hinweis.style.display = unsinn ? 'inline' : 'none';
  if (unsinn) { updateExportBar(); return; }
  state[bosId].startBestand = (roh === '') ? null : val;
  // 08.11.2026 (Schritt 2): anders als Zählung + Produktion = von Hand (zurückgestellt = nicht mehr)
  var auto = (DATEN[bosId] && typeof DATEN[bosId].automatisch === 'number') ? DATEN[bosId].automatisch : null;
  state[bosId].bestandVonHand = (state[bosId].startBestand !== null && state[bosId].startBestand !== auto);
  clearTimeout(rebuildTimers['bestand_' + bosId]);
  rebuildTimers['bestand_' + bosId] = setTimeout(function() {
    rebuildCard(bosId);
  }, 700);
}

// Fehlmenge (Sofort-Zusatzbedarf) manuell setzen, pro Produkt
function onFehlmengeInput(bosId, el) {
  var val = parseInt(el.value);
  state[bosId].fehlmengeAbs = (!isNaN(val) && val >= 0) ? val : 0;
  clearTimeout(rebuildTimers['fehlmenge_' + bosId]);
  rebuildTimers['fehlmenge_' + bosId] = setTimeout(function() {
    rebuildCard(bosId);
  }, 700);
}

function toggleLock(bosId, offset) {
  clearTimeout(rebuildTimers[bosId]);
  var s = state[bosId];
  if (s.gesperrtWerte[offset] !== undefined) {
    delete s.gesperrtWerte[offset];
  } else {
    var inp = document.querySelector('input[data-bid="' + bosId + '"][data-off="' + offset + '"]');
    var wert = parseInt(inp ? inp.value : 0) || 0;
    s.gesperrtWerte[offset] = wert; s.manuelleWerte[offset] = wert;
  }
  rebuildCard(bosId);
}

function resetCard(bosId) {
  clearTimeout(rebuildTimers[bosId]);
  var s = state[bosId];
  Object.keys(s.manuelleWerte).forEach(function(k) {
    if (s.gesperrtWerte[k] === undefined) delete s.manuelleWerte[k];
  });
  rebuildCard(bosId);
}

function toggleAkk(bosId) {
  var s = state[bosId]; s._akkOpen = !s._akkOpen;
  var body = document.getElementById('akk-' + bosId);
  var arr  = document.getElementById('akk-arr-' + bosId);
  if (body) body.classList.toggle('open', s._akkOpen);
  if (arr)  arr.classList.toggle('open', s._akkOpen);
}

// ── EXPORT BAR ────────────────────────────────
// 08.11.2026: Sperrgrund fürs Einreichen (null = frei). Reihenfolge: Froster-Frage,
// Bestellungen nicht geladen, letzte Einreichungen nicht gelesen (Schritt 2), Bestand
// fehlt (Knopf nennt die Produkte; auch wenn die Produktion nicht lesbar war).
function einreichSperre() {
  if (frosterFertig === null) return 'Erst die Froster-Frage beantworten.';
  if (!BESTELL_STAND.geladen) return '⚠ Bestellungen nicht geladen — Einreichen gesperrt' + (BESTELL_STAND.fehler ? ': ' + BESTELL_STAND.fehler : '.');
  // 08.11.2026 (Schritt 2, E6): ohne die letzten Einreichungen kein Einreichen
  if (!EINREICHUNGEN_GELADEN) return '⚠ Letzte Einreichungen nicht gelesen — Einreichen gesperrt' + (EINREICHUNGEN_FEHLER ? ': ' + EINREICHUNGEN_FEHLER : '.');
  var fehlen = PRODUKTE.filter(function (p) { return state[p.bosId] && state[p.bosId].startBestand === null; }).map(function (p) { return p.name; });
  if (fehlen.length) {
    var txt = fehlen.slice(0, 3).join(', ') + (fehlen.length > 3 ? ' und ' + (fehlen.length - 3) + ' weitere' : '');
    return '✕ Bestand fehlt: ' + txt + ' — Einreichen gesperrt';
  }
  return null;
}
function updateExportBar() {
  var fertig = 0, gesamt = PRODUKTE.length;
  PRODUKTE.forEach(function(prod) {
    var s = state[prod.bosId];
    var prodCount = Object.keys(s.prodTage).filter(function(k){ return s.prodTage[k]; }).length;
    if (s.zielOff !== null && prodCount > 0) fertig++;
  });
  var btn = document.getElementById('btn-export');
  var cnt = document.getElementById('export-count');
  var sperre = einreichSperre();
  btn.className = 'btn-export' + (fertig === 0 || sperre ? ' disabled' : '');
  cnt.textContent = sperre || (fertig + ' / ' + gesamt + ' Produkte mit Vorschlag');
  cnt.style.color = sperre ? 'var(--bos-red)' : '';
}

// ── EINREICHEN (ersetzt den alten WhatsApp-Export) ──────────
// Schreibt eine Basis-Einreichung nach Firestore (append-only, bos_events),
// siehe SESSION_2026-09-03_PRODUKTIONSPLANER_KONZEPT.md. Die Übersichtsseite
// (künftig) liest daraus den grünen Haken pro Station.
function isoDatum(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function aktuellerProfilName() {
  try {
    var st = JSON.parse(localStorage.getItem('bos_launcher_state_v2') || 'null');
    if (!st || !st.activeProfileId) return null;
    var alle = (window.BOS_PROFILES || []).concat(st.localProfiles || []);
    var p = alle.find(function(x){ return x.id === st.activeProfileId; });
    return p ? p.name : null;
  } catch (e) { return null; }
}

async function planungEinreichen(opt) {
  var trotzdemId = (opt && opt.trotzdem) || null;   // 08.11.2026 (Schritt 2): „Trotzdem einreichen“ für genau diese fremde Einreichung
  var btn = document.getElementById('btn-export');
  if (btn.classList.contains('disabled') || btn.disabled) return;
  if (einreichSperre()) { updateExportBar(); return; }   // 08.11.2026: nicht nur über die Knopf-Klasse

  var produkteDaten = {};
  var mind1 = false;
  // 02.11.2026 (Wochenzettel): Tagesaufteilung über plan_tage.js. Fehlt das Modul
  // (alte Fassung im Zwischenspeicher), wird ohne tage eingereicht — sichtbar gemeldet.
  var tageModul = window.BOS_PLAN_TAGE && typeof window.BOS_PLAN_TAGE.ausKette === 'function' ? window.BOS_PLAN_TAGE : null;
  PRODUKTE.forEach(function(prod) {
    var s = state[prod.bosId];
    var prodOffsets = Object.keys(s.prodTage).filter(function(k){ return s.prodTage[k]; });
    if (s.zielOff === null || !prodOffsets.length) return;
    mind1 = true;
    var result = getResult(prod.bosId);
    var bstAnteil = bestellAnteil(prod.bosId);   // 08.11.2026
    var dE = DATEN[prod.bosId] || {};             // 08.11.2026 (Schritt 2)
    produkteDaten[prod.legacyKey] = {
      name: prod.name,
      zielOff: s.zielOff,
      prodTage: s.prodTage,
      manuelleWerte: s.manuelleWerte,
      gesperrtWerte: s.gesperrtWerte,
      startBestand: s.startBestand,
      fehlmengeAbs: wirksameFehlmenge(prod.bosId),      // 08.11.2026: wirksamer Wert (0 bei Nein), Feld bleibt für alte Leser
      fehlmengeFroster: wirksameFehlmenge(prod.bosId),  // 08.11.2026: neuer Name, derselbe Wert
      bestellungen: bstAnteil ? BR.fuerEinreichung(bstAnteil) : [],   // 08.11.2026: eingeplante Bestellungen [{id, datum, menge}]
      gesamtProduktion: result ? rd(result.gesamtProduktion) : 0,
      endlager: result ? rd(result.endlager) : 0,
      warnungen: result ? result.warnungen : [],
      bedarfsQuelle: prod.quelle,   // 15.10.2026 (#63): womit gerechnet wurde (Datenbankwert)
      // 08.11.2026 (Schritt 2): Schalter und Teile des Bestands (startBestand bleibt der wirksame Wert)
      gleichmaessig: !!s.gleichmaessig,
      bestandZaehlung: (dE.frisch && typeof dE.zaehlung === 'number') ? dE.zaehlung : null,
      bestandProduktion: (dE.frisch && !dE.produktionFehler) ? (dE.produktion || 0) : null,
      bestandVonHand: !!s.bestandVonHand
    };
    if (tageModul) produkteDaten[prod.legacyKey].tage = tageModul.ausKette(result);   // 02.11.2026: Tagesmengen für den Wochenzettel
  });
  if (!mind1) return;
  var abdruckEingereicht = planungsAbdruck();   // #77 Teil 2: Stand beim Zusammenstellen, VOR dem await

  var urspruenglicherText = btn.textContent;
  btn.disabled = true;
  einreichenLaeuft = true;   // #77 Teil 2: „wird gerade gespeichert“ bis zum Ende von try/catch

  // 08.11.2026 (Schritt 2, E5): Doppel-Prüfung. Scheitert sie, wird nicht eingereicht.
  btn.textContent = 'Wird geprüft …';
  var neueste;
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    neueste = await holeNeuesteDerWoche();
  } catch (fehler) {
    console.warn('[Station] Prüfung vor dem Einreichen fehlgeschlagen', fehler);
    btn.textContent = '⚠ Nicht eingereicht — nochmal tippen';
    btn.disabled = false;
    var cntP = document.getElementById('export-count');
    cntP.textContent = '⚠ Prüfung vor dem Einreichen fehlgeschlagen, nicht eingereicht: ' + fehlerGrund(fehler) + (fehler && fehler.code && String(fehler.message || '').indexOf(fehler.code) < 0 ? ' (' + fehler.code + ')' : '');
    cntP.style.color = 'var(--bos-red)';
    einreichenLaeuft = false;
    return;
  }
  if (neueste && neueste._docId !== BEKANNTE_ID && neueste._docId !== trotzdemId) {
    DOPPEL = neueste;
    renderDoppel();
    btn.textContent = urspruenglicherText;
    btn.disabled = false;
    einreichenLaeuft = false;
    return;
  }
  btn.textContent = 'Wird eingereicht …';

  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    var neuRef = await window.db.collection('bos_events').add({
      type: 'produktionsplan_einreichung',
      station: STATION_CFG,
      woche: isoDatum(wochenMo),
      planungsTag: isoDatum(heute),   // 08.11.2026: „heute“ der Station, auf das sich alle Versätze beziehen
      frosterFertig: frosterFertig,
      eingereichtVon: aktuellerProfilName(),
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      produkte: produkteDaten
    });
    gemerkterAbdruck = abdruckEingereicht;   // #77 Teil 2: nur bei Erfolg; spätere Änderungen bleiben „ungespeichert“
    // 08.11.2026: Kennzeichen sofort gegen die eigene neue Einreichung (ersetzt die der Planungswoche)
    var wIso = isoDatum(wochenMo);
    var eigene = { _docId: neuRef && neuRef.id ? neuRef.id : null, station: STATION_CFG, woche: wIso, planungsTag: isoDatum(heute), eingereichtVon: aktuellerProfilName(), ts: new Date(), produkte: produkteDaten };
    EINREICHUNGEN_KZ = EINREICHUNGEN_KZ.filter(function (e) { return e.woche !== wIso; }).concat([eigene]);
    // 08.11.2026 (Schritt 2): ab jetzt beruht der Stand auf der eigenen Einreichung
    BEKANNTE_ID = eigene._docId;
    LADE_STAND = { id: eigene._docId, von: eigene.eingereichtVon, ts: eigene.ts, produkte: produkteDaten, art: 'eigene', leer: false, hinweise: {}, oben: [] };
    DOPPEL = null; SPAET_ANGEBOT = null; LEER_FRAGE = false;
    renderDoppel(); renderSeitenHinweise();
    recalcAll();
    btn.textContent = '✓ Eingereicht';
    var cntOk = document.getElementById('export-count');
    if (!tageModul) {   // 02.11.2026: eingereicht, aber ohne Tagesaufteilung — nicht still
      cntOk.textContent = '⚠ Eingereicht, aber ohne Tagesaufteilung (plan_tage.js nicht geladen) — Seite neu laden und nochmal einreichen.';
      cntOk.style.color = 'var(--bos-warn, var(--bos-amber))';
    }
    setTimeout(function() {
      btn.textContent = urspruenglicherText;
      btn.disabled = false;
    }, 2500);
  } catch (fehler) {
    console.warn('Produktionsplaner Frühschicht: Einreichen fehlgeschlagen', fehler);
    btn.textContent = '⚠ Fehlgeschlagen — nochmal tippen';
    btn.disabled = false;
    // 13.10.2026: echter Grund sichtbar unter dem Knopf (Projektregel err.message)
    var cnt = document.getElementById('export-count');
    cnt.textContent = '⚠ ' + fehlerGrund(fehler);
    cnt.style.color = 'var(--bos-red)';
  }
  einreichenLaeuft = false;   // #77 Teil 2
}

// ── BESTELLBLOCK (08.11.2026) ───────────────────────────────────────
// Immer sichtbar, unabhängig von der Froster-Frage. Zeile: Menge · Tag · Notiz ·
// eingetragen von … · Kennzeichen · Löschen (Rückfrage auf der Seite).
function fmtTagKurz(iso) { var d = BR.ausIso(iso); return d ? WT_KURZ_JS[d.getDay()] + ' ' + fmtD(d) : String(iso); }
function fmtWann(ts) {
  var d = BR.alsDatum(ts);
  if (!d) return 'gerade eben';
  return WT_KURZ_JS[d.getDay()] + ' ' + fmtD(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function bestellTagOffsets() {   // morgen … So der Woche nach der Planungswoche (Ziel-Grenze der Station)
  var bis = naechsteWocheOffsets[6], r = [];
  for (var o = 1; o <= bis; o++) r.push(o);
  return r;
}
function baueBestellBlock(bosId, eh) {
  var s = state[bosId];
  var html = '<div class="bst-block" id="bst-' + bosId + '"><div class="bst-kopf"><span>📋 Bestellungen</span>'
           + '<a href="bestellungen.html">Alle Bestellungen →</a></div>';
  if (BESTELL_STAND.fehler) {
    html += '<div class="bst-leer bst-fehler">⚠ Bestellungen nicht geladen: ' + fehlertextMitLink(escText(BESTELL_STAND.fehler)) + '</div>';
  } else {
    html += baueBestellZeilen(bosId, eh);
  }
  return html + '</div>';
}
function baueBestellZeilen(bosId, eh) {
  var s = state[bosId], html = '';
  var eigene = BESTELLUNGEN.filter(function (b) { return b.legacyKey === bosId; });
  if (!eigene.length) html += '<div class="bst-leer">Keine Bestellungen in dieser Planung.</div>';
  eigene.forEach(function (b) {
    var d = BR.ausIso(b.datum);
    var off = d ? BR.tageAbstand(heute, d) : null;
    var marken = [];
    if (off === null || off < 1) marken.push(['aus', 'liegt außerhalb der Planung, nicht eingerechnet']);
    else if (s.zielOff === null) marken.push(['aus', 'wird eingerechnet, sobald ein Ziel gewählt ist']);
    else if (off > s.zielOff) marken.push(['aus', 'liegt außerhalb der Planung, nicht eingerechnet']);
    else if (frosterFertig === true && off === 1) marken.push(['aus', 'morgen — gehört zur Vorbereitung oder ins Fehlmenge-Feld']);
    if (off !== null && off >= 1 && (TAGESTYPEN[off] || 'normal') === 'zu') marken.push(['zu', 'Bestellung an einem geschlossenen Tag']);
    var kz = BR.kennzeichen(b, EINREICHUNGEN_KZ);
    if (kz === 'neu') marken.push(['neu', BR.KENNZEICHEN_TEXT.neu]);
    else if (kz === 'eingeplant') marken.push(['eingeplant', '✓ ' + BR.KENNZEICHEN_TEXT.eingeplant]);
    var idA = escText(b.id);
    // 09.11.2026 (Schritt 4): Teil eines Auftrags mit mehreren Positionen → Hinweis, Notiz steht dort
    var nPos = b.auftragId ? AUFTRAG_POS.zahl[b.auftragId] : 0;
    var imAuftrag = nPos > 1;
    html += '<div class="bst-zeile" data-bestellung="' + idA + '"' + (b.auftragId ? ' data-auftrag="' + escText(b.auftragId) + '"' : '') + '><div class="bst-haupt"><div class="bst-text"><b>' + escText(rd2(b.menge)) + ' ' + eh + '</b> · ' + escText(fmtTagKurz(b.datum))
          + (b.notiz && !imAuftrag ? ' · ' + escText(b.notiz) : '') + ' · eingetragen' + (b.eingetragenVon ? ' von ' + escText(b.eingetragenVon) : '') + ' ' + escText(fmtWann(b.ts)) + '</div>'
          + (BST_FRAGE === b.id ? '' : '<button class="bst-btn" onclick="bstFrage(\'' + idA + '\')">Löschen</button>') + '</div>'
          + marken.map(function (m) { return '<span class="bst-marke ' + m[0] + '">' + escText(m[1]) + '</span>'; }).join('');
    if (imAuftrag) html += '<div class="bst-auftrag">aus Auftrag ' + (b.notiz ? '<b>' + escText(b.notiz) + '</b> ' : '') + '(' + nPos + ' Positionen) → <a href="bestellungen.html">Bestellungen</a></div>';
    else if (b.auftragId && AUFTRAG_POS.fehler) html += '<div class="bst-auftrag fehler">⚠ Weitere Positionen des Auftrags nicht geladen: ' + escText(AUFTRAG_POS.fehler) + ' — die Rechnung ist davon nicht betroffen.</div>';
    if (BST_FRAGE === b.id) {
      html += '<div class="bst-frage">Wirklich löschen? <button class="bst-btn rot" ' + (BST_LAEUFT[b.id] ? 'disabled ' : '') + 'onclick="bstLoeschen(\'' + idA + '\')">Ja, löschen</button>'
            + '<button class="bst-btn" onclick="bstFrage(null)">Abbrechen</button></div>';
    }
    if (BST_FEHLER[b.id]) html += '<div class="bst-fehler">⚠ Löschen fehlgeschlagen: ' + escText(BST_FEHLER[b.id]) + '</div>';
    html += '</div>';
  });
  // + Bestellung
  var f = BST_FORM[bosId] || {};
  html += '<div class="bst-neu">';
  if (!f.offen) {
    html += '<button class="bst-btn haupt" onclick="bstFormAuf(\'' + bosId + '\')">+ Bestellung</button>';
  } else {
    var optionen = bestellTagOffsets().map(function (o) {
      var dt = offsetToDate(o), iso = isoDatum(dt), zu = (TAGESTYPEN[o] || 'normal') === 'zu';
      return '<option value="' + iso + '"' + (f.tag === iso ? ' selected' : '') + '>' + WT_KURZ_JS[dt.getDay()] + ' ' + fmtD(dt) + (zu ? ' 🔒 zu' : '') + '</option>';
    }).join('');
    html += '<div class="bst-form">'
          + '<select data-bst-tag="' + bosId + '" onchange="bstFeld(\'' + bosId + '\', \'tag\', this.value)"><option value="">— Tag —</option>' + optionen + '</select>'
          + '<input data-bst-menge="' + bosId + '" type="text" inputmode="decimal" placeholder="Menge (' + eh + ')" aria-label="Menge (' + eh + ')" value="' + escText(f.menge || '') + '" oninput="bstFeld(\'' + bosId + '\', \'menge\', this.value)">'
          + '<input class="bst-notiz" data-bst-notiz="' + bosId + '" type="text" maxlength="' + BR.NOTIZ_MAX + '" placeholder="Notiz (optional, z. B. Kunde)" value="' + escText(f.notiz || '') + '" oninput="bstFeld(\'' + bosId + '\', \'notiz\', this.value)">'
          + '<div class="bst-aktion"><button class="bst-btn haupt" ' + (f.laeuft ? 'disabled ' : '') + 'onclick="bstSpeichern(\'' + bosId + '\')">' + (f.laeuft ? 'Wird gespeichert …' : 'Speichern') + '</button>'
          + '<button class="bst-btn" onclick="bstFormZu(\'' + bosId + '\')">Abbrechen</button></div>'
          + '</div>' + (f.fehler ? '<div class="bst-fehler">⚠ ' + escText(f.fehler) + '</div>' : '');
  }
  html += '</div>';
  return html;
}
function rd2(n) { var x = Math.round(Number(n) * 100) / 100; return String(x).replace('.', ','); }
function bstFormAuf(bosId) { if (frosterFertig === null) return; BST_FORM[bosId] = { offen: true, tag: '', menge: '', notiz: '' }; rebuildCard(bosId); }
function bstFormZu(bosId) { delete BST_FORM[bosId]; rebuildCard(bosId); }
function bstFeld(bosId, feld, wert) { if (BST_FORM[bosId]) BST_FORM[bosId][feld] = wert; }
async function bstSpeichern(bosId) {
  var f = BST_FORM[bosId];
  if (!f || f.laeuft || frosterFertig === null) return;
  var prod = PRODUKTE.find(function (x) { return x.bosId === bosId; });
  var menge = BR.mengeAusText(f.menge);
  if (!BR.istIso(f.tag)) { f.fehler = 'Bitte einen Tag wählen.'; rebuildCard(bosId); return; }
  if (menge === null) { f.fehler = 'Bitte eine Menge größer 0 eintragen.'; rebuildCard(bosId); return; }
  f.laeuft = true; f.fehler = null; rebuildCard(bosId);
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    // 09.11.2026 (Schritt 4): eigener Auftrag mit einer Position (auftragId aus doc().id, nichts geschrieben)
    var auftragId = window.db.collection('bos_events').doc().id;
    await window.db.collection('bos_events').add({
      type: BR.TYP,
      station: STATION_CFG,
      legacyKey: prod.legacyKey,
      produktName: prod.name,
      datum: f.tag,
      menge: menge,
      notiz: BR.notizAusText(f.notiz),
      auftragId: auftragId,
      pos: 0,
      eingetragenVon: aktuellerProfilName(),
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
    delete BST_FORM[bosId];   // die Zeile kommt über onSnapshot
    rebuildCard(bosId);
  } catch (e) {
    console.error('[Station] Bestellung speichern:', e);
    f.laeuft = false;
    f.fehler = 'Speichern fehlgeschlagen: ' + fehlerGrund(e) + bstRat(e);
    rebuildCard(bosId);
  }
}
function bstRat(e) {
  var c = e && e.code;
  if (c === 'permission-denied') return ' — dieses Konto darf das nicht, Ulf Bescheid sagen.';
  if (c === 'unavailable' || c === 'deadline-exceeded') return ' — keine Verbindung zur Datenbank, Netz prüfen und nochmal versuchen.';
  return '';
}
function bstFrage(id) {
  BST_FRAGE = id;
  if (id) delete BST_FEHLER[id];
  recalcAll();
}
async function bstLoeschen(id) {
  if (BST_LAEUFT[id]) return;
  BST_LAEUFT[id] = true; recalcAll();
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    await window.db.collection('bos_events').doc(id).delete();
    BST_FRAGE = null;
  } catch (e) {
    console.error('[Station] Bestellung löschen:', e);
    BST_FEHLER[id] = fehlerGrund(e) + bstRat(e);
  }
  delete BST_LAEUFT[id];
  recalcAll();
}

function ppOeffneHilfe() {
  const inhalt = document.getElementById('pp-hilfe-inhalt');
  inhalt.innerHTML = PP_HILFE_SCHRITTE.map(function (s) {
    return '<div class="pp-hilfe-schritt"><div class="pp-hilfe-titel">' + s[0] + '</div><div class="pp-hilfe-text">' + s[1] + '</div></div>';
  }).join('');
  document.getElementById('pp-hilfe-modal').style.display = 'block';
}
function ppSchliesseHilfe() {
  document.getElementById('pp-hilfe-modal').style.display = 'none';
}
