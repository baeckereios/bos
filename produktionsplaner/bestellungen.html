<!-- 2026-11-08 · 15:38 · v1.0 · Feature — Erstfassung (Produktionsplaner Schritt 1, Go Kontroll-Chat 08.11., 14:45, Freigabe §3; Ulf 08.11., 14:42/14:44: „eine eigene Seite … wo wir sauber alle Bestellungen in einer Liste vor uns sehen? Und auch hinzufügen und ggf wieder löschen können?“). Alle Bestellungen (bos_events, type produktionsplan_bestellung) in einer Liste, nach Tag sortiert, Filter Station und Produkt; je Zeile Tag, Station, Produkt, Menge mit Einheit, Notiz, wer, wann, Kennzeichen (bestell_regeln.js: eingeplant · neu seit Einreichung — noch nicht eingeplant · ohne = kommt in eine spätere Planung), Löschen mit Rückfrage auf der Seite. Eintragen mit Tag frei ab morgen (keine Grenze nach vorne). Vergangene eingeklappt, nichts gelöscht. Zeilen „Bestellung gelöscht, steckt noch in der eingereichten Planung von …“. Alte Nachträge (produktionsplan_nachtrag) nur lesen. Abfrage nur type == … (kein Index), Rest im Gerät; Einreichungen der Wochen aus wochenFuerTage(). Fehler sichtbar mit Grund, Zeitlimit beim Speichern. SESSION_2026-11-08_PRODUKTIONSPLANER_FROSTER_BESTELLUNGEN_BAU.md -->

<style>
  body { padding-bottom: 60px; margin: 0; background: var(--bos-bg); }
  * { box-sizing: border-box; }

  .nfc-header { background:var(--bos-surface); border-bottom:1px solid var(--bos-border); padding:14px 16px; position: sticky; top: 0; z-index: 100; }

  .nfc-back   { font-family:var(--bos-font-label); font-weight:800; font-size:0.72rem; color:var(--bos-text-dim); text-decoration:none; white-space:nowrap; padding-top:4px; -webkit-tap-highlight-color:transparent; }
  .nfc-header-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }

  #pp-hilfe-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; overflow-y:auto; }

  .pp-hilfe-schritt { margin-bottom:18px; padding-bottom:14px; border-bottom:1px dashed var(--bos-border); }

  .brain-status { padding:8px 16px; text-align:center; font-size:0.75rem; font-family:var(--bos-font-label); font-weight:700; letter-spacing:0.5px; border-bottom:2px solid var(--bos-border); overflow-wrap:anywhere; }
  .brain-status.loading { color:var(--bos-amber); background:color-mix(in srgb, var(--bos-amber) 6%, transparent); }
  .brain-status.ready   { color:var(--bos-green);  background:rgba(77,184,122,0.06); }

  .container { max-width:640px; margin:0 auto; padding:14px 12px 20px; }

  .karte-titel { font-family:var(--bos-font-display); font-weight:900; font-size:1rem; color:var(--bos-text); margin-bottom:10px; }
  .feld-raster { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .feld-raster .ganz { grid-column:1 / -1; }
  .feld-label { display:block; font-family:var(--bos-font-label); font-weight:800; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--bos-text-dim); margin-bottom:3px; }
  .feld { width:100%; padding:9px 8px; border-radius:10px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); color:var(--bos-text); font-family:var(--bos-font-body); font-size:0.9rem; }

  .meldung.ok { color:var(--bos-green); } .meldung.fehler { color:var(--bos-red); } .meldung.info { color:var(--bos-text-dim); }

  .filter { display:flex; gap:8px; margin-bottom:10px; }
  .filter .feld { font-family:var(--bos-font-label); font-weight:800; font-size:0.8rem; }

  .abschnitt-titel { font-family:var(--bos-font-label); font-weight:900; font-size:0.7rem; text-transform:uppercase; letter-spacing:1.2px; color:var(--bos-amber); margin:16px 2px 6px; }
  .tag-kopf { font-family:var(--bos-font-display); font-weight:900; font-size:0.95rem; color:var(--bos-text); margin:12px 2px 4px; }
  .bst-zeile { background:var(--bos-surface); border:1.5px solid var(--bos-border-strong); border-radius:12px; padding:9px 11px; margin-bottom:6px; font-family:var(--bos-font-label); font-size:0.78rem; font-weight:700; color:var(--bos-text-dim); }
  .bst-zeile.neu { border-color:var(--bos-warn); }
  .bst-zeile.geloescht { border-style:dashed; border-color:var(--bos-red); }
  .bst-haupt { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .bst-text { min-width:0; overflow-wrap:anywhere; line-height:1.45; }
  .bst-text b { color:var(--bos-text); font-weight:900; }
  .bst-marke { display:inline-block; margin:4px 6px 0 0; padding:1px 7px; border-radius:6px; font-size:0.66rem; font-weight:800; }
  .bst-marke.neu { color:var(--bos-warn-bright); border:1px solid var(--bos-warn); background:var(--bos-warn-glow-soft); }
  .bst-marke.eingeplant { color:var(--bos-green); border:1px solid rgba(77,184,122,.5); }
  .bst-marke.spaeter, .bst-marke.vergangen, .bst-marke.alt { color:var(--bos-text-faint); border:1px solid var(--bos-border-strong); }
  .bst-marke.geloescht { color:var(--bos-red); border:1px solid var(--bos-red); }
  .bst-btn { padding:5px 10px; border-radius:8px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); color:var(--bos-text-dim); font-family:var(--bos-font-label); font-weight:900; font-size:0.7rem; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  /* 09.11.2026 (Schritt 4): Aufträge */
  .pos-zeile { display:grid; grid-template-columns:1fr 34% 34px; gap:6px; align-items:end; margin-bottom:6px; }
  .pos-zeile .feld-label { margin-top:0; }
  .pos-weg { height:38px; border-radius:10px; border:1.5px solid var(--bos-border-strong); background:var(--bos-surface-raised); color:var(--bos-text-dim); font-weight:900; cursor:pointer; }
  .auftrag { border:1.5px solid var(--bos-border-strong); border-radius:14px; padding:8px 8px 4px; margin-bottom:8px; }
  .auftrag-kopf { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:var(--bos-font-label); font-weight:900; font-size:0.85rem; color:var(--bos-text); margin:0 2px 6px; }
  .auftrag-titel { flex:1; min-width:0; overflow-wrap:anywhere; }
  .auftrag-zahl { font-size:0.7rem; color:var(--bos-text-dim); }
  .auftrag .bst-zeile { margin-bottom:4px; }
  .bst-zeile.sonst { border-style:dashed; }
  .bst-marke.sonstiges { color:var(--bos-amber); border:1px solid var(--bos-amber); }
  .pos-neu { display:grid; grid-template-columns:1fr 34%; gap:6px; margin:4px 0 6px; }
  .pos-neu .bst-aktion { grid-column:1 / -1; display:flex; gap:6px; }
  .bst-btn.rot { border-color:var(--bos-red); color:var(--bos-red); }
  .bst-btn:disabled { opacity:.5; cursor:not-allowed; }
  .bst-frage { display:flex; align-items:center; gap:6px; margin-top:6px; color:var(--bos-red); font-weight:800; flex-wrap:wrap; }
  .bst-fehler { margin-top:4px; color:var(--bos-red); font-weight:800; overflow-wrap:anywhere; }
  .leer { font-family:var(--bos-font-label); font-weight:700; font-size:0.78rem; color:var(--bos-text-faint); padding:6px 2px; }
  details.klapp { margin-top:14px; }
  details.klapp > summary { cursor:pointer; font-family:var(--bos-font-label); font-weight:900; font-size:0.72rem; text-transform:uppercase; letter-spacing:1px; color:var(--bos-text-dim); padding:6px 2px; -webkit-tap-highlight-color:transparent; }
  .seiten-hinweis { margin:0 0 10px; padding:9px 12px; border-radius:10px; border:1.5px solid var(--bos-red); background:rgba(201,74,74,0.08); color:var(--bos-red); font-family:var(--bos-font-label); font-weight:800; font-size:.78rem; line-height:1.4; overflow-wrap:anywhere; }
  .seiten-hinweis a { color:inherit; text-decoration:underline; }
</style>

<script>
// ── i18n-Hook (Checkliste §6; bisher nur Deutsch) ─────────────────────
var I18N_DE = {
  laden: '⏳ Bestellungen werden geladen…',
  geladen: function (n) { return '✓ ' + n + ' Bestellung' + (n === 1 ? '' : 'en') + ' geladen'; },
  ladeFehler: '⚠ Bestellungen konnten nicht geladen werden: ',
  kennzeichenFehler: '⚠ Einreichungen nicht gelesen — die Kennzeichen „eingeplant / noch nicht eingeplant“ fehlen: ',
  nachtragFehler: '⚠ Alte Nachträge nicht gelesen: ',
  produktFehler: '⚠ Produktliste nicht geladen: ',
  keineKommenden: 'Keine kommenden Bestellungen.',
  keineVergangenen: 'Keine vergangenen Bestellungen.',
  keineNachtraege: 'Keine alten Nachträge.',
  produktWaehlen: 'Bitte ein Produkt wählen.',
  textFehlt: 'Bitte den Text für „Sonstiges“ eintragen.',
  sonstFehler: '⚠ Sonstige Bestellungen nicht geladen: ',
  auftragFrage: function (n) { return 'Auftrag mit ' + n + ' Positionen löschen?'; },
  tagWaehlen: function (m) { return 'Bitte einen Tag ab morgen (' + m + ') wählen.'; },
  mengeFehlt: 'Bitte eine Menge größer 0 eintragen.',
  speichert: 'Wird gespeichert …',
  gespeichert: function (t) { return '✓ Eingetragen: ' + t; },
  zeitlimit: 'Keine Bestätigung vom Server nach 15 Sekunden — Netz prüfen. Die Bestellung erscheint in der Liste, sobald sie gespeichert ist; erst dann nochmal versuchen.',
  speichernFehler: 'Speichern fehlgeschlagen: ',
  loeschenFehler: 'Löschen fehlgeschlagen: ',
  wirklich: 'Wirklich löschen?',
  jaLoeschen: 'Ja, löschen',
  abbrechen: 'Abbrechen',
  loeschen: 'Löschen',
  geloescht: function (st) { return 'Bestellung gelöscht, steckt noch in der eingereichten Planung von ' + st; },
  alterNachtrag: 'alter Nachtrag (ohne Tag)',
  vergangen: 'vergangen',
  spaeter: 'kommt in eine spätere Planung',
  unerwartet: '⚠ Unerwarteter Fehler: '
};
function t(k) { var v = I18N_DE[k]; return typeof v === 'function' ? v.apply(null, Array.prototype.slice.call(arguments, 1)) : (v !== undefined ? v : k); }

var STATIONEN = [
  { station: 'Rondo',           icon: '🔄' },
  { station: 'Brötchenstraße',  icon: '🥐' },
  { station: 'Frühschicht',     icon: '🌅' },
  { station: 'Nachtschicht',    icon: '🌙' }
];
var BR = window.BOS_BESTELL_REGELN || null;
var heute = new Date(); heute.setHours(0, 0, 0, 0);
var WT_KURZ_JS = ['So','Mo','Di','Mi','Do','Fr','Sa'];

var BESTELLUNGEN = [];          // alle Bestellungen (mit id)
// 09.11.2026 (Schritt 4): sonstige Positionen (eigener Typ), Formular, Auftrags-Aktionen
var SONSTIGE = [], SONST_FEHLER = null, SONST_GELADEN = false;
var FORM_POS = [{ wahl: '', menge: '', text: '' }];
var PRODUKT_OPTIONEN = '';      // <optgroup>… der laufenden Stationsprodukte
var PRODUKT_WAHL = {};          // legacyKey → { station, name }
var AFRAGE = null, ALAEUFT = {}, AFEHLER = {};
var APOS = null;                // „+ Position“ an einem Auftrag: { key, wahl, menge, text, laeuft, fehler }
var SONST = '__sonstiges';
var BESTELL_FEHLER = null;
var BESTELL_GELADEN = false;
var EINREICHUNGEN = [];         // neueste je Station und Woche, aus den Wochen, die die Tage abdecken können
var EINR_WOCHEN = '';           // geladene Wochenliste (als Schlüssel)
var EINR_FEHLER = null;
var NACHTRAEGE = [];
var NACHTRAG_FEHLER = null;
var PRODUKT_JE_KEY = {};
var PRODUKT_FEHLER = null;
var FRAGE = null, LAEUFT = {}, FEHLER = {};
var speichernLaeuft = false;
var SEITEN_FEHLER = null;

function esc(x) { return String(x === undefined || x === null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function setStatus(cls, text) { var el = document.getElementById('brain-status'); el.className = 'brain-status ' + cls; el.textContent = text; }
function fehlerText(e) { var x = (e && e.message) || String(e); if (e && e.code && x.indexOf(e.code) < 0) x += ' (' + e.code + ')'; return x; }
function fehlerRat(e) {
  var c = e && e.code;
  if (c === 'permission-denied') return ' — dieses Konto darf das nicht, Ulf Bescheid sagen.';
  if (c === 'unavailable' || c === 'deadline-exceeded') return ' — keine Verbindung zur Datenbank, Netz prüfen und die Seite neu laden.';
  return '';
}
function mitLink(text) { return esc(text).replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">Index anlegen</a>'); }
function heuteIso() { return BR.datumLokal(heute); }
function morgenIso() { return BR.plusTageIso(heuteIso(), 1); }
function einheitKurz(lk) {
  var p = PRODUKT_JE_KEY[lk];
  return (p && window.BOS_PRODUKTE && window.BOS_PRODUKTE.einheit) ? window.BOS_PRODUKTE.einheit(p).kurz : 'Bl.';
}
function stationIcon(st) { var s = STATIONEN.find(function (x) { return x.station === st; }); return s ? s.icon : '•'; }
function fmtTag(iso) { var d = BR.ausIso(iso); return d ? WT_KURZ_JS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' : esc(iso); }
function fmtTagLang(iso) {
  var d = BR.ausIso(iso); if (!d) return esc(iso);
  return ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
}
function fmtWann(ts) {
  var d = BR.alsDatum(ts); if (!d) return 'gerade eben';
  return WT_KURZ_JS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '. ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function zahl(n) { return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }
function aktuellerProfilName() {
  try {
    var st = JSON.parse(localStorage.getItem('bos_launcher_state_v2') || 'null');
    if (!st || !st.activeProfileId) return null;
    var alle = (window.BOS_PROFILES || []).concat(st.localProfiles || []);

async function ladeProdukte() {
  try {
    if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    if (typeof window.BOS_PRODUKTE.bedarfsQuelle !== 'function') throw new Error('bos_produkte.js ist in einer alten Fassung geladen — Seite neu laden (neue Fassung noch nicht online?)');
    var aktive = (await window.BOS_PRODUKTE.lade({ sicht: 'aktive' })).liste;
    aktive.forEach(function (p) { if (p && p.legacyKey) PRODUKT_JE_KEY[p.legacyKey] = p; });
    var laufend = (await window.BOS_PRODUKTE.lade({ sicht: 'laufend' })).liste.filter(function (p) { return p.nfcSeite === true && p.legacyKey; });
    // 09.11.2026 (Schritt 4): dieselben Optionen für jede Positionszeile

      if (!hier.length) return;

  }
  fuelleFilter();
  renderHinweise();
}

// Nur type == … (kein Index nötig, Menge auf Jahre klein); Rest im Gerät.
function starteBestellungen() {
  try {
    window.db.collection('bos_events').where('type', '==', BR.TYP).onSnapshot(function (snap) {
      var l = [];
      snap.forEach(function (doc) { var d = doc.data(); d.id = doc.id; l.push(d); });
      BESTELLUNGEN = BR.sortiere(l);
      BESTELL_FEHLER = null; BESTELL_GELADEN = true;
      setStatus('ready', t('geladen', BESTELLUNGEN.length));
      fuelleFilter();
      ladeEinreichungen();

    }, function (e) {
      console.error('[Bestellungen] Laden:', e);

      renderListe();
    });
  } catch (e) {
    BESTELL_FEHLER = fehlerText(e);
    setStatus('error', t('ladeFehler') + BESTELL_FEHLER);
    renderListe();
  }
}
// 09.11.2026 (Schritt 4): sonstige Positionen, eigener Typ, nur type ==
function starteSonstige() {

// Einreichungen aller Wochen, die einen kommenden Tag abdecken können (inkl. heute).
function noetigeWochen() {
  var tage = BESTELLUNGEN.filter(function (b) { return b.datum >= heuteIso(); }).map(function (b) { return b.datum; });
  tage.push(heuteIso());
  return BR.wochenFuerTage(tage);
}
async function ladeEinreichungen() {
  var wochen = noetigeWochen();
  var schluessel = wochen.join(',');
  if (schluessel === EINR_WOCHEN && !EINR_FEHLER) return;
  try {
    var liste = [];
    var abfragen = BR.stuecke(wochen, 30).map(function (teil) {
      return window.db.collection('bos_events').where('type', '==', 'produktionsplan_einreichung').where('woche', 'in', teil).get()
        .then(function (snap) { snap.forEach(function (doc) { liste.push(doc.data()); }); });
    });
    await Promise.all(abfragen);
    EINREICHUNGEN = BR.neuesteJeStationUndWoche(liste);
    EINR_WOCHEN = schluessel; EINR_FEHLER = null;
  } catch (e) {
    console.error('[Bestellungen] Einreichungen:', e);
    EINR_FEHLER = fehlerText(e) + fehlerRat(e);
  }
  renderHinweise();
  renderListe();
}
function ladeNachtraege() {
  return window.db.collection('bos_events').where('type', '==', 'produktionsplan_nachtrag').get().then(function (snap) {
    var l = []; snap.forEach(function (doc) { l.push(doc.data()); });
    l.sort(function (a, b) { return BR.alsMillis(b.ts) - BR.alsMillis(a.ts); });
    NACHTRAEGE = l; NACHTRAG_FEHLER = null;
  }).catch(function (e) {
    console.error('[Bestellungen] Alte Nachträge:', e);
    NACHTRAG_FEHLER = fehlerText(e) + fehlerRat(e);
  }).then(function () { renderHinweise(); renderListe(); });
}

      + posWahlHtml(posId('neu-produkt', i), z.wahl, 'posWahl(' + i + ')') + '</div>'

      + '<input class="feld zahl" id="' + posId('neu-menge', i) + '" type="text" inputmode="decimal" placeholder="' + esc(z.wahl && !sonst ? 'z. B. 5 ' + einheitKurz(z.wahl) : 'z. B. 5') + '" value="' + esc(z.menge) + '" oninput="formGeaendert()"' + (sonst ? ' style="display:none"' : '') + '>'
      + '<input class="feld" id="' + posId('neu-text', i) + '" type="text" maxlength="' + BR.TEXT_MAX + '" placeholder="z. B. Hochzeitstorte" value="' + esc(z.text) + '" oninput="formGeaendert()"' + (sonst ? '' : ' style="display:none"') + '></div>'
      + '<button class="pos-weg" data-pos-weg="' + i + '" onclick="positionWeg(' + i + ')" aria-label="Position entfernen">✕</button></div>';
  }).join('');
}
function posWahl(i) { formLesen(); formGeaendert(); renderPositionen(); }
function positionDazu() { formLesen(); FORM_POS.push({ wahl: '', menge: '', text: '' }); renderPositionen(); }
function positionWeg(i) {
  formLesen();
  if (FORM_POS.length > 1) FORM_POS.splice(i, 1); else FORM_POS = [{ wahl: '', menge: '', text: '' }];
  renderPositionen(); formGeaendert();
}

// ── EINTRAGEN ────────────────────────────────────────────────────────
function mitZeitlimit(versprechen, ms) {
  return new Promise(function (ok, nein) {
    var z = setTimeout(function () { var e = new Error(t('zeitlimit')); e.code = 'zeitlimit'; nein(e); }, ms);
    versprechen.then(function (x) { clearTimeout(z); ok(x); }, function (e) { clearTimeout(z); nein(e); });
  });
}
// Eine Position aus Wahl/Menge/Text — { daten } oder { fehler }.
function positionAus(z) {
  if (z.wahl === SONST) {
    var text = BR.textAusText(z.text);
    return text ? { daten: { type: BR.TYP_SONSTIGES, text: text } } : { fehler: t('textFehlt') };
  }
  var info = PRODUKT_WAHL[z.wahl];
  if (!z.wahl || !info) return { fehler: t('produktWaehlen') };
  var menge = BR.mengeAusText(z.menge);
  if (menge === null) return { fehler: t('mengeFehlt') };
  return { daten: { type: BR.TYP, station: info.station, legacyKey: z.wahl, produktName: info.name, menge: menge } };
}
// 09.11.2026 (Schritt 4): alle Positionen eines Auftrags in EINEM Batch — alles oder nichts.
function schreibePositionen(liste, auftragId, startPos, tag, notiz) {
  var col = window.db.collection('bos_events');
  var batch = window.db.batch();
  var wer = aktuellerProfilName();
  liste.forEach(function (d, i) {
    var doc = { type: d.type };
    if (d.type === BR.TYP) { doc.station = d.station; doc.legacyKey = d.legacyKey; doc.produktName = d.produktName; doc.menge = d.menge; }
    else doc.text = d.text;
    doc.datum = tag; doc.notiz = notiz; doc.auftragId = auftragId; doc.pos = startPos + i;
    doc.eingetragenVon = wer; doc.ts = firebase.firestore.FieldValue.serverTimestamp();
    batch.set(col.doc(), doc);
  });
  return batch.commit();
}
async function bestellungEintragen() {
  if (speichernLaeuft) return;
  formLesen();
  var tag = document.getElementById('neu-tag').value;
  var notiz = BR.notizAusText(document.getElementById('neu-notiz').value);
  var m = document.getElementById('eintragen-meldung');
  function melde(text, art) { m.textContent = text; m.className = 'meldung ' + art; }
  var belegt = [];
  FORM_POS.forEach(function (z, i) { if (z.wahl || String(z.menge).trim() || String(z.text).trim()) belegt.push({ z: z, nr: i + 1 }); });
  var vor = function (x) { return belegt.length > 1 || FORM_POS.length > 1 ? 'Position ' + x.nr + ': ' : ''; };
  if (!belegt.length) return melde(t('produktWaehlen'), 'fehler');
  var ohneWahl = belegt.filter(function (x) { return !x.z.wahl; })[0];
  if (ohneWahl) return melde(vor(ohneWahl) + t('produktWaehlen'), 'fehler');
  if (!BR.istIso(tag) || tag < morgenIso()) return melde(t('tagWaehlen', fmtTag(morgenIso())), 'fehler');
  var daten = [];
  for (var i = 0; i < belegt.length; i++) {
    var r = positionAus(belegt[i].z);
    if (r.fehler) return melde(vor(belegt[i]) + r.fehler, 'fehler');
    daten.push(r.daten);
  }
  speichernLaeuft = true;
  var btn = document.getElementById('btn-eintragen'); btn.disabled = true; btn.textContent = t('speichert');
  melde('', 'info');
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    var auftragId = window.db.collection('bos_events').doc().id;   // neue Kennung, nichts geschrieben
    await mitZeitlimit(schreibePositionen(daten, auftragId, 0, tag, notiz), 15000);
    var d0 = daten[0], text;
    if (daten.length > 1) text = 'Auftrag ' + (notiz ? notiz + ' · ' : '') + fmtTag(tag) + ' · ' + daten.length + ' Positionen';
    else if (d0.type === BR.TYP) text = zahl(d0.menge) + ' ' + einheitKurz(d0.legacyKey) + ' ' + d0.produktName + ' für ' + fmtTag(tag) + ' (' + d0.station + ')';
    else text = '„' + d0.text + '“ für ' + fmtTag(tag) + ' (Sonstiges)';
    FORM_POS = [{ wahl: '', menge: '', text: '' }]; renderPositionen();
    ['neu-tag', 'neu-notiz'].forEach(function (id) { document.getElementById(id).value = ''; });
    melde(t('gespeichert', text), 'ok');
  } catch (e) {
    console.error('[Bestellungen] Speichern:', e);
    melde(e && e.code === 'zeitlimit' ? e.message : t('speichernFehler') + fehlerText(e) + fehlerRat(e), 'fehler');
  }
  speichernLaeuft = false;
  btn.disabled = false; btn.textContent = 'Eintragen';
}

// ── AUFTRAG: ganz löschen, Position nachtragen (09.11.2026, Schritt 4) ──
function findeAuftrag(key) { return BR.auftraege(BESTELLUNGEN, SONSTIGE).filter(function (a) { return a.schluessel === key; })[0] || null; }
function auftragFrage(key) { AFRAGE = key; if (key) delete AFEHLER[key]; renderListe(); }
async function auftragLoeschen(key) {
  var a = findeAuftrag(key);
  if (!a || ALAEUFT[key]) return;
  ALAEUFT[key] = true; renderListe();
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    var col = window.db.collection('bos_events'), batch = window.db.batch();
    a.positionen.forEach(function (p) { batch.delete(col.doc(p.id)); });
    await mitZeitlimit(batch.commit(), 15000);
    AFRAGE = null;
  } catch (e) {
    console.error('[Bestellungen] Auftrag löschen:', e);
    AFEHLER[key] = (e && e.code === 'zeitlimit') ? e.message : fehlerText(e) + fehlerRat(e);
  }
  delete ALAEUFT[key];
  renderListe();
}
function aposAuf(key) { APOS = { key: key, wahl: '', menge: '', text: '', laeuft: false, fehler: null }; renderListe(); }
function aposZu() { APOS = null; renderListe(); }
function aposFeld(f, w) { if (APOS) APOS[f] = w; }
async function positionNachtragen() {
  if (!APOS || APOS.laeuft) return;
  var a = findeAuftrag(APOS.key);
  if (!a) { APOS.fehler = 'Auftrag nicht mehr da.'; renderListe(); return; }
  var r = positionAus(APOS);
  if (r.fehler) { APOS.fehler = r.fehler; renderListe(); return; }
  APOS.laeuft = true; APOS.fehler = null; renderListe();
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    var naechste = a.positionen.reduce(function (m, p) { return typeof p.pos === 'number' && p.pos >= m ? p.pos + 1 : m; }, a.positionen.length);
    await mitZeitlimit(schreibePositionen([r.daten], a.auftragId, naechste, a.datum, a.notiz), 15000);
    APOS = null;
  } catch (e) {
    console.error('[Bestellungen] Position nachtragen:', e);
    APOS.laeuft = false;
    APOS.fehler = (e && e.code === 'zeitlimit') ? e.message : t('speichernFehler') + fehlerText(e) + fehlerRat(e);
  }
  renderListe();
}

// ── LÖSCHEN (Rückfrage auf der Seite, kein Browser-Dialog) ────────────
function frage(id) { FRAGE = id; if (id) delete FEHLER[id]; renderListe(); }
async function loeschen(id) {
  if (LAEUFT[id]) return;
  LAEUFT[id] = true; renderListe();
  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    await mitZeitlimit(window.db.collection('bos_events').doc(id).delete(), 15000);
    FRAGE = null;
  } catch (e) {
    console.error('[Bestellungen] Löschen:', e);
    FEHLER[id] = (e && e.code === 'zeitlimit') ? e.message : fehlerText(e) + fehlerRat(e);
  }
  delete LAEUFT[id];
  renderListe();
}
