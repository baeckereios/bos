<script>
var STATIONEN = [
  { station: 'Rondo',           icon: '🔄', url: 'station_rondo.html' },
  { station: 'Brötchenstraße',  icon: '🥐', url: 'station_broetchenstrasse.html' },
  { station: 'Frühschicht',     icon: '🌅', url: 'station_fruehschicht.html' },
  { station: 'Nachtschicht',    icon: '🌙', url: 'station_nachtschicht.html' }
];

var heute = new Date(); heute.setHours(0,0,0,0);

function isoDatum(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Planungswoche — MUSS identisch zur selben Logik in den Stationsseiten
// (station_*.html) berechnet werden, sonst passt WOCHE_ISO nicht mehr zu
// dem, was die Stationen unter `woche` schreiben, und der grüne Haken
// bleibt trotz Einreichung aus. Siehe ausführlicher Kommentar dort sowie
// SESSION_2026-09-05_PRODUKTIONSPLANER_WOCHENANKER_FIX.md.
function planWocheMontag(von) {
  var mo = naechsterDienstag(von);
  mo.setDate(mo.getDate() - 1);
  mo.setHours(0, 0, 0, 0);
  return mo;
}
var wochenMo = planWocheMontag(heute);
var WOCHE_ISO = isoDatum(wochenMo);

var STAND = {}; // station -> zuletzt eingereichte Doku
var NACHTRAEGE = []; // in der Planungswoche eingetragene Nachträge, chronologisch
var PRODUKTE_NACH_STATION = {}; // station -> [{legacyKey, name}], nur nfcSeite:true

function setStatus(cls, text) {
  var el = document.getElementById('brain-status');
  el.className = 'brain-status ' + cls;
  el.textContent = text;
}

// ── Planungsfenster: Fr 00:01 – Di 23:59, danach HART gesperrt (Ulf,
// 03.09.2026 — Kurskorrektur gegenüber der ursprünglichen Annahme "weiches
// Ende"). Dieselbe Berechnung wie in den Stationsseiten, dort zusätzlich
// für die eigentliche Sperre genutzt — hier nur für die Anzeige.
function naechsterDienstag(von) {
  var d = new Date(von);
  var tag = (d.getDay() + 6) % 7; // Mo=0..So=6
  var diff = (2 - 1 - tag + 7) % 7; // Ziel: Wochentag-Index 1 (Dienstag, Mo=0-basiert)
  d.setDate(d.getDate() + diff);
  d.setHours(23, 59, 0, 0);
  if (d < von) d.setDate(d.getDate() + 7);
  return d;
}
function planungsfenster(von) {
  var ende = naechsterDienstag(von);
  var start = new Date(ende);
  start.setDate(start.getDate() - 4);
  start.setHours(0, 1, 0, 0);
  return { start: start, ende: ende, offen: von >= start && von <= ende };
}

function fmtWochentagDatum(d) {
  var wochentage = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  return wochentage[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.';
}

function renderCountdown() {
  var jetzt = new Date();
  var fenster = planungsfenster(jetzt);
  var box = document.getElementById('countdown');
  var val = document.getElementById('countdown-value');
  var sub = document.getElementById('countdown-sub');
  var label = document.querySelector('.countdown-label');

  if (!fenster.offen) {
    box.classList.add('abgelaufen');
    label.textContent = 'Planung gerade gesperrt';
    val.textContent = '🔒 gesperrt';
    sub.textContent = 'Öffnet wieder ' + fmtWochentagDatum(fenster.start) + ', 00:01 Uhr';
    return;
  }

  box.classList.remove('abgelaufen');
  label.textContent = 'Einreichung noch offen bis';
  var diffMs = fenster.ende - jetzt;
  var tage = Math.floor(diffMs / 86400000);
  var stunden = Math.floor((diffMs % 86400000) / 3600000);
  val.textContent = tage > 0 ? ('noch ' + tage + ' Tag' + (tage === 1 ? '' : 'e') + ' ' + stunden + ' Std.') : ('noch ' + stunden + ' Std.');
  sub.textContent = fmtWochentagDatum(fenster.ende) + ' · 23:59 Uhr';
}

function relativeZeit(ts) {
  if (!ts || !ts.toMillis) return '';
  var diffMin = Math.round((Date.now() - ts.toMillis()) / 60000);
  if (diffMin < 1) return 'gerade eben';
  if (diffMin < 60) return 'vor ' + diffMin + ' Min.';
  var diffStd = Math.round(diffMin / 60);
  if (diffStd < 24) return 'vor ' + diffStd + ' Std.';
  return 'vor ' + Math.round(diffStd / 24) + ' Tg.';
}

function renderStationen() {
  var html = '';
  STATIONEN.forEach(function (s) {
    var d = STAND[s.station];
    var ok = !!d;
    html += '<div class="station-card' + (ok ? ' ok' : '') + '">'
          + '<div class="station-icon">' + s.icon + '</div>'
          + '<div class="station-info">'
          + '<div class="station-name">' + s.station + '</div>'
          + '<div class="station-status ' + (ok ? 'ok' : 'offen') + '">'
          + (ok ? '✓ eingereicht' + (d.eingereichtVon ? ' von ' + d.eingereichtVon : '') + ' · ' + relativeZeit(d.ts) : '○ steht noch aus')
          + '</div></div>'
          + '<a class="station-link" href="' + s.url + '">Zur Station →</a>'
          + '</div>';
  });
  document.getElementById('stationen-liste').innerHTML = html;
}

async function ladeProduktDropdown() {
  var select = document.getElementById('nachtrag-produkt');
  // 05.10.2026 (Stufe 1): Produktliste aus Firestore über bos_produkte.js;
  // Ladefehler sichtbar in der Meldezeile statt nur console.warn (K8).
  try {
    if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    var produktErgebnis = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' });
    var configData = produktErgebnis.liste;
    var produktHinweis = window.BOS_PRODUKTE.hinweisText(produktErgebnis);
    if (produktHinweis) window.BOS_PRODUKTE.zeigeMeldung(produktHinweis, 'hinweis');
    var proTag = configData.filter(function (p) { return p.nfcSeite === true && p.legacyKey; });
    STATIONEN.forEach(function (s) {
      var produkteHier = proTag.filter(function (p) { return p.station === s.station; });
      if (!produkteHier.length) return;
      var group = document.createElement('optgroup');
      group.label = s.icon + ' ' + s.station;
      produkteHier.forEach(function (p) {
        var opt = document.createElement('option');
        opt.value = p.legacyKey; opt.textContent = p.name;
        opt.dataset.station = s.station; opt.dataset.name = p.name;
        group.appendChild(opt);
      });
      select.appendChild(group);
    });
  } catch (e) {
    console.error('Produktionsplaner Übersicht: Produktliste für Nachtrag konnte nicht geladen werden', e);
    var text = window.BOS_PRODUKTE ? window.BOS_PRODUKTE.fehlerText(e) : ((e && e.message) || String(e));
    if (window.BOS_PRODUKTE) window.BOS_PRODUKTE.zeigeMeldung('Nachtrag ohne Produktliste: ' + text, 'fehler');
    else setStatus('error', '⚠ ' + text);
  }
}

async function ladeStand() {
  await (window.BOS_AUTH_READY || Promise.resolve());
  var db = window.db;
  try {
    var snap = await db.collection('bos_events')
      .where('type', '==', 'produktionsplan_einreichung')
      .where('woche', '==', WOCHE_ISO)
      .get();
    var neueste = {};
    snap.forEach(function (doc) {
      var d = doc.data();
      var bestehend = neueste[d.station];
      var tsNeu = d.ts && d.ts.toMillis ? d.ts.toMillis() : 0;
      var tsAlt = bestehend && bestehend.ts && bestehend.ts.toMillis ? bestehend.ts.toMillis() : -1;
      if (!bestehend || tsNeu > tsAlt) neueste[d.station] = d;
    });
    STAND = neueste;

    var nachtragSnap = await db.collection('bos_events')
      .where('type', '==', 'produktionsplan_nachtrag')
      .where('woche', '==', WOCHE_ISO)
      .get();
    NACHTRAEGE = [];
    nachtragSnap.forEach(function (doc) { NACHTRAEGE.push(doc.data()); });
    NACHTRAEGE.sort(function (a, b) {
      var ta = a.ts && a.ts.toMillis ? a.ts.toMillis() : 0;
      var tb = b.ts && b.ts.toMillis ? b.ts.toMillis() : 0;
      return tb - ta;
    });

    setStatus('ready', '✓ Stand geladen · Woche ' + WOCHE_ISO);
  } catch (e) {
    console.warn('Produktionsplaner Übersicht: Laden fehlgeschlagen', e);
    setStatus('error', '⚠ Stand konnte nicht geladen werden');
  }
  renderStationen();
  renderNachtragListe();
}

function renderNachtragListe() {
  var el = document.getElementById('nachtrag-liste');
  if (!NACHTRAEGE.length) { el.innerHTML = ''; return; }
  el.innerHTML = NACHTRAEGE.map(function (n) {
    return '<div class="nachtrag-item"><span>' + n.station + ' · <b>' + n.produktName + '</b></span>'
         + '<span>+' + n.menge + ' · ' + (n.eingetragenVon || '—') + '</span></div>';
  }).join('');
}

async function nachtragEintragen() {
  var select = document.getElementById('nachtrag-produkt');
  var opt = select.options[select.selectedIndex];
  var mengeInput = document.getElementById('nachtrag-menge');
  var menge = parseInt(mengeInput.value);

  if (!select.value || !menge || menge <= 0) {
    alert('Bitte Produkt und eine Menge größer 0 eingeben.');
    return;
  }

  try {
    await (window.BOS_AUTH_READY || Promise.resolve());
    await window.db.collection('bos_events').add({
      type: 'produktionsplan_nachtrag',
      station: opt.dataset.station,
      woche: WOCHE_ISO,
      legacyKey: select.value,
      produktName: opt.dataset.name,
      menge: menge,
      eingetragenVon: aktuellerProfilName(),
      ts: firebase.firestore.FieldValue.serverTimestamp()
    });
    select.value = '';
    mengeInput.value = '';
    await ladeStand();
  } catch (e) {
    console.warn('Produktionsplaner Übersicht: Nachtrag konnte nicht eingetragen werden', e);
    alert('Nachtrag konnte nicht eingetragen werden — bitte nochmal versuchen.');
  }
}

function aktuellerProfilName() {
  try {
    var st = JSON.parse(localStorage.getItem('bos_launcher_state_v2') || 'null');
    if (!st || !st.activeProfileId) return null;
    var alle = (window.BOS_PROFILES || []).concat(st.localProfiles || []);
    var p = alle.find(function (x) { return x.id === st.activeProfileId; });
    return p ? p.name : null;
  } catch (e) { return null; }
}

function druckWoche() {
  var teile = [];
  STATIONEN.forEach(function (s) {
    var d = STAND[s.station];
    teile.push('<h3>' + s.icon + ' ' + s.station + '</h3>');
    if (!d) {
      teile.push('<p class="pp-druck-fehlt"><em>Noch keine Planung eingereicht.</em></p>');
      return;
    }
    teile.push('<table class="pp-druck-tabelle"><thead><tr><th>Produkt</th><th>Produktion gesamt</th><th>Endlager</th></tr></thead><tbody>');
    Object.keys(d.produkte || {}).forEach(function (lk) {
      var p = d.produkte[lk];
      teile.push('<tr><td>' + p.name + '</td><td>' + p.gesamtProduktion + ' Bl.</td><td>' + p.endlager + ' Bl.</td></tr>');
    });
    teile.push('</tbody></table>');
    teile.push('<p class="pp-druck-meta">Eingereicht von ' + (d.eingereichtVon || 'unbekannt') + '</p>');
  });

  // Nachträge bewusst als EIGENER, separater Bereich — nicht in die Tabellen
  // oben eingerechnet. Auf Ulfs ausdrücklichen Wunsch (03.09.2026): das
  // System soll die ursprüngliche Planung nicht selbst verändern, das würde
  // die Person überrumpeln, die den Plan erstellt hat.
  teile.push('<h3>➕ Nachbestellungen</h3>');
  if (!NACHTRAEGE.length) {
    teile.push('<p class="pp-druck-fehlt"><em>Keine Nachträge für diese Planungswoche.</em></p>');
  } else {
    teile.push('<table class="pp-druck-tabelle"><thead><tr><th>Station</th><th>Produkt</th><th>Menge</th><th>Von</th></tr></thead><tbody>');
    NACHTRAEGE.forEach(function (n) {
      teile.push('<tr><td>' + n.station + '</td><td>' + n.produktName + '</td><td>+' + n.menge + ' Bl.</td><td>' + (n.eingetragenVon || '—') + '</td></tr>');
    });
    teile.push('</tbody></table>');
  }

  window.BOS_DRUCK.drucken({
    inhaltHTML: teile.join(''),
    appName: 'Produktionsplaner',
    titel: 'Wochenübersicht · ' + WOCHE_ISO,
    mitKopf: true,
    farbig: true,
    extraCSS: '.pp-druck-tabelle{width:100%;border-collapse:collapse;margin:4px 0 6px;} .pp-druck-tabelle th,.pp-druck-tabelle td{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:0.85rem;} .pp-druck-meta{font-size:0.75rem;color:#666;margin:0 0 14px;} .pp-druck-fehlt{color:#888;margin:0 0 14px;}'
  });
}

// ── Hilfe ─────────────────────────────────────────────────────────
const PP_HILFE_SCHRITTE = [
  ['Wofür ist diese Seite?', 'Sie zeigt auf einen Blick, welche Station ihre Produktionsplanung für die aktuelle Planungswoche (Fr–Di) schon eingereicht hat — mit grünem Haken, wer es war und wann. Fehlt eine Station, steht das genauso sichtbar da.'],
  ['Zeitfenster', 'Die Planung ist nur Freitag bis Dienstag geöffnet. Die Karte oben zeigt entweder, wie viel Zeit noch bleibt, oder — außerhalb des Fensters — wann es wieder öffnet. Außerhalb des Fensters sind die Stationsseiten gesperrt, es gibt dann nichts mehr zu planen.'],
  ['Zur Station springen', 'Über "Zur Station →" bei jeder Zeile kommst du direkt zur jeweiligen Stationsseite.'],
  ['Nachtrag eintragen', 'Braucht es spontan mehr von einem Produkt (z. B. Kundenbestellung) als ursprünglich geplant, trägst du das hier ein — Produkt wählen (nach Station sortiert), Menge, fertig. Das verändert die ursprüngliche Planung NICHT und rechnet auch nichts neu — es ist eine reine Zusatz-Notiz, die separat mit ausgedruckt wird. Wer die Station bedienen darf, darf auch nachtragen.'],
  ['Drucken', 'Der Button unten druckt alle vier Stationen zusammen auf einen Zettel — auch wenn noch nicht jede Station eingereicht hat. Nachträge erscheinen in einem eigenen Abschnitt am Ende.']
];
function ppOeffneHilfe() {
  const inhalt = document.getElementById('pp-hilfe-inhalt');
  inhalt.innerHTML = PP_HILFE_SCHRITTE.map(function (s) {
    return '<div class="pp-hilfe-schritt"><div class="pp-hilfe-titel">' + s[0] + '</div><div class="pp-hilfe-text">' + s[1] + '</div></div>';
  }).join('');
  document.getElementById('pp-hilfe-modal').style.display = 'block';
}
function ppSchliesseHilfe() {
  document.getElementById('pp-hilfe-modal').style.display = 'none';
}

window.addEventListener('load', function () {
  renderCountdown();
  setInterval(renderCountdown, 60000);
  ladeProduktDropdown();
  ladeStand();
});
</script>
