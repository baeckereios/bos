<script>
var STATIONEN = [
  { station: 'Rondo',           icon: '🔄', url: 'station_rondo.html' },
  { station: 'Brötchenstraße',  icon: '🥐', url: 'station_broetchenstrasse.html' },
  { station: 'Frühschicht',     icon: '🌅', url: 'station_fruehschicht.html' },
  { station: 'Nachtschicht',    icon: '🌙', url: 'station_nachtschicht.html' }
];

var heute = new Date(); heute.setHours(0,0,0,0);

function isoDatum(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Planungswoche — MUSS identisch zur selben Logik in den Stationsseiten
// (station_*.html) berechnet werden, sonst passt WOCHE_ISO nicht mehr zu
// dem, was die Stationen unter `woche` schreiben, und der grüne Haken
// bleibt trotz Einreichung aus. Siehe ausführlicher Kommentar dort sowie
// SESSION_2026-09-05_PRODUKTIONSPLANER_WOCHENANKER_FIX.md.
function planWocheMontag(von) {
  var mo = naechsterDienstag(von);
  mo.setDate(mo.getDate() - 1);
  mo.setHours(0, 0, 0, 0);
  return mo;
}
var wochenMo = planWocheMontag(heute);
var WOCHE_ISO = isoDatum(wochenMo);

var STAND = {}; // station -> zuletzt eingereichte Doku
var NACHTRAEGE = []; // in der Planungswoche eingetragene Nachträge (alt, seit 08.11.2026 nur noch gelesen), chronologisch
var BR = window.BOS_BESTELL_REGELN || null;   // 08.11.2026
var BESTELLUNGEN = [];      // 08.11.2026: alle Bestellungen (mit id)
var EINREICHUNGEN_KZ = [];  // 08.11.2026: neueste je Station und Woche, aus den Wochen, die die Tage abdecken können
var PRODUKTE_NACH_STATION = {}; // station -> [{legacyKey, name}], nur nfcSeite:true
var PRODUKT_JE_KEY = {}; // 13.10.2026 (#64): legacyKey -> Produkt, für die Einheit im Druck
var PRODUKT_POS = {};    // 02.11.2026: legacyKey -> Platz in der Produktliste (= Reihenfolge in der Station)
var PRODUKTLISTE_GELADEN = Promise.resolve();   // 02.11.2026: der Druck wartet darauf (Einheit, Reihenfolge)
var STAND_VERSPRECHEN = null;   // 02.11.2026: laufendes/letztes ladeStand — der Druck wartet darauf

var SONSTIGE = [], SONST_FEHLER = null, SONST_FEHLER_RAT = '';

// ── Planungsfenster: Fr 00:01 – Di 23:59, danach HART gesperrt (Ulf,
// 03.09.2026 — Kurskorrektur gegenüber der ursprünglichen Annahme "weiches
// Ende"). Dieselbe Berechnung wie in den Stationsseiten, dort zusätzlich
// für die eigentliche Sperre genutzt — hier nur für die Anzeige.
function naechsterDienstag(von) {
  var d = new Date(von);
  var tag = (d.getDay() + 6) % 7; // Mo=0..So=6
  var diff = (2 - 1 - tag + 7) % 7; // Ziel: Wochentag-Index 1 (Dienstag, Mo=0-basiert)
  d.setDate(d.getDate() + diff);
  d.setHours(23, 59, 0, 0);
  if (d < von) d.setDate(d.getDate() + 7);
  return d;
}
function planungsfenster(von) {
  var ende = naechsterDienstag(von);
  var start = new Date(ende);
  start.setDate(start.getDate() - 4);
  start.setHours(0, 1, 0, 0);
  return { start: start, ende: ende, offen: von >= start && von <= ende };
}

function fmtWochentagDatum(d) {
  var wochentage = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  return wochentage[d.getDay()] + ', ' + String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.';
}

function renderCountdown() {
  var jetzt = new Date();
  var fenster = planungsfenster(jetzt);
  var box = document.getElementById('countdown');
  var val = document.getElementById('countdown-value');
  var sub = document.getElementById('countdown-sub');
  var label = document.querySelector('.countdown-label');

  if (!fenster.offen) {
    box.classList.add('abgelaufen');
    label.textContent = 'Planung gerade gesperrt';
    val.textContent = '🔒 gesperrt';
    sub.textContent = 'Öffnet wieder ' + fmtWochentagDatum(fenster.start) + ', 00:01 Uhr';
    return;
  }

  box.classList.remove('abgelaufen');
  label.textContent = 'Einreichung noch offen bis';
  var diffMs = fenster.ende - jetzt;
  var tage = Math.floor(diffMs / 86400000);
  var stunden = Math.floor((diffMs % 86400000) / 3600000);
  val.textContent = tage > 0 ? ('noch ' + tage + ' Tag' + (tage === 1 ? '' : 'e') + ' ' + stunden + ' Std.') : ('noch ' + stunden + ' Std.');
  sub.textContent = fmtWochentagDatum(fenster.ende) + ' · 23:59 Uhr';
}

function relativeZeit(ts) {
  if (!ts || !ts.toMillis) return '';
  var diffMin = Math.round((Date.now() - ts.toMillis()) / 60000);
  if (diffMin < 1) return 'gerade eben';
  if (diffMin < 60) return 'vor ' + diffMin + ' Min.';
  var diffStd = Math.round(diffMin / 60);
  if (diffStd < 24) return 'vor ' + diffStd + ' Std.';
  return 'vor ' + Math.round(diffStd / 24) + ' Tg.';
}

function renderStationen() {
  var html = '';
  STATIONEN.forEach(function (s) {
    var d = STAND[s.station];
    var ok = !!d;
    html += '<div class="station-card' + (ok ? ' ok' : '') + '">'
          + '<div class="station-icon">' + s.icon + '</div>'
          + '<div class="station-info">'
          + '<div class="station-name">' + s.station + '</div>'
          + '<div class="station-status ' + (ok ? 'ok' : 'offen') + '">'
          + (ok ? '✓ eingereicht' + (d.eingereichtVon ? ' von ' + d.eingereichtVon : '') + ' · ' + relativeZeit(d.ts) : '○ steht noch aus')
          + '</div></div>'
          + '<a class="station-link" href="' + s.url + '">Zur Station →</a>'
          + '</div>';
  });
  document.getElementById('stationen-liste').innerHTML = html;
}

// 02.11.2026: Hülle — merkt sich das Versprechen, damit der Druck auf den
// gerade laufenden Ladevorgang wartet (Aufrufer unverändert, auch der Nachtrag).
function ladeStand() {
  STAND_VERSPRECHEN = ladeStandIntern();
  return STAND_VERSPRECHEN;
}

// Was hilft — keine Berechtigung ist etwas anderes als kein Netz (Starter Bau-Chat §4).
function fehlerRat(e) {
  var c = e && e.code;
  if (c === 'permission-denied') return 'Dieses Konto darf den Stand nicht lesen — Ulf Bescheid sagen.';
  if (c === 'unavailable' || c === 'deadline-exceeded') return 'Keine Verbindung zur Datenbank — Netz prüfen und die Seite neu laden.';
  return 'Seite neu laden. Hilft das nicht: Ulf Bescheid sagen.';
}

function fehlerText(e) {
  var t = (e && e.message) || String(e);
  if (e && e.code && t.indexOf(e.code) < 0) t += ' (' + e.code + ')';
  return t;
}

// 09.11.2026 (Schritt 4): sonstige Bestellungen, eigener Fehler (Bestellzeile und Stand bleiben)
async function ladeSonstige(db) {
  try {
    if (!BR || !BR.TYP_SONSTIGES) throw new Error('bestell_regeln.js ist alt geladen (ohne Aufträge) — Seite neu laden');
    var snap = await db.collection('bos_events').where('type', '==', BR.TYP_SONSTIGES).get();
    var l = [];
    snap.forEach(function (doc) { var d = doc.data(); d.id = doc.id; l.push(d); });
    SONSTIGE = l; SONST_FEHLER = null; SONST_FEHLER_RAT = '';
  } catch (e) {
    console.error('Produktionsplaner Übersicht: sonstige Bestellungen', e);
    SONSTIGE = []; SONST_FEHLER = fehlerText(e); SONST_FEHLER_RAT = fehlerRat(e);
  }
}
function renderSonstHinweis() {
  var box = document.getElementById('sonst-hinweis');
  if (!box) return;
  if (!SONST_FEHLER) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="sonst-hinweis">⚠ Sonstige Bestellungen nicht geladen: <span></span> — Wochenplan drucken ist gesperrt, bis sie geladen sind. <button onclick="sonstNeuLaden(this)">Neu laden</button></div>';
  box.querySelector('span').textContent = SONST_FEHLER + ' — ' + SONST_FEHLER_RAT;
}
async function sonstNeuLaden(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'lädt …'; }
  await ladeStand();
  if (!SONST_FEHLER && document.getElementById('pp-druck-modal').style.display === 'block') ppDruckMeldung('✓ Sonstige Bestellungen geladen — Drucken ist frei.', 'info');
}
async function ladeStandIntern() {
  await (window.BOS_AUTH_READY || Promise.resolve());
  var db = window.db;
  var sonstLaden = ladeSonstige(db);   // 09.11.2026 (Schritt 4): parallel, fängt selbst ab
  try {
    var snap = await db.collection('bos_events')
      .where('type', '==', 'produktionsplan_einreichung')
      .where('woche', '==', WOCHE_ISO)
      .get();
    var neueste = {};
    snap.forEach(function (doc) {
      var d = doc.data();
      var bestehend = neueste[d.station];
      var tsNeu = d.ts && d.ts.toMillis ? d.ts.toMillis() : 0;
      var tsAlt = bestehend && bestehend.ts && bestehend.ts.toMillis ? bestehend.ts.toMillis() : -1;
      if (!bestehend || tsNeu > tsAlt) neueste[d.station] = d;
    });
    STAND = neueste;

    var nachtragSnap = await db.collection('bos_events')
      .where('type', '==', 'produktionsplan_nachtrag')
      .where('woche', '==', WOCHE_ISO)
      .get();
    NACHTRAEGE = [];
    nachtragSnap.forEach(function (doc) { NACHTRAEGE.push(doc.data()); });
    NACHTRAEGE.sort(function (a, b) {
      var ta = a.ts && a.ts.toMillis ? a.ts.toMillis() : 0;
      var tb = b.ts && b.ts.toMillis ? b.ts.toMillis() : 0;
      return tb - ta;
    });

    // 08.11.2026: Bestellungen (nur type ==, kein Index) und die Einreichungen aller
    // Wochen, die einen der Tage abdecken können — dieselbe Auswahl wie Station und
    // Seite Bestellungen, damit die Kennzeichen überall gleich sind.
    if (!BR) throw new Error('bestell_regeln.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    var bSnap = await db.collection('bos_events').where('type', '==', BR.TYP).get();
    var bl = [];
    bSnap.forEach(function (doc) { var d = doc.data(); d.id = doc.id; bl.push(d); });
    BESTELLUNGEN = BR.sortiere(bl);
    var abTag = BR.datumLokal(heute < wochenMo ? heute : wochenMo);
    var tageKZ = BESTELLUNGEN.filter(function (b) { return b.datum >= abTag; }).map(function (b) { return b.datum; });
    tageKZ.push(BR.datumLokal(heute));
    var eListe = [];
    await Promise.all(BR.stuecke(BR.wochenFuerTage(tageKZ), 30).map(function (teil) {
      return db.collection('bos_events').where('type', '==', 'produktionsplan_einreichung').where('woche', 'in', teil).get()
        .then(function (snap) { snap.forEach(function (doc) { eListe.push(doc.data()); }); });
    }));
    EINREICHUNGEN_KZ = BR.neuesteJeStationUndWoche(eListe);

    STAND_FEHLER = null; STAND_FEHLER_RAT = '';
    setStatus('ready', '✓ Stand geladen · Woche ' + WOCHE_ISO);
  } catch (e) {
    console.warn('Produktionsplaner Übersicht: Laden fehlgeschlagen', e);
    STAND_FEHLER = fehlerText(e);   // 02.11.2026: Grund sichtbar, und der Druck weiß Bescheid
    STAND_FEHLER_RAT = fehlerRat(e);
    setStatus('error', '⚠ Stand konnte nicht geladen werden: ' + STAND_FEHLER);
  }
  await sonstLaden;
  renderStationen();
  renderBestellZeile();
  renderSonstHinweis();
}

// ~~renderNachtragListe() / nachtragEintragen()~~ (08.11.2026): Eintragen und Liste
// sind auf der Seite Bestellungen. Neu angelegt wird nur noch produktionsplan_bestellung.
// Kennzeichen „noch nicht eingeplant“ für kommende Tage (ab heute).
function offeneBestellungen() {
  if (!BR) return [];
  var hi = BR.datumLokal(heute);
  return BESTELLUNGEN.filter(function (b) { return b.datum >= hi && BR.kennzeichen(b, EINREICHUNGEN_KZ) === 'neu'; });
}
function geloeschteBestellungen() {
  if (!BR) return [];
  var ids = {}; BESTELLUNGEN.forEach(function (b) { ids[b.id] = true; });
  return BR.geloeschte(EINREICHUNGEN_KZ, ids, { von: BR.datumLokal(heute) });
}
function sonstigeDerWoche() {
  if (!BR || SONST_FEHLER) return [];
  var bis = new Date(wochenMo); bis.setDate(bis.getDate() + 6);
  var von = BR.datumLokal(wochenMo), bisIso = BR.datumLokal(bis);
  return SONSTIGE.filter(function (x) { return x.datum >= von && x.datum <= bisIso; });
}
function renderBestellZeile() {
  var a = document.getElementById('bestell-zeile'), t = document.getElementById('bestell-zeile-text');
  if (STAND_FEHLER) { a.className = 'bestell-zeile fehler'; t.textContent = '📋 Bestellungen nicht geladen: ' + STAND_FEHLER; return; }
  var n = offeneBestellungen().length, m = geloeschteBestellungen().length;
  var teile = [];
  if (n) teile.push(n + (n === 1 ? ' Bestellung' : ' Bestellungen') + ' noch nicht eingeplant');
  if (m) teile.push(m + ' gelöscht nach Einreichung');
  // 09.11.2026 (Schritt 4): sonstige der Planungswoche (Mo–So), nur zur Info
  var k = sonstigeDerWoche().length;
  if (k) teile.push(k + (k === 1 ? ' sonstige Bestellung' : ' sonstige Bestellungen') + ' diese Woche');
  a.className = 'bestell-zeile' + (teile.length ? ' offen' : '');
  t.textContent = '📋 ' + (teile.length ? teile.join(' · ') : 'Alle Bestellungen');
}

// 13.10.2026 (#64): Kurzform der Einheit (Stk., Bl., Dl. …) für einen
// Schlüssel. Unbekanntes Produkt → „Bl.“ wie vor dem 13.10. Entschärft,
// weil `einheit` Freitext ist.
function einheitKurzFuer(lk) {
  var p = PRODUKT_JE_KEY[lk];
  var k = (p && window.BOS_PRODUKTE && window.BOS_PRODUKTE.einheit) ? window.BOS_PRODUKTE.einheit(p).kurz : 'Bl.';
  return String(k).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

// ── WOCHENZETTEL (02.11.2026, Ulf 09:33: „Montag das, Dienstag das …“,
// gesamt oder je Station) ──────────────────────────────────────────
// Quelle: neueste Einreichung je Station (STAND) mit tage: [{datum, menge}]
// je Produkt (seit 02.11. von den Stationen über plan_tage.js geschrieben).
// Nichts wird nachgerechnet: Einreichungen ohne tage bekommen keine
// Tageszahlen, nur Hinweis und Gesamtwerte. Nachträge bleiben ein eigener
// Block (Ulf 03.09.2026: nicht in die Planung einrechnen).
var WT_NAMEN = ['SONNTAG','MONTAG','DIENSTAG','MITTWOCH','DONNERSTAG','FREITAG','SAMSTAG'];

function esc(t) {
  return String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function ausIso(iso) {   // 'JJJJ-MM-TT' → lokales Datum (nie über UTC)
  var t = String(iso).split('-');
  return new Date(Number(t[0]), Number(t[1]) - 1, Number(t[2]));
}
function kurzDatum(d) {
  return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.';
}
function hatTage(einreichung) {   // jede Produktzeile muss tage tragen (leeres Array zählt)
  var pr = (einreichung && einreichung.produkte) || {};
  var keys = Object.keys(pr);
  return keys.length > 0 && keys.every(function (lk) { return Array.isArray(pr[lk] && pr[lk].tage); });
}
// Produkte wie in der Station: Platz in der Produktliste; Unbekannte
// (gelöscht, Liste nicht geladen) ans Ende, nach Name. Nicht Object.keys —
// Firestore liefert Map-Felder nach Schlüssel sortiert.
function produktReihenfolge(produkte) {
  return Object.keys(produkte || {}).sort(function (a, b) {
    var pa = PRODUKT_POS[a], pb = PRODUKT_POS[b];
    if (pa !== undefined && pb !== undefined) return pa - pb;
    if (pa !== undefined) return -1;
    if (pb !== undefined) return 1;
    return String(produkte[a].name || a).localeCompare(String(produkte[b].name || b), 'de');
  });
}

// Baut den Zettel. auswahl: 'alle' oder ein Stationsname aus STATIONEN.
// Rein aus STAND/NACHTRAEGE — kein Firestore, prüfbar ohne Druck.
function baueWochenzettel(auswahl) {
  var stationen = auswahl === 'alle' ? STATIONEN : STATIONEN.filter(function (s) { return s.station === auswahl; });
  if (!stationen.length) throw new Error('Unbekannte Station: ' + auswahl);

  var hinweise = [], tagesMap = {}, summenTeile = [];
  stationen.forEach(function (s) {
    var d = STAND[s.station];
    summenTeile.push('<h3 class="pp-z-station">' + s.icon + ' ' + esc(s.station) + '</h3>');
    if (!d) {
      hinweise.push(s.icon + ' ' + esc(s.station) + ': noch keine Planung eingereicht.');
      summenTeile.push('<p class="pp-druck-fehlt"><em>Noch keine Planung eingereicht.</em></p>');
      return;
    }
    var mitTage = hatTage(d);
    if (!mitTage) hinweise.push(s.icon + ' ' + esc(s.station) + ': Planung ohne Tagesaufteilung eingereicht (ältere Fassung der Station) — bitte neu einreichen.');
    summenTeile.push('<table class="pp-druck-tabelle"><thead><tr><th>Produkt</th><th>Produktion gesamt</th><th>Endlager</th></tr></thead><tbody>');
    produktReihenfolge(d.produkte).forEach(function (lk) {
      var p = d.produkte[lk];
      var eh = einheitKurzFuer(lk);
      var gesamtZelle;
      if (mitTage) {
        // Regel: gedruckte Summe = Summe der gedruckten Tage. Abweichung vom
        // eingereichten Wert (heute unmöglich, Bau-Doku §3 Fund 1) sichtbar.
        var summe = 0;
        p.tage.forEach(function (t) {
          summe += Number(t.menge) || 0;
          if (!tagesMap[t.datum]) tagesMap[t.datum] = {};
          if (!tagesMap[t.datum][s.station]) tagesMap[t.datum][s.station] = [];
          tagesMap[t.datum][s.station].push({ lk: lk, name: p.name, menge: t.menge, eh: eh });
        });
        gesamtZelle = summe + ' ' + eh + (Number(p.gesamtProduktion) !== summe ? ' <span class="pp-z-abw">⚠ eingereicht: ' + esc(p.gesamtProduktion) + '</span>' : '');
      } else {
        gesamtZelle = esc(p.gesamtProduktion) + ' ' + eh;
      }
      summenTeile.push('<tr><td>' + esc(p.name) + '</td><td>' + gesamtZelle + '</td><td>' + esc(p.endlager) + ' ' + eh + '</td></tr>');
    });
    summenTeile.push('</tbody></table>');
    summenTeile.push('<p class="pp-druck-meta">Eingereicht von ' + esc(d.eingereichtVon || 'unbekannt') + '</p>');
  });

  // Spanne: Mo–So der Planungswoche, verbreitert um Tage außerhalb (Auflage A1 — nichts still verwerfen)
  var tageSortiert = Object.keys(tagesMap).sort();
  var von = new Date(wochenMo), bis = new Date(wochenMo); bis.setDate(bis.getDate() + 6);
  tageSortiert.forEach(function (iso) { var d = ausIso(iso); if (d < von) von = d; if (d > bis) bis = d; });
  // 09.11.2026 (Schritt 4): sonstige Bestellungen im Zeitraum des Zettels, an ihrem Tag.
  // Zettel einer Station: nur, wenn der Auftrag eine Position dieser Station hat (E7).
  var produktTage = tageSortiert.length;
  var sonstJeTag = {}, sonstWeitere = {};
  if (BR && BR.auftraege) {
    var vonS = BR.datumLokal(von), bisS = BR.datumLokal(bis);
    BR.auftraege(BESTELLUNGEN, SONSTIGE).forEach(function (a) {
      if (a.datum < vonS || a.datum > bisS) return;
      var sonst = a.positionen.filter(function (p) { return p.art === 'sonstiges'; });
      if (!sonst.length) return;
      var gehoertDazu = auswahl === 'alle' || BR.auftragPasst(a, auswahl, null);
      if (gehoertDazu) sonst.forEach(function (p) { (sonstJeTag[a.datum] = sonstJeTag[a.datum] || []).push(p); });
      else sonstWeitere[a.datum] = (sonstWeitere[a.datum] || 0) + sonst.length;
    });
  }
  Object.keys(sonstJeTag).concat(Object.keys(sonstWeitere)).forEach(function (iso) { if (!tagesMap[iso]) tagesMap[iso] = {}; });
  tageSortiert = Object.keys(tagesMap).sort();
  var spanne = kurzDatum(von) + '–' + kurzDatum(bis);
  var titelName = auswahl === 'alle' ? 'Alle Stationen' : esc(auswahl);

  var teile = [];
  if (hinweise.length) {
    teile.push('<div class="pp-z-hinweise"><b>Hinweise</b><ul>' + hinweise.map(function (h) { return '<li>' + h + '</li>'; }).join('') + '</ul></div>');
  }
  if (!produktTage) {
    teile.push('<p class="pp-druck-fehlt"><em>Keine Tagesmengen vorhanden.</em></p>');
  }
  tageSortiert.forEach(function (iso) {
    var d = ausIso(iso);
    teile.push('<div class="pp-z-tag"><div class="pp-z-tagkopf">' + WT_NAMEN[d.getDay()] + ', ' + kurzDatum(d) + '</div>');
    stationen.forEach(function (s) {
      var zeilen = tagesMap[iso][s.station];
      if (!zeilen || !zeilen.length) return;
      teile.push('<div class="pp-z-st">' + s.icon + ' ' + esc(s.station) + '</div>');
      // Reihenfolge der Produkte = Reihenfolge der Wochensumme (produktReihenfolge)
      var ordnung = produktReihenfolge(STAND[s.station].produkte);
      zeilen.sort(function (a, b) { return ordnung.indexOf(a.lk) - ordnung.indexOf(b.lk); });
      zeilen.forEach(function (z) {
        teile.push('<div class="pp-z-zeile"><span class="pp-z-name">' + esc(z.name) + '</span><span class="pp-z-pkt"></span><span class="pp-z-menge">' + esc(z.menge) + ' ' + z.eh + '</span></div>');
      });
    });
    // 09.11.2026 (Schritt 4): Sonstige Bestellungen des Tages (Text, Notiz) — nicht gerechnet
    var so = sonstJeTag[iso] || [], weitere = sonstWeitere[iso] || 0;
    if (so.length || weitere) {
      teile.push('<div class="pp-z-st pp-z-sonst">✎ Sonstige Bestellungen</div>');
      so.forEach(function (p) {
        teile.push('<div class="pp-z-zeile pp-z-sonstzeile"><span class="pp-z-name">' + esc(p.text) + '</span><span class="pp-z-pkt"></span><span class="pp-z-notiz">' + esc(p.notiz || '') + '</span></div>');
      });
      if (weitere) teile.push('<div class="pp-z-zeile pp-z-weitere">+ ' + weitere + ' weitere sonstige ' + (weitere === 1 ? 'Bestellung' : 'Bestellungen') + ' (Zettel „Alle“)</div>');
    }
    teile.push('</div>');
  });

  teile.push('<h2 class="pp-z-block">Wochensumme</h2>');
  teile.push(summenTeile.join(''));

  // Nachträge bewusst als EIGENER Bereich — nicht eingerechnet (Ulf 03.09.2026:
  // das System soll die ursprüngliche Planung nicht selbst verändern).
  // 08.11.2026: dazu Bestellungen „noch nicht eingeplant“ mit Tag im Zeitraum des
  // Zettels (von … bis), jetzt mit Spalten Tag und Notiz. Eingeplante stecken schon
  // in den Tagesmengen und erscheinen hier nicht noch einmal. Alte Nachträge wie bisher.
  var passt = function (st) { return auswahl === 'alle' || st === auswahl; };
  var nachtraege = NACHTRAEGE.filter(function (n) { return passt(n.station); });
  var vonIso = BR ? BR.datumLokal(von) : '', bisIso = BR ? BR.datumLokal(bis) : '';
  var neueBst = (BR ? BESTELLUNGEN : []).filter(function (b) { return passt(b.station) && b.datum >= vonIso && b.datum <= bisIso && BR.kennzeichen(b, EINREICHUNGEN_KZ) === 'neu'; });
  teile.push('<h2 class="pp-z-block">➕ Nachbestellungen</h2>');
  if (!nachtraege.length && !neueBst.length) {
    teile.push('<p class="pp-druck-fehlt"><em>Keine Nachbestellungen für diese Planungswoche' + (auswahl === 'alle' ? '' : ' und Station') + '.</em></p>');
  } else {
    teile.push('<table class="pp-druck-tabelle"><thead><tr>' + (auswahl === 'alle' ? '<th>Station</th>' : '') + '<th>Tag</th><th>Produkt</th><th>Menge</th><th>Notiz</th><th>Von</th></tr></thead><tbody>');
    neueBst.forEach(function (b) {
      var d = ausIso(b.datum);
      teile.push('<tr>' + (auswahl === 'alle' ? '<td>' + esc(b.station) + '</td>' : '') + '<td>' + (WT_NAMEN[d.getDay()].charAt(0) + WT_NAMEN[d.getDay()].charAt(1).toLowerCase()) + ' ' + kurzDatum(d) + '</td><td>' + esc(b.produktName) + '</td><td>+' + esc(String(b.menge).replace('.', ',')) + ' ' + einheitKurzFuer(b.legacyKey) + '</td><td>' + esc(b.notiz || '') + '</td><td>' + esc(b.eingetragenVon || '—') + '</td></tr>');
    });
    nachtraege.forEach(function (n) {
      teile.push('<tr>' + (auswahl === 'alle' ? '<td>' + esc(n.station) + '</td>' : '') + '<td>—</td><td>' + esc(n.produktName) + '</td><td>+' + esc(n.menge) + ' ' + einheitKurzFuer(n.legacyKey) + '</td><td>alter Nachtrag (ohne Tag)</td><td>' + esc(n.eingetragenVon || '—') + '</td></tr>');
    });
    teile.push('</tbody></table>');
  }

  return { titel: 'Wochenplan · ' + titelName + ' · ' + spanne, inhaltHTML: teile.join('') };
}

var PP_ZETTEL_CSS = '.pp-druck-tabelle{width:100%;border-collapse:collapse;margin:4px 0 6px;} .pp-druck-tabelle th,.pp-druck-tabelle td{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:0.85rem;} .pp-druck-meta{font-size:0.75rem;color:#666;margin:0 0 14px;} .pp-druck-fehlt{color:#888;margin:0 0 14px;}'
  + ' .pp-z-hinweise{border:1.5px solid #000;padding:6px 10px;margin:0 0 12px;font-size:0.85rem;line-height:1.5;} .pp-z-hinweise ul{margin:4px 0 0;padding-left:18px;}'
  + ' .pp-z-tag{page-break-inside:avoid;break-inside:avoid;margin:0 0 10px;} .pp-z-tagkopf{font-weight:900;font-size:1rem;letter-spacing:0.5px;border-bottom:1.5px solid #000;margin:0 0 4px;padding-bottom:1px;}'
  + ' .pp-z-st{font-weight:700;font-size:0.9rem;margin:4px 0 0 4mm;} .pp-z-zeile{display:flex;align-items:baseline;gap:6px;margin-left:10mm;font-size:0.95rem;line-height:1.5;}'

  + ' .pp-z-block{font-size:1.05rem;margin:16px 0 4px;padding-top:6px;border-top:1px solid #ddd;page-break-after:avoid;} .pp-z-station{font-size:0.95rem;margin:8px 0 2px;} .pp-z-abw{color:#000;font-weight:700;}';

function ppDruckMeldung(text, art) {
  var el = document.getElementById('pp-druck-meldung');
  el.className = 'pp-druck-meldung' + (art ? ' ' + art : '');
  el.textContent = text || '';
}
function ppOeffneDruckwahl() {
  var wahl = [{ wert: 'alle', icon: '📋', text: 'Alle Stationen' }].concat(STATIONEN.map(function (s) { return { wert: s.station, icon: s.icon, text: s.station }; }));
  var box = document.getElementById('pp-druck-auswahl');
  box.innerHTML = '';
  wahl.forEach(function (w) {
    var b = document.createElement('button');
    b.className = 'pp-druck-wahl' + (w.wert === 'alle' ? ' alle' : '');
    b.dataset.wahl = w.wert;
    b.innerHTML = '<span class="pp-druck-wahl-icon">' + w.icon + '</span><span></span>';
    b.lastChild.textContent = w.text;
    b.onclick = function () { druckWoche(w.wert); };
    box.appendChild(b);
  });
  document.getElementById('pp-druck-sub').textContent = 'Was soll auf den Zettel? Woche ab ' + kurzDatum(wochenMo);
  ppDruckMeldung('');
  document.getElementById('pp-druck-modal').style.display = 'block';
}
function ppSchliesseDruckwahl() {
  document.getElementById('pp-druck-modal').style.display = 'none';
}

async function druckWoche(auswahl) {
  var knoepfe = document.querySelectorAll('.pp-druck-wahl');
  knoepfe.forEach(function (b) { b.disabled = true; });
  ppDruckMeldung('Zettel wird vorbereitet …', 'info');
  try {
    await PRODUKTLISTE_GELADEN;                // Einheit und Reihenfolge (scheitert nie, fängt selbst ab)
    if (STAND_VERSPRECHEN) await STAND_VERSPRECHEN;
    if (STAND_FEHLER) {
      // Fund 2: sonst stünde „nicht eingereicht“ auf dem Papier, obwohl nur das Laden scheiterte
      ppDruckMeldung('Drucken nicht möglich — der Stand ist nicht geladen: ' + STAND_FEHLER + ' — ' + STAND_FEHLER_RAT, 'fehler');
      return;
    }
    if (SONST_FEHLER) {
      // 09.11.2026 (Schritt 4): sonst fehlten die sonstigen Bestellungen still auf dem Papier
      ppDruckMeldung('Drucken nicht möglich — die sonstigen Bestellungen sind nicht geladen: ' + SONST_FEHLER + ' — ' + SONST_FEHLER_RAT, 'fehler');
      var nl = document.createElement('button'); nl.className = 'pp-druck-neu'; nl.textContent = 'Neu laden';
      nl.onclick = function () { sonstNeuLaden(nl); };
      document.getElementById('pp-druck-meldung').appendChild(document.createTextNode(' ')); document.getElementById('pp-druck-meldung').appendChild(nl);
      return;
    }
    if (!window.BOS_DRUCK || typeof window.BOS_DRUCK.drucken !== 'function') throw new Error('bos_druck.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    var zettel = baueWochenzettel(auswahl || 'alle');
    window.BOS_DRUCK.drucken({
      inhaltHTML: zettel.inhaltHTML,
      appName: 'Produktionsplaner',
      titel: zettel.titel,
      mitKopf: true,
      farbig: true,
      extraCSS: PP_ZETTEL_CSS
    });
    ppSchliesseDruckwahl();
  } catch (e) {
    console.error('Produktionsplaner Übersicht: Drucken fehlgeschlagen', e);
    ppDruckMeldung('Drucken fehlgeschlagen: ' + fehlerText(e), 'fehler');
  } finally {
    knoepfe.forEach(function (b) { b.disabled = false; });
  }
}

  ['Wofür ist diese Seite?', 'Sie zeigt auf einen Blick, welche Station ihre Produktionsplanung für die aktuelle Planungswoche (Fr–Di) schon eingereicht hat — mit grünem Haken, wer es war und wann. Fehlt eine Station, steht das genauso sichtbar da.'],
  ['Zeitfenster', 'Die Planung ist nur Freitag bis Dienstag geöffnet. Die Karte oben zeigt entweder, wie viel Zeit noch bleibt, oder — außerhalb des Fensters — wann es wieder öffnet. Außerhalb des Fensters sind die Stationsseiten gesperrt, es gibt dann nichts mehr zu planen.'],
  ['Zur Station springen', 'Über "Zur Station →" bei jeder Zeile kommst du direkt zur jeweiligen Stationsseite.'],
  ['Bestellungen', 'Bestellungen trägst du auf der Seite „Bestellungen“ ein (Zeile „📋 …“ antippen) oder direkt an der Station beim Produkt. Die Zeile hier zählt, wie viele kommende Bestellungen noch in keiner eingereichten Planung stecken („noch nicht eingeplant“) und wie viele gelöscht wurden, obwohl sie schon eingeplant waren. Steht dort etwas, sollte die betroffene Station neu planen und einreichen. Dazu steht, wie viele „sonstige Bestellungen“ (freier Text ohne Produkt, z. B. eine Torte) in der Planungswoche liegen — die rechnen nirgends mit und stehen nur auf dem Zettel. Eine Bestellung ändert eine eingereichte Planung nie von selbst. Die früheren „Nachträge“ ohne Tag gibt es nicht mehr neu; alte stehen weiter auf der Seite Bestellungen und auf dem Zettel.'],
  ['Drucken', 'Der Button unten („Wochenplan drucken“) fragt zuerst, was auf den Zettel soll: alle Stationen zusammen oder nur eine Station. Der Zettel ist nach Tagen gegliedert — Montag das, Dienstag das … — und zeigt je Tag, welche Station wie viel von welchem Produkt produziert. Tage ohne Produktion fehlen. Gibt es an einem Tag sonstige Bestellungen, stehen sie dort unter „Sonstige Bestellungen“ mit Text und Notiz — auch an einem Tag ohne Produktion. Auf dem Zettel einer Station erscheint Sonstiges nur, wenn derselbe Auftrag auch ein Produkt dieser Station hat; sonst steht dort „+ n weitere sonstige Bestellungen (Zettel „Alle“)“. Konnten die sonstigen Bestellungen nicht geladen werden, steht oben der Grund mit „Neu laden“, und gedruckt wird erst danach. Danach folgt die Wochensumme je Station (gesamt und Endlager) und am Ende die Nachbestellungen in einem eigenen Abschnitt (bei einer Station nur deren): Bestellungen, die noch nicht eingeplant sind, mit Tag und Notiz, und alte Nachträge ohne Tag. Gedruckt werden kann auch, wenn noch nicht jede Station eingereicht hat — oben auf dem Zettel steht dann, welche fehlt. Wurde eine Planung mit einer älteren Fassung der Station eingereicht, fehlt ihr die Aufteilung nach Tagen: Sie erscheint nur in der Wochensumme, und oben steht der Hinweis, neu einzureichen.']

// ── PLANUNG GEGEN BESTAND (08.11.2026, Schritt 3) ────────────────────
// Rechnung in plan_pruefung.js. Lädt nach dem Stand, eigener Zustand, kein Einfluss auf den Druck.
var PG_LAEUFT = false;
function pgWann(ms) { var d = new Date(ms); return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()] + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
async function ladePruefung() {
  if (PG_LAEUFT) return;
  PG_LAEUFT = true;
  var inhalt = document.getElementById('pg-inhalt'), knopf = document.getElementById('pg-neu');
  inhalt.className = 'pg-leise'; inhalt.textContent = 'wird geprüft …'; knopf.disabled = true;
  try {
    var PP = window.BOS_PLAN_PRUEFUNG;
    if (!PP || typeof PP.pruefe !== 'function') throw new Error('plan_pruefung.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    await (window.BOS_AUTH_READY || Promise.resolve());
    if (window.BOS_HAMSTER && typeof window.BOS_HAMSTER.init === 'function') window.BOS_HAMSTER.init();
    var erg = await PP.pruefe(window.db, {});
    inhalt.className = ''; inhalt.innerHTML = pgHtml(erg);
  } catch (e) {
    console.error('[Übersicht] Planung gegen Bestand:', e);
    inhalt.className = 'pg-fehler'; inhalt.innerHTML = '⚠ Prüfung fehlgeschlagen: ' + pgLink(esc(fehlerText(e))) + ' — der Wochenplan und der Druck sind davon nicht betroffen.';
  }
  knopf.disabled = false; PG_LAEUFT = false;
}
// Firestore-Index-Link antippbar (wie fehlertextMitLink an der Station)
function pgLink(html) { return html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">Index anlegen</a>'); }
function pgHtml(erg) {
  var PP = window.BOS_PLAN_PRUEFUNG, html = '';
  STATIONEN.forEach(function (st) {
    var eigene = erg.ergebnisse.filter(function (x) { return x.produkt.station === st.station; });
    if (!eigene.length) return;
    var laut = [], leise = [], nicht = [], geprueft = 0, zeiten = {};
    eigene.forEach(function (x) {
      var z = PP.zeilen(x.ergebnis, x.produkt);
      if (x.ergebnis.status !== 'nicht_pruefbar') { geprueft++; zeiten[pgWann(x.ergebnis.details.zaehlTs)] = true; }
      // 09.11.2026 (Schritt 4, 4.6): je Produkt eine laute Zeile, Tage eingeklappt darunter
      z.laut.forEach(function (t) { laut.push('<div class="pg-laut">' + esc(t) + '</div>' + ((z.tage && z.tage.length) ? '<details><summary>Tage anzeigen</summary>' + z.tage.map(function (x2) { return '<div class="pg-leise">' + esc(x2) + '</div>'; }).join('') + '</details>' : '')); });
      leise.push.apply(leise, z.leise); if (z.nicht) nicht.push(z.nicht);
    });
    var zeitText = Object.keys(zeiten).length ? '<span class="pg-zeit">gezählt ' + esc(Object.keys(zeiten).join(', ')) + '</span>' : '';
    html += '<div class="pg-station"><div class="pg-station-name">' + st.icon + ' ' + esc(st.station) + zeitText + '</div>';
    if (laut.length) html += laut.join('');
    else if (geprueft) html += '<div class="pg-ok">✓ Die eingereichte Planung passt mit dem aktuellen Bestand.</div>';
    if (leise.length) html += '<details><summary>' + leise.length + ' × knapp</summary>' + leise.map(function (t) { return '<div class="pg-leise">' + esc(t) + '</div>'; }).join('') + '</details>';
    html += nicht.map(function (t) { return '<div class="pg-leise">' + pgLink(esc(t)) + '</div>'; }).join('');
    html += '</div>';
  });
  return html || '<div class="pg-leise">Keine Produkte auf den Stationen.</div>';
}

// Checkliste §7a: nicht abgefangene Fehler sichtbar (08.11.2026)
function zeigeSeitenFehler(text) { var el = document.getElementById('seiten-fehler'); if (el) el.innerHTML = '<div class="seiten-fehler">⚠ Unerwarteter Fehler: ' + esc(text) + ' — Seite neu laden. Hilft das nicht: Ulf Bescheid sagen.</div>'; }
window.addEventListener('error', function (e) { zeigeSeitenFehler((e && e.message ? e.message : 'Fehler') + (e && e.filename ? ' (' + String(e.filename).replace(/^.*\//, '') + ':' + e.lineno + ')' : '')); });
window.addEventListener('unhandledrejection', function (e) { var r = e && e.reason; zeigeSeitenFehler((r && r.message) ? r.message : String(r)); });

window.addEventListener('load', function () {
  renderCountdown();
  setInterval(renderCountdown, 60000);
  PRODUKTLISTE_GELADEN = ladeProduktliste();
  ladeStand();
  STAND_VERSPRECHEN.then(ladePruefung, ladePruefung);   // 08.11.2026 (Schritt 3): erst nach dem Stand
});
</script>
