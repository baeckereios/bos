<link rel="stylesheet" href="tour_geschichte.css">
<script>
  function tourLadefehler(datei){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="err" role="alert" style="margin:16px">'+datei+' konnte nicht geladen werden. Liegt die Datei im selben Ordner?</div>');
    });
  }
</script>
<script src="tour_figuren.js" onerror="tourLadefehler('tour_figuren.js')"></script>
<script src="tour_freunde.js" onerror="tourLadefehler('tour_freunde.js')"></script>
<script src="tour_kulisse.js" onerror="tourLadefehler('tour_kulisse.js')"></script>
<script src="tour_abspieler.js" onerror="tourLadefehler('tour_abspieler.js')"></script>
</head>
<body>
<script>
window.BOS_TOUR && BOS_TOUR.geschichte({
  titel:'Krank – und nun?',
  untertitel:'Wenn morgens plötzlich jemand fehlt',
  zurueck:{href:'wunschtag.html', name:'Der Wunschtag'},
  weiter:{href:'teigecke.html', name:'Nachts in der Teigecke'},
  szenen:[
    {n:'Früh am Morgen', d:7000,
     t:'Mittwochmorgen. Karl liegt flach und meldet sich bei der Produktionsleitung krank. Der Wochenplan ist längst raus, und morgen fehlt nun jemand.',
     m(F){
       return F.ort('zuhause',{licht:150})
         +F.bett(F.kopf(88,138,{c:'b',krank:true,mund:'sorge',gross:.86,drehen:-8}))
         +F.bub(56,58,196,'Ich schaff’s heute nicht …',100,118,.7);
     }},
    {n:'Eine Lücke im Plan', d:7000,
     t:'Im Büro zeigt der Plan sofort, wo es hakt: Donnerstag an der Rondo ist leer.',
     m(F){
       const tage=['Mo','Di','Mi','Do','Fr','Sa'];let g=`<rect x="140" y="34" width="208" height="134" rx="8" fill="#FFFDF6" stroke="${F.K}" stroke-width="2.2"/>`;
       tage.forEach((t,i)=>{const x=150+i*32;g+=F.text(x+14,56,t,1,'middle');
         [0,1,2].forEach(r=>{const y=64+r*30,leer=(t==='Do'&&r===1);
           g+=leer?`<rect class="zittern" x="${x}" y="${y}" width="28" height="24" rx="4" style="fill:#FCEBEB;stroke:#E24B4A;stroke-width:2;stroke-dasharray:4 3"/><text x="${x+14}" y="${y+17}" text-anchor="middle" style="fill:#A32D2D;font-size:13px;font-weight:600">?</text>`
                  :`<rect x="${x}" y="${y}" width="28" height="24" rx="4" fill="${['#FAC775','#B5D4F4','#C0DD97'][r]}" stroke="${F.K}" stroke-width="1.5"/>`;});});
       return F.ort('buero')+F.schild(104,6,'Büro')+g
         +F.chip(244,172,'Rondo ist die mittlere Reihe','middle')
         +F.fig(72,146,{c:'n',brille:true,mund:'sorge',blick:1})
         +F.bub(4,62,130,'Donnerstag fehlt …',70,120,.8);
     }},
    {n:'Der Krankmelder', d:8000,
     t:'Die Produktionsleitung öffnet den Krankmelder. BäckereiOS füllt die Lücke und lässt dabei alle anderen Tage so, wie sie schon verkündet sind. Wer möchte, kann auch komplett neu sortieren lassen.',
     m(F){
       const tage=['Mo','Di','Mi','Do','Fr','Sa'];let g=`<rect x="140" y="34" width="208" height="134" rx="8" fill="#FFFDF6" stroke="${F.K}" stroke-width="2.2"/>`;
       tage.forEach((t,i)=>{const x=150+i*32;g+=F.text(x+14,56,t,1,'middle');
         [0,1,2].forEach(r=>{const y=64+r*30,neu=(t==='Do'&&r===1);
           g+=neu?`<rect class="pop" style="--d:1.4s" x="${x}" y="${y}" width="28" height="24" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="2.6"/>`
                 :`<rect x="${x}" y="${y}" width="28" height="24" rx="4" fill="${['#FAC775','#B5D4F4','#C0DD97'][r]}" stroke="${F.K}" stroke-width="1.5"/>`;});});
       return F.ort('buero')+g
         +`<g class="pop" style="--d:.5s"><rect x="150" y="174" width="188" height="28" rx="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="2"/>`
         +`<text x="244" y="193" text-anchor="middle" style="fill:#085041;font-size:12px;font-weight:600;${F.FONT}">Minimal verändert</text></g>`
         +F.fig(72,146,{c:'n',brille:true,aR:[24,-6],blick:1});
     }},
    {n:'Kurz nachfragen', d:7500,
     t:'Erst speichern, noch nicht veröffentlichen. So bleibt Zeit für eine kurze Gedenkpause und ein Wort mit der Kollegin, die einspringen soll.',
     m(F){
       return F.ort('backstube')
         +F.fig(96,146,{c:'n',brille:true,aR:[16,4],blick:1})
         +F.fig(266,146,{hair:'bun',c:'g',blick:-1})
         +F.bub(14,58,160,'Kannst du Donnerstag?',94,120,.5)
         +F.bub(216,82,92,'Klar!',262,122,1.8);
     }},
    {n:'Alle wissen Bescheid', d:7500,
     t:'Jetzt wird veröffentlicht, und der neue Plan steht sofort bei allen. Springt jemand an einem eigentlich freien Tag ein, merkt BäckereiOS sich das, damit es später fair ausgeglichen werden kann.',
     m(F){
       return F.ort('backstube',{regal:'',lampe:false})+F.mitte(180,48)
         +[[52,'bun','g'],[152,'tuft','o'],[252,'tuft','r']].map(([x,h,c],k)=>
            F.fig(x,146,{hair:h,c,blick:x<152?1:x>152?-1:0})+F.paper(180,80,'stay',`--d:${.4+k*.35}s;--dx:${x-180+22}px;--dy:100px`)).join('')
         +F.schluss('daumen',null,{x:328});
     }}
  ]
});
</script>
</body>
</html>
