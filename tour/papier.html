<link rel="stylesheet" href="tour_geschichte.css">
<script>
  function tourLadefehler(datei){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="err" role="alert" style="margin:16px">'+datei+' konnte nicht geladen werden. Liegt die Datei im selben Ordner?</div>');
    });
  }
</script>
<script src="tour_figuren.js" onerror="tourLadefehler('tour_figuren.js')"></script>
<script src="tour_freunde.js" onerror="tourLadefehler('tour_freunde.js')"></script>
<script src="tour_kulisse.js" onerror="tourLadefehler('tour_kulisse.js')"></script>

<body>
<script>
window.BOS_TOUR && BOS_TOUR.geschichte({
  titel:'Papier darf bleiben',
  untertitel:'Drucken, was man in der Hand haben will',
  zurueck:{href:'meldestation.html', name:'Kaputt? Gemeldet.'},
  weiter:{href:'nicht.html', name:'Was BäckereiOS nicht tut'},
  szenen:[
    {n:'Nicht alles gehört aufs Tablet', d:7500,
     t:'BäckereiOS will das Papier nicht abschaffen. Manches hat man einfach lieber in der Hand oder an der Wand. Also kann man fast alles drucken.',
     m(F){
       return F.ort('buero',{licht:190})
         +F.drucker(196)
         +F.fig(72,146,{c:'n',brille:true,blick:1,aR:[22,-4]});
     }},
    {n:'Der Schnelldruck', d:8500,
     t:'Mit dem Schnelldruck ist eine Notiz oder eine Checkliste in einer halben Minute getippt und gedruckt. Kein Speichern, kein Umweg. Das wird fast täglich gebraucht.',
     m(F){
       return F.ort('buero')
         +F.figTab(66,146,{c:'n',brille:true,blick:1})
         +`<g class="pop" style="--d:.4s">`+F.karte(134,26,150,124,'Schnelldruck',[
            '☐ Mehl nachfüllen',
            '☐ Bleche zählen',
            '☐ Ofen 2 prüfen',
            {t:'Drucken ›',farbe:'#0F6E56',fett:true}
          ],'#FAC775')+`</g>`
         +`<g class="up" style="--d:1.8s"><rect x="296" y="60" width="52" height="72" rx="2" fill="#FFFDF6" stroke="${F.K}" stroke-width="2"/><path d="M304 76 h4 M304 90 h4 M304 104 h4" stroke="${F.K}" stroke-width="2" stroke-linecap="round"/><path d="M314 76 h26 M314 90 h26 M314 104 h20" stroke="#C9B79A" stroke-width="1.6" stroke-linecap="round"/></g>`
         +F.haken(322,146,2.6);
     }},
    {n:'Der Zettel für die Frühschicht', d:8500,
     t:'In der Druckzentrale entsteht der tägliche Zettel für die Frühschicht: was in welcher Menge gebraucht wird, dazu Notizen. Sauber gedruckt statt schnell hingekritzelt.',
     m(F){
       return F.ort('backstube',{licht:250,regal:'l'})
         +F.blatt(150,26,116,150,'Frühschicht')
         +`<rect x="156" y="68" width="104" height="100" fill="#FFFDF6"/>`
         +`<g class="pop" style="--d:.8s">`+['Mohn / Sesam','Croissants','Laugenecken','Käsebrötchen'].map((n,i)=>`<text x="160" y="${86+i*21}" style="fill:${F.K};font-size:11px;${F.FONT}">${n}</text>`+`<rect x="240" y="${74+i*21}" width="18" height="16" rx="3" fill="#E6F1FB" stroke="${F.K}" stroke-width="1.2"/>`).join('')+`</g>`
         +F.fig(308,146,{c:'r',muetze:true,blick:-1,aL:[-22,-4]})
         +F.bub(8,58,132,'Für morgen früh.',62,120,1.8)
         +F.fig(64,146,{hair:'bun',c:'g',blick:1,aR:[22,-4]});
     }},
    {n:'Für den Springer', d:9000,
     t:'Springt morgen Nacht jemand ein, bekommt er die Backprogramme als Tabelle in die Hand: welches Produkt, welches Programm. Kein Suchen, kein Raten.',
     m(F){
       let t=`<rect x="126" y="28" width="150" height="124" rx="3" fill="#FFFDF6" stroke="${F.K}" stroke-width="2.2"/><rect x="126" y="28" width="150" height="24" fill="#FAEEDA" stroke="${F.K}" stroke-width="2.2"/>`
         +`<text x="201" y="45" text-anchor="middle" style="fill:${F.K};font-size:12px;font-weight:600;${F.FONT}">Backprogramme</text><path d="M214 52 V152" stroke="${F.K}" stroke-width="1.4"/>`;
       [0,1,2,3].forEach(i=>{const y=52+i*25;t+=`<path d="M126 ${y+25} h150" stroke="#C9B79A" stroke-width="1.2"/><path d="M136 ${y+14} h${50+((i*13)%20)}" stroke="#C9B79A" stroke-width="5" stroke-linecap="round"/>`
         +`<rect x="226" y="${y+5}" width="38" height="15" rx="4" fill="#E6F1FB" stroke="${F.K}" stroke-width="1.2"/><text x="245" y="${y+16.5}" text-anchor="middle" style="fill:${F.K};font-size:10px;font-weight:600;${F.FONT}">Nr. ${[4,7,2,9][i]}</text>`;});
       return F.ort('backstube',{nacht:true,licht:200,regal:'',fenster:false,lampe:false})
         +`<g class="pop" style="--d:.4s">${t}</g>`
         +F.fig(62,146,{hair:'cap',c:'b',blick:1,aR:[24,-6]})
         +F.fig(310,146,{c:'t',mund:'wow',blick:-1,aL:[-22,-6]})
         +F.bub(136,170,124,'Damit geht’s.',284,176,1.8);
     }},
    {n:'An die Wand damit', d:8000,
     t:'Auch der Wochenplan und jeder Aushang lassen sich drucken und aufhängen. BäckereiOS und die Wand in der Backstube erzählen dasselbe, nur eben jeder auf seine Art.',
     m(F){
       return F.ort('backstube',{licht:180,regal:'',lampe:false})
         +F.blatt(26,26,110,140,'Wochenplan')+`<circle cx="81" cy="30" r="5" fill="#D85A30" stroke="${F.K}" stroke-width="1.6"/>`
         +F.blatt(160,36,100,128,'Aushang')+`<circle cx="210" cy="40" r="5" fill="#378ADD" stroke="${F.K}" stroke-width="1.6"/>`
         +F.fig(292,146,{hair:'tuft',c:'o',blick:-1,aL:[-20,-8]})
         +F.schluss('zwinkern',null,{x:150});
     }}
  ]
});
