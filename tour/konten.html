<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jedem sein Konto · BäckereiOS Einblick</title>
<!--

      vom Ideen-Chat (Entwurf 13. Fassung), Szenen und Texte unverändert übernommen.

<link rel="stylesheet" href="tour_geschichte.css">
<script>
  function tourLadefehler(datei){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="err" role="alert" style="margin:16px">'+datei+' konnte nicht geladen werden. Liegt die Datei im selben Ordner?</div>');
    });
  }
</script>
<script src="tour_figuren.js" onerror="tourLadefehler('tour_figuren.js')"></script>
<script src="tour_freunde.js" onerror="tourLadefehler('tour_freunde.js')"></script>
<script src="tour_kulisse.js" onerror="tourLadefehler('tour_kulisse.js')"></script>
<script src="tour_abspieler.js" onerror="tourLadefehler('tour_abspieler.js')"></script>
</head>
<body>
<script>
window.BOS_TOUR && BOS_TOUR.geschichte({
  titel:'Jedem sein Konto',
  untertitel:'Für Menschen und für Orte',
  zurueck:{href:'krank.html', name:'Krank – und nun?'},
  weiter:{href:'nachrichten.html', name:'Nachricht für dich'},
  szenen:[
    {n:'Ein Konto für den Ort', d:8000,
     t:'In BäckereiOS bekommen nicht nur Menschen ein Konto, sondern auch Orte. Das Tablet an der Rondo ist so einer: Es gehört dem Platz. Wer dort steht, arbeitet einfach los, ohne sich erst anzumelden.',
     m(F){
       return F.ort('backstube',{licht:230,regal:'l'})+F.schild(12,14,'An der Rondo')
         +F.stationTablet(244,'Konto: Rondo')
         +F.rein(F.fig(150,146,{hair:'cap',c:'b',aR:[24,-6],blick:1}),{von:-200,d:.2})
         +F.bub(24,84,136,'Einfach loslegen.',140,124,1.8);
     }},
    {n:'Ein Konto für den Menschen', d:8000,
     t:'Paul hat sein eigenes Konto, auch am eigenen Handy. Sein Wunschtag, seine Nachrichten: Das gehört zu ihm und nicht zu einem Tablet in der Backstube.',
     m(F){
       return F.ort('zuhause',{licht:90})
         +F.figTab(70,146,{hair:'tuft',c:'o',blick:1})
         +`<g class="pop" style="--d:.5s">`+F.karte(138,40,200,112,'Konto: Paul',[
            {t:'Mein Wunschtag',fett:true},
            {t:'Meine Nachrichten',fett:true},
            {t:'gehört nur zu mir',farbe:F.SOFT}
          ],'#FAC775')+`</g>`
         +F.haken(316,82,1.2)+F.haken(316,101,1.6);
     }},
    {n:'Crumble verteilt die Schlüssel', d:9000,
     t:'Was ein Konto darf, hängt an seinen Schlüsseln, und die verteilt Crumble. Hannes von der Haustechnik bekommt „Reparaturen bearbeiten“. Ben ist Azubi: „Nachrichten schreiben“ bleibt erst einmal bei Crumble.',
     m(F){
       return F.ort('backstube',{regal:'',lampe:false})
         +F.loch(180,226,'pfote',.2,78)
         +`<g class="pop" style="--d:.9s">`+F.bund(218,148,['#B5D4F4','#FAC775','#C0DD97'],1)+`</g>`
         +F.fig(58,146,{hair:'tuft',c:'v',aR:[20,-6],blick:1})
         +`<g class="pop" style="--d:1.6s">`+F.dkey(108,150,'#CECBF6',{dreh:-20,gross:1.2})+`</g>`
         +`<g class="pop" style="--d:1.9s">`+F.chip(8,84,'Reparaturen bearbeiten')+`</g>`
         +F.fig(314,146,{c:'t',blick:-1})
         +`<g class="pop" style="--d:2.6s">`+F.dkey(268,152,'#B5D4F4',{dreh:20,gross:1.2,leer:true})+F.chip(352,84,'Nachrichten schreiben','end')+F.chip(352,108,'noch nicht','end')+`</g>`;
     }},
    {n:'Gleiche Rolle, anderer Bund', d:9000,
     t:'Paul und Fritz haben dieselbe Rolle und damit dieselbe Grundausstattung. Paul pflegt aber zusätzlich die Teige, also hängt an seinem Bund ein Schlüssel mehr. Rechte lassen sich für jedes Konto einzeln einstellen.',
     m(F){
       return F.ort('backstube',{regal:'',lampe:false})
         +F.fig(100,146,{hair:'tuft',c:'o',blick:1})+F.fig(260,146,{c:'r',muetze:true,blick:-1})
         +F.namensschild(100,226,'Rolle: Backstube',.3)+F.namensschild(260,226,'Rolle: Backstube',.5)
         +`<g class="pop" style="--d:.9s">`+F.bund(88,50,['#C0DD97','#FAC775'],1.15)+`</g>`
         +`<g class="pop" style="--d:1.1s">`+F.bund(260,44,['#C0DD97','#FAC775'],1.15)+`</g>`
         +`<g class="stamp" style="--d:2s">`+F.dkey(128,52,'#9FE1CB',{dreh:-38,gross:1.35})+`</g>`
         +`<g class="pop" style="--d:2.4s">`+F.chip(128,96,'+ Teige pflegen')+`</g>`;
     }},
    {n:'Auch eine Filiale', d:9500,
     t:'Auch eine Filiale ist ein Ort und kann ein eigenes Konto bekommen, mit genau den Schlüsseln, die sie braucht. Zum Beispiel „Nachrichten empfangen“, den ein Stations-Tablet nie bekommt. Genutzt wird das noch nicht, aber es ist startklar: Es könnte von heute auf morgen losgehen.',
     m(F){
       return F.ort('hof')
         +F.filiale(22)
         +`<g class="pop" style="--d:.8s">`+F.bund(262,62,['#85B7EB'],1.4)+F.chip(350,124,'Nachrichten empfangen','end')+`</g>`
         +`<g class="stamp" style="--d:1.8s"><g transform="rotate(-6 268 186)"><rect x="206" y="168" width="124" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.4"/>`
         +`<text x="268" y="191" text-anchor="middle" style="fill:#085041;font-size:15px;font-weight:600;${F.FONT}">startklar</text></g></g>`;
     }},
    {n:'Jeder sieht, was er braucht', d:8500,
     t:'So sieht am Ende jeder genau das, was er für seine Arbeit braucht, nicht mehr und nicht weniger. Ein System, und für jeden Menschen und jeden Ort der passende Schlüsselbund.',
     m(F){
       const A='#FAC775',B='#B5D4F4',C='#C0DD97',V='#CECBF6',T='#9FE1CB';
       const schirm=(x,name,farben,d)=>`<g class="pop" style="--d:${d}s">`+F.tablet(x,56,92,84,F.kacheln(x+13,69,farben,3,18))+F.chip(x+46,150,name,'middle')+`</g>`;
       return F.ort('bos',{ton:'creme'})
         +schirm(14,'Hannes',[V,B,null,null,null,null],.2)
         +schirm(120,'Paul',[C,A,B,T,null,null],.6)
         +schirm(226,'Rondo',[C,A,null,null,null,null],1.0)
         +`<g class="pop" style="--d:2.6s">`+F.bund(282,204,['#CECBF6','#FAC775','#9FE1CB'],.85)+`</g>`
         +F.schluss('zwinkern');
     }}
  ]
});
</script>
</body>
</html>
