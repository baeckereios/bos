<link rel="stylesheet" href="tour_geschichte.css">
<script>
  function tourLadefehler(datei){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="err" role="alert" style="margin:16px">'+datei+' konnte nicht geladen werden. Liegt die Datei im selben Ordner?</div>');
    });
  }
</script>
<script src="tour_figuren.js" onerror="tourLadefehler('tour_figuren.js')"></script>
<script src="tour_freunde.js" onerror="tourLadefehler('tour_freunde.js')"></script>
<script src="tour_kulisse.js" onerror="tourLadefehler('tour_kulisse.js')"></script>
<script src="tour_abspieler.js" onerror="tourLadefehler('tour_abspieler.js')"></script>
</head>
<body>
<script>
window.BOS_TOUR && BOS_TOUR.geschichte({
  titel:'Das Lager weiß Bescheid',
  untertitel:'Von der Backstube zum Lager – in Planung',
  geplant:true,
  zurueck:{href:'meldestation.html', name:'Kaputt? Gemeldet.'},
  szenen:[
    {n:'Bleche fehlen', d:7000,
     t:'In der Backstube gehen die Bleche aus. Das Lager liegt eine Straße weiter. Heute schreibt man dafür eine Nachricht aufs Handy und hofft, dass sie jemand liest.',
     m(F){
       return F.ort('backstube',{licht:120,regal:''})+F.schild(12,14,'Backstube')
         +F.stikken(216,3)
         +F.figTab(108,146,{hair:'cap',c:'b',mund:'sorge',blick:1})
         +F.bub(120,56,196,'Uns gehen die Bleche aus.',124,122,.6)
         +F.paper(112,182,'fly','--d:1.6s;--dx:220px;--dy:-160px');
     }},
    {n:'Unterwegs', d:7000,
     t:'Fred ist gerade auf seiner Filialtour. Die unterbricht niemand, um im Lager etwas zu holen. Muss er auch nicht.',
     m(F){
       let s='';for(let i=0;i<8;i++)s+=`<rect x="${i*60}" y="228" width="30" height="4" rx="2" fill="#FFFFFF"/>`;
       return F.ort('strasse')+`<g class="fahren">${s}</g>`
         +F.lkw(F.kopf(254,136,{c:'p',hair:'tuft',gross:.4}))
         +F.bub(196,28,132,'Erst die Tour.',256,112,.6);
     }},
    {n:'Zurück im Lager', d:7500,
     t:'Nach jeder Tour kommt Fred ins Lager, um die Retouren abzuladen. Das Rolltor geht hoch.',
     m(F){
       return F.ort('hof')+F.schild(12,14,'Lager')
         +F.halle(176)
         +F.kartons(84,193)+F.chip(126,224,'Retouren','middle')
         +F.fig(40,146,{hair:'tuft',c:'p',blick:1});
     }},
    {n:'Ein Blick auf den Monitor', d:8000,
     t:'Drinnen hängt ein Monitor, auf dem BäckereiOS mit einem eigenen Konto läuft. Er zeigt nur, was Backstube und Konditorei gerade brauchen. Freds Blick fällt darauf: „Ach, das wird drüben gebraucht.“',
     m(F){
       return F.ort('lager',{licht:120})
         +F.monitor(178,26,
            F.text(258,54,'Wird gebraucht',0,'middle')
           +`<g class="pop" style="--d:.6s"><rect x="196" y="62" width="124" height="22" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.6"/>`+F.text(204,78,'Backstube: Bleche',0)+`</g>`
           +`<g class="pop" style="--d:.9s"><rect x="196" y="90" width="124" height="22" rx="4" fill="#FBEAF0" stroke="#993556" stroke-width="1.6"/>`+F.text(204,106,'Konditorei: Mehl',0)+`</g>`)
         +F.fig(86,146,{hair:'tuft',c:'p',mund:'wow',blick:1})
         +F.bub(124,176,226,'Ach, das wird drüben gebraucht!',112,164,1.4);
     }},
    {n:'Gleich mitgenommen', d:8000,
     t:'Fred nimmt die Bleche auf dem Weg einfach mit. Kein Anruf, keine Nachricht, keine Extrafahrt. Der Lager-Monitor ist noch in Planung.',
     m(F){
       return F.ort('lager',{licht:110})
         +F.fig(110,146,{hair:'tuft',c:'p',aL:[14,12],aR:[10,12],vorArm:F.bleche(-8,44,4,60)})
         +F.bub(176,52,140,'Bring ich mit!',128,118,.6)
         +F.stempel(250,140,'Lager-Monitor','in Planung')
         +F.schluss('winken');
     }}
  ]
});
</script>
</body>
