<link rel="stylesheet" href="tour_geschichte.css">
<script>
  function tourLadefehler(datei){
    document.addEventListener('DOMContentLoaded',function(){
      document.body.insertAdjacentHTML('afterbegin',
        '<div class="err" role="alert" style="margin:16px">'+datei+' konnte nicht geladen werden. Liegt die Datei im selben Ordner?</div>');
    });
  }
</script>
<script src="tour_figuren.js" onerror="tourLadefehler('tour_figuren.js')"></script>
<script src="tour_freunde.js" onerror="tourLadefehler('tour_freunde.js')"></script>
<script src="tour_kulisse.js" onerror="tourLadefehler('tour_kulisse.js')"></script>
<script src="tour_abspieler.js" onerror="tourLadefehler('tour_abspieler.js')"></script>
</head>
<body>
<script>
window.BOS_TOUR && BOS_TOUR.geschichte({
  titel:'Nachts in der Teigecke',
  untertitel:'Wie ein Neuer sicher durch die Nacht kommt',
  zurueck:{href:'produkte.html', name:'Jedes Produkt hat seine Karte'},
  weiter:{href:'sicher.html', name:'Fehler, die gar nicht erst passieren'},
  szenen:[
    {n:'Allein in der Teigecke', d:7000,
     t:'Nacht in der Backstube. Ben ist Azubi und steht heute zum ersten Mal allein in der Teigecke. Viele Teige, wenig Erfahrung.',
     m(F){
       return F.ort('backstube',{nacht:true,licht:150,regal:''})
         +F.kessel(244)
         +F.fig(110,146,{c:'t',mund:'sorge',blick:1})
         +F.bub(14,58,186,'Oh je … so viele Teige!',108,124,.7);
     }},
    {n:'Brotzahlen rein', d:8000,
     t:'Ben tippt ein, wie viele Brote heute gebraucht werden. BäckereiOS rechnet den Rest: die Zahl für den Rezeptcomputer, dazu Wasser, Hefe und wie viele Kessel. Kein Kopfrechnen um drei Uhr nachts.',
     m(F){
       const k=(x,y,t,d)=>`<g class="pop" style="--d:${d}s"><rect x="${x}" y="${y}" width="86" height="34" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>`
         +`<text x="${x+43}" y="${y+22}" text-anchor="middle" style="fill:#085041;font-size:12px;font-weight:600;${F.FONT}">${t} ✓</text></g>`;
       return F.ort('backstube',{nacht:true,licht:70,regal:'',fenster:false})
         +F.figTab(60,146,{c:'t',blick:1})
         +F.karte(118,30,108,72,'Korbbrot',[{t:'Brote: 80',fett:true}],'#9FE1CB')
         +`<path class="pop" style="--d:.8s;${F.S0}" d="M232 66 h14 l-5 -5 m5 5 l-5 5"/>`
         +k(254,24,'Teigmenge',1.2)+k(254,66,'Wasser',1.5)+k(254,108,'Hefe',1.8)+k(254,150,'Kessel',2.1);
     }},
    {n:'Alles hat ein Zuhause', d:8000,
     t:'Jede Zutat hat ihren festen Platz: auf einem beschrifteten Wagen oder in der Kühlung. Die Einsammelliste sagt Ben, wo er was findet. Kein Suchen, kein Fragen.',
     m(F){
       return F.ort('backstube',{nacht:true,licht:70,regal:'',fenster:false})
         +F.wagen(124,false,'Wagen 1')+F.wagen(210,true,'Wagen 2')
         +`<rect class="pop" style="--d:1s" x="200" y="120" width="94" height="96" rx="8" fill="none" stroke="#1D9E75" stroke-width="2.4" stroke-dasharray="5 4"/>`
         +F.kuehlung(300)
         +F.fig(58,146,{c:'t',aR:[22,-2],blick:1})
         +F.bub(8,56,146,'Wagen 2, Mitte!',64,122,1.3);
     }},
    {n:'Was die Erfahrenen wissen', d:8000,
     t:'Mehr Wasser abziehen, Mehl von Hand dazugeben: Solche Kniffe der erfahrenen Kollegen stehen jetzt direkt am Teig. Was früher nur im Kopf von Paul war, hat Ben heute vor sich.',
     m(F){
       const note=(x,y,t,d)=>`<g class="pop" style="--d:${d}s"><rect x="${x}" y="${y}" width="108" height="28" rx="5" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.8"/>`
         +`<text x="${x+54}" y="${y+18}" text-anchor="middle" style="fill:#633806;font-size:11px;${F.FONT}">${t}</text></g>`;
       return F.ort('backstube',{nacht:true,regal:'',fenster:false,lampe:false})+F.mitte(222,56)
         +F.fig(56,146,{hair:'tuft',c:'o',blick:1})+F.fig(304,146,{c:'t',mund:'wow',blick:-1})
         +note(8,24,'Tipp: Wasser ab',.3)+note(8,58,'Tipp: Mehl dazu',.6)
         +F.paper(96,104,'fly','--d:1s;--dx:100px;--dy:-44px')
         +F.paper(250,84,'stay','--d:2s;--dx:44px;--dy:100px');
     }},
    {n:'Läuft', d:7500,
     t:'Ben hat seine Nacht gut geschafft und muss niemanden anrufen. Genau dafür ist BäckereiOS da: Jeder soll in jeder Schicht klarkommen.',
     m(F){
       return F.ort('backstube',{nacht:true,licht:150,regal:''})
         +F.kessel(244,true)
         +F.fig(110,146,{c:'t',aL:[-14,-16],aR:[14,-16],huepf:true})
         +F.bub(20,60,96,'Läuft!',106,116,.6)
         +F.schluss('daumen',null,{x:328});
     }}
  ]
});
</script>
</body>
</html>
