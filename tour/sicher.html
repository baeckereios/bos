<script>

  titel:'Fehler, die gar nicht erst passieren',
  untertitel:'BäckereiOS passt mit auf',
  zurueck:{href:'teigecke.html', name:'Nachts in der Teigecke'},

  szenen:[
    {n:'Drei Uhr nachts', d:7000,
     t:'Drei Uhr nachts, der Kopf ist müde. Genau dann passieren die teuren Fehler. Deshalb passt BäckereiOS an ein paar Stellen ganz bewusst mit auf.',

    {n:'Zwei Kessel, nicht einer', d:10000,
     t:'Steht da „213,2 kg (2×)“, kann man zweimal 213 Kilo lesen und setzt die doppelte Menge an. BäckereiOS schreibt deshalb immer die Menge je Kessel nach vorn: „2 × 106,6 kg“. Die Gesamtmenge steht nur klein daneben.',

       return F.ort('backstube',{nacht:true,licht:100,regal:'',fenster:false,lampe:false})
         +`<g class="pop" style="--d:.3s"><rect x="18" y="24" width="150" height="56" rx="9" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2.2" stroke-dasharray="6 4"/>`

         +`<g transform="translate(60 76) scale(.62)">`+F.kessel(60,true)+`</g><g transform="translate(180 76) scale(.62)">`+F.kessel(60,true)+`</g>`

     }},
    {n:'Erst wählen, dann rechnen', d:11000,
     t:'Am Froster gibt es eine Frage mit zwei Knöpfen und keiner Vorauswahl. „Berechnen“ bleibt gesperrt, bis jemand wirklich gewählt hat. Ein Knopf, der schon vorbelegt ist, wird nachts einfach durchgetippt. Dieselbe Regel gilt im Produktionsplaner: keine Berechnung ohne vorherige Entscheidung.',
     m(F){
       return F.ort('froster',{licht:100})
         +`<rect x="132" y="24" width="214" height="150" rx="10" fill="#FFFDF6" stroke="${F.K}" stroke-width="2.2"/><path d="M132 50 v-16 a10 10 0 0 1 10 -10 h194 a10 10 0 0 1 10 10 v16z" fill="#B5D4F4" stroke="${F.K}" stroke-width="2.2"/>`

         +`<rect x="148" y="64" width="84" height="38" rx="9" fill="#FFFDF6" stroke="${F.K}" stroke-width="2"/><text x="190" y="88" text-anchor="middle" style="fill:${F.K};font-size:15px;font-weight:600;${F.FONT}">Ja</text>`

         +`<g class="stamp" style="--d:2.8s"><rect x="148" y="64" width="84" height="38" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2.8"/><text x="190" y="88" text-anchor="middle" style="fill:#085041;font-size:15px;font-weight:600;${F.FONT}">Ja ✓</text></g>`
         +`<g class="pop" style="--d:3.8s"><rect x="148" y="120" width="182" height="36" rx="9" fill="#9FE1CB" stroke="#0F6E56" stroke-width="2.4"/><text x="239" y="143" text-anchor="middle" style="fill:#085041;font-size:13px;font-weight:600;${F.FONT}">Berechnen ›</text></g>`
         +F.fig(70,146,{hair:'tuft',c:'o',aR:[24,-10],blick:1});
     }},
    {n:'Alte Zahlen melden sich', d:8000,
     t:'Mit einer Zählung von vorgestern rechnet BäckereiOS nicht stillschweigend weiter. Es sagt, wie alt die Zahl ist, und bittet darum, neu zu zählen.',
     m(F){
       return F.ort('froster',{licht:110})
         +`<g class="pop" style="--d:.3s">`+F.karte(166,34,178,90,'Froster-Bestand',[{t:'zuletzt gezählt: vorgestern',farbe:'#A32D2D'},{t:'Bitte neu zählen',gestrichelt:true}],'#F7C1C1')+`</g>`
         +F.fig(100,146,{hair:'cap',c:'b',blick:1,aR:[20,10]})+F.klemmbrett(132,166)
         +F.bub(14,62,112,'Zähl ich neu.',96,120,1.6);
     }},
    {n:'Klartext statt Rätsel', d:8500,
     t:'Und wenn doch etwas schiefgeht, sagt BäckereiOS, was los ist: im Klartext auf dem Bildschirm, nicht versteckt und nicht nur „fehlgeschlagen“. Damit man es melden kann, ohne zu raten.',
     m(F){
       return F.ort('backstube',{licht:110,regal:'',lampe:false})
         +F.tablet(128,34,216,140,
            `<rect x="144" y="52" width="184" height="46" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>`

           +`<rect x="144" y="110" width="110" height="30" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.8"/><text x="199" y="130" text-anchor="middle" style="fill:#633806;font-size:12px;font-weight:600;${F.FONT}">Noch einmal</text>`)
