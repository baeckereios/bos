'use strict';
/* ==================================================================
   Teige (Stationen) — Seitenlogik. Gerüst: ../teigecke/teigecke_seite.js.
   Rechnen und Formular: teigrechner_logik.js (mit node prüfbar).
   ================================================================== */
const tm = function () { return L.nachId(S.teige); };
const nm = function () { return L.nachId(S.nachtTeige); };
const pm = function () { return L.produktMap(S.produkte); };
function istAdmin() { return S.rolle === 'admin'; }
function darfTeig() { return S.haken.weitere && online(); }
function produktName(lk) { const p = pm()[lk]; return p ? p.name : lk; }
/* Name eines Teigs aus beiden Welten, sonst die Kennung. */
function teigName(k) { const x = tm()[k] || nm()[k]; return x ? x.name : k; }
function istNachtTeig(k) { return !!nm()[k]; }
function einheitVon(p) { return window.BOS_PRODUKTE.einheit(p || {}); }

/* ---------- Laden ---------- */
/* ladeProdukte: Muster aus teigecke/teigecke_rezepte.html (Sicht 'aktive': pausierte
   bleiben sichtbar und werden ausgegraut). */
async function ladeProdukte() {
  try {
    if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    if (window.BOS_PRODUKTE.EINHEITEN_LISTE.indexOf('Halbes Kuchenblech') === -1) throw new Error('bos_produkte.js ist in einer alten Fassung geladen (ohne „Halbes Kuchenblech“) — Seite neu laden. Hilft das nicht: Ulf Bescheid sagen.');
    const e = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' });
    S.produkte = e.liste; S.produkteOk = true;
    S.produkteAusSpiegel = (e.quelle === 'geraetekopie') ? (e.kopieZeit || e.stand) : null;
    if (e.quelle === 'geraetekopie' && e.grund) zeigeFehler(t('err_laden', { was: 'Produktliste' }), e.grund);
  } catch (err) {
    zeigeFehler(t('err_laden', { was: 'Produktliste' }), err);
    S.produkte = []; S.produkteOk = false;
  }
}
/* Haken weitereTeige und Rolle aus dem eigenen Konto. Das Gerüst liest nur die
   Teigecke-Haken; deshalb hier selbst, mit derselben Lade-Funktion. */
async function ladeKontoWeitere() {
  S.haken = { weitere: false }; S.rolle = null;
  if (!S.kennung) return;
  try {
    const konto = await window.BOS_ACCOUNTS.ladeKonto(window.db, S.kennung);
    S.haken = { weitere: !!(konto && konto.weitereTeige === true) };
    S.rolle = (konto && konto.role) || null;
  } catch (err) { zeigeFehler(t('err_konto'), err); }
}
function abonniere() {

function eingabeGeaendert(el) {

  if (feld === 'hefeKg' || feld === 'hefeG' || feld === 'kesselKg') { E.form[feld] = el.value; return; }
  if (feld === 'ausbeute-kg' || feld === 'ausbeute-n') {

    if (feld === 'ausbeute-kg') a.kg = el.value; else a.anzahl = el.value;

    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); });

function anhaken(lk) {
  const p = pm()[lk];
  E.auswahl[lk] = true; E.geaendert = true; E.frage = null;
  /* Ausbeute vom bisherigen weiteren Teig übernehmen — sichtbar markiert (Freigabe KC §2). */
  const a = E.form.ausbeute[lk];
  if ((!a || (!a.kg && !a.anzahl)) && p && p.ausTeig && tm()[p.ausTeig]) {
    const alt = (tm()[p.ausTeig].ausbeute || {})[lk];
    if (T.ausbeuteGueltig(alt)) { E.form.ausbeute[lk] = { kg: T.zahlText(alt.kg), anzahl: T.zahlText(alt.anzahl) }; E.uebernommen[lk] = true; }
  }
  if (!E.form.ausbeute[lk]) E.form.ausbeute[lk] = { kg: '', anzahl: '' };
  const s = document.getElementById('trSuche'); if (s) s.value = '';
  zeigeTreffer('');
  zeichneProdukte();
}
function stationUmschalten(s) {
  if (!S.haken.weitere || !E) return;
  const i = E.form.stationen.indexOf(s);
  if (i === -1) E.form.stationen.push(s); else E.form.stationen.splice(i, 1);
  E.geaendert = true;
  document.getElementById('trStationen').innerHTML = stationenHTML();
  zeichneProdukte();
}

/* ---------- Speichern: 1 · Teig, dann 2 · Produkte ---------- */
function fehlerTexte(kennungen) {
  return kennungen.map(function (f) {
    const teil = f.split(':'), lk = teil[1];
    switch (teil[0]) {
      case 'name_fehlt': return t('v_name_fehlt');
      case 'name_lang': return t('v_name_lang');
      case 'kennung_ungueltig': return t('v_kennung_ungueltig');
      case 'kennung_belegt': return t('v_kennung_belegt', { k: kennungJetzt() });
      case 'name_doppelt': return t('v_name_doppelt');
      case 'station_fehlt': return t('v_station_fehlt');
      case 'station_unbekannt': return t('v_station_unbekannt');
      case 'hefe_zahl': return t('v_hefe_zahl');
      case 'hefe_halb': return t('v_hefe_halb');
      case 'kessel_zahl': return t('v_kessel_zahl');
      case 'ausbeute_zahl': return t('v_ausbeute_zahl', { name: produktName(lk) });
      case 'ausbeute_halb': return t('v_ausbeute_halb', { name: produktName(lk) });
      default: return f;
    }
  });
}
/* Formular für das Dokument: nur die Ausbeuten der angehakten Produkte. Abgehakte
   behalten ihren alten Eintrag (bleiben liegen, Freigabe KC §2). */
function formFuerDokument() {
  const f = Object.assign({}, E.form, { kennung: kennungJetzt(), neu: !E.id, ausbeute: {} });
  Object.keys(E.form.ausbeute).forEach(function (lk) { if (E.auswahl[lk] === true) f.ausbeute[lk] = E.form.ausbeute[lk]; });
  return f;
}
function produkteGeaendert() { return Object.keys(E.auswahl).some(function (lk) { return !!E.auswahl[lk] !== !!E.ursprung[lk]; }); }
async function speichere() {
  if (!E || speichertGerade()) return;
  editFehler('');
  const form = formFuerDokument();
  const fehler = (S.haken.weitere ? fehlerTexte(T.pruefeForm(form, { nacht: S.nachtTeige, weitere: S.teige })) : []);
  if (!E.id && !S.haken.weitere) fehler.push(t('sp_neu_ohne_haken'));
  if (fehler.length) { editFehler(fehler.join(' ')); return; }
  E.sp = { teig: 'laeuft', teigText: '', produkte: 'wartet', produkteText: '' };
  zeichneSpeichern();
  const ok = await schrittTeig();
  if (ok) await schrittProdukte();
}
async function schrittTeig() {
  E.sp.teig = 'laeuft'; E.sp.teigText = ''; zeichneSpeichern();
  const form = formFuerDokument();
  const alt = E.id ? tm()[E.id] : null;
  const daten = T.teigDokument(form, alt ? alt.ausbeute : null, alt ? !!alt.geloescht : false);
  if (!S.haken.weitere) {
    E.sp.teig = 'nichts'; E.sp.teigText = (alt && !T.teigGleich(daten, alt)) ? t('sp_ohne_haken') : '';
    zeichneSpeichern(); return true;
  }
  if (alt && T.teigGleich(daten, alt)) { E.sp.teig = 'nichts'; zeichneSpeichern(); return true; }
  try {
    if (!alt) {
      const kennung = form.kennung;
      await schreibeNeuEindeutig(COL.teige, function (v) { return v === 0 ? { id: kennung, daten: daten } : null; }, 1);
      E.id = kennung;
    } else {
      await schreibe(COL.teige, E.id, daten, 'aendern', alt);
    }
    E.sp.teig = 'ok';
    E.alt = tm()[E.id] || E.alt;
    document.getElementById('editTitel').textContent = t('e_titel', { name: daten.name });
    zeichneSpeichern();
    return true;
  } catch (err) {
    E.sp.teig = 'fehler';
    if (err && err.code === 'belegt') E.sp.teigText = t('sp_belegt', { k: form.kennung });
    else if (err && err.code === 'permission-denied' && alt) {
      const konflikt = await konfliktText(COL.teige, E.id, alt);
      E.sp.teigText = konflikt || fehlerText(t('err_speichern'), err);
      if (!konflikt) zeigeFehler(t('sp_teig'), err); else console.error('[Teige Stationen] Teig abgelehnt: veralteter Stand', err);
    } else { E.sp.teigText = fehlerText(t('err_speichern'), err); zeigeFehler(t('sp_teig'), err); }
    zeichneSpeichern();
    return false;
  }
}
/* KOPIERT aus teigecke/teigecke_rezepte.html schrittBrote() (Stand v0.2a, 15.10.2026),
   Weg B der Freigabe (KC 16.10., 16:37). Geändert nur: Zustand E statt S.strecke,
   Texte sp_produkte_*, die Auswahl als { lk: { an } } für L.ausTeigAenderungen und
   die Teilgröße T.PRODUKTE_JE_VORGANG (4) statt HOECHSTENS_JE_VORGANG (10, #70).
   Zusammenführen später mit #70. */
async function schrittProdukte() {
  const kennung = E.id;
  if (!produkteGeaendert()) { E.sp.produkte = 'nichts'; fertigPruefen(); return; }
  if (!istAdmin()) { E.sp.produkte = 'nichts'; E.sp.produkteText = t('sp_ohne_rolle'); fertigPruefen(); return; }
  E.sp.produkte = 'laeuft'; E.sp.produkteText = '';
  zeichneSpeichern();
  let erledigt = 0, gesamt = 0;
  try {
    if (!window.BOS_PRODUKTE || !window.BOS_PRODUKTE_SCHREIBEN) throw new Error('bos_produkte.js / bos_produkte_schreiben.js nicht geladen');
    /* frisch vom Server, nie die Gerätekopie */
    const e = await window.BOS_PRODUKTE.lade({ sicht: 'roh', nurServer: true, frisch: true });
    const brote = {}; Object.keys(E.auswahl).forEach(function (lk) { brote[lk] = { an: E.auswahl[lk] === true }; });
    const aenderungen = L.ausTeigAenderungen(kennung, brote, e.liste);
    gesamt = aenderungen.length;
    if (!gesamt) { E.sp.produkte = 'nichts'; await ladeProdukte(); fertigPruefen(); return; }
    const standRef = window.db.collection(window.BOS_PRODUKTE_SCHREIBEN.STAND_COLLECTION).doc(window.BOS_PRODUKTE_SCHREIBEN.STAND_DOK);
    const standSnap = await standRef.get({ source: 'server' });
    let stand = standSnap.exists && typeof standSnap.data().nummer === 'number' ? standSnap.data().nummer : null;
    let existiert = standSnap.exists;
    for (const teil of L.teile(aenderungen, T.PRODUKTE_JE_VORGANG)) {
      const erg = await mitZeitlimit(window.BOS_PRODUKTE_SCHREIBEN.schreibe({ kennung: S.kennung, geladenerStand: stand, standExistiert: existiert, eintraege: teil }));
      stand = erg.neuerStand; existiert = true; erledigt += teil.length;
    }
    E.sp.produkte = 'ok'; E.sp.produkteText = t('sp_produkte_ok', { n: erledigt, stand: stand });
    await ladeProdukte();    /* der Stand ist gestiegen: neue Liste holen */
    fertigPruefen();
  } catch (err) {
    E.sp.produkte = 'fehler';
    const teil = erledigt ? t('sp_produkte_teil', { i: erledigt, n: gesamt }) + ' ' : '';
    E.sp.produkteText = teil + (window.BOS_PRODUKTE && err && err.meldung ? window.BOS_PRODUKTE.fehlerText(err) : fehlerText(t('err_speichern'), err)) +
      (err && err.code === 'permission-denied' ? ' · ' + t('sp_produkte_perm') : '');
    zeigeFehler(t('sp_produkte'), err);
    if (erledigt) await ladeProdukte();
    zeichneSpeichern();
  }
}
function fertigPruefen() {
  const ok = function (z) { return z === 'ok' || z === 'nichts'; };
  if (ok(E.sp.teig) && ok(E.sp.produkte)) {
    E.geaendert = false;
    /* Neuer Ausgangsstand: was jetzt am Teig hängt. */
    E.ursprung = {}; Object.keys(E.auswahl).forEach(function (lk) { if (E.auswahl[lk] === true) E.ursprung[lk] = true; });
    toast(t('sp_fertig'));
  }
  zeichneSpeichern();
  render();
}

/* ---------- Schließen, Archiv ---------- */
function frageSchliessen() {
  if (E && E.geaendert && !speichertGerade()) {
    const id = E.id;
    const merk = E;
    oeffneEdit(t('verwerfen_titel'), '<p class="sheet-info">' + esc(t('verwerfen_text')) + '</p>',
      [{ aktion: 'verwerfen', text: t('verwerfen_ja'), klasse: 'gefahr' }, { aktion: 'weiter-bearbeiten', text: t('verwerfen_nein') }]);
    E = merk; E._zurueck = id;
    return;
  }
  E = null; schliesseEdit();
}
function archivFrage() {
  if (!E || !E.id) return;
  const haengen = T.produkteDesTeigs(E.id, S.produkte);
  if (haengen.length) { editFehler(t('sperre_archiv', { liste: haengen.map(function (p) { return p.name; }).join(', ') })); return; }
  const name = (tm()[E.id] || {}).name || E.id, id = E.id;
  E = null;
  editZustand = { typ: 'archiv', id: id };
  oeffneEdit(t('archiv_frage_titel', { name: name }), '<p class="sheet-info">' + esc(t('archiv_frage_text')) + '</p>',
    [{ aktion: 'archivieren', text: t('archivieren').replace(' …', ''), klasse: 'gefahr' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
}
async function archiviere() {
  const z = editZustand; if (!z || z.typ !== 'archiv') return;
  const alt = tm()[z.id]; if (!alt) return;
  await fuehreSchreibenAus(COL.teige, z.id, Object.assign({}, alt, { geloescht: true }), 'archivieren', alt, t('archiviert'));
}
async function stelleWiederHer(id) {
  const dok = tm()[id];
  if (!dok) return;
  if (!S.haken.weitere) { zeigeFehler(t('wiederherstellen'), { message: t('err_haken_fehlt') }); return; }
  if (T.nameBelegt(dok.name, L.aktiv(S.nachtTeige), L.aktiv(S.teige), id)) { zeigeFehler(t('wiederherstellen'), { message: t('v_name_doppelt') }); return; }
  try {
    await schreibe(COL.teige, id, Object.assign({}, dok, { geloescht: false }), 'wiederherstellen', dok);
    toast(t('wiederhergestellt'));
  } catch (err) {
    if (err && err.code === 'permission-denied') {
      const konflikt = await konfliktText(COL.teige, id, dok);
      if (konflikt) { zeigeFehler(t('wiederherstellen'), { message: konflikt }); return; }
    }
    zeigeFehler(t('err_speichern'), err);
  }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id');
  switch (a) {
    case 'reiter': {
      S.station = el.getAttribute('data-station');
      try { localStorage.setItem('bos_teigrechner_teige_station', S.station); } catch (x) { /* ohne Speicher geht es auch */ }
      render(); window.scrollTo(0, 0); break;
    }
    case 'neu-teig': if (darfTeig()) oeffneTeig(null); break;
    case 'teig-oeffnen': oeffneTeig(id); break;
    case 'archiv-umschalten': S.zeigeArchiv = !S.zeigeArchiv; render(); break;
    case 'wiederherstellen': stelleWiederHer(id); break;
    case 'station': stationUmschalten(el.getAttribute('data-station')); break;
    case 'haken': hakenUmschalten(el.getAttribute('data-lk')); break;
    case 'frage-ja': if (E && E.frage) anhaken(E.frage); break;
    case 'frage-nein': if (E) { E.frage = null; zeichneProdukte(); } break;
    case 'speichern': speichere(); break;
    case 'wiederhole-teig': (async function () { if (await schrittTeig()) await schrittProdukte(); })(); break;
    case 'wiederhole-produkte': schrittProdukte(); break;
    case 'schliessen-frage': frageSchliessen(); break;
    case 'verwerfen': E = null; schliesseEdit(); break;
    case 'weiter-bearbeiten': {
      const merk = E; const id2 = merk && merk._zurueck;
      oeffneEdit(id2 ? t('e_titel', { name: (tm()[id2] || {}).name || id2 }) : t('e_titel_neu'), '', []);
      E = merk; zeichneEdit(); break;
    }
    case 'archiv-frage': archivFrage(); break;
    case 'archivieren': archiviere(); break;
    case 'abbrechen': E = null; schliesseEdit(); break;
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'trSuche') { zeigeTreffer(e.target.value); return; }
  if (e.target && e.target.closest && e.target.closest('#editInhalt')) eingabeGeaendert(e.target);
});
document.getElementById('editSheet').addEventListener('click', function (e) { if (e.target === this) frageSchliessen(); });

/* ---------- Hilfe (Checkliste §7; kanonische Fassung in TEIGRECHNER_DOKU.md) ---------- */
const helpData = {

    { heading: 'Die Reiter', text: 'Je Station ein Reiter. Ein Teig, der zu mehreren Stationen gehört, steht in jedem dieser Reiter. Im Reiter 🌙 Nachtschicht siehst du die Teige des BrotTeigRechners mit ihren Produkten, grau und ohne Stift. Gepflegt werden sie dort, unter „Teige & Rezepte“.' },
    { heading: 'Ausbeute: so, wie es auf dem Zettel steht', text: 'Je Produkt trägst du zwei Zahlen ein: „30 kg Teig ergibt 24 Bleche“. Die Einheit kommt aus der Produktliste (Lochblech, Kuchenblech, Halbes Kuchenblech …). BOS rechnet daraus selbst, wie viel kg Teig ein Blech braucht, und zeigt es daneben („= 1,25 kg je Blech“). Die Zahl auf dem Zettel ist die Teigmenge für WinBack mit Abschnitt. Fehlt die Ausbeute, steht „Ausbeute fehlt“ — der Rechner rechnet den Teig dann nicht, sobald für dieses Produkt etwas eingetragen ist.' },

function renderHilfe() {

}
document.getElementById('hilfeBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = false; });
document.getElementById('hilfeZuBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = true; });
document.getElementById('hilfeSheet').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
