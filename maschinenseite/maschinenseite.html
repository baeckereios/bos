/* ---------- Werkzeuge ---------- */
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
let toastUhr = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastUhr); toastUhr = setTimeout(function () { el.hidden = true; }, 3800);
}

/* ---------- Fehler auf den Bildschirm (Checkliste §7a) ---------- */

}

window.onerror = function (msg, quelle, zeile, spalte, err) {

};

/* ---------- Zustand ---------- */
const S = {
  kennung: null, ich: null, konto: null, zugang: null, regel: 'unbekannt',
  maschinen: null, produkte: null,
  mid: null, ansicht: 'liste',
  maschine: null, reihenfolge: null, angaben: null, geladenFuer: null,
  ed: null,          // Editor: { eingabe: {key:{feld:wert}}, geaendert:{}, laeuft:{}, meldung:{}, konflikt:{}, folge:[keys], folgeGeaendert, veraltet:{} }
  v: null,           // Verwalten: { neu, form, personen, personenFehler, geaendert, laeuft }
  speichertAlle: false,
  wahl: {}           // Backprogramme: { maschineId: { sortierung, filter } }
};
function maschineSichtbar(m) { return m && m.geloescht !== true; }
function istAdmin() { return !!(S.zugang && S.zugang.admin); }
function istFuehrerHier() { return !!(S.zugang && S.zugang.person && M.istFuehrer(S.maschine, S.kennung)); }

/* ---------- Adresse = Zustand (?maschine=…&ansicht=…; kein #, die Tür schneidet ihn ab) ---------- */
function ausAdresse() {
  const p = new URLSearchParams(window.location.search);
  S.mid = p.get('maschine') || null;
  const a = p.get('ansicht') || '';
  S.ansicht = !S.mid ? (a === 'neu' ? 'neu' : 'liste') : (['programme', 'editor', 'verwalten'].indexOf(a) !== -1 ? a : 'maschine');
}
function geheZu(mid, ansicht) {
  if (ungespeichert() && !window.confirm(t('unge_frage'))) return;
  verwirfEingaben();
  const p = new URLSearchParams();
  if (mid) p.set('maschine', mid);
  if (ansicht && ansicht !== 'maschine' && ansicht !== 'liste') p.set('ansicht', ansicht);
  const neu = window.location.pathname + (p.toString() ? '?' + p.toString() : '');
  try { history.pushState({}, '', neu); } catch (e) { /* ohne Verlauf: nur neu zeichnen */ }
  ausAdresse(); zeige();
}
window.addEventListener('popstate', function () { verwirfEingaben(); ausAdresse(); zeige(); });

/* ---------- Ungespeichert (Checkliste §7b) ---------- */
function ungespeichert() {
  const edOffen = S.ed && (Object.keys(S.ed.geaendert).length > 0 || S.ed.folgeGeaendert);
  const vOffen = S.v && S.v.geaendert;
  return !!(edOffen || vOffen);
}
function verwirfEingaben() { S.ed = null; S.v = null; }
(function (pruef) {
  if (window.BOS_UNGESPEICHERT) { window.BOS_UNGESPEICHERT.melde(pruef, { laeuft: function () { return S.speichertAlle || !!(S.ed && Object.keys(S.ed.laeuft).length) || !!(S.v && S.v.laeuft); } }); return; }
  window.addEventListener('beforeunload', function (e) { if (pruef()) { e.preventDefault(); e.returnValue = ''; } });
})(function () { return ungespeichert(); });

/* ---------- Start ---------- */
function setzeKopf(eyebrow, titel) {
  document.getElementById('eyebrow').textContent = eyebrow;
  document.getElementById('kopfTitel').textContent = titel;
  document.title = 'BäckereiOS · ' + titel;
}
function werZeile() {
  const el = document.getElementById('werZeile');
  if (!S.ich) { el.textContent = ''; return; }
  el.innerHTML = esc(t('du_als', { name: S.ich.name })) +
    (istAdmin() ? '<span class="abzeichen">' + esc(t('ab_admin')) + '</span>' : '') +
    (S.maschine && istFuehrerHier() ? '<span class="abzeichen">' + esc(t('ab_fuehrer')) + '</span>' : '');
}
async function start() {
  ausAdresse();
  if (!M || !A) { zeigeFehler('Start', new Error('maschinen_logik.js oder maschinen_ansicht.js ist nicht geladen.')); return; }
  let nutzer;
  try { nutzer = await window.BOS_AUTH_READY; } catch (e) { zeigeFehler(t('err_laden', { was: t('w_konto') }), e); return; }
  if (!nutzer || !nutzer.email) { zeigeFehler(t('err_laden', { was: t('w_konto') }), new Error('Nicht angemeldet — bitte an der Tür anmelden.')); return; }
  S.kennung = String(nutzer.email).split('@')[0].toLowerCase();
  M.pruefeRegelstand().then(function (stand) {
    S.regel = stand;
    const el = document.getElementById('regelLeiste');
    el.textContent = t('regel_alt', { fassung: M.REGEL_FASSUNG, datei: M.REGEL_DATEI });
    el.hidden = stand !== 'alt';
  });
  try { S.konto = await M.ladeKonto(null, S.kennung); }
  catch (e) { zeigeFehler(t('err_laden', { was: t('w_konto') }), e); document.getElementById('ladeStatus').textContent = ''; return; }
  S.zugang = M.zugang(S.konto);
  try { S.ich = window.BOS_MELDUNGEN ? await window.BOS_MELDUNGEN.ich() : { kennung: S.kennung, name: S.kennung, warnungen: [] }; }
  catch (e) { S.ich = { kennung: S.kennung, name: S.kennung, warnungen: [] }; }
  (S.ich.warnungen || []).forEach(function (w) { hinweis(w); });
  werZeile();
  if (!S.zugang.lesen) { zeigeZugang(); return; }
  if (S.zugang.admin && !S.zugang.person) hinweis(t('zg_admin_hinweis'));
  await ladeGrund();
  zeige();
}
function hinweis(text) { const h = document.getElementById('hinweisLeiste'); h.textContent = (h.textContent ? h.textContent + ' · ' : '') + text; h.hidden = false; }
function zeigeZugang() {
  const g = S.zugang.grund;
  const satz = g === 'ort' ? t('zg_ort') : g === 'ohne_art' ? t('zg_ohne_art') : g === 'system' ? t('zg_system') : g === 'gesperrt' ? t('zg_gesperrt') : t('zg_kein_konto');
  setzeKopf(t('titel'), t('titel'));
  document.getElementById('main').innerHTML = '<div class="kasten warn" id="zugangKasten"><h2>' + esc(t('zg_titel')) + '</h2><p>' + esc(satz) + '</p></div>';
}
async function ladeGrund() {
  const aufgaben = [
    M.ladeMaschinen().then(function (l) { S.maschinen = l; }, function (e) { S.maschinen = null; zeigeFehler(t('err_laden', { was: t('w_maschinen') }), e); }),
    window.BOS_PRODUKTE.lade({ sicht: 'aktive' }).then(function (e) {
      S.produkte = e.liste;
      const h = window.BOS_PRODUKTE.hinweisText(e); if (h) hinweis(h);
    }, function (e) { S.produkte = null; zeigeFehler(t('err_laden', { was: t('w_produkte') }), e); })
  ];
  await Promise.all(aufgaben);
}
/* Daten einer Maschine (Stammdaten frisch, Reihenfolge, Angaben). */
async function ladeMaschinenDaten(mid) {
  S.maschine = null; S.reihenfolge = null; S.angaben = null; S.geladenFuer = null;
  try { S.maschine = await M.ladeMaschine(null, mid); }
  catch (e) { zeigeFehler(t('err_laden', { was: t('w_maschine') }), e); return false; }
  if (!S.maschine) return true;
  const r = await Promise.all([
    M.ladeReihenfolge(null, mid).then(function (d) { S.reihenfolge = d; return true; }, function (e) { zeigeFehler(t('err_laden', { was: t('w_reihenfolge') }), e); return false; }),
    M.ladeAngaben(null, mid).then(function (d) { S.angaben = d; return true; }, function (e) { zeigeFehler(t('err_laden', { was: t('w_angaben') }), e); return false; })
  ]);
  S.geladenFuer = mid;
  return r[0] && r[1];
}

/* ---------- Zeichnen ---------- */
async function zeige() {
  const main = document.getElementById('main');
  if (S.ansicht === 'liste') { zeichneListe(); return; }
  if (S.ansicht === 'neu') { if (!istAdmin()) { geheZu(null, 'liste'); return; } oeffneVerwalten(true); return; }
  if (S.geladenFuer !== S.mid) {
    main.innerHTML = '<div class="status">' + esc(t('lade')) + '</div>';
    await ladeMaschinenDaten(S.mid);
  }
  werZeile();
  if (!S.maschine || (!maschineSichtbar(S.maschine) && !(istAdmin() && S.ansicht === 'verwalten'))) { zeichneUnbekannt(); return; }
  if (S.ansicht === 'programme') zeichneProgramme();
  else if (S.ansicht === 'editor') { if (!istFuehrerHier()) { zeichneMaschine(t('ed_kein_fuehrer')); return; } oeffneEditor(); }
  else if (S.ansicht === 'verwalten') { if (!istAdmin()) { zeichneMaschine(); return; } oeffneVerwalten(false); }
  else zeichneMaschine();
}
function knopf(id, text, klasse, attr) { return '<button type="button" class="bos-btn ' + (klasse || '') + '" id="' + id + '"' + (attr || '') + '>' + esc(text) + '</button>'; }
function exemplarText(m) { const n = M.exemplarSchluessel(m.exemplare).length; return n === 1 ? t('exemplar_ein') : t('exemplare_n', { n: n }); }

    return '<button type="button" class="m-kachel" data-maschine="' + esc(m.id) + '"><b>' + esc(m.name || m.id) + '</b><span class="dim">' + esc(exemplarText(m)) + '</span>' +
      (M.istFuehrer(m, S.kennung) && S.zugang.person ? '<span class="etikett neu">' + esc(t('ab_fuehrer')) + '</span>' : '') + '</button>';

    aus.map(function (m) { return '<button type="button" class="m-kachel aus" data-maschine="' + esc(m.id) + '" data-ansicht="verwalten"><b>' + esc(m.name || m.id) + '</b><span class="dim">' + esc(m.id) + '</span></button>'; }).join('') + '</div></details>';
  main.innerHTML = h;
  main.querySelectorAll('[data-maschine]').forEach(function (b) { b.addEventListener('click', function () { geheZu(b.getAttribute('data-maschine'), b.getAttribute('data-ansicht') || 'maschine'); }); });

/* ---------- Backprogramme ---------- */
function letzterStand() {
  let best = null;
  Object.keys(S.angaben || {}).forEach(function (k) { const d = S.angaben[k]; const ms = M.msVon(d.geaendertAm); if (ms !== null && (!best || ms > best.ms)) best = { ms: ms, d: d }; });
  return best ? t('pr_stand', { zeit: M.zeitText(best.d.geaendertAm), name: best.d.geaendertVonName || best.d.geaendertVon }) : t('pr_stand_leer');
}
function ansichtDaten(wahl) {
  return A.zeilen({ maschine: S.maschine, produkte: S.produkte || [], angaben: S.angaben || {}, reihenfolge: S.reihenfolge ? S.reihenfolge.produkte : [], sortierung: wahl.sortierung, filter: wahl.filter, jetzt: new Date() });
}
function zeichneProgramme() {
  const m = S.maschine;
  setzeKopf(m.name || m.id, t('pr_titel'));
  /* Wahl im Speicher der Seite; der Gerätespeicher ist nur Komfort (fehlt er, gilt die Wahl bis zum Neuladen) */
  if (!S.wahl[m.id]) S.wahl[m.id] = A.ansichtLaden(m.id);
  const wahl = S.wahl[m.id];
  let e;
  try { e = ansichtDaten(wahl); } catch (err) { zeigeFehler(t('err_laden', { was: t('pr_titel') }), err); return; }
  const schalter = function (gruppe, werte) {
    return '<div class="wahl" role="group">' + werte.map(function (w) {
      return '<button type="button" data-' + gruppe + '="' + w[0] + '" aria-pressed="' + (wahl[gruppe] === w[0]) + '">' + esc(w[1]) + '</button>';
    }).join('') + '</div>';
  };
  let h = '<button type="button" class="link-btn zurueck" id="zurueckBtn">' + esc(t('zurueck_maschine', { name: m.name || m.id })) + '</button>' +
    '<div class="knopfreihe">' + schalter('sortierung', [['reihenfolge', t('s_reihenfolge')], ['warenart', t('s_warenart')]]) +
    schalter('filter', [['alle', t('f_alle')], ['heute', t('f_heute')]]) + knopf('druckBtn', t('pr_drucken'), '', e.anzahl ? '' : ' disabled') + '</div>';
  if (e.filter === 'heute') h += '<div class="heute-satz" id="heuteSatz">' + esc(e.heuteSatz) + '</div>';
  const keineProdukte = !M.produkteDerMaschine(S.produkte || [], m.id).length;

    '<div id="vMeldung"></div></div>';
  document.getElementById('main').innerHTML = h;
  document.getElementById('zurueckBtn').addEventListener('click', function () { geheZu(v.neu ? null : S.mid, v.neu ? 'liste' : 'maschine'); });
  const kid = document.getElementById('vKennung'); if (kid) kid.addEventListener('input', function () { f.id = kid.value.trim().toLowerCase(); vGeaendert(); });
  document.getElementById('vName').addEventListener('input', function () { f.name = this.value; vGeaendert(); });
  document.querySelectorAll('[data-exemplar]').forEach(function (el) { el.addEventListener('input', function () { f.exemplare[el.getAttribute('data-exemplar')] = el.value; vGeaendert(); }); });
  document.getElementById('vExemplarNeu').addEventListener('click', function () { const k = M.naechsterExemplarSchluessel(f.exemplare); f.exemplare[k] = (f.name ? f.name + ' ' : '') + k; vGeaendert(); zeichneVerwalten(); });
  document.querySelectorAll('[data-fuehrer]').forEach(function (el) {
    el.addEventListener('change', function () {
      const k = el.getAttribute('data-fuehrer');
      f.fuehrer = f.fuehrer.filter(function (x) { return x !== k; });
      if (el.checked) f.fuehrer.push(k);
      vGeaendert();
    });
  });
  document.querySelectorAll('[data-feldname]').forEach(function (el) { el.addEventListener('input', function () { f.felder[Number(el.getAttribute('data-feldname'))].name = el.value; vGeaendert(); }); });
  document.querySelectorAll('[data-feldart]').forEach(function (el) { el.addEventListener('change', function () { f.felder[Number(el.getAttribute('data-feldart'))].art = el.value; vGeaendert(); }); });
  document.querySelectorAll('[data-feldhoch],[data-feldrunter]').forEach(function (b) {
    b.addEventListener('click', function () { const i = Number(b.getAttribute(b.hasAttribute('data-feldhoch') ? 'data-feldhoch' : 'data-feldrunter')); f.felder = M.verschiebe(f.felder, i, b.hasAttribute('data-feldhoch') ? -1 : 1); vGeaendert(); zeichneVerwalten(); });
  });
  document.querySelectorAll('[data-feldweg]').forEach(function (b) { b.addEventListener('click', function () { f.felder.splice(Number(b.getAttribute('data-feldweg')), 1); vGeaendert(); zeichneVerwalten(); }); });
  document.getElementById('vFeldNeu').addEventListener('click', function () {
    /* Kennung des Felds entsteht erst beim Speichern aus der Beschriftung (feldIdAus) und bleibt dann fest. */
    f.felder.push({ id: '', name: '', art: 'text' });
    vGeaendert(); zeichneVerwalten();
    const neu = document.querySelector('[data-feldname="' + (f.felder.length - 1) + '"]'); if (neu) neu.focus();
  });
  document.getElementById('vSpeichern').addEventListener('click', function () { speichereVerwalten(false); });
  const ab = document.getElementById('vAusblenden'); if (ab) ab.addEventListener('click', function () {
    if (!f.geloescht && !window.confirm(t('v_ausblenden_frage', { name: f.name || f.id }))) return;
    speichereVerwalten(true);
  });
}
function vMeldung(text, ok, original) {
  const el = document.getElementById('vMeldung');
  if (el) el.innerHTML = '<div class="ed-meldung' + (ok ? ' ok' : '') + '">' + esc(text) + (original ? ' <span class="klein">(' + esc(original) + ')</span>' : '') + '</div>';
}
async function speichereVerwalten(umschalten) {
  const v = S.v, f = v.form;
  if (v.laeuft) return;
  f.felder.forEach(function (x) { if (!x.id && String(x.name || '').trim()) x.id = M.feldIdAus(x.name, f.felder.map(function (y) { return y.id; }).filter(Boolean)); });
  const eingabe = { id: f.id, name: f.name, exemplare: f.exemplare, fuehrer: f.fuehrer, felder: f.felder, geloescht: umschalten ? !f.geloescht : f.geloescht };
  const fehler = M.pruefeMaschine(eingabe);
  if (fehler.length) { vMeldung(fehler.join(' ')); return; }
  v.laeuft = true; zeichneVerwalten();
  try {
    if (v.neu) {
      const da = await M.ladeMaschine(null, f.id);
      if (da) { v.laeuft = false; zeichneVerwalten(); vMeldung(t('v_gibts_schon', { id: f.id })); return; }
    }
    await M.speichereMaschine(null, eingabe, S.kennung);
    v.geaendert = false; v.laeuft = false;
    S.maschinen = await M.ladeMaschinen().catch(function () { return S.maschinen; });
    S.geladenFuer = null; S.v = null;
    const ziel = eingabe.id;
    toast(t('v_gespeichert'));
    geheZu(ziel, eingabe.geloescht ? 'verwalten' : 'maschine');
  } catch (err) {
    console.error('[Maschinen] Maschine speichern:', err);
    const e = err && err.code === 'eingabe' ? { meldung: err.message, original: '' } : await M.erklaere(null, err, { art: 'maschine', kennung: S.kennung, maschineId: f.id });
    v.laeuft = false; zeichneVerwalten(); vMeldung(e.meldung, false, e.original);
  }
}

start().catch(function (err) { zeigeFehler('Start', err); });
</script>
</body>
</html>
