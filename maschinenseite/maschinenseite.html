    ['Wofür?', 'Jede Maschine hat hier ihre eigene Seite: auf einen Blick Reparatur, Info-Karten und Chatfenster, dazu die Backprogramme — welches Produkt an dieser Maschine mit welchem Programm läuft und worauf man achten muss. Das ist für die Nacht, in der ein Kollege einspringt und schnell Bescheid wissen muss.'],
    ['Wer sieht was?', 'Alles hier sieht jeder mit einem persönlichen Konto. Backprogramme und Info-Karten ändern nur die Maschinenführer, die der Admin bei der Maschine eingetragen hat. Ins Chatfenster schreiben, anpinnen und lösen darf jedes persönliche Konto. Maschinen anlegen und Maschinenführer eintragen macht der Admin unter „Verwalten“. Tablets an der Wand (Konto-Art „Ort“) zeigen die Seite nicht, weil man sonst nicht sieht, wer etwas geschrieben hat.'],

/* ---------- Werkzeuge ---------- */
function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
let toastUhr = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastUhr); toastUhr = setTimeout(function () { el.hidden = true; }, 3800);
}

/* ---------- Fehler auf den Bildschirm (Checkliste §7a) ---------- */
function zeigeFehler(was, err) {
  console.error('[Maschinen]', was, err);
  const e = (err && err.meldung) ? err : (M ? M.einordnen(err) : { meldung: String(err && err.message || err), original: '' });
  const li = document.createElement('li');
  li.innerHTML = '<b>' + esc(was) + ':</b> ' + esc(e.meldung) + (e.original ? ' <span class="klein">(' + esc(e.original) + ')</span>' : '');
  document.getElementById('fehlerListe').appendChild(li);
  document.getElementById('fehlerLeiste').hidden = false;
}
document.getElementById('fehlerZuBtn').addEventListener('click', function () {
  document.getElementById('fehlerLeiste').hidden = true;
  document.getElementById('fehlerListe').innerHTML = '';

function maschineSichtbar(m) { return m && m.geloescht !== true; }

/* ---------- Adresse = Zustand (?maschine=…&ansicht=…; kein #, die Tür schneidet ihn ab) ---------- */
function ausAdresse() {
  const p = new URLSearchParams(window.location.search);
  S.mid = p.get('maschine') || null;
  S.ofen = S.mid ? (p.get('ofen') || null) : null;
  const a = p.get('ansicht') || '';
  S.ansicht = !S.mid ? (a === 'neu' ? 'neu' : 'liste') : (['programme', 'editor', 'verwalten', 'karten'].indexOf(a) !== -1 ? a : 'maschine');
}
/* ofen: undefined = bei derselben Maschine behalten; null = ohne (Gesamtübersicht „Alle“) */
function geheZu(mid, ansicht, ofen) {
  if (ungespeichert() && !window.confirm(t('unge_frage'))) return;
  verwirfEingaben();
  if (ofen === undefined) ofen = mid && mid === S.mid ? S.ofen : null;
  const p = new URLSearchParams();
  if (mid) p.set('maschine', mid);
  if (mid && ofen) p.set('ofen', ofen);
  if (ansicht && ansicht !== 'maschine' && ansicht !== 'liste') p.set('ansicht', ansicht);
  const neu = window.location.pathname + (p.toString() ? '?' + p.toString() : '');
  try { history.pushState({}, '', neu); } catch (e) { /* ohne Verlauf: nur neu zeichnen */ }
  ausAdresse(); zeige();
}
window.addEventListener('popstate', function () { verwirfEingaben(); ausAdresse(); zeige(); });

/* ---------- Ungespeichert (Checkliste §7b) ---------- */
function ungespeichert() {
  const edOffen = S.ed && (Object.keys(S.ed.geaendert).length > 0 || S.ed.folgeGeaendert);
  const vOffen = S.v && S.v.geaendert;

  const ikOffen = S.ik && (Object.keys(S.ik.geaendert).length > 0 || S.ik.neu.some(function (n) { return String(n.titel || '').trim() || String(n.text || '').trim(); }));
  return !!(edOffen || vOffen || chatOffen || ikOffen);
}
function verwirfEingaben() { S.ed = null; S.v = null; S.ik = null; S.chat.entwurf = ''; S.chat.pin = false; S.chat.gilt = null; S.chat.meldung = null; S.repWahl = false; }
(function (pruef) {

  window.addEventListener('beforeunload', function (e) { if (pruef()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Start ---------- */
function setzeKopf(eyebrow, titel) {

/* Nachtrag Übersicht (D2, D3): Zurück und Ofen-Filter stehen in der Kopfleiste, die mit dem Kopf stehen bleibt.
   o = null (keine Leiste) | { zurueck: Text, ziel: Funktion, filter: true (Ofenknöpfe der Übersicht) } */
function setzeLeiste(o) {
  const nav = document.getElementById('kopfLeiste');
  if (!o) { nav.innerHTML = ''; nav.hidden = true; return; }
  const m = S.maschine;
  let h = '<button type="button" class="link-btn zurueck" id="zurueckBtn">' + esc(o.zurueck) + '</button>';
  if (o.filter) {
    h += '<div class="ofen-filter" id="ofenFilter" role="group" aria-label="' + esc(t('filter_titel')) + '">' +
      ['alle'].concat(M.exemplarSchluessel(m.exemplare)).map(function (k) {
        const an = k === S.ofenAktiv;
        return '<button type="button" class="of" data-ofenfilter="' + esc(k) + '" aria-pressed="' + (an ? 'true' : 'false') + '" title="' + esc(k === 'alle' ? t('ik_alle') : M.ofenName(m, k)) + '">' +
          esc(k === 'alle' ? t('filter_alle') : M.ofenKurz(m, k)) + '</button>';
      }).join('') + '</div>';
  }
  nav.innerHTML = h; nav.hidden = false;
  document.getElementById('zurueckBtn').addEventListener('click', o.ziel);
  nav.querySelectorAll('[data-ofenfilter]').forEach(function (b) { b.addEventListener('click', function () { setzeFilter(b.getAttribute('data-ofenfilter')); }); });
  const f = document.getElementById('ofenFilter'), a = f && f.querySelector('[aria-pressed="true"]');
  if (f && a && a.offsetLeft + a.offsetWidth > f.clientWidth) f.scrollLeft = a.offsetLeft - 8;   /* bei 12 Öfen: der gewählte ist im Bild */
}
/* Ofenknopf = Filter (D4): kein Schritt im Verlauf (replaceState) — die Zurück-Taste des Geräts wirkt wie „‹ Maschinen“.
   Liest nichts neu: Notizen und Anfragen laufen schon je Maschine live. Ein angefangener Entwurf bleibt;
   „Gilt für“ wird wieder leer (unter „Alle“ also wieder Pflicht, D5). */
function setzeFilter(k) {
  S.ofen = k; S.chat.gilt = null; S.repWahl = false;
  const p = new URLSearchParams(window.location.search);
  if (k === 'alle') p.delete('ofen'); else p.set('ofen', k);
  try { history.replaceState(history.state, '', window.location.pathname + '?' + p.toString()); } catch (e) { /* ohne Verlauf: nur neu zeichnen */ }
  zeichneMaschine();
}
/* Werkzeuge im Kopf (Rechte wie bisher). Am Handy bei zwei oder drei Knöpfen nur die Zeichen (F1, M41). */
function setzeWerkzeuge(an) {
  const el = document.getElementById('kopfWerkzeuge');
  if (!an) { el.innerHTML = ''; el.className = 'kopf-werkzeuge'; return; }
  const l = [['programmeBtn', 'k_programme', 'programme']];

  }).join('');
  l.forEach(function (x) { document.getElementById(x[0]).addEventListener('click', function () { geheZu(S.mid, x[2]); }); });
}
/* Höhe des Kopfs für die Editor-Leiste (klebt darunter, auch wenn der Kopf umbricht oder gezoomt wird) */
(function () {
  const kopf = document.getElementById('kopf');
  function miss() { document.documentElement.style.setProperty('--kopf-h', kopf.offsetHeight + 'px'); }
  if (window.ResizeObserver) new ResizeObserver(miss).observe(kopf);

function werZeile() {

async function start() {
  ausAdresse();
  if (!M || !A) { zeigeFehler('Start', new Error('maschinen_logik.js oder maschinen_ansicht.js ist nicht geladen.')); return; }
  let nutzer;
  try { nutzer = await window.BOS_AUTH_READY; } catch (e) { zeigeFehler(t('err_laden', { was: t('w_konto') }), e); return; }
  if (!nutzer || !nutzer.email) { zeigeFehler(t('err_laden', { was: t('w_konto') }), new Error('Nicht angemeldet — bitte an der Tür anmelden.')); return; }
  S.kennung = String(nutzer.email).split('@')[0].toLowerCase();
  M.pruefeRegelstand().then(function (stand) {
    S.regel = stand;
    const el = document.getElementById('regelLeiste');

  try { S.konto = await M.ladeKonto(null, S.kennung); }

  S.zugang = M.zugang(S.konto);

  catch (e) { S.ich = { kennung: S.kennung, name: S.kennung, warnungen: [] }; }
  (S.ich.warnungen || []).forEach(function (w) { hinweis(w); });
  werZeile();
  if (!S.zugang.lesen) { zeigeZugang(); return; }
  if (S.zugang.admin && !S.zugang.person) hinweis(t('zg_admin_hinweis'));
  await ladeGrund();

}
function hinweis(text) { const h = document.getElementById('hinweisLeiste'); h.textContent = (h.textContent ? h.textContent + ' · ' : '') + text; h.hidden = false; }
function zeigeZugang() {
  const g = S.zugang.grund;

}
async function ladeGrund() {
  const aufgaben = [
    M.ladeMaschinen().then(function (l) { S.maschinen = l; }, function (e) { S.maschinen = null; zeigeFehler(t('err_laden', { was: t('w_maschinen') }), e); }),
    window.BOS_PRODUKTE.lade({ sicht: 'aktive' }).then(function (e) {
      S.produkte = e.liste;
      const h = window.BOS_PRODUKTE.hinweisText(e); if (h) hinweis(h);
    }, function (e) { S.produkte = null; zeigeFehler(t('err_laden', { was: t('w_produkte') }), e); })
  ];

/* Daten einer Maschine (Stammdaten frisch, Reihenfolge, Angaben). */
async function ladeMaschinenDaten(mid) {
  S.maschine = null; S.reihenfolge = null; S.angaben = null; S.geladenFuer = null; S.karten = null; S.kartenFehler = null;
  try { S.maschine = await M.ladeMaschine(null, mid); }
  catch (e) { zeigeFehler(t('err_laden', { was: t('w_maschine') }), e); return false; }
  if (!S.maschine) return true;
  const r = await Promise.all([
    M.ladeReihenfolge(null, mid).then(function (d) { S.reihenfolge = d; return true; }, function (e) { zeigeFehler(t('err_laden', { was: t('w_reihenfolge') }), e); return false; }),
    M.ladeAngaben(null, mid).then(function (d) { S.angaben = d; return true; }, function (e) { zeigeFehler(t('err_laden', { was: t('w_angaben') }), e); return false; }),
    /* Stufe B: Fehler beim Lesen der Karten steht im Kartenbereich, nicht oben (Stufe A geht weiter) */
    M.ladeKarten(null, mid).then(function (l) { S.karten = l; return true; }, function (e) { S.kartenFehler = e; console.error('[Maschinen] Info-Karten laden:', e); return true; })
  ]);
  S.geladenFuer = mid;
  return r[0] && r[1];
}

/* ---------- Zeichnen ---------- */
async function zeige() {
  const main = document.getElementById('main');
  if (!(S.ansicht === 'maschine' && S.live.fuer === S.mid)) stoppeLive();
  if (S.ansicht !== 'maschine') setzeWerkzeuge(false);
  if (S.ansicht === 'liste') { setzeLeiste(null); zeichneListe(); return; }
  if (S.ansicht === 'neu') { if (!istAdmin()) { geheZu(null, 'liste'); return; } oeffneVerwalten(true); return; }
  if (S.geladenFuer !== S.mid) {
    main.innerHTML = '<div class="status">' + esc(t('lade')) + '</div>';
    await ladeMaschinenDaten(S.mid);
  }
  werZeile();
  if (!S.maschine || (!maschineSichtbar(S.maschine) && !(istAdmin() && S.ansicht === 'verwalten'))) { zeichneUnbekannt(); return; }
  if (S.ansicht === 'programme') zeichneProgramme();
  else if (S.ansicht === 'editor') { if (!istFuehrerHier()) { zeichneMaschine(t('ed_kein_fuehrer')); return; } oeffneEditor(); }
  else if (S.ansicht === 'verwalten') { if (!istAdmin()) { zeichneMaschine(); return; } oeffneVerwalten(false); }
  else if (S.ansicht === 'karten') { if (!istFuehrerHier()) { zeichneMaschine(t('ik_kein_fuehrer')); return; } oeffneKartenEditor(); }
  else zeichneMaschine();
}
function knopf(id, text, klasse, attr) { return '<button type="button" class="bos-btn ' + (klasse || '') + '" id="' + id + '"' + (attr || '') + '>' + esc(text) + '</button>'; }
function exemplarText(m) { const n = M.exemplarSchluessel(m.exemplare).length; return n === 1 ? t('exemplar_ein') : t('exemplare_n', { n: n }); }

function ich() { return { kennung: S.kennung, name: S.ich ? S.ich.name : S.kennung }; }

function zeichneChatListe() {
  const el = document.getElementById('chatListe'); if (!el) return;
  if (S.notizFehler) { el.innerHTML = '<div class="ed-meldung" id="chatFehler"><b>' + esc(t('chat_fehler')) + ':</b> ' + esc(fehlerText(S.notizFehler)) + '</div>'; return; }
  if (S.notizen === null) { el.innerHTML = '<p class="klein">' + esc(t('chat_lade')) + '</p>'; return; }
  const jetzt = Date.now(), l = M.notizenFuer(S.notizen, S.ofenAktiv, jetzt);
  if (!l.length) { el.innerHTML = '<p class="klein" id="chatLeer">' + esc(t('chat_leer')) + '</p>'; return; }
  el.innerHTML = l.map(function (n) { return notizHTML(n, jetzt); }).join('');
  el.querySelectorAll('[data-pin]').forEach(function (b) { b.addEventListener('click', function () { pinneNotiz(b.getAttribute('data-pin'), b.getAttribute('data-an') === '1'); }); });
  el.querySelectorAll('[data-weg]').forEach(function (b) { b.addEventListener('click', function () { loescheNotiz(b.getAttribute('data-weg')); }); });

function notizNach(id) { return (S.notizen || []).filter(function (n) { return n.id === id; })[0] || null; }
async function sendeNotiz() {
  const c = S.chat;
  if (c.laeuft) return;
  const geprueft = M.pruefeNotizText(c.entwurf);
  if (geprueft.fehler) { c.meldung = { text: geprueft.fehler }; zeichneChat(); return; }
  const ofen = S.ofenAktiv === 'alle' ? c.gilt : S.ofenAktiv;   /* unter „Alle“: die Pflichtwahl (D5) */
  if (!ofen) { c.meldung = { text: t('chat_gilt_fehlt') }; zeichneChat(); return; }
  c.laeuft = true; c.meldung = null; zeichneChat();
  try {
    await M.notizAnlegen(null, { maschine: S.mid, exemplar: ofen, text: c.entwurf }, ich(), c.pin);
    c.entwurf = ''; c.pin = false; c.gilt = null; c.meldung = { text: t('chat_ok'), ok: true };
  } catch (err) {
    console.error('[Maschinen] Notiz speichern:', err);
    const e = err && err.code === 'eingabe' ? { meldung: err.message, original: '' } : await M.erklaere(null, err, { art: 'notiz', kennung: S.kennung, maschineId: S.mid, exemplar: ofen });
    c.meldung = { text: e.meldung, original: e.original };
  } finally { c.laeuft = false; }
  zeichneChat();
}
async function pinneNotiz(id, anpinnen) {
  const n = notizNach(id); if (!n || S.chat.laeuftNotiz[id]) return;
  if (!anpinnen && M.loesenLoescht(n, Date.now()) && !window.confirm(t('chat_loesen_alt', { tage: M.alterTage(n, Date.now()) }))) return;
  S.chat.laeuftNotiz[id] = true; delete S.chat.notizMeldung[id]; zeichneChatListe();
  try { await M.notizPinnen(null, id, anpinnen, ich()); }
  catch (err) {
    console.error('[Maschinen] anpinnen/lösen:', err);
    const e = err && err.code === 'weg' ? { meldung: err.message, original: '' } : await M.erklaere(null, err, { art: 'pinnen', kennung: S.kennung, maschineId: S.mid, exemplar: n.exemplar });
    S.chat.notizMeldung[id] = { text: e.meldung, original: e.original };
  } finally { delete S.chat.laeuftNotiz[id]; }
  zeichneChatListe();
}
async function loescheNotiz(id) {
  const n = notizNach(id); if (!n || S.chat.laeuftNotiz[id]) return;
  const eigen = n.von === S.kennung && S.zugang.person;
  if (!window.confirm(eigen ? t('chat_loeschen_frage') : t('chat_loeschen_admin_frage', { name: n.vonName || n.von }))) return;
  S.chat.laeuftNotiz[id] = true; delete S.chat.notizMeldung[id]; zeichneChatListe();
  try { await M.notizLoeschen(null, id); }
  catch (err) {
    console.error('[Maschinen] Notiz löschen:', err);
    const e = await M.erklaere(null, err, { art: 'notiz_loeschen', kennung: S.kennung, maschineId: S.mid, notiz: n });
    S.chat.notizMeldung[id] = { text: e.meldung, original: e.original };
  } finally { delete S.chat.laeuftNotiz[id]; }
  zeichneChatListe();
}

  if (falsch.length) { S.ed.meldung[k] = { text: falsch.join(' ') }; return false; }
  const werte = M.werteAus(felder(), eingabe, a ? a.werte : {});
  if (M.werteGleich(werte, a ? a.werte || {} : {})) { delete S.ed.geaendert[k]; S.ed.meldung[k] = { text: t('ed_unveraendert'), ok: true }; return true; }
  S.ed.laeuft[k] = true; delete S.ed.konflikt[k]; zeichneEditor();
  try {
    let alt = a;
    if (S.ed.veraltet[k]) { alt = await M.ladeAngabe(null, S.mid, k); S.angaben[k] = alt || undefined; delete S.ed.veraltet[k]; }
    await M.speichereAngaben(null, S.mid, k, werte, alt, { kennung: S.kennung, name: S.ich ? S.ich.name : S.kennung });
    delete S.ed.geaendert[k]; delete S.ed.eingabe[k];
    try { const frisch = await M.ladeAngabe(null, S.mid, k); if (frisch) S.angaben[k] = frisch; else S.ed.veraltet[k] = true; }
    catch (e2) { S.ed.veraltet[k] = true; }
    S.ed.meldung[k] = { text: t('ed_gespeichert'), ok: true };
    return true;
  } catch (err) {
    const e = await M.erklaere(null, err, { art: 'angaben', kennung: S.kennung, maschineId: S.mid, produktKey: k, altAm: a ? a.geaendertAm : null });
    console.error('[Maschinen] Angaben speichern:', err);
    S.ed.meldung[k] = { text: e.meldung, original: e.original };
    if (e.art === 'konflikt') S.ed.konflikt[k] = e.jetzt;
    return false;
  } finally { delete S.ed.laeuft[k]; }
}
async function neuLaden(k) {
  try {
    const frisch = await M.ladeAngabe(null, S.mid, k);
    if (frisch) S.angaben[k] = frisch; else delete S.angaben[k];
    delete S.ed.konflikt[k]; delete S.ed.veraltet[k];
    markiere(k);
    S.ed.meldung[k] = { text: t('ed_neu_geladen'), ok: true };
  } catch (err) { S.ed.meldung[k] = { text: M.einordnen(err).meldung, original: M.fehlerOriginal(err) }; }
  zeichneEditor();
}
async function speichereAlle() {
  if (S.speichertAlle) return;
  S.speichertAlle = true;
  const keys = sichtbareFolge().filter(function (k) { return S.ed.geaendert[k]; });
  try {
    for (let i = 0; i < keys.length; i++) {
      const ok = await speichereKarte(keys[i]);
      if (!ok) break;   // bei Fehler Stopp — der Grund steht an der Karte
    }
  } finally { S.speichertAlle = false; zeichneEditor(); }
}
async function speichereFolge() {
  if (!S.ed || S.ed.laeuft.__folge) return;
  S.ed.laeuft.__folge = true; zeichneEditor();
  const el = function () { return document.getElementById('folgeMeldung'); };
  try {
    const liste = M.reihenfolgeNeu(S.reihenfolge ? S.reihenfolge.produkte : [], sichtbareFolge());
    await M.speichereReihenfolge(null, S.mid, liste, { kennung: S.kennung, name: S.ich ? S.ich.name : S.kennung });
    S.ed.folgeGeaendert = false; S.ed.neu = {};
    try { S.reihenfolge = await M.ladeReihenfolge(null, S.mid); } catch (e2) { S.reihenfolge = { produkte: liste }; }
    delete S.ed.laeuft.__folge; zeichneEditor(); if (el()) el().textContent = t('ed_reihenfolge_ok'); toast(t('ed_reihenfolge_ok'));
  } catch (err) {
    console.error('[Maschinen] Reihenfolge speichern:', err);
    const e = await M.erklaere(null, err, { art: 'reihenfolge', kennung: S.kennung, maschineId: S.mid });
    delete S.ed.laeuft.__folge; zeichneEditor();
    zeigeFehler(t('err_speichern', { was: t('w_reihenfolge') }), e);
  }
}

/* ---------- Verwalten (nur Rolle admin) ---------- */
function oeffneVerwalten(neu) {
  if (!S.v || S.v.neu !== neu) {
    const m = neu ? null : S.maschine;
    S.v = {
      neu: neu, geaendert: false, laeuft: false, personen: null, personenFehler: '',
      form: m ? { id: m.id, name: m.name || '', exemplare: JSON.parse(JSON.stringify(m.exemplare || {})), fuehrer: (m.fuehrer || []).slice(), felder: JSON.parse(JSON.stringify(m.felder || [])), geloescht: m.geloescht === true }
        : { id: '', name: '', exemplare: { '1': '' }, fuehrer: [], felder: M.standardFelder(), geloescht: false }
    };
    ladePersonen();
  }
  zeichneVerwalten();
}
function ladePersonen() {
  if (!window.BOS_NAMEN) { S.v.personenFehler = 'bos_namen.js ist nicht geladen.'; return; }
  window.BOS_NAMEN.personenAlle(window.db).then(function (snap) {
    const l = [];
    snap.forEach(function (d) { const x = d.data() || {}; if (x.bosKontoId) l.push({ id: d.id, kennung: String(x.bosKontoId), name: window.BOS_NAMEN.anzeige(d.id), aktiv: x.aktiv !== false }); });
    l.sort(function (a, b) { return a.name.localeCompare(b.name, 'de'); });
    if (S.v) { S.v.personen = l; if (S.ansicht === 'verwalten' || S.ansicht === 'neu') zeichneVerwalten(); }
  }, function (err) {
    if (S.v) { S.v.personenFehler = M.fehlerOriginal(err); if (S.ansicht === 'verwalten' || S.ansicht === 'neu') zeichneVerwalten(); }
  });
}
function vGeaendert() { S.v.geaendert = true; }
function zeichneVerwalten() {
  const v = S.v, f = v.form;
  setzeKopf(v.neu ? t('titel') : (S.maschine.name || S.maschine.id), v.neu ? t('v_titel_neu') : t('v_titel'));
  setzeLeiste({ zurueck: v.neu ? t('zurueck_liste') : t('zurueck_maschine', { name: S.maschine.name || S.maschine.id }), ziel: function () { geheZu(v.neu ? null : S.mid, v.neu ? 'liste' : 'maschine'); } });
  let h = '';
  h += '<div class="kasten">';
  h += '<div class="v-feld"><label for="vKennung">' + esc(t('v_kennung')) + '</label>' + (v.neu
    ? '<input class="bos-input" id="vKennung" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30" value="' + esc(f.id) + '" placeholder="stikkenofen"><div class="klein">' + esc(t('v_kennung_hilfe')) + '</div>'
    : '<div><code>' + esc(f.id) + '</code></div>') + '</div>';
  h += '<div class="v-feld"><label for="vName">' + esc(t('v_name')) + '</label><input class="bos-input" id="vName" maxlength="' + M.GRENZEN.NAME + '" value="' + esc(f.name) + '"></div>';
  h += '<div class="v-feld"><label>' + esc(t('v_exemplare')) + '</label>' + M.exemplarSchluessel(f.exemplare).map(function (k) {
    return '<div class="v-zeile"><span class="chip">' + esc(k) + '</span><input class="bos-input" data-exemplar="' + esc(k) + '" maxlength="' + M.SEITE.EXEMPLAR_NAME + '" value="' + esc(f.exemplare[k]) + '" placeholder="' + esc((f.name || 'Maschine') + ' ' + k) + '"></div>';
  }).join('') + '<button type="button" class="bos-btn" id="vExemplarNeu"' + (M.exemplarSchluessel(f.exemplare).length >= M.GRENZEN.EXEMPLARE ? ' disabled' : '') + '>' + esc(t('v_exemplar_neu')) + '</button><div class="klein">' + esc(t('v_exemplare_hilfe')) + '</div></div>';
  h += '<div class="v-feld"><label>' + esc(t('v_fuehrer')) + '</label><div class="fuehrer-liste" id="vFuehrer">';
  if (v.personenFehler) h += '<div class="ed-meldung">' + esc(t('v_personen_fehler', { grund: v.personenFehler })) + '</div>';
  else if (!v.personen) h += '<div class="klein">' + esc(t('lade')) + '</div>';
  else {
    const bekannt = {};
    h += v.personen.map(function (p) {
      bekannt[p.kennung] = true;
      return '<label><input type="checkbox" data-fuehrer="' + esc(p.kennung) + '"' + (f.fuehrer.indexOf(p.kennung) !== -1 ? ' checked' : '') + '> ' + esc(p.name) + ' <span class="klein">(' + esc(p.kennung) + ')</span></label>';
    }).join('');
    h += f.fuehrer.filter(function (k) { return !bekannt[k]; }).map(function (k) {
      return '<label><input type="checkbox" data-fuehrer="' + esc(k) + '" checked> ' + esc(t('v_fuehrer_unbekannt', { kennung: k })) + '</label>';
    }).join('');
  }
  h += '</div><div class="klein">' + esc(t('v_fuehrer_hilfe')) + '</div></div>';
  h += '<div class="v-feld"><label>' + esc(t('v_felder')) + '</label>' + f.felder.map(function (x, i) {
    return '<div class="v-zeile"><input class="bos-input" data-feldname="' + i + '" maxlength="' + M.SEITE.FELD_NAME + '" value="' + esc(x.name) + '">' +
      '<select class="bos-input" data-feldart="' + i + '" style="flex:0 0 auto;width:auto"><option value="text"' + (x.art === 'text' ? ' selected' : '') + '>' + esc(t('art_text')) + '</option><option value="nummer"' + (x.art === 'nummer' ? ' selected' : '') + '>' + esc(t('art_nummer')) + '</option></select>' +
      '<button type="button" class="bos-btn pfeil" data-feldhoch="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="nach oben">▲</button>' +
      '<button type="button" class="bos-btn pfeil" data-feldrunter="' + i + '"' + (i === f.felder.length - 1 ? ' disabled' : '') + ' aria-label="nach unten">▼</button>' +
      '<button type="button" class="bos-btn pfeil" data-feldweg="' + i + '"' + (f.felder.length <= 1 ? ' disabled' : '') + ' aria-label="Feld entfernen">✕</button>' +
      '<span class="klein">' + esc(x.id || t('v_feld_id_neu')) + '</span></div>';
  }).join('') + '<button type="button" class="bos-btn" id="vFeldNeu"' + (f.felder.length >= M.GRENZEN.FELDER ? ' disabled' : '') + '>' + esc(t('v_feld_neu')) + '</button><div class="klein">' + esc(t('v_felder_hilfe')) + '</div></div>';
  h += '<div class="knopfreihe">' + knopf('vSpeichern', v.laeuft ? t('ed_speichert') : t('v_speichern'), 'bos-btn--amber', v.laeuft ? ' disabled' : '') +
    (!v.neu ? knopf('vAusblenden', f.geloescht ? t('v_zurueckholen') : t('v_ausblenden'), '', v.laeuft ? ' disabled' : '') : '') + '</div>' +
    '<div id="vMeldung"></div></div>';
  document.getElementById('main').innerHTML = h;
  const kid = document.getElementById('vKennung'); if (kid) kid.addEventListener('input', function () { f.id = kid.value.trim().toLowerCase(); vGeaendert(); });
  document.getElementById('vName').addEventListener('input', function () { f.name = this.value; vGeaendert(); });
  document.querySelectorAll('[data-exemplar]').forEach(function (el) { el.addEventListener('input', function () { f.exemplare[el.getAttribute('data-exemplar')] = el.value; vGeaendert(); }); });
  document.getElementById('vExemplarNeu').addEventListener('click', function () { const k = M.naechsterExemplarSchluessel(f.exemplare); f.exemplare[k] = (f.name ? f.name + ' ' : '') + k; vGeaendert(); zeichneVerwalten(); });
  document.querySelectorAll('[data-fuehrer]').forEach(function (el) {
    el.addEventListener('change', function () {
      const k = el.getAttribute('data-fuehrer');
      f.fuehrer = f.fuehrer.filter(function (x) { return x !== k; });
      if (el.checked) f.fuehrer.push(k);
      vGeaendert();
    });
  });
  document.querySelectorAll('[data-feldname]').forEach(function (el) { el.addEventListener('input', function () { f.felder[Number(el.getAttribute('data-feldname'))].name = el.value; vGeaendert(); }); });
  document.querySelectorAll('[data-feldart]').forEach(function (el) { el.addEventListener('change', function () { f.felder[Number(el.getAttribute('data-feldart'))].art = el.value; vGeaendert(); }); });
  document.querySelectorAll('[data-feldhoch],[data-feldrunter]').forEach(function (b) {
    b.addEventListener('click', function () { const i = Number(b.getAttribute(b.hasAttribute('data-feldhoch') ? 'data-feldhoch' : 'data-feldrunter')); f.felder = M.verschiebe(f.felder, i, b.hasAttribute('data-feldhoch') ? -1 : 1); vGeaendert(); zeichneVerwalten(); });
  });
  document.querySelectorAll('[data-feldweg]').forEach(function (b) { b.addEventListener('click', function () { f.felder.splice(Number(b.getAttribute('data-feldweg')), 1); vGeaendert(); zeichneVerwalten(); }); });
  document.getElementById('vFeldNeu').addEventListener('click', function () {
    /* Kennung des Felds entsteht erst beim Speichern aus der Beschriftung (feldIdAus) und bleibt dann fest. */
    f.felder.push({ id: '', name: '', art: 'text' });
    vGeaendert(); zeichneVerwalten();
    const neu = document.querySelector('[data-feldname="' + (f.felder.length - 1) + '"]'); if (neu) neu.focus();
  });
  document.getElementById('vSpeichern').addEventListener('click', function () { speichereVerwalten(false); });
  const ab = document.getElementById('vAusblenden'); if (ab) ab.addEventListener('click', function () {
    if (!f.geloescht && !window.confirm(t('v_ausblenden_frage', { name: f.name || f.id }))) return;
    speichereVerwalten(true);
  });
}
function vMeldung(text, ok, original) {
  const el = document.getElementById('vMeldung');
  if (el) el.innerHTML = '<div class="ed-meldung' + (ok ? ' ok' : '') + '">' + esc(text) + (original ? ' <span class="klein">(' + esc(original) + ')</span>' : '') + '</div>';
}
async function speichereVerwalten(umschalten) {
  const v = S.v, f = v.form;
  if (v.laeuft) return;
  f.felder.forEach(function (x) { if (!x.id && String(x.name || '').trim()) x.id = M.feldIdAus(x.name, f.felder.map(function (y) { return y.id; }).filter(Boolean)); });
  const eingabe = { id: f.id, name: f.name, exemplare: f.exemplare, fuehrer: f.fuehrer, felder: f.felder, geloescht: umschalten ? !f.geloescht : f.geloescht };
  const fehler = M.pruefeMaschine(eingabe);
  if (fehler.length) { vMeldung(fehler.join(' ')); return; }
  v.laeuft = true; zeichneVerwalten();
  try {
    if (v.neu) {
      const da = await M.ladeMaschine(null, f.id);
      if (da) { v.laeuft = false; zeichneVerwalten(); vMeldung(t('v_gibts_schon', { id: f.id })); return; }
    }
    await M.speichereMaschine(null, eingabe, S.kennung);
    v.geaendert = false; v.laeuft = false;
    S.maschinen = await M.ladeMaschinen().catch(function () { return S.maschinen; });
    S.geladenFuer = null; S.v = null;
    const ziel = eingabe.id;
    toast(t('v_gespeichert'));
    geheZu(ziel, eingabe.geloescht ? 'verwalten' : 'maschine');
  } catch (err) {
    console.error('[Maschinen] Maschine speichern:', err);
    const e = err && err.code === 'eingabe' ? { meldung: err.message, original: '' } : await M.erklaere(null, err, { art: 'maschine', kennung: S.kennung, maschineId: f.id });
    v.laeuft = false; zeichneVerwalten(); vMeldung(e.meldung, false, e.original);
  }
}

start().catch(function (err) { zeigeFehler('Start', err); });
</script>
