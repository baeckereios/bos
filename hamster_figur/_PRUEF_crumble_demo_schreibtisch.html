<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo · Crumble auf dem Schreibtisch</title>
<!--
  _PRUEF_crumble_demo_schreibtisch.html — Kontroll-Chat Crumble, 17.10.2026, 08:45 Uhr.
  DEMO, kein Produktivcode: zeigt, wie Crumble auf einer nachgebauten Taskleiste marschiert, Nummern
  aus den 16 Wallpaper-Figuren spielt (als registrierte Zustände), schläft, und wie eine nähere Sprechblase wirkt.
  Lädt hamster_figur.js/.css (Nachtrag-1-Fassung) daneben und die Bilder aus _PRUEF_demo_bilder/.
  Über http öffnen (lokaler Server im bos-Ordner), nicht file://. Knöpfe unten steuern; läuft auch von allein.
-->
<link rel="stylesheet" href="../bos_design_tokens.css" onerror="this.remove()">
<link rel="stylesheet" href="hamster_figur.css">
<style>
  body { margin:0; background: var(--bos-bg, #16120e); color: var(--bos-text,#f3ece1); font: 14px/1.4 var(--bos-font-body, system-ui, sans-serif); overflow:hidden; }
  body.hell { background:#f5ecdc; color:#3a2a1e; }
  .top { height:52px; background: var(--bos-surface-raised, #2b2218); display:flex; align-items:center; padding:0 16px; gap:12px; font-weight:700; }
  body.hell .top { background:#e6ecf2; }
  #desk { position:fixed; left:0; right:0; top:52px; bottom:72px; }
  .grid { position:absolute; inset:16px; display:grid; grid-template-columns:repeat(auto-fill, 96px); gap:28px 40px; align-content:start; }
  .tile { width:96px; text-align:center; font-size:12px; font-weight:700; opacity:.9 }
  .tile i { display:block; width:72px; height:72px; margin:0 auto 6px; border-radius:16px; background:#3a2a1e; }
  body.hell .tile i { background:#d9c9a8; }
  #bar { position:fixed; left:0; right:0; bottom:0; height:72px; background: var(--bos-surface-raised, #2b2218); border-top:2px solid var(--bos-amber,#e0973a); display:flex; align-items:center; gap:8px; padding:0 12px; }
  body.hell #bar { background:#e6ecf2; }
  button { background:#3a2a1e; color:#f3ece1; border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:6px 10px; font-size:12px; }
  /* --- Demo: Crumble auf dem Schreibtisch, über den Kacheln, unter (hier nicht vorhandenen) Fenstern --- */
  .hf--container.demo { right:auto; bottom:0; z-index:350; transition:none; }
  .hf--container.demo .hf__figur { transition: transform .25s; }
  .hf.laeuft .hf__figur { animation: watscheln .42s ease-in-out infinite !important; }
  .hf.links .hf__koerper { transform: scaleX(-1); }
  @keyframes watscheln { 0%,100% { transform: rotate(-4deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-7px); } }
  /* nähere Blase: dicht am Kopf, feste Farben für hell UND dunkel (Nachtrag-2-Vorschlag) */
  .hf__blase { background:#fbf3e4 !important; color:#3a2a1e !important; border:2px solid #4a2f1a; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); font-size:14px !important; z-index:5; border-radius:14px 14px 14px 2px !important; }
  .hf__figur { z-index:1; }
</style>
</head>
<body>
<div class="top">BäckereiOS <span style="opacity:.6;font-weight:400">Demo-Schreibtisch</span><span style="flex:1"></span><span id="uhr"></span></div>
<div id="meldung" style="display:none;position:fixed;left:0;right:0;top:52px;z-index:9999;background:#b3261e;color:#fff;padding:10px 16px;font-weight:700;white-space:pre-wrap"></div>
<div id="desk">
  <div class="grid">
    <div class="tile"><i></i>Teigecke</div><div class="tile"><i></i>Produkt-Config</div><div class="tile"><i></i>Wunschtag</div>
    <div class="tile"><i></i>Urlaub</div><div class="tile"><i></i>Reparatur</div><div class="tile"><i></i>Konten</div>
    <div class="tile"><i></i>NFC &amp; QR</div><div class="tile"><i></i>Schnellrechner</div><div class="tile"><i></i>Schnelldruck</div>
  </div>
</div>
<div id="bar">
  <button onclick="DEMO.laufe()">laufen</button>
  <button onclick="DEMO.nummer()">Nummer</button>
  <button onclick="DEMO.nummer('karate')">Karate</button>
  <button onclick="DEMO.nummer('jongleur')">Jonglieren</button>
  <button onclick="DEMO.nummer('teigmonster')">Teig</button>
  <button onclick="DEMO.schlaf()">schlafen</button>
  <button onclick="document.body.classList.toggle('hell')">hell/dunkel</button>
  <span style="opacity:.6;font-size:12px;margin-left:auto">Demo: Taktung verkürzt (Nummer ~ alle 20 s)</span>
</div>

<script src="hamster_figur.js"></script>
<script>
function melde(text) { var m = document.getElementById('meldung'); m.style.display = 'block'; m.textContent += (m.textContent ? '\n' : '') + text; }
if (location.protocol === 'file:') melde('Diese Seite ist per file:// geöffnet — so kann das Modul sein Manifest nicht laden (fetch). Bitte über den lokalen Server öffnen, z. B. http://127.0.0.1:24190/…/hamster_figur/_PRUEF_crumble_demo_schreibtisch.html');
if (!window.BOS_HAMSTER_FIGUR) melde('hamster_figur.js nicht geladen — liegt die Datei neben dieser Seite in bos/hamster_figur/?');
else if (typeof window.BOS_HAMSTER_FIGUR.neu !== 'function') melde('hamster_figur.js ist die ALTE Fassung (kein neu()) — die Stufe-1-Fassung vom 17.10. wird gebraucht.');
window.addEventListener('error', function (e) { melde('Fehler: ' + (e.message || e)); });
window.addEventListener('unhandledrejection', function (e) { melde('Fehler: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
document.addEventListener('hamster-figur:fehler', function (e) { melde('Figur meldet: ' + JSON.stringify(e.detail)); });
window.DEMO = (function () {
  if (!window.BOS_HAMSTER_FIGUR || typeof window.BOS_HAMSTER_FIGUR.neu !== 'function') return { laufe: function(){}, nummer: function(){}, schlaf: function(){}, figur: function(){ return null; } };
  var NUMMERN = {
    jongleur:      ['Vier Brote. Null Hände frei. Kein Problem.', 'Jonglieren ist nur Werfen mit Stil.'],
    karate:        ['HIIIJA. Scheibe gefällig?', 'Brotmesser? Brauch ich nicht.'],
    teigmonster:   ['Hilfe. Der Teig geht. Mit mir.', 'Ich hab nur kurz reingefasst.'],
    geheimagent:   ['Der Name ist Crumble. Nur Crumble.', 'Geschüttelt, nicht geknetet.'],
    chili:         ['Bisschen Schärfe schadet keiner Torte.', 'Das ist Deko. Rote Deko.'],
    torte_gesicht: ['Das war Absicht. Fast.', 'Sahne. Überall. Auch hinten.'],
    backen_voll:   ['Mmmpf.', 'Ich sag später was.'],
    hamstertag:    ['Morgen Hamstertag. Ich bin vorbereitet.', 'Vorrat ist kein Hobby. Vorrat ist Pflicht.'],
    croissant:     ['Pause. Auf Blätterteig.', 'Nicht stören. Ich reife.'],
    mehlbombe:     ['War der Sack kaputt oder ich?', 'Hatschi. Mehl 550. Erkenn ich blind.'],
    alchemist:     ['Es blubbert. Also lebt es.', 'Sauerteig: Tag 847. Er mag mich.'],
    bowling:       ['Strike. Mit Semmel.', 'Stangen umhauen ist auch Sport.'],
    gewichtheber:  ['Zwei Brezeln. Laugen-Hantel.', 'Noch eine Wiederholung. Dann Pause.'],
    zombie:        ['Kaffee. Jetzt. Bitte. Danke.', 'Ich war schon wach, als du kamst.'],
    froster:       ['Im Froster ist es kalt. Hab ich geprüft.', 'Minus achtzehn. Wie mein Humor.'],
    fechter:       ['En garde! Mit Baguette.', 'Touché. Krümel.']
  };
  var MASSSTAB = { teigmonster: 1.45, bowling: 1.25, gewichtheber: 1.25, karate: 1.3, froster: 1.3, jongleur: 1.3, chili: 1.25, hamstertag: 1.3, mehlbombe: 1.3 };
  var M = window.BOS_HAMSTER_FIGUR, desk = document.getElementById('desk');
  var F = M.neu({ name: 'demo', container: desk, basisPfad: './', modus: 'ecke', einbettung: 'container', rolle: 'spielplatz', hoehe: 170, zufall: false, an: true });
  var x = 60, ziel = 60, laeuft = false, t0 = 0, naechste = null;
  Object.keys(NUMMERN).forEach(function (n) {
    F.registriere.zustand('nummer_' + n, { datei: '../_PRUEF_demo_bilder/crumble_' + n + '.png', gruppe: 'stand_pose', kategorie: 'geste',
      koerper: [0, 0, 1, 1], massstab: MASSSTAB[n] || 1.15, texte: NUMMERN[n], texte_spielplatz: NUMMERN[n] });
  });
  function wurzel() { return F.wurzel(); }
  function setzeX() { var w = wurzel(); if (w) w.style.left = Math.round(x) + 'px'; }
  function schritt(ts) {
    if (!laeuft) return;
    var w = wurzel(); if (!w) return;
    var d = ziel - x, v = 55 / 1000; // px pro ms
    if (Math.abs(d) < 2) { laeuft = false; w.classList.remove('laeuft'); setzeX(); return; }
    x += Math.sign(d) * Math.min(Math.abs(d), v * 16);
    w.classList.toggle('links', d < 0);
    setzeX();
    requestAnimationFrame(schritt);
  }
  function laufe(zielX) {
    var w = wurzel(); if (!w) return;
    var max = desk.clientWidth - 200;
    ziel = typeof zielX === 'number' ? zielX : 40 + Math.random() * max;
    if (F.zustand() !== 'idle') F.zeige('idle', { still: true });
    laeuft = true; w.classList.add('laeuft'); requestAnimationFrame(schritt);
  }
  function nummer(name) {
    var w = wurzel(); if (!w) return;
    laeuft = false; w.classList.remove('laeuft', 'links');
    var liste = Object.keys(NUMMERN); name = name || liste[Math.floor(Math.random() * liste.length)];
    F.zeige('nummer_' + name, { dauer: 6000, dauerText: 5000 });
  }
  function schlaf() { F.zeige('sleep_sitting', { dauer: 0 }); }
  function auto() {
    naechste = setTimeout(function () {
      if (F.zustand() === 'idle') { if (Math.random() < 0.5) laufe(); else nummer(); }
      auto();
    }, 9000 + Math.random() * 9000);
  }
  F.bereit.catch(function (e) { melde('Figur nicht ladbar: ' + (e && e.message ? e.message : e)); });
  F.bereit.then(function () {
    var w = wurzel(); w.classList.add('demo'); setzeX();
    // Blase näher an den Kopf (Vorschlag Nachtrag 2): statt links neben der Figur auf Kopfhöhe → dicht am Kopf
    var figW = Math.round(170 * 0.95);
    // über dem Kopf, Spitze unten links zeigt auf ihn; Bühne nach oben vergrößern
    w.querySelector('.hf__blase').style.right = Math.round(figW * 0.35) + 'px';
    w.querySelector('.hf__blase').style.bottom = Math.round(170 * 1.08) + 'px';
    w.querySelector('.hf__buehne').style.height = (170 + 160) + 'px';
    F.auf('tipp', function () { if (Math.random() < 0.4) setTimeout(laufe, 600); });
    setTimeout(laufe, 800); auto();
  });
  setInterval(function () { document.getElementById('uhr').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); }, 1000);
  return { laufe: laufe, nummer: nummer, schlaf: schlaf, figur: function () { return F; } };
})();
</script>
</body>
</html>
