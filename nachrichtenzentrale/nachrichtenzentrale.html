         nachrichten_logik.js, Ansicht in nachrichten_ansicht.js. Kein onSnapshot.

         bos_firebase_config.js über die Tür mit ?weiter= hierher zurück.

<header id="kopf">
  <div class="kopf-zeile">
    <div class="kopf-titel">
      <h1 data-i18n="titel"></h1>
      <div class="kopf-unter" id="werZeile"></div>

    <button type="button" class="kopf-btn" id="hilfeBtn" data-i18n-title="hilfe">❓</button>
  </div>
  <nav class="tab-row" id="reiter" role="tablist" hidden>
    <button type="button" class="tab-btn" role="tab" data-reiter="postfach"><span data-i18n="r_postfach"></span><span class="tab-zahl" hidden></span></button>
    <button type="button" class="tab-btn" role="tab" data-reiter="aushaenge"><span data-i18n="r_aushaenge"></span><span class="tab-zahl" hidden></span></button>

    <button type="button" class="tab-btn" role="tab" data-reiter="schreiben" hidden><span data-i18n="r_schreiben"></span></button>
  </nav>
</header>

<main class="wrap">
  <div class="fehler-zeile" id="fehlerZeile" role="alert" hidden><button type="button" class="zeile-zu" id="fehlerZu" aria-label="schließen">✕</button><span id="fehlerText"></span></div>

  <section id="panel-gesendet" class="panel" hidden>

      <label class="schalter"><input type="checkbox" id="zeigeAusGesendet"><span data-i18n="zeige_ausgeblendete"></span></label>
    </div>
    <div class="liste" id="listeGesendet"></div>
  </section>

  <section id="panel-schreiben" class="panel" hidden>

      <div class="feld-titel" data-i18n="feld_art"></div>
