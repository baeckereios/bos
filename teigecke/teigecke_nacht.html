  .sheet .sec p { margin: 0; line-height: 1.55; color: var(--bos-text-dim); font-size: var(--bos-font-sm, .82rem); }
  .feld { margin-bottom: var(--bos-space-sm, 14px); }
  .feld > label { display: block; margin-bottom: 4px; }
  .feld .bos-input { min-height: 48px; }
  .feld-zeile { display: flex; gap: var(--bos-space-2xs, 6px); }
  .feld-hilfe { font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); margin-top: 3px; line-height: 1.4; }
  .sheet-knoepfe { display: flex; flex-wrap: wrap; gap: var(--bos-space-2xs, 6px); margin-top: var(--bos-space-md, 18px); }
  .sheet-knoepfe .bos-btn { min-height: var(--tk-tap); flex: 1 1 140px; }
  .sheet-fehler { color: var(--bos-red); font-size: var(--bos-font-sm, .82rem); margin-top: var(--bos-space-xs, 9px); line-height: 1.5; word-break: break-word; }
  .sheet-info { color: var(--bos-text-dim); font-size: var(--bos-font-sm, .82rem); margin-top: var(--bos-space-xs, 9px); line-height: 1.5; }
  .bos-btn.gefahr { border-color: var(--bos-red); color: var(--bos-red); }
  .import-liste { font-size: var(--bos-font-sm, .82rem); line-height: 1.5; max-height: 220px; overflow-y: auto; padding-left: 18px; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60;
    background: var(--bos-surface-raised); border: 1px solid var(--bos-border-strong); border-radius: var(--bos-radius-sm);
    padding: 10px 16px; max-width: 90vw; font-size: var(--bos-font-sm, .82rem); box-shadow: var(--bos-shadow-md);
  }

  /* ---- Stufe 2 (29.09.2026) ---- */
  .klein { font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); line-height: 1.4; }
  .hinweis.gruen { border-left-color: var(--bos-green); }
  .hinweis.gross { font-size: var(--bos-font-lg, 1.15rem); font-weight: 700; color: var(--bos-text); }
  #verbindungLeiste {
    margin: var(--bos-space-sm, 14px) var(--bos-space-md, 18px) 0;
    border: 1px solid var(--bos-blue); border-radius: var(--bos-radius-sm); background: var(--bos-surface);
    padding: var(--bos-space-xs, 9px) var(--bos-space-sm, 14px); font-size: var(--bos-font-sm, .82rem); line-height: 1.5;
  }


  .zahl-block { display: flex; flex-direction: column; gap: var(--bos-space-xs, 9px); margin: var(--bos-space-sm, 14px) 0; }
  .zahl-zeile { display: flex; align-items: center; gap: var(--bos-space-sm, 14px); }
  .zz-name { flex: 1 1 auto; font-size: var(--bos-font-lg, 1.15rem); font-weight: 600; display: flex; flex-direction: column; }
  .zz-name small { font-size: var(--bos-font-xs, .72rem); font-weight: 400; color: var(--bos-text-faint); }
  .zahl-eingabe {
    flex: 0 0 auto; width: 130px; min-height: 64px; text-align: center;
    font-family: var(--bos-font-label); font-weight: 800; font-size: 2rem;
    background: var(--bos-surface-raised); color: var(--bos-text);
    border: 2px solid var(--bos-border-strong); border-radius: var(--bos-radius-sm);
  }
  .zahl-eingabe:focus { outline: none; border-color: var(--bos-amber); box-shadow: 0 0 0 3px var(--bos-amber-glow); }
  .karte-weiter { display: flex; justify-content: flex-end; margin-bottom: var(--bos-space-sm, 14px); }
  .karte-weiter .bos-btn { min-height: var(--tk-tap); min-width: 160px; font-size: var(--bos-font-lg, 1.15rem); }
  .info-liste { list-style: none; margin: 0 0 var(--bos-space-sm, 14px); padding: 0; }
  .info-liste > li { padding: 8px 0; border-top: 1px solid var(--bos-border); font-size: var(--bos-font-md, .95rem); line-height: 1.5; }
  .info-liste > li:first-child { border-top: none; }
  .info-liste > li.rot { color: var(--bos-red); }
  .info-liste > li.wasser { font-size: var(--bos-font-lg, 1.15rem); font-weight: 700; }
  .info-liste > li.ergebnis { font-size: var(--bos-font-lg, 1.15rem); font-weight: 700; color: var(--bos-amber-bright); }
  .info-liste > li.ergebnis.rot { color: var(--bos-red); }
  .info-liste details summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; gap: 6px; }
  .info-liste details summary { list-style: none; }
  .info-liste details summary::-webkit-details-marker { display: none; }
  .info-liste details summary::before { content: '▸'; color: var(--bos-text-faint); width: 1em; }
  .info-liste details[open] summary::before { content: '▾'; }
  .info-liste details .liste { margin-top: 2px; }
  .abw { display: inline-block; font-family: var(--bos-font-label); font-size: var(--bos-font-xs, .72rem); font-weight: 700; color: var(--bos-amber-bright); border: 1px dashed var(--bos-amber); border-radius: 999px; padding: 0 8px; vertical-align: middle; }

  /* Reiter „Anpassen“: oben nur heute (Mond), darunter die dauerhafte Regel */
  .nacht-block { border: 1px dashed var(--bos-blue); border-radius: var(--bos-radius-md); padding: var(--bos-space-sm, 14px); margin-top: var(--bos-space-sm, 14px); }
  .nacht-titel { font-weight: 700; margin-bottom: var(--bos-space-xs, 9px); color: var(--bos-blue); }
  .regel-block { border: 1px solid var(--bos-amber); border-radius: var(--bos-radius-md); padding: var(--bos-space-sm, 14px); margin-top: var(--bos-space-md, 18px); }
  .regel-titel { font-weight: 700; margin-bottom: var(--bos-space-xs, 9px); color: var(--bos-amber-bright); }
  .anp-zeile { margin-bottom: var(--bos-space-sm, 14px); }
  .anp-zeile > label { display: block; margin-bottom: 4px; }
  .anp-zeile .feld-zeile { align-items: center; flex-wrap: wrap; }
  .anp-zeile .bos-input { min-height: 48px; max-width: 160px; }
  .tabelle-kopf, .tabelle-zeile { display: grid; grid-template-columns: 1fr 1fr 1fr 48px; gap: 6px; align-items: center; margin-bottom: 4px; }
  .tabelle-kopf { font-size: var(--bos-font-2xs, .62rem); text-transform: uppercase; letter-spacing: .05em; color: var(--bos-text-faint); font-family: var(--bos-font-label); }
  .tabelle-zeile .bos-input { min-height: 44px; max-width: none; width: 100%; }

  /* Abwiegefolge, Sauer, Import */
  .folge-zeile { display: flex; align-items: center; gap: var(--bos-space-2xs, 6px); padding: 6px 0; border-top: 1px solid var(--bos-border); }
  .folge-zeile .bos-btn { min-width: 52px; min-height: 52px; font-size: 1.1rem; }
  .fz-nr { width: 2.2em; text-align: right; font-family: var(--bos-font-label); font-weight: 700; color: var(--bos-text-faint); }
  .fz-name { flex: 1 1 auto; font-weight: 600; }
  .sauer-eintrag { align-items: center; flex-wrap: wrap; margin-top: var(--bos-space-xs, 9px); }
  .sauer-eintrag .bos-input { max-width: 120px; min-height: 48px; }
  .einwaage-tabelle { width: 100%; border-collapse: collapse; font-size: var(--bos-font-sm, .82rem); }
  .einwaage-tabelle td { padding: 4px 6px; border-top: 1px solid var(--bos-border); }
  .einwaage-tabelle td:last-child { text-align: right; white-space: nowrap; }
  .einwaage-tabelle td.rot { color: var(--bos-red); font-weight: 700; }

  /* ---- Feinschliff 02.10.2026 (Ulf: „grob, ohne Feinschliff“) ----
     Kopf und Reiter kleben zusammen oben; Reiter wie Browser-Tabs (der
     aktive Tab ist aus demselben Stoff wie die Seite darunter); Karte als
     schwebendes Fenster wie die Produkt-Karte im Produkt-Config-Editor. */
  .kopfbereich { position: sticky; top: 0; z-index: 20; background: var(--bos-bg); }
  .rund-btn { min-width: 48px; min-height: 48px; width: 48px; height: 48px; padding: 0; border-radius: 50%; font-size: 1.15rem; }
  .pflege-btn { min-height: 48px; }

  nav.reiter {
    display: flex; align-items: flex-end; gap: 4px;
    padding: 6px var(--bos-space-md, 18px) 0;
    background: var(--bos-bg-soft); border-bottom: 1px solid var(--bos-border-strong);
    overflow-x: auto; scrollbar-width: none;
  }
  nav.reiter::-webkit-scrollbar { display: none; }
  nav.reiter button {
    flex: 1 1 0; min-width: 0; min-height: 50px; margin-bottom: -1px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 0 14px; border: 1px solid transparent; border-bottom: none;
    border-radius: 12px 12px 0 0; background: transparent; color: var(--bos-text-dim);
    font-family: var(--bos-font-label); font-weight: 600; font-size: 1.02rem; letter-spacing: .01em;
    text-transform: none; white-space: nowrap; cursor: pointer; position: relative;
    transition: background var(--bos-transition-fast, .12s), color var(--bos-transition-fast, .12s);
  }
  nav.reiter button:hover { background: var(--bos-amber-glow-soft); color: var(--bos-text); }
  nav.reiter button[aria-selected="true"] {
    background: var(--bos-bg); color: var(--bos-text); border-color: var(--bos-border-strong);
    box-shadow: inset 0 3px 0 var(--bos-amber);
  }
  nav.reiter button:focus-visible { outline: 2px solid var(--bos-amber-bright); outline-offset: -4px; }
  .reiter-zahl {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; font-size: .78rem; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bos-amber-glow-soft); color: var(--bos-amber-bright);
  }
  .reiter-zahl:empty { display: none; }
  @media (max-width: 520px) { nav.reiter { padding: 6px 8px 0; gap: 2px; } nav.reiter button { padding: 0 6px; font-size: .9rem; } }

  /* Teig-Liste: EINE Fläche mit Trennlinien statt einzelner Kacheln */
  .teig-liste { background: var(--bos-surface); border: 1px solid var(--bos-border); border-radius: var(--bos-radius-md); overflow: hidden; }
  .liste-kopf, .liste-zeile { display: grid; grid-template-columns: 28px 1fr 64px 136px; gap: 10px; align-items: center; }
  .liste-kopf { padding: 0 16px 6px; font-family: var(--bos-font-label); font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); }
  .liste-kopf span:nth-child(3), .liste-kopf span:nth-child(4) { text-align: right; }
  .liste-zeile-rahmen { display: flex; align-items: stretch; border-top: 1px solid var(--bos-border); }
  .liste-zeile-rahmen:first-child { border-top: none; }
  .liste-zeile-rahmen > .bos-btn { min-width: 56px; border: none; border-left: 1px solid var(--bos-border); border-radius: 0; background: transparent; }
  .liste-zeile {
    flex: 1 1 auto; min-height: 62px; text-align: left; cursor: pointer;
    background: transparent; border: none; color: var(--bos-text); padding: 8px 16px; font-family: var(--bos-font-body);
  }
  .liste-zeile:hover, .liste-zeile:focus-visible { background: var(--bos-amber-glow-soft); outline: none; }
  .lz-status { font-size: 1.1rem; font-weight: 700; text-align: center; color: var(--bos-text-faint); }
  .lz-status.ok { color: var(--bos-green); } .lz-status.warn { color: var(--bos-red); } .lz-status.teil { color: var(--bos-amber-bright); }
  .lz-name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lz-name b { font-weight: 600; font-size: var(--bos-font-md, .95rem); }
  .lz-name small { color: var(--bos-text-faint); font-size: var(--bos-font-xs, .72rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lz-zahl { text-align: right; font-family: var(--bos-font-label); font-weight: 700; font-size: var(--bos-font-lg, 1.15rem); font-variant-numeric: tabular-nums; }
  .lz-menge { text-align: right; font-family: var(--bos-font-label); font-weight: 700; color: var(--bos-amber-bright); font-variant-numeric: tabular-nums; }
  @media (max-width: 480px) { .liste-kopf, .liste-zeile { grid-template-columns: 22px 1fr 40px 104px; gap: 6px; } .liste-zeile { padding: 8px 10px; } }

  /* Hinweise, die jede Nacht gleich sind, eingeklappt */
  details.hinweis > summary { cursor: pointer; list-style: none; font-weight: 600; min-height: 28px; display: flex; align-items: center; gap: 6px; }
  details.hinweis > summary::-webkit-details-marker { display: none; }
  details.hinweis > summary::after { content: '▸'; margin-left: auto; color: var(--bos-text-faint); transition: transform var(--bos-transition-fast, .12s); }
  details.hinweis[open] > summary::after { transform: rotate(90deg); }
  details.hinweis > div { margin-top: 6px; }

  /* Außentemperatur: eine ruhige Zeile mit Umschalter */
  .temp-leiste { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: var(--bos-space-sm, 14px) 0; }
  .temp-titel { font-family: var(--bos-font-label); font-weight: 600; color: var(--bos-text-dim); }
  .temp-wert { font-size: var(--bos-font-md, .95rem); }
  .temp-wert strong { font-family: var(--bos-font-label); font-size: 1.25rem; }
  .temp-eingabe { max-width: 96px; min-height: 44px; display: inline-block; }
  .umschalter { display: inline-flex; border: 1px solid var(--bos-border-strong); border-radius: 999px; overflow: hidden; margin-left: auto; }
  .umschalter button {
    min-height: 40px; padding: 0 16px; border: none; background: transparent; color: var(--bos-text-dim);
    font-family: var(--bos-font-label); font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  .umschalter button + button { border-left: 1px solid var(--bos-border-strong); }
  .umschalter button[aria-pressed="true"] { background: var(--bos-amber); color: #1a1208; }

  /* Karte je Teig: schwebendes Fenster (Muster Produkt-Karte, 04.09.2026) */
  .karte-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px; background: rgba(0,0,0,.55); }
  .karte-rahmen {
    width: 100%; max-width: 760px; height: min(780px, 90vh); overflow: hidden;
    display: flex; flex-direction: column;
    background: var(--bos-surface); border: 1px solid var(--bos-border-strong); border-radius: 18px;
    box-shadow: 0 20px 56px rgba(0,0,0,.45);
  }
  .karte-kopfzeile { display: flex; align-items: center; gap: 12px; padding: 18px 22px 12px; flex-shrink: 0; }
  .karte-kopfzeile .rund-btn { background: var(--bos-surface); border: 1px solid var(--bos-border-strong); color: var(--bos-text); }
  .karte-kopfzeile .rund-btn:disabled { opacity: .3; }
  .karte-zu { background: none; border: none; color: var(--bos-text-dim); font-size: 1.5rem; width: 48px; height: 48px; cursor: pointer; flex-shrink: 0; }
  .karte-titelblock { flex: 1 1 auto; min-width: 0; text-align: center; }
  .karte-titel { font-family: var(--bos-font-display); font-weight: 900; font-size: 1.6rem; color: var(--bos-text); line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .karte-untertitel { font-size: var(--bos-font-sm, .82rem); color: var(--bos-text-faint); margin-top: 3px; }
  .karte-reiterleiste { display: flex; gap: 4px; padding: 0 22px; border-bottom: 1px solid var(--bos-border-strong); flex-shrink: 0; }
  .karte-reiterleiste button {
    min-height: 46px; padding: 0 22px; margin-bottom: -1px; border: 1px solid transparent; border-bottom: none;
    border-radius: 10px 10px 0 0; background: transparent; color: var(--bos-text-dim); cursor: pointer;
    font-family: var(--bos-font-label); font-weight: 600; font-size: 1rem;
  }
  .karte-reiterleiste button[aria-selected="true"] { background: var(--bos-surface); color: var(--bos-text); border-color: var(--bos-border-strong); box-shadow: inset 0 3px 0 var(--bos-amber); }
  .karte-inhalt { flex: 1 1 auto; overflow-y: auto; padding: 4px 22px 28px; }
  .karte-inhalt #karteMeldung:empty { display: none; }
  @media (max-width: 560px) {
    .karte-overlay { padding: 8px; }
    .karte-rahmen { height: 94vh; border-radius: 14px; }
    .karte-kopfzeile { padding: 12px 12px 8px; gap: 6px; }
    .karte-titel { font-size: 1.3rem; }
    .karte-reiterleiste { padding: 0 12px; }
    .karte-inhalt { padding: 4px 14px 22px; }
  }

  /* Ergebnis der Karte: zwei Kacheln (Feinschliff 02.10.2026) */
  .ergebnis-kacheln { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin: 4px 0 var(--bos-space-sm, 14px); }
  .kachel { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: var(--bos-radius-md); border: 1px solid var(--bos-border-strong); background: var(--bos-bg-soft); min-width: 0; }
  .kachel.winback { border-color: var(--bos-amber); background: var(--bos-amber-glow-soft); }
  .k-label { font-family: var(--bos-font-label); font-weight: 600; font-size: .9rem; color: var(--bos-text-dim); }
  .k-wert { font-family: var(--bos-font-label); font-weight: 800; font-size: 2.1rem; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--bos-text); }
  .kachel.winback .k-wert { color: var(--bos-amber-bright); }
  .k-wert.klein-wert { font-size: 1.15rem; font-weight: 600; color: var(--bos-text-dim); }
  .k-unter { font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); }
  .ergebnis-kacheln.sauer { grid-template-columns: 1.4fr 1fr; }
  .ergebnis-kacheln.vorlaeufig .kachel { border-style: dashed; }
  .info-liste > li.rechenweg { font-size: var(--bos-font-sm, .82rem); color: var(--bos-text-faint); }
  @media (max-width: 480px) { .ergebnis-kacheln { grid-template-columns: 1fr; } .k-wert { font-size: 1.8rem; } }

  /* Sicherheitsregel 02.10.2026: Zahl je Kessel vorn, Gesamt klein darunter */
  .lz-menge { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .lz-haupt { white-space: nowrap; }
  .lz-gesamt { font-family: var(--bos-font-body); font-weight: 400; font-size: var(--bos-font-xs, .72rem); color: var(--bos-text-faint); white-space: nowrap; }
  .lz-name small { white-space: normal; overflow: visible; line-height: 1.5; }
  .lz-brot { display: inline-block; margin-right: 14px; white-space: nowrap; }
  .lz-brot .rot, .zz-einwaage.rot { color: var(--bos-red); font-weight: 700; }
  .zz-einwaage { font-size: var(--bos-font-md, .95rem); font-weight: 600; color: var(--bos-text-dim); margin-top: 2px; }

  /* Vorrat (Konzept Punkt 53) und Vorstufen-Schritte (§5.1a), 02.10.2026 */
  .vorrat-leiste { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 0 0 var(--bos-space-sm, 14px); }
  .vorrat-titel { font-family: var(--bos-font-label); font-weight: 600; color: var(--bos-text-dim); margin-right: 4px; }
  .vorrat-haken {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 10px; cursor: pointer;
    border: 1px solid var(--bos-border-strong); border-radius: 999px; background: var(--bos-surface); color: var(--bos-text);
    font-family: var(--bos-font-body); font-size: var(--bos-font-md, .95rem);
  }
  .vorrat-haken[aria-pressed="true"] { border-color: var(--bos-amber); background: var(--bos-amber-glow-soft); }
  .vh-kasten { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--bos-border-strong); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; color: var(--bos-amber-bright); }
  .vorrat-haken[aria-pressed="true"] .vh-kasten { border-color: var(--bos-amber); }
  .vorrat-marke { font-family: var(--bos-font-label); font-size: .72rem; font-weight: 700; color: var(--bos-blue); border: 1px solid var(--bos-blue); border-radius: 999px; padding: 0 7px; vertical-align: middle; }
  .vorrat-hinweis { border-left-color: var(--bos-blue); }
  .vorrat-zeile { flex-wrap: wrap; }
  .einheit-schalter { margin-left: 0; }
  .einheit-schalter button { min-height: 48px; }
  .zz-umrechnung { font-size: var(--bos-font-sm, .82rem); color: var(--bos-amber-bright); font-weight: 600; margin-top: 2px; }
  .stueck-hinweis { margin: 4px 0 -4px; }
  .vorstufen-liste li.mit-schritten { flex-wrap: wrap; }
  .schritt-wahl { flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .schritt-wahl .umschalter { margin-left: 0; align-self: flex-start; }
  .schritt-wahl .umschalter button { min-height: 48px; padding: 0 18px; }
  .schritt-wahl .umschalter small { font-weight: 400; opacity: .85; }
  .schritt-aufschluesselung { font-weight: 600; }
  .sauer-schalter { margin-left: 0; }

  /* Je Behälter eine Zeile; Regelstand-Hinweis (02.10.2026) */
  .behaelter-liste { list-style: none; margin: 2px 0 0; padding: 0; }
  .behaelter-liste li { display: block; padding: 6px 0; border-top: 1px dashed var(--bos-border); font-size: var(--bos-font-md, .95rem); }
  .behaelter-liste li:first-child { border-top: none; }
  #regelLeiste { margin: var(--bos-space-sm, 14px) var(--bos-space-md, 18px) 0; font-weight: 600; }

/* ---------- Fehler sichtbar (Checkliste §7a) ---------- */
function erklaerung(err) {
  const c = (err && err.code) || '';
  if (c === 'permission-denied') return (S.regelstand === 'alt' ? t('err_perm_regel_alt') : '') + t('err_perm');
  if (c === 'unavailable') return t('err_netz');
  if (c === 'zeitlimit') return t('err_zeit', { s: SCHREIB_ZEITLIMIT_MS / 1000 });
  return '';
}
function fehlerText(kontext, err) {
  const roh = (err && err.code ? err.code + ' — ' : '') + ((err && err.message) || String(err));
  return kontext + ': ' + [erklaerung(err), roh].filter(Boolean).join(' · ');
}
function zeigeFehler(kontext, err) {
  console.error('[Teigecke] ' + kontext, err);
  const liste = document.getElementById('fehlerListe');
  const li = document.createElement('li');
  li.textContent = fehlerText(kontext, err);
  liste.insertBefore(li, liste.firstChild);
  while (liste.children.length > 6) liste.removeChild(liste.lastChild);
  document.getElementById('fehlerLeiste').hidden = false;
}
window.addEventListener('error', function (e) {
  zeigeFehler(t('err_unbehandelt'), { message: (e.message || 'unbekannt') + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ')' });
});
window.addEventListener('unhandledrejection', function (e) {
  zeigeFehler(t('err_unbehandelt'), e.reason || { message: 'unbekannt' });
});
document.getElementById('fehlerZuBtn').addEventListener('click', function () {
  document.getElementById('fehlerLeiste').hidden = true;
  document.getElementById('fehlerListe').innerHTML = '';
});

let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 4200);
}

/* ---------- Lokaler Zustand je Backtag (Auswahl, Abhaken) ----------
   Nur auf diesem Gerät, nichts davon geht in die Datenbank. */
function leseLokal() {
  try { const r = localStorage.getItem(LOKAL_KEY); const o = r ? JSON.parse(r) : {}; return (o && typeof o === 'object') ? o : {}; }
  catch (e) { return {}; }
}
function schreibeLokal(o) {
  try {
    const tage = Object.keys(o).sort();
    while (tage.length > 4) delete o[tage.shift()];   // nur die letzten Tage behalten
    localStorage.setItem(LOKAL_KEY, JSON.stringify(o));
  } catch (e) { console.warn('[Teigecke] lokales Speichern nicht möglich', e); }
}
function lokalTag(datum) {
  const o = leseLokal();
  const k = L.datumStr(datum);
  return (o[k] && typeof o[k] === 'object') ? o[k] : {};
}
function setzeLokalTag(datum, teil) {
  const o = leseLokal();
  const k = L.datumStr(datum);
  o[k] = Object.assign({}, o[k] || {}, teil);
  schreibeLokal(o);
}

/* Auswahl: null = automatische Vorauswahl über backTage, Liste = von Hand */
function auswahl(datum) {
  const lokal = lokalTag(datum);
  if (Array.isArray(lokal.auswahl)) return { ids: lokal.auswahl, manuell: true };
  return { ids: S.produkteOk ? L.vorauswahl(S.teige, S.produkte, datum.getDay(), vorratHaken(L.datumStr(datum))) : [], manuell: false };
}

/* ---------- Datum/Backtag ---------- */
function tagText(d) { return WOCHENTAGE[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.'; }
function heuteStr() { return L.datumStr(S.backtag); }
function morgenStr() { return L.datumStr(S.backtagMorgen); }
function gesternStr() { return L.datumStr(S.backtagGestern); }
function setzeBacktag() {
  S.backtag = L.backtag(new Date());
  S.backtagMorgen = L.naechsterTag(S.backtag);
  S.backtagGestern = new Date(S.backtag.getFullYear(), S.backtag.getMonth(), S.backtag.getDate() - 1);
  document.getElementById('backtagZeile').textContent = t('backtag', { tag: tagText(S.backtag) });
}

/* ---------- Zahlen ---------- */
function fmt(x, stellen) {
  if (!L.istZahl(x)) return '–';
  return x.toFixed(stellen).replace('.', ',');
}
function fmtKg(x) { return fmt(x, 1) + ' kg'; }
function fmtL(x) { return fmt(x, 1) + ' L'; }
function fmtHefe(x) { return fmt(x, 2) + ' kg'; }
function fmtG(x) { return L.istZahl(x) ? Math.round(x) + ' g' : '–'; }
function zahlText(x) { return L.istZahl(x) ? String(x).replace('.', ',') : ''; }
/* '' → null (Feld geleert), sonst Zahl oder NaN (ungültig). Komma erlaubt. */
function parseZahl(text) {
  const s = String(text == null ? '' : text).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

/* ---------- Kurzwege ---------- */
const tm = function () { return L.nachId(S.teige); };
const zm = function () { return L.nachId(S.zutaten); };
const om = function () { return L.nachId(S.orte); };
const pm = function () { return L.produktMap(S.produkte); };
function produktName(k) { const p = pm()[k]; return p ? p.name : k; }
function aktiveTeigeSortiert() { return L.aktiv(S.teige).slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); }); }
function online() { return navigator.onLine !== false && !Object.keys(S.verbindung.ausCache).some(function (k) { return S.verbindung.ausCache[k]; }); }
function hatHaken() { return S.haken.teige || S.haken.rezepte; }   /* Link „Teige & Rezepte“; Wagen-Haken: Seite „Orte“ */
function pflegtTeige() { return S.pflegeModus && S.haken.teige && online(); }
function einstZahl(feld, vorgabe) { const v = S.einstellungen && S.einstellungen[feld]; return L.istZahl(v) ? v : vorgabe; }
function folgeFuer(wd) { const f = S.einstellungen && S.einstellungen.abwiegefolge; return (f && Array.isArray(f[String(wd)])) ? f[String(wd)] : null; }
function sauerteig() { return L.aktiv(S.teige).filter(function (x) { return x.istSauerteig; })[0] || null; }

/* ---------- Laden: Produkte (Firestore über bos_produkte.js), Konto, Zeitkontext ----------
   05.10.2026 (Stufe 1): Die eigene Gerätekopie (PRODUKTE_SPIEGEL_KEY) ist in die
   gemeinsame Lade-Datei gewandert — eine Mechanik, zwölf Aufrufer. Der Hinweis
   „Produktliste vom Gerät (Stand …)“ bleibt (S.produkteAusSpiegel). Der alte
   Eintrag im Gerät wird einmalig entfernt (er stammte aus der Datei, F10). */
async function ladeProdukte() {
  try { localStorage.removeItem(PRODUKTE_SPIEGEL_KEY_ALT); } catch (e) { /* egal */ }
  try {
    if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    const e = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' });
    S.produkte = e.liste; S.produkteOk = true;
    S.produkteAusSpiegel = (e.quelle === 'geraetekopie') ? (e.kopieZeit || e.stand) : null;
    if (e.quelle === 'geraetekopie' && e.grund) zeigeFehler(t('err_laden', { was: 'Produktliste' }), e.grund);
  } catch (err) {
    zeigeFehler(t('err_laden', { was: 'Produktliste' }), err);
    S.produkte = []; S.produkteOk = false;
  }
}
async function ladeKonto() {
  S.haken = { wagen: false, teige: false, rezepte: false };
  if (!S.kennung) return;
  try {
    const konto = await window.BOS_ACCOUNTS.ladeKonto(window.db, S.kennung);
    S.haken = {
      wagen: !!(konto && konto.teigeckePflege === true),
      teige: !!(konto && konto.teigeckeTeige === true),
      rezepte: !!(konto && konto.teigeckeRezepte === true)
    };
  } catch (err) { zeigeFehler(t('err_konto'), err); }
}
async function ladeZeitkontext() {
  S.zeitkontext = null;
  if (!window.BOS_ZEITKONTEXT) return;
  try { S.zeitkontext = await window.BOS_ZEITKONTEXT.status(window.db, heuteStr()); }
  catch (err) { zeigeFehler(t('err_zeitkontext'), err); }
}

/* ---------- Live-Daten (onSnapshot) ----------
   Alles wird abonniert: Zwei Geräte sehen sofort, was das andere schreibt,
   und ohne Netz bleibt der letzte Stand auf dem Bildschirm (Schicht 1). */
function merkeVerbindung(schluessel, meta) {
  S.verbindung.ausCache[schluessel] = !!meta.fromCache;
  S.verbindung.ausstehend[schluessel] = !!meta.hasPendingWrites;
  if (!meta.fromCache) S.verbindung.letzteServerZeit = new Date();
}
function mitId(snap) { const a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); }); return a; }
function aboCollection(name, verarbeite) {
  return window.db.collection(COL[name]).onSnapshot({ includeMetadataChanges: true }, function (snap) {
    merkeVerbindung(name, snap.metadata);
    verarbeite(mitId(snap));
    planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: COL[name] }), err); });
}
function aboDokument(col, id, schluessel, verarbeite) {
  return window.db.collection(col).doc(id).onSnapshot({ includeMetadataChanges: true }, function (snap) {
    merkeVerbindung(schluessel, snap.metadata);
    verarbeite(snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null);
    planeRender();
  }, function (err) { zeigeFehler(t('err_laden', { was: col + '/' + id }), err); });
}
function abonniereStamm() {
  abos.stamm.forEach(function (ab) { ab(); });
  abos.stamm = [
    aboCollection('orte', function (a) { S.orte = a; }),
    aboCollection('zutaten', function (a) { S.zutaten = a; }),
    aboCollection('teige', function (a) { S.teige = a; }),
    aboCollection('teigwerte', function (a) { S.teigwerte = L.nachId(a); }),
    aboDokument(COL.einstellungen, 'allgemein', 'einstellungen', function (d) { S.einstellungen = d || {}; }),
    aboDokument(COL.anpassungen, 'aktuell', 'anpassungen', function (d) { S.anpassung = d; })
  ];
}
function abonniereNaechte() {
  abos.naechte.forEach(function (ab) { ab(); });
  S.naechte = {};
  abos.naechte = [gesternStr(), heuteStr(), morgenStr()].map(function (tag) {
    return aboDokument(COL.naechte, tag, 'nacht_' + tag, function (d) { S.naechte[tag] = d; });
  });
}

async function start() {
  wendeI18nAn();
  renderHilfe();
  setzeBacktag();
  if (!window.db || !window.BOS_AUTH_READY) {
    zeigeFehler(t('err_laden', { was: 'bos_firebase_config.js' }), new Error('window.db oder window.BOS_AUTH_READY fehlt'));
    return;
  }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; }
  catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); return; }
  S.kennung = (nutzer && nutzer.email) ? nutzer.email.split('@')[0] : null;
  if (!S.kennung) toast(t('kein_konto'));
  await Promise.all([ladeProdukte(), ladeKonto(), ladeZeitkontext()]);
  abonniereStamm();
  abonniereNaechte();
  S.geladen = true;
  document.getElementById('ladeStatus').hidden = true;
  document.getElementById('pflegeBtn').hidden = !S.haken.teige;   /* seit 08.10.2026 nur noch Abwiegefolge (Haken Teige) */
  render();
  holeWetter();
  if (S.kennung) pruefeRegelstand();
  setInterval(pruefeBacktagWechsel, 60000);
  setInterval(holeWetter, WETTER_INTERVALL_MS);
}
async function pruefeBacktagWechsel() {
  const neu = L.backtag(new Date());
  if (S.backtag && L.datumStr(neu) !== L.datumStr(S.backtag)) {
    setzeBacktag();
    abonniereNaechte();       // neuer Backtag = neues, leeres Nacht-Dokument
    await ladeZeitkontext();
    schliesseKarte();
    render();
    toast(t('backtag_gewechselt'));
    holeWetter();
  }
}
window.addEventListener('online', function () { planeRender(); holeWetter(); });
window.addEventListener('offline', planeRender);

/* ---------- Schreiben: Nachtdaten (ohne Haken, feldgenau) ----------
   Merge auf Feldpfade: zwei Geräte, die verschiedene Felder schreiben,
   verlieren nichts. Gleiches Feld gleichzeitig: spätere Eingabe gewinnt
   (RK §11). Nicht blockierend: ohne Netz puffert Firestore, die Leiste
   oben zeigt „wird übertragen“. */
/* Regelstand-Probe (02.10.2026, RK §13): Die Regeln geben ein Lesen auf
   bos_regelstand/{fassung} nur für die Fassungen frei, die sie erfüllen.
   Das Dokument existiert nicht; ein erlaubtes get liefert „gibt es nicht“,
   eine ältere Regel lehnt ab (kein passender match-Block). Ein Lesevorgang,
   kein Schreiben, keine Daten. Nur „permission-denied“ vom SERVER zählt als
   „alt“; ohne Netz oder bei anderen Fehlern bleibt es still (unbekannt). */
const REGEL_FASSUNG = 'teigecke-2026-10-02';
const REGEL_DATEI = 'firestore_regeln_2026-10-07_teigecke_rezepte.rules';   /* neueste Datei, die REGEL_FASSUNG erfüllt */
async function pruefeRegelstand() {
  try {
    await window.db.collection('bos_regelstand').doc(REGEL_FASSUNG).get({ source: 'server' });
    S.regelstand = 'passt';
  } catch (err) {
    S.regelstand = err && err.code === 'permission-denied' ? 'alt' : 'unbekannt';
    if (S.regelstand === 'unbekannt') console.warn('[Teigecke] Regelstand nicht prüfbar:', err && err.message);
  }
  const el = document.getElementById('regelLeiste');
  el.textContent = t('regel_alt', { fassung: REGEL_FASSUNG, datei: REGEL_DATEI });
  el.hidden = S.regelstand !== 'alt';
}
function FV() { return firebase.firestore.FieldValue; }
function verschachtelt(pfad, wert) {
  let innen = wert;
  for (let i = pfad.length - 1; i >= 0; i--) { const o = {}; o[pfad[i]] = innen; innen = o; }
  return innen;
}
function schreibeNacht(tag, daten) {
  const voll = Object.assign({}, daten, { geaendertVon: S.kennung, geaendertAm: FV().serverTimestamp() });
  return window.db.collection(COL.naechte).doc(tag).set(voll, { merge: true })
    .catch(function (err) { zeigeFehler(t('err_speichern'), err); });
}
/* Anpassungen „nur heute Nacht“: EIN Dokument mit Feld backtag (Auflage KC).
   Passt der Backtag nicht, wird es beim ersten Schreiben ganz ersetzt —
   die Anpassung von gestern ist dann weg und nirgends mehr gespeichert. */
function schreibeAnpassung(kennung, pfad, wert) {
  const heute = heuteStr();
  const aktuell = !!(S.anpassung && S.anpassung.backtag === heute);
  if (wert === null && !aktuell) return Promise.resolve();
  const teil = {}; teil[kennung] = verschachtelt(pfad, wert === null ? FV().delete() : wert);
  const daten = { teige: teil, geaendertVon: S.kennung, geaendertAm: FV().serverTimestamp() };
  const ref = window.db.collection(COL.anpassungen).doc('aktuell');
  let p;
  if (aktuell) p = ref.set(daten, { merge: true });
  else { daten.backtag = heute; p = ref.set(daten); }
  return p.catch(function (err) { zeigeFehler(t('err_speichern'), err); });
}

/* ---------- Temperatur (Konzept §4.1) ---------- */
function temperaturHeute() {
  const n = S.naechte[heuteStr()];
  const tmp = (n && n.temperatur) || {};
  return { modus: tmp.modus === 'manuell' ? 'manuell' : 'auto', wertC: L.istZahl(tmp.wertC) ? tmp.wertC : null, zeit: tmp.zeit || '', quelle: tmp.quelle || '' };
}
async function holeWetter() {
  if (!S.geladen || S.wetter.laeuft || temperaturHeute().modus !== 'auto') return;
  S.wetter.laeuft = true;
  const ctrl = (typeof AbortController === 'function') ? new AbortController() : null;
  const timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, WETTER_ZEITLIMIT_MS);
  try {
    const res = await fetch(WETTER_URL, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' vom Wetterdienst');
    const j = await res.json();
    const w = j && j.current && j.current.temperature_2m;
    if (!L.istZahl(w)) throw new Error('Der Wetterdienst lieferte keine Temperatur.');
    S.wetter.fehler = null;
    if (temperaturHeute().modus === 'auto') {
      schreibeNacht(heuteStr(), { temperatur: { modus: 'auto', wertC: w, quelle: 'automatisch', zeit: String((j.current && j.current.time) || '') } });
    }
  } catch (err) {
    const e = (err && err.name === 'AbortError') ? { message: t('wetter_zeitlimit', { s: WETTER_ZEITLIMIT_MS / 1000 }) } : err;
    S.wetter.fehler = e;
    zeigeFehler(t('err_wetter'), e);
  } finally {
    clearTimeout(timer);
    S.wetter.laeuft = false;
    planeRender();
  }
}
function uhrzeitAus(zeit) { const m = /T(\d{2}:\d{2})/.exec(zeit || ''); return m ? m[1] : (zeit || ''); }
function temperaturHTML() {
  const tmp = temperaturHeute();
  const knopf = function (modus) {
    return '<button type="button" data-aktion="temp-modus" data-modus="' + modus + '" aria-pressed="' + (tmp.modus === modus) + '">' + esc(t(modus === 'auto' ? 'temp_auto' : 'temp_manuell')) + '</button>';
  };
  let wert;
  if (tmp.modus === 'manuell') {
    wert = '<input class="bos-input temp-eingabe" id="tempManuell" inputmode="decimal" value="' + esc(zahlText(tmp.wertC)) + '" aria-label="' + esc(t('temp_label')) + '"> °C';
  } else if (L.istZahl(tmp.wertC)) {
    wert = '<strong>' + fmt(tmp.wertC, 1) + ' °C</strong> <span class="klein">' + esc(t('temp_stand', { zeit: uhrzeitAus(tmp.zeit) })) + '</span>' +
      (S.wetter.fehler ? ' <span class="badge rot">' + esc(t('temp_alt')) + '</span>' : '');
  } else {
    wert = S.wetter.laeuft ? esc(t('temp_holt')) : '<span class="badge rot">' + esc(t('temp_fehlt')) + '</span>';
  }
  return '<div class="temp-leiste"><span class="temp-titel">' + esc(t('temp_label')) + '</span><div class="temp-wert">' + wert + '</div>' +
    '<div class="umschalter" role="group" aria-label="' + esc(t('temp_label')) + '">' + knopf('auto') + knopf('manuell') + '</div></div>';
}

/* ---------- Ein Teig in einer Nacht (Anzeige + Rechnung) ---------- */
function teigRechnung(teig, rolle) {
  const datum = rolle === 'prognose' ? S.backtagMorgen : S.backtag;
  const tag = L.datumStr(datum);
  const nacht = S.naechte[tag] || {};
  const vorrat = rolle === 'heute' && istVorrat(teig);
  const zahlen = (rolle === 'prognose' ? nacht.prognose : vorrat ? nacht.vorrat : nacht.brote) || {};
  const tw = S.teigwerte[teig.id] || {};
  const stamm = tw.einwaage || {};
  const anp = rolle === 'heute' ? (L.anpassungHeute(S.anpassung, tag)[teig.id] || {}) : {};
  const anpE = anp.einwaage || {};
  /* Vorrat: alle Brote des Teigs (nicht an den Backtag gebunden). */
  const produkte = L.produkteDesTeigs(teig.id, S.produkte, vorrat ? undefined : datum.getDay());
  const posten = produkte.map(function (p) {
    const lk = p.legacyKey;
    const abw = L.istZahl(anpE[lk]);
    return { lk: lk, name: p.name, anzahl: L.istZahl(zahlen[lk]) ? zahlen[lk] : undefined,
      einwaageG: abw ? anpE[lk] : stamm[lk], stammG: stamm[lk], abw: abw };
  });
  const kesselrestStamm = L.istZahl(tw.kesselrestKg) ? tw.kesselrestKg : 0;
  const kesselrestNacht = (rolle === 'heute' && nacht.kesselrest && L.istZahl(nacht.kesselrest[teig.id])) ? nacht.kesselrest[teig.id] : null;
  const aussen = rolle === 'heute' ? temperaturHeute().wertC : null;
  const hefeT = L.interpoliere(tw.tabelle, aussen, 'hefeDeltaG');
  const wasserT = L.interpoliere(tw.tabelle, aussen, 'wasserC');
  const calc = L.rechneTeig({
    posten: posten,
    kesselrestKg: kesselrestNacht !== null ? kesselrestNacht : kesselrestStamm,
    literJeKg: tw.wasserLiterJeKg,
    wasserL: L.istZahl(anp.wasserL) ? anp.wasserL : null,
    ohneSchuettwasser: !!teig.ohneSchuettwasser,
    kesselMaxKg: L.istZahl(tw.kesselMaxKg) ? tw.kesselMaxKg : einstZahl('kesselMaxVorgabeKg', KESSEL_VORGABE_KG),
    hefeJeKg: teig.hefeJeKg, hefeDeltaG: hefeT.wert, rezeptBasisKg: teig.rezeptBasisKg,
    hefeKg: L.istZahl(anp.hefeKg) ? anp.hefeKg : null
  });
  return { teig: teig, rolle: rolle, tag: tag, vorrat: vorrat, produkte: produkte, posten: posten, tw: tw, anp: anp, kesselrestStamm: kesselrestStamm,
    kesselrestNacht: kesselrestNacht, aussen: aussen, hefeT: hefeT, wasserT: wasserT, calc: calc };
}
function istFertig(calc) { return calc.status === 'fertig' || calc.status === 'null'; }

/* ---------- Rendern ---------- */
let renderGeplant = false, renderAufgeschoben = false;
function planeRender() {
  if (renderGeplant) return;
  renderGeplant = true;
  requestAnimationFrame(function () { renderGeplant = false; render(); });
}
function fokusIn(el) {
  const a = document.activeElement;
  return !!(a && el && el.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName));
}
document.addEventListener('focusout', function () {
  setTimeout(function () { if (renderAufgeschoben) { renderAufgeschoben = false; render(); } }, 0);
});
function renderVerbindung() {
  const el = document.getElementById('verbindungLeiste');
  const ausstehend = Object.keys(S.verbindung.ausstehend).filter(function (k) { return S.verbindung.ausstehend[k]; }).length;
  const teile = [];
  if (!online()) {
    const z = S.verbindung.letzteServerZeit;
    teile.push(t('offline_stand', { zeit: z ? String(z.getHours()).padStart(2, '0') + ':' + String(z.getMinutes()).padStart(2, '0') : '?' }));
  }
  if (ausstehend) teile.push(t('ausstehend'));
  if (S.produkteAusSpiegel) teile.push(t('produkte_spiegel', { zeit: S.produkteAusSpiegel.toLocaleString('de-DE') }));
  el.hidden = !teile.length;
  el.textContent = teile.join(' · ');
}
function render() {
  if (!S.geladen) return;
  renderVerbindung();
  document.querySelectorAll('nav.reiter [data-tab]').forEach(function (knopf) {
    knopf.setAttribute('aria-selected', knopf.getAttribute('data-tab') === S.tab ? 'true' : 'false');
  });
  document.getElementById('pflegeBtn').setAttribute('aria-pressed', S.pflegeModus ? 'true' : 'false');
  document.getElementById('reiterZahlTeige').textContent = String(teigeFuer('heute').length || '');
  const ansichten = { teige: 'ansichtTeige', vorbereitungen: 'ansichtVorbereitungen', einsammeln: 'ansichtEinsammeln' };
  Object.keys(ansichten).forEach(function (k) { document.getElementById(ansichten[k]).hidden = S.tab !== k; });
  if (fokusIn(document.querySelector('main'))) renderAufgeschoben = true;
  else {

    if (S.tab === 'vorbereitungen') renderVorbereitungen();

}

/* ---------- Liste der Teige (Startseite, auch für die Prognose) ---------- */
function statusSymbol(calc) {
  if (calc.status === 'fertig') return '<span class="lz-status ok" title="' + esc(t('status_fertig')) + '">✓</span>';
  if (calc.status === 'null') return '<span class="lz-status neutral" title="' + esc(t('status_null')) + '">–</span>';
  if (calc.status === 'einwaageFehlt') return '<span class="lz-status warn" title="' + esc(t('status_einwaage')) + '">⚠</span>';
  if (calc.status === 'teilweise') return '<span class="lz-status teil" title="' + esc(t('status_teilweise')) + '">…</span>';
  return '<span class="lz-status leer" title="' + esc(t('status_leer')) + '">○</span>';
}
/* Vorrats-Teige (Konzept Punkt 53): nur, wenn für den Backtag angehakt.
   Die Prognose für morgen nimmt sie nie (nicht an den Backzettel gebunden). */
function vorratHaken(tag) {
  const h = (S.naechte[tag] || {}).vorratHaken || {}, m = {};
  Object.keys(h).forEach(function (k) { if (h[k] === true) m[k] = true; });
  return m;
}
function istVorrat(teig) { return L.istVorratsTeig(teig.id, S.produkte); }
function teigeFuer(rolle) {
  const datum = rolle === 'prognose' ? S.backtagMorgen : S.backtag;
  return L.teigeDesTages(S.teige, S.produkte, datum.getDay(), folgeFuer(datum.getDay()), rolle === 'prognose' ? {} : vorratHaken(heuteStr()));
}
function vorratZeileHTML() {
  const vt = L.vorratsTeige(S.teige, S.produkte);
  if (!vt.length) return '';
  const h = vorratHaken(heuteStr());
  return '<div class="vorrat-leiste"><span class="vorrat-titel">' + esc(t('vorrat_heute')) + '</span>' + vt.map(function (x) {
    return '<button type="button" class="vorrat-haken" data-aktion="vorrat-haken" data-id="' + esc(x.id) + '" aria-pressed="' + (h[x.id] === true) + '">' +
      '<span class="vh-kasten" aria-hidden="true">' + (h[x.id] === true ? '✓' : '') + '</span>' + esc(x.name) + '</button>';
  }).join('') + '</div>';
}
/* Haken setzen/entfernen. Stehen schon Teiglinge drin, erst nachfragen;
   beim Entfernen werden sie mit gelöscht (sonst stünde Vorrat in der Historie,
   der nie gemacht wurde). */
function vorratUmschalten(id, bestaetigt) {
  const tag = heuteStr(), an = vorratHaken(tag)[id] === true;
  const daten = { vorratHaken: {} };
  if (!an) { daten.vorratHaken[id] = true; schreibeNacht(tag, daten); return; }
  const zahlen = (S.naechte[tag] || {}).vorrat || {};
  const mitZahl = L.produkteDesTeigs(id, S.produkte).filter(function (p) { return L.istZahl(zahlen[p.legacyKey]); });
  if (mitZahl.length && !bestaetigt) {
    editZustand = { typ: 'vorratFrage', id: id };
    oeffneEdit(t('vorrat_entfernen_titel'), '<p>' + esc(t('vorrat_entfernen_text', { teig: (tm()[id] || {}).name || id,
      liste: mitZahl.map(function (p) { return p.name + ' ' + zahlen[p.legacyKey] + ' Stk'; }).join(', ') })) + '</p>',
      [{ aktion: 'vorrat-entfernen', text: t('vorrat_entfernen_ja'), klasse: 'gefahr' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
    return;
  }
  daten.vorratHaken[id] = FV().delete();
  if (mitZahl.length) { daten.vorrat = {}; mitZahl.forEach(function (p) { daten.vorrat[p.legacyKey] = FV().delete(); }); }
  schreibeNacht(tag, daten);
}
function listeHTML(rolle) {

}

/* ---------- Vorbereitungen: Sauer, Prognose, Vorstufen ---------- */
function prognoseStand() {
  const teige = teigeFuer('prognose');
  const rechnungen = teige.map(function (x) { return teigRechnung(x, 'prognose'); });
  const offen = rechnungen.filter(function (r) { return !istFertig(r.calc); });
  return { rechnungen: rechnungen, offen: offen };
}
function sauerBedarfAus(rechnungen, feld) {
  return rechnungen.reduce(function (s, r) {
    const teig = r.teig;
    if (!teig.mitSauer || !L.istZahl(teig.sauerJeKg) || !L.istZahl(r.calc[feld])) return s;
    return s + teig.sauerJeKg * r.calc[feld];
  }, 0);
}
function sauerHTML() {
  const st = sauerteig();
  const a = st && st.anstellgutAnteil;
  const einst = { stufeKg: einstZahl('sauerStufeKg', L.SAUER_VORGABE.stufeKg), halbStufeKg: einstZahl('sauerHalbStufeKg', L.SAUER_VORGABE.halbStufeKg),
    schwelleKg: einstZahl('sauerSchwelleKg', L.SAUER_VORGABE.schwelleKg), chargeMaxKg: einstZahl('sauerKesselMaxKg', L.SAUER_VORGABE.chargeMaxKg) };
  let html = '<section class="block"><div class="block-kopf"><h2 class="bos-title">' + esc(t('sauer_titel')) + '</h2><span class="klein">' + esc(t('sauer_klein', { tag: tagText(S.backtagMorgen) })) + '</span></div>';
  if (!L.istZahl(a)) return html + '<div class="hinweis baustelle">' + esc(t('sauer_kein_rezept')) + '</div></section>';
  const pg = prognoseStand();
  const ohneWert = pg.rechnungen.filter(function (r) { return r.teig.mitSauer && !L.istZahl(r.teig.sauerJeKg); }).map(function (r) { return r.teig.name; });
  if (ohneWert.length) html += '<div class="hinweis baustelle">' + esc(t('sauer_ohne_wert', { liste: ohneWert.join(', ') })) + '</div>';
  /* mitSauer fehlt = unbekannt (Anweisung Vorrat §5 A): sichtbar, nicht still weglassen. */
  const unbekannt = pg.rechnungen.filter(function (r) { return typeof r.teig.mitSauer !== 'boolean' && !r.teig.istSauerteig; }).map(function (r) { return r.teig.name; });
  if (unbekannt.length) html += '<div class="hinweis rot">' + esc(t('sauer_unbekannt', { liste: unbekannt.join(', ') })) + '</div>';
  const vorratMitSauer = L.vorratsTeige(S.teige, S.produkte).filter(function (x) { return x.mitSauer === true; }).map(function (x) { return x.name; });
  if (vorratMitSauer.length) html += '<div class="hinweis">' + esc(t('sauer_vorrat', { liste: vorratMitSauer.join(', ') })) + '</div>';
  let vorschlag = null;
  if (pg.offen.length) {
    html += '<div class="hinweis">' + esc(t('sauer_prognose_offen', { liste: pg.offen.map(function (r) { return r.teig.name; }).join(', ') })) + '</div>';
  } else {
    const bedarf = sauerBedarfAus(pg.rechnungen, 'D');
    vorschlag = L.sauerAnsatz(bedarf, a, einst);
    if (vorschlag) {
      /* Feinschliff 02.10.: Ergebnis als Kacheln wie in der Teig-Karte. */
      html += '<div class="ergebnis-kacheln sauer">' +
        '<div class="kachel winback"><span class="k-label">' + esc(t('sauer_ansatz')) + '</span><span class="k-wert">' + esc(L.mengeJeKessel(vorschlag.ansatzKg, vorschlag.chargen, 'kg', 1).haupt) + '</span>' +
          '<span class="k-unter">' + esc(L.mengeJeKessel(vorschlag.ansatzKg, vorschlag.chargen, 'kg', 1).gesamt || t('k_eine_charge')) + '</span></div>' +
        '<div class="kachel"><span class="k-label">' + esc(t('k_anstellgut')) + '</span><span class="k-wert">' + fmtKg(vorschlag.anstellgutKg) + '</span>' +
          '<span class="k-unter">' + esc(t('k_anstellgut_unter')) + '</span></div></div>' +
        '<ul class="info-liste">' +
        '<li>' + esc(t('sauer_bedarf')) + ' <strong>' + fmtKg(vorschlag.bedarfKg) + '</strong></li>' +
        '<li>' + esc(t('sauer_mindest', { prozent: fmt(a * 100, 1) })) + ' <strong>' + fmtKg(vorschlag.mindestKg) + '</strong></li></ul>';
    }
  }
  const eingetragen = (S.naechte[heuteStr()] || {}).sauerAnsatz;
  const wert = eingetragen && L.istZahl(eingetragen.kg) ? eingetragen.kg : (vorschlag ? vorschlag.ansatzKg : null);
  if (wert !== null) {
    html += '<div class="feld-zeile sauer-eintrag"><label class="bos-label" for="sauerAngesetzt">' + esc(t('sauer_angesetzt')) + '</label>' +
      '<input class="bos-input" id="sauerAngesetzt" inputmode="decimal" value="' + esc(zahlText(wert)) + '"> kg ' +
      '<button type="button" class="bos-btn bos-btn--amber" data-aktion="sauer-bestaetigen">' + esc(t('sauer_bestaetigen')) + '</button></div>' +
      '<div class="klein">' + esc(eingetragen && L.istZahl(eingetragen.kg) ? t('sauer_eingetragen') : t('sauer_vorschlag_gilt')) + '</div>';
  }
  html += reichtHTML(a, einst, wert);
  return html + '</section>';
}
/* Reicht-Prüfung für heute: gestriger Ansatz − Sauer der heutigen Teige (auf T)
   ≥ Anstellgut für den neuen Ansatz. Nur ein Hinweis, kein Vorschlag (Punkt 34). */
function reichtHTML(a, einst, ansatzHeute) {
  const gestern = (S.naechte[gesternStr()] || {}).sauerAnsatz;
  let ansatzGestern = gestern && L.istZahl(gestern.kg) ? gestern.kg : null, quelle = 'eingetragen';
  if (ansatzGestern === null) {
    /* „Der Vorschlag gilt“ (Frage 9): aus der Prognose, die gestern für heute eingetippt wurde. */
    const prog = (S.naechte[heuteStr()] || {}).prognose;
    if (prog && Object.keys(prog).length) {
      const rechnungen = teigeFuer('heute').map(function (x) {
        const r = teigRechnung(x, 'heute');
        const posten = r.posten.map(function (p) { return Object.assign({}, p, { anzahl: L.istZahl(prog[p.lk]) ? prog[p.lk] : undefined, einwaageG: p.stammG }); });
        return { teig: x, calc: L.rechneTeig({ posten: posten, kesselrestKg: r.kesselrestStamm, ohneSchuettwasser: true }) };
      });
      if (rechnungen.every(function (r) { return istFertig(r.calc); })) {
        const v = L.sauerAnsatz(sauerBedarfAus(rechnungen, 'D'), a, einst);
        if (v) { ansatzGestern = v.ansatzKg; quelle = 'vorschlag'; }
      }
    }
  }
  let html = '<div class="unterkopf">' + esc(t('reicht_titel')) + '</div>';
  if (ansatzGestern === null) return html + '<div class="hinweis baustelle">' + esc(t('reicht_gestern_fehlt')) + '</div>';
  const heute = teigeFuer('heute').map(function (x) { return teigRechnung(x, 'heute'); });
  const offen = heute.filter(function (r) { return !istFertig(r.calc); });
  if (offen.length) return html + '<div class="hinweis">' + esc(t('reicht_heute_offen', { liste: offen.map(function (r) { return r.teig.name; }).join(', ') })) + '</div>';
  if (!L.istZahl(ansatzHeute)) return html + '<div class="hinweis">' + esc(t('reicht_ansatz_fehlt')) + '</div>';
  const pr = L.reichtPruefung(ansatzGestern, sauerBedarfAus(heute, 'T'), a * ansatzHeute);
  const zahlen = t('reicht_zahlen', { gestern: fmtKg(ansatzGestern), quelle: t(quelle === 'vorschlag' ? 'reicht_quelle_vorschlag' : 'reicht_quelle_eingetragen'),
    heute: fmtKg(ansatzGestern - pr.restKg), rest: fmtKg(pr.restKg), noetig: fmtKg(a * ansatzHeute) });
  return html + '<div class="hinweis ' + (pr.reicht ? 'gruen' : 'rot') + '">' + esc((pr.reicht ? t('reicht_ja') : t('reicht_nein', { fehlt: fmtKg(pr.fehltKg) })) + ' ' + zahlen) + '</div>';
}
function vorstufenHTML() {
  const pg = prognoseStand();
  const mit = pg.rechnungen.filter(function (r) { return r.teig.vorstufe; });
  const vorratMit = L.vorratsTeige(S.teige, S.produkte).filter(function (x) { return x.vorstufe; }).map(function (x) { return x.name; });
  let html = '<section class="block"><div class="block-kopf"><h2 class="bos-title">' + esc(t('vorstufen_titel')) + '</h2><span class="klein">' + esc(t('vorstufen_klein', { tag: tagText(S.backtagMorgen) })) + '</span></div>';
  if (vorratMit.length) html += '<div class="hinweis">' + esc(t('vorstufe_vorrat', { liste: vorratMit.join(', ') })) + '</div>';
  if (!mit.length) return html + '<p class="status">' + esc(t('vorstufen_keine')) + '</p></section>';
  const wahlen = (S.naechte[morgenStr()] || {}).vorstufeWahl || {};
  return html + '<ul class="liste vorstufen-liste">' + mit.map(function (r) {
    const x = r.teig;
    let menge = '', schritte = '', zuWenig = false;
    if (!istFertig(r.calc)) menge = '<span class="klein">' + esc(t('prognose_fehlt')) + '</span>';
    else if (!L.istZahl(x.vorstufeJeKg)) menge = '<span class="klein">' + esc(t('kein_rezeptwert')) + '</span>';
    else {
      const bedarf = x.vorstufeJeKg * r.calc.D;
      const v = L.istSchritt(x.vorstufeSchritt) ? L.vorstufeSchritte(bedarf, x.vorstufeSchritt, x.vorstufeSchritteJeBehaelter, r.calc.anzahl) : null;
      if (!v) menge = '<strong>' + esc(t('vorstufe_menge', { stk: r.calc.anzahl, kg: fmtKg(bedarf) })) + '</strong>';
      else {
        /* Feste Schritte (Konzept §5.1a): zwei Nachbarn, vorbelegt aufgerundet, Wahl je Nacht. */
        const gewaehlt = v.optionen.filter(function (o) { return o.n === wahlen[x.id]; })[0] || v.optionen.filter(function (o) { return o.n === v.vorschlag; })[0];
        menge = '<span class="klein">' + esc(t('vorstufe_bedarf', { kg: fmtKg(bedarf), stk: r.calc.anzahl })) + '</span>';
        /* Kleinere Stufe bleibt wählbar (Erfahrung des Teigmachers), wird aber
           rötlich, wenn sie rechnerisch nicht für die Prognose reicht (KC 02.10.).
           Folgt der aktuellen Prognose, weil sie bei jedem Zeichnen neu rechnet. */
        zuWenig = gewaehlt.zuWenig;
        schritte = '<div class="schritt-wahl"><div class="umschalter" role="group" aria-label="' + esc(t('vorstufe_schritte')) + '">' + v.optionen.map(function (o) {
          const rot = o === gewaehlt && o.zuWenig;
          return '<button type="button" data-aktion="vorstufe-wahl" data-id="' + esc(x.id) + '" data-n="' + o.n + '" aria-pressed="' + (o === gewaehlt) + '"' + (rot ? ' class="zu-wenig"' : '') + '>' +
            esc(t('vorstufe_option', { n: o.n })) + (L.istZahl(o.reichtBrote) ? ' <small>' + esc(rot && L.istZahl(o.broteBedarf)
              ? t('vorstufe_reicht_nur', { stk: o.reichtBrote, von: o.broteBedarf }) : t('vorstufe_reicht', { stk: o.reichtBrote })) + '</small>' : '') + '</button>';
        }).join('') + '</div>' +
        '<div class="schritt-aufschluesselung">' + esc(t('vorstufe_gesamt', { teile: L.schrittText(x.vorstufeSchritt, gewaehlt.n), kg: fmtKg(gewaehlt.kg) })) + '</div>' +
        /* Je Behälter eine Zeile (Ulf, 02.10.): „graue Wanne 1: 9 kg … + 27 L …“ */
        '<ul class="behaelter-liste">' + L.behaelterZeilen(x.vorstufeSchritt, gewaehlt.behaelter, x.vorstufeBehaelter || t('vorstufe_behaelter_vorgabe')).map(function (b) {
          return '<li><b>' + esc(b.name) + ':</b> ' + esc(b.text) + ' <span class="klein">(' + esc(fmtKg(b.kg)) + ')</span></li>';
        }).join('') + '</ul></div>';
      }
    }
    return '<li class="' + (schritte ? 'mit-schritten' : '') + (zuWenig ? ' zu-wenig' : '') + '"><span>' + esc(x.vorstufe + ' ' + x.name) + (x.vorstufeHinweis ? '<br><small>' + esc(x.vorstufeHinweis) + '</small>' : '') + '</span>' + menge + schritte + '</li>';
  }).join('') + '</ul></section>';
}
function renderVorbereitungen() {

/* ---------- Karte je Teig (Diashow) ---------- */
function oeffneKarte(rolle, id) {
  const liste = teigeFuer(rolle).map(function (x) { return x.id; });
  const index = liste.indexOf(id);
  if (index === -1) return;
  S.karte = { rolle: rolle, liste: liste, index: index, reiter: 'zahlen', gerendert: '', entwurf: null };
  document.getElementById('karteMeldung').textContent = '';   // keine alte Meldung eines anderen Teigs (Fund 02.10.)
  document.getElementById('karteSheet').hidden = false;
  renderKarte(true);
  fokusErstesFeld();
}
function schliesseKarte() {
  S.karte = null;
  document.getElementById('karteSheet').hidden = true;
  planeRender();
}
function karteNav(richtung) {
  const k = S.karte;
  if (!k) return false;
  const neu = k.index + richtung;
  if (neu < 0 || neu >= k.liste.length) return false;
  k.index = neu; k.reiter = 'zahlen'; k.entwurf = null;
  document.getElementById('karteMeldung').textContent = '';
  renderKarte(true);
  return true;
}
function fokusErstesFeld() {
  const f = document.querySelector('#karteBody .zahl-eingabe');
  if (f) { f.focus(); if (f.select) f.select(); }
}
function renderKarte(voll) {
  const k = S.karte;
  if (!k) return;
  const teig = tm()[k.liste[k.index]];
  if (!teig || teig.geloescht) { schliesseKarte(); return; }
  const r = teigRechnung(teig, k.rolle);
  const schluessel = teig.id + '|' + k.reiter + '|' + k.rolle;
  const sheet = document.getElementById('karteSheet');
  if (!voll && k.gerendert === schluessel) {
    if (k.reiter === 'zahlen') {
      const info = document.getElementById('karteInfo');
      if (info) info.innerHTML = karteInfoHTML(r);
      document.querySelectorAll('#karteBody .zahl-eingabe').forEach(function (inp) {
        if (inp === document.activeElement) return;
        const p = r.posten.filter(function (x) { return x.lk === inp.getAttribute('data-lk'); })[0];
        inp.value = p && L.istZahl(p.anzahl) ? String(p.anzahl) : '';
        inp.setAttribute('data-geschrieben', inp.value);
      });
      return;
    }
    if (fokusIn(sheet)) return;
  }
  k.gerendert = schluessel;
  document.getElementById('karteTitel').textContent = teig.name;
  document.getElementById('karteUntertitel').textContent = (k.rolle === 'prognose' ? t('karte_prognose', { tag: tagText(S.backtagMorgen) }) : tagText(S.backtag)) + ' · ' + (k.index + 1) + '/' + k.liste.length;
  document.getElementById('karteZurueckBtn').disabled = k.index <= 0;
  document.getElementById('karteVorBtn').disabled = k.index >= k.liste.length - 1;
  const reiter = k.rolle === 'heute' ? [['zahlen', t('reiter_zahlen')], ['anpassen', t('reiter_anpassen')]] : [['zahlen', t('reiter_zahlen')]];
  document.getElementById('karteReiter').innerHTML = reiter.map(function (x) {
    return '<button type="button" role="tab" data-aktion="karte-reiter" data-reiter="' + x[0] + '" aria-selected="' + (k.reiter === x[0]) + '">' + esc(x[1]) + '</button>';
  }).join('');
  document.getElementById('karteBody').innerHTML = k.reiter === 'anpassen' ? anpassenHTML(r) : zahlenHTML(r);
}
function vorratFeldHTML(r, p) {
  const prod = pm()[p.lk] || {};
  const spb = L.istZahl(prod.stueckProBlech) && prod.stueckProBlech > 1 ? prod.stueckProBlech : null;
  const wort = String(prod.einheit || '').indexOf('Dielen') !== -1 ? t('vorrat_dielen') : t('vorrat_bleche');
  let einh = spb ? (S.vorratEinheit[p.lk] || 'bleche') : 'stueck';
  if (einh === 'bleche' && L.istZahl(p.anzahl) && p.anzahl % spb !== 0) einh = 'stueck';
  const wertText = L.istZahl(p.anzahl) ? String(einh === 'bleche' ? p.anzahl / spb : p.anzahl) : '';
  const umrechnung = L.istZahl(p.anzahl) && spb ? t('vorrat_umrechnung', { n: zahlText(p.anzahl / spb), wort: wort, stk: p.anzahl }) : '';
  return '<div class="zahl-zeile vorrat-zeile"><span class="zz-name">' + esc(p.name) +
      (L.istZahl(p.einwaageG) ? '<span class="zz-einwaage">' + esc(t('einwaage_klein', { g: Math.round(p.einwaageG) })) + (p.abw ? ' ' + esc(t('einwaage_heute')) : '') + '</span>'
        : '<span class="zz-einwaage rot">' + esc(t('einwaage_fehlt_kurz')) + '</span>') +
      (umrechnung ? '<span class="zz-umrechnung">' + esc(umrechnung) + '</span>' : '') + '</span>' +
    (spb ? '<span class="umschalter einheit-schalter" role="group" aria-label="' + esc(t('vorrat_einheit')) + '">' +
      '<button type="button" data-aktion="vorrat-einheit" data-lk="' + esc(p.lk) + '" data-einheit="bleche" aria-pressed="' + (einh === 'bleche') + '">' + esc(wort) + '</button>' +
      '<button type="button" data-aktion="vorrat-einheit" data-lk="' + esc(p.lk) + '" data-einheit="stueck" aria-pressed="' + (einh === 'stueck') + '">' + esc(t('vorrat_stueck')) + '</button></span>' : '') +
    '<input class="zahl-eingabe" data-lk="' + esc(p.lk) + '" data-teig="' + esc(r.teig.id) + '" data-rolle="vorrat" data-einheit="' + einh + '" data-spb="' + (spb || 1) +
      '" data-geschrieben="' + esc(wertText) + '" inputmode="numeric" enterkeyhint="next" autocomplete="off" value="' + esc(wertText) + '" aria-label="' + esc(p.name) + '"></div>';
}

        ? '<span class="zz-einwaage">' + esc(t('einwaage_klein', { g: Math.round(p.einwaageG) })) + (p.abw ? ' ' + esc(t('einwaage_heute')) : '') + '</span>'
        : '<span class="zz-einwaage rot">' + esc(t('einwaage_fehlt_kurz')) + '</span>') + '</span>' +

  }).join('') + '</div>' +
  '<div class="karte-weiter"><button type="button" class="bos-btn bos-btn--amber" data-aktion="karte-weiter">' + esc(t('weiter')) + '</button></div>' +
  '<div id="karteInfo">' + karteInfoHTML(r) + '</div>';

function karteInfoHTML(r) {
  const c = r.calc, x = r.teig, anp = r.anp;
  const zeilen = [];
  if (r.rolle === 'prognose') {
    if (c.status === 'einwaageFehlt') zeilen.push('<li class="rot">' + esc(t('einwaage_fehlt_lang', { liste: c.fehlendeEinwaage.map(produktName).join(', ') })) + '</li>');
    else if (istFertig(c) || c.status === 'teilweise') {
      zeilen.push('<li>' + esc(t('teigmenge_d')) + ' <strong>' + fmtKg(c.D) + '</strong></li>');
      if (x.mitSauer && L.istZahl(x.sauerJeKg)) zeilen.push('<li>' + esc(t('sauer_dafuer')) + ' <strong>' + fmtKg(x.sauerJeKg * c.D) + '</strong></li>');
      if (x.vorstufe && L.istZahl(x.vorstufeJeKg)) zeilen.push('<li>' + esc(x.vorstufe) + ': <strong>' + fmtKg(x.vorstufeJeKg * c.D) + '</strong></li>');
    }
    return '<ul class="info-liste">' + zeilen.join('') + '</ul>';
  }
  const abw = function (text) { return ' <span class="abw">' + esc(text) + '</span>'; };
  /* Feinschliff 02.10.: Steht das Ergebnis fest, kommen Wasser und WinBack-
     Menge als zwei große Kacheln nach oben (Wasser links = zuerst, Konzept
     §4.3); die Liste darunter trägt nur noch die Einzelheiten. */
  const mitKacheln = (c.status === 'fertig' || c.status === 'teilweise') && L.istZahl(c.T);
  /* 1. Wasser zuerst — muss vor der WinBack-Eingabe feststehen (Konzept §4.3). */
  if (mitKacheln) { /* steht in der Kachel */ }
  else if (x.ohneSchuettwasser) zeilen.push('<li>' + esc(t('ohne_schuettwasser')) + '</li>');
  else if (L.istZahl(c.r)) {
    let w = '<li class="wasser">' + esc(t('wasser_weniger', { l: fmtL(c.r) }));
    if (L.istZahl(anp.wasserL)) w += abw(t('heute_statt', { statt: L.istZahl(c.rRegel) ? fmtL(c.rRegel) : '0 L' }));
    else if (!L.istZahl(r.tw.wasserLiterJeKg)) w += ' <span class="klein">' + esc(t('keine_wasserregel')) + '</span>';
    zeilen.push(w + '</li>');
  } else if (!L.istZahl(r.tw.wasserLiterJeKg)) zeilen.push('<li class="klein">' + esc(t('keine_wasserregel')) + '</li>');
  /* 2. Wassertemperatur */
  if (!x.ohneSchuettwasser) {
    if (L.istZahl(anp.wasserC)) zeilen.push('<li>' + esc(t('wassertemp', { c: Math.round(anp.wasserC) })) + abw(t('heute_angepasst')) + '</li>');
    else if (r.wasserT.leer) zeilen.push('<li class="klein">' + esc(t('wassertemp_keine_tabelle')) + '</li>');
    else if (r.wasserT.ohneTemperatur) zeilen.push('<li class="klein">' + esc(t('wassertemp_ohne_aussen')) + '</li>');
    else zeilen.push('<li>' + esc(t('wassertemp', { c: Math.round(r.wasserT.wert) })) + (r.wasserT.rand ? ' <span class="klein">' + esc(t('tabelle_rand')) + '</span>' : '') + '</li>');
  }
  /* 3. Hefe (auf T, wie WinBack) */
  if (L.istZahl(c.hefeKg)) {
    const hm = L.mengeJeKessel(c.hefeKg, c.kessel, 'kg', 2);
    let h = '<li>' + esc(t('hefe', { kg: hm.haupt })) + (hm.gesamt ? ' <span class="klein">(' + esc(hm.gesamt) + ')</span>' : '');
    if (L.istZahl(anp.hefeKg)) h += abw(t('heute_statt', { statt: L.istZahl(c.hefeRezeptKg) ? fmtHefe(c.hefeRezeptKg + (c.hefeDeltaKg || 0)) : '–' }));
    else if (r.hefeT.leer) h += ' <span class="klein">' + esc(t('hefe_ohne_tabelle')) + '</span>';
    else if (L.istZahl(c.hefeDeltaKg) && c.hefeDeltaKg !== 0) h += ' <span class="klein">' + esc(t('hefe_tabelle', { delta: (c.hefeDeltaKg > 0 ? '+' : '') + fmt(c.hefeDeltaKg * 1000, 0) + ' g' })) + '</span>';
    zeilen.push(h + '</li>');
  } else if (!L.istZahl(x.hefeJeKg)) zeilen.push('<li class="klein">' + esc(t('hefe_kein_rezeptwert')) + '</li>');
  /* 4. Einwaage (ausklappbar), 5. Kesselrest */
  const einwaageAbw = r.posten.some(function (p) { return p.abw; });
  zeilen.push('<li><details' + (einwaageAbw || c.status === 'einwaageFehlt' ? ' open' : '') + '><summary>' + esc(t('einwaage_titel')) + (einwaageAbw ? abw(t('heute_angepasst')) : '') + '</summary><ul class="liste">' +
    r.posten.map(function (p) {
      return '<li><span>' + esc(p.name) + '</span><span>' + (L.istZahl(p.einwaageG) ? fmtG(p.einwaageG) : '<span class="badge rot">' + esc(t('einwaage_fehlt_kurz')) + '</span>') +
        (p.abw ? abw(t('heute_statt', { statt: fmtG(p.stammG) })) : '') + '</span></li>';
    }).join('') + '</ul></details></li>');
  const kr = r.kesselrestNacht !== null ? r.kesselrestNacht : r.kesselrestStamm;
  zeilen.push('<li>' + esc(t('kesselrest', { kg: fmtKg(kr) })) + (r.kesselrestNacht !== null ? abw(t('heute_statt', { statt: fmtKg(r.kesselrestStamm) })) : '') + '</li>');
  /* 6. Ergebnis */
  let erg;
  if (c.status === 'leer') erg = t('noch_keine_zahlen');
  else if (c.status === 'null') erg = t('status_null');
  else if (c.status === 'einwaageFehlt') erg = t('einwaage_fehlt_lang', { liste: c.fehlendeEinwaage.map(produktName).join(', ') });
  else {
    erg = t(r.vorrat ? 'rechnung_vorrat' : 'rechnung', { summe: fmtKg(c.summeKg), rest: fmtKg(kr) }) + (x.ohneSchuettwasser || !c.r ? '' : ', ' + t('wasser_weniger', { l: fmtL(c.r) })) + ' → ' +
      (c.kessel > 1 ? t('in_winback_kessel', { gesamt: fmtKg(c.T), n: c.kessel, je: fmtKg(c.jeKesselKg) }) : t('in_winback', { kg: fmtKg(c.T) }));
    if (c.status === 'teilweise') erg = t('noch_nicht_alle') + ' ' + erg;
  }
  zeilen.push('<li class="' + (mitKacheln ? 'rechenweg' : 'ergebnis') + (c.status === 'einwaageFehlt' ? ' rot' : '') + '">' + esc(erg) + '</li>');
  let kacheln = '';
  if (mitKacheln) {
    let wasser;
    if (x.ohneSchuettwasser) wasser = '<span class="k-wert klein-wert">' + esc(t('k_kein_schuettwasser')) + '</span>';
    else {
      const wm = L.mengeJeKessel(c.r || 0, c.r ? c.kessel : 1, 'L', 1);
      wasser = '<span class="k-wert">' + esc(wm.haupt) + '</span>' + (wm.gesamt ? '<span class="k-unter">' + esc(wm.gesamt) + '</span>' : '');
      if (L.istZahl(anp.wasserL)) wasser += '<span class="k-unter">' + abw(t('heute_statt', { statt: L.istZahl(c.rRegel) ? fmtL(c.rRegel) : '0 L' })) + '</span>';
      else if (!L.istZahl(r.tw.wasserLiterJeKg)) wasser += '<span class="k-unter">' + esc(t('keine_wasserregel')) + '</span>';
    }
    const km = L.mengeJeKessel(c.T, c.kessel, 'kg', 1);
    kacheln = '<div class="ergebnis-kacheln' + (c.status === 'teilweise' ? ' vorlaeufig' : '') + '">' +
      '<div class="kachel"><span class="k-label">' + esc(t('k_wasser')) + '</span>' + wasser + '</div>' +
      '<div class="kachel winback"><span class="k-label">' + esc(t(c.status === 'teilweise' ? 'k_winback_vorlaeufig' : (c.kessel > 1 ? 'k_winback_je' : 'k_winback'))) + '</span><span class="k-wert">' + esc(km.haupt) + '</span>' +
        '<span class="k-unter">' + esc(km.gesamt ? km.gesamt + ' · ' + t('k_kg_nicht_stueck') : t('k_kg_nicht_stueck')) + '</span></div></div>';
  }
  let html = kacheln + '<ul class="info-liste">' + zeilen.join('') + '</ul>' + (mitKacheln ? '' : '<div class="hinweis">' + esc(t('winback_hinweis')) + '</div>');
  if (x.zutaten && x.zutaten.length) html += '<div class="unterkopf">' + esc(t('teig_zutaten')) + '</div>' + zutatenListeHTML(x.zutaten);
  if (x.vorstufe) html += '<div class="unterkopf">' + esc(t('teig_vorstufe', { name: x.vorstufe })) + '</div><div class="klein">' + esc(t('vorstufe_gestern')) + '</div>';
  return html;
}
/* Reiter „Anpassen“: oben „nur heute Nacht“ für jeden, darunter die dauerhafte
   Regel nur mit Teig-Haken (ohne Haken ausgeblendet, nicht gesperrt). */
function anpassenHTML(r) {
  const x = r.teig, anp = r.anp, c = r.calc;
  const feld = function (label, anpFeld, wertJetzt, einheit, extra) {
    const gesetzt = L.istZahl(anpFeld === 'kesselrest' ? r.kesselrestNacht : (anpFeld.indexOf('einwaage:') === 0 ? (anp.einwaage || {})[anpFeld.slice(9)] : anp[anpFeld]));
    return '<div class="anp-zeile"><label class="bos-label">' + esc(label) + '</label><div class="feld-zeile">' +
      '<input class="bos-input" data-anp="' + esc(anpFeld) + '" inputmode="decimal" placeholder="' + esc(zahlText(wertJetzt)) + '" value="' + (gesetzt ? esc(zahlText(anpFeld === 'kesselrest' ? r.kesselrestNacht : (anpFeld.indexOf('einwaage:') === 0 ? anp.einwaage[anpFeld.slice(9)] : anp[anpFeld]))) : '') + '"> ' + esc(einheit) +
      (gesetzt ? ' <button type="button" class="bos-btn" data-aktion="anp-zurueck" data-anp="' + esc(anpFeld) + '">' + esc(t('normalwert')) + '</button>' : '') +

async function speichereRegel() {
  const k = S.karte;
  if (!k || !k.entwurf) return;
  const teig = tm()[k.liste[k.index]];
  const r = teigRechnung(teig, 'heute');
  const e = k.entwurf, tw = r.tw, meldung = document.getElementById('karteMeldung');
  meldung.textContent = '';
  if (!S.haken.teige) { meldung.textContent = t('err_perm'); return; }
  if (!online()) { meldung.textContent = t('offline_pflege'); return; }
  if (S.verbindung.ausstehend.teigwerte) { meldung.textContent = t('warte_uebertragung'); return; }
  const daten = {};
  const einwaage = {};
  let fehler = '';
  Object.keys(e.einwaage).forEach(function (lk) {
    const g = e.einwaage[lk];
    if (g === null || g === undefined || g === '') return;
    if (!(L.istZahl(g) && g > 0)) fehler = t('v_einwaage', { name: produktName(lk) }); else einwaage[lk] = g;
  });
  if (Object.keys(einwaage).length) daten.einwaage = einwaage;
  const tabelle = [];
  e.tabelle.forEach(function (z) {
    if (!L.istZahl(z.aussenC)) { if (L.istZahl(z.wasserC) || L.istZahl(z.hefeDeltaG)) fehler = t('v_tabelle'); return; }
    const zeile = { aussenC: z.aussenC };
    if (L.istZahl(z.wasserC)) zeile.wasserC = z.wasserC;
    if (L.istZahl(z.hefeDeltaG)) zeile.hefeDeltaG = z.hefeDeltaG;
    tabelle.push(zeile);
  });
  if (tabelle.length) daten.tabelle = tabelle.sort(function (a, b) { return a.aussenC - b.aussenC; });
  if (L.istZahl(e.kesselMaxKg)) { if (e.kesselMaxKg > 0) daten.kesselMaxKg = e.kesselMaxKg; else fehler = t('v_kessel'); }
  if (L.istZahl(e.kesselrestKg)) { if (e.kesselrestKg >= 0) daten.kesselrestKg = e.kesselrestKg; else fehler = t('v_kesselrest'); }
  /* Wasserregel: nur neu umrechnen, wenn sie geändert wurde — sonst bliebe
     sie nicht exakt dieselbe, weil sich die Brotmischung der Nacht ändert. */
  ['wasserLiterJeKg', 'wasserRefBrote', 'wasserRefKg', 'wasserRefLiter'].forEach(function (f) { if (L.istZahl(tw[f])) daten[f] = tw[f]; });
  if (e.wasserGeaendert && !teig.ohneSchuettwasser) {
    if (!(L.istZahl(e.refBrote) && e.refBrote > 0) || !(L.istZahl(e.refLiter) && e.refLiter >= 0)) fehler = t('v_wasserregel');
    else {
      let refKg = null;
      if (r.calc.anzahl > 0 && L.istZahl(r.calc.D) && r.calc.D > 0) refKg = r.calc.D * e.refBrote / r.calc.anzahl;
      else {
        const erste = r.produkte.map(function (p) { return einwaage[p.legacyKey]; }).filter(L.istZahl)[0];
        if (L.istZahl(erste)) refKg = e.refBrote * erste / 1000;
      }
      if (!L.istZahl(refKg)) fehler = t('v_wasserregel_einwaage');
      else {
        daten.wasserLiterJeKg = L.wasserRegelLiterJeKg(e.refLiter, refKg);
        daten.wasserRefBrote = e.refBrote; daten.wasserRefKg = refKg; daten.wasserRefLiter = e.refLiter;
      }
    }
  }
  if (fehler) { meldung.textContent = fehler; return; }
  const vorher = S.teigwerte[teig.id] || null;
  try {
    await schreibe(COL.teigwerte, teig.id, daten, vorher ? 'aendern' : 'anlegen', vorher);
    k.entwurf = null;
    toast(t('gespeichert'));
    renderKarte(true);
  } catch (err) {
    if (err && err.code === 'permission-denied') {
      const konflikt = await konfliktText(COL.teigwerte, teig.id, vorher);
      if (konflikt) { k.entwurf = null; renderKarte(true); document.getElementById('karteMeldung').textContent = konflikt; return; }
    }
    meldung.textContent = fehlerText(t('err_speichern'), err);
    zeigeFehler(t('err_speichern'), err);
  }
}

/* Eingaben in der Karte: Zahl → sofort in die Nacht schreiben. */
/* Teig und Rolle kommen aus dem Feld selbst: Enter springt schon zum nächsten
   Teig, bevor ein spätes „change“ des alten Feldes eintrifft. data-geschrieben
   verhindert, dass derselbe Wert zweimal geschrieben wird (Enter + change). */
function commitZahl(inp) {
  const rolle = inp.getAttribute('data-rolle');
  const teig = tm()[inp.getAttribute('data-teig')];
  if (!teig) return;
  if (inp.value.trim() === (inp.getAttribute('data-geschrieben') || '')) return;
  const lk = inp.getAttribute('data-lk');
  const n = parseZahl(inp.value);
  if (n !== null && (!(n >= 0) || Math.floor(n) !== n)) { toast(t('v_anzahl')); inp.value = inp.getAttribute('data-geschrieben') || ''; return; }
  inp.setAttribute('data-geschrieben', inp.value.trim());
  if (rolle === 'vorrat') {
    /* Teiglinge: gespeichert wird immer in Stück (Bleche/Dielen × stueckProBlech). */
    const stk = n === null ? null : L.teiglingeStueck(n, inp.getAttribute('data-einheit'), Number(inp.getAttribute('data-spb')));
    const dv = { vorrat: {}, rezeptStand: {} };
    dv.vorrat[lk] = stk === null ? FV().delete() : stk;
    dv.rezeptStand[teig.id] = teig.sicherungId || '';
    schreibeNacht(heuteStr(), dv);
    return;
  }
  const feld = rolle === 'prognose' ? 'prognose' : 'brote';
  const tag = rolle === 'prognose' ? morgenStr() : heuteStr();
  const daten = {}; daten[feld] = {}; daten[feld][lk] = n === null ? FV().delete() : n;
  if (rolle === 'heute') { daten.rezeptStand = {}; daten.rezeptStand[teig.id] = teig.sicherungId || ''; }
  schreibeNacht(tag, daten);
}
function commitAnpassung(inp) {
  const k = S.karte;
  if (!k) return;
  const teig = tm()[k.liste[k.index]];
  const feld = inp.getAttribute('data-anp');
  const n = parseZahl(inp.value);
  if (n !== null && !(n >= 0)) { toast(t('v_zahl')); return; }
  if (feld === 'kesselrest') {
    const d = { kesselrest: {} }; d.kesselrest[teig.id] = n === null ? FV().delete() : n;
    schreibeNacht(heuteStr(), d);
  } else if (feld.indexOf('einwaage:') === 0) schreibeAnpassung(teig.id, ['einwaage', feld.slice(9)], n);
  else schreibeAnpassung(teig.id, [feld], n);
}
function entwurfEingabe(inp) {
  const k = S.karte;
  if (!k || !k.entwurf) return;
  const e = k.entwurf, feld = inp.getAttribute('data-entwurf');
  const n = parseZahl(inp.value);
  const wert = (n === null || isNaN(n)) ? null : n;
  if (feld === 'tabelle') e.tabelle[Number(inp.getAttribute('data-zeile'))][inp.getAttribute('data-spalte')] = wert;
  else if (feld === 'einwaage') e.einwaage[inp.getAttribute('data-lk')] = wert;
  else { e[feld] = wert; if (feld === 'refBrote' || feld === 'refLiter') e.wasserGeaendert = true; }
}

/* ---------- Schreiben: Sicherung + Dokument in EINEM Batch ----------
   Die Regel (RK §10) verlangt: sicherungId zeigt auf eine Sicherung, die
   in genau diesem Batch neu entsteht und auf genau dieses Dokument zeigt.
   Eine Mechanik für jeden Schreibweg dieser Seite (Pflege, Archiv,
   Startdaten) — ein künftiger Aufrufer (Produkt-Karte) muss denselben
   Weg gehen, sonst lehnt die Regel ab. */
function nurErlaubteFelder(col, daten) {
  const d = {};
  FELDER[col].forEach(function (k) { if (daten[k] !== undefined) d[k] = daten[k]; });
  return d;
}
function ohneId(dok) { if (!dok) return null; const k = Object.assign({}, dok); delete k.id; return k; }
function mitZeitlimit(promise) {
  let timer;
  const zeit = new Promise(function (_, reject) {
    timer = setTimeout(function () { const e = new Error('Zeitlimit ' + (SCHREIB_ZEITLIMIT_MS / 1000) + ' s überschritten'); e.code = 'zeitlimit'; reject(e); }, SCHREIB_ZEITLIMIT_MS);
  });
  return Promise.race([promise, zeit]).finally(function () { clearTimeout(timer); });
}
/* Vorab (29.09.2026): Haken passend zur Collection, Verbindung da, nichts
   mehr ausstehend. Sonst eine verständliche Meldung statt einer späten
   Ablehnung durch die Regel oder eines Schreibvorgangs, der offline hängt. */
function schreibSperre(col, ohneWarten) {
  const haken = HAKEN_FUER[col];
  if (!haken || !S.haken[haken]) return { code: 'haken-fehlt', text: t('err_haken_fehlt') };
  if (!online()) return { code: 'offline', text: t('offline_pflege') };
  const name = Object.keys(COL).filter(function (k) { return COL[k] === col; })[0];
  if (!ohneWarten && name && S.verbindung.ausstehend[name]) return { code: 'ausstehend', text: t('warte_uebertragung') };
  return null;
}
/* ohneWarten: nur das Einlesen, das Eintrag für Eintrag schreibt und jeden
   Schritt selbst abwartet — dort wäre „wird noch übertragen“ ein Fehlalarm
   (die Bestätigung des vorigen Eintrags kann kurz nach dem commit kommen). */
async function schreibe(col, id, daten, aktion, vorher, ohneWarten) {
  const sperre = schreibSperre(col, ohneWarten);
  if (sperre) { const e = new Error(sperre.text); e.code = sperre.code; throw e; }
  const db = window.db;
  const ts = firebase.firestore.FieldValue.serverTimestamp();
  const sichRef = db.collection(COL.sicherungen).doc();
  const zielRef = id ? db.collection(col).doc(id) : db.collection(col).doc();
  const batch = db.batch();
  batch.set(sichRef, { collection: col, dokId: zielRef.id, aktion: aktion, vorher: ohneId(vorher), konto: S.kennung, ts: ts });
  batch.set(zielRef, Object.assign(nurErlaubteFelder(col, daten), { sicherungId: sichRef.id, geaendertVon: S.kennung, geaendertAm: ts }));
  await mitZeitlimit(batch.commit());
  return zielRef.id;
}
