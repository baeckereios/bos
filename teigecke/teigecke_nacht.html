/* ---------- Konflikt statt Rätsel (29.09.2026) ----------
   Seit die Regel „vorher“ gegen den Serverstand prüft, heißt
   permission-denied entweder „Haken fehlt“ oder „jemand war schneller“.
   Frisch vom Server lesen und unterscheiden. Liefert den Meldungstext
   oder null (dann gilt die normale Berechtigungsmeldung). */
async function konfliktText(col, id, vorher) {
  if (!id || !vorher) return null;
  let frisch = null;
  try {
    const snap = await window.db.collection(col).doc(id).get({ source: 'server' });
    frisch = snap.exists ? snap.data() : null;
  } catch (err) {
    zeigeFehler(t('err_gegenlesen'), err);
    return null;
  }
  if (!L.istVeraltet(vorher, frisch)) return null;
  uebernimmFrisch(col, id, frisch);
  return t('konflikt', { wer: (frisch && frisch.geaendertVon) || '?' });
}
/* Frischen Serverstand sofort in S übernehmen — das Formular öffnet damit,
   auch wenn der Live-Abruf (onSnapshot) noch nicht nachgezogen hat. */
function uebernimmFrisch(col, id, frisch) {
  const dok = frisch ? Object.assign({ id: id }, frisch) : null;
  if (col === COL.einstellungen) { S.einstellungen = dok || {}; return; }
  if (col === COL.teigwerte) { if (dok) S.teigwerte[id] = dok; else delete S.teigwerte[id]; return; }
  const name = Object.keys(COL).filter(function (k) { return COL[k] === col; })[0];
  if (!name || !Array.isArray(S[name])) return;
  S[name] = S[name].filter(function (x) { return x.id !== id; }).concat(dok ? [dok] : []);
}
/* Die Daten kommen live (onSnapshot); „neu laden“ heißt hier nur neu zeichnen. */
async function neuLaden() { render(); }
function oeffneNachCol(col, id) {
  if (col === COL.einstellungen) oeffneFolge();
}

async function fuehreSchreibenAus(col, id, daten, aktion, vorher, erfolgText) {
  const knoepfe = document.querySelectorAll('#editKnoepfe button');
  knoepfe.forEach(function (b) { b.disabled = true; });
  document.getElementById('editInfo').textContent = '…';
  try {
    await schreibe(col, id, daten, aktion, vorher);
    schliesseEdit();
    toast(erfolgText);
    await neuLaden();
  } catch (err) {
    document.getElementById('editInfo').textContent = '';
    if (err && err.code === 'permission-denied') {
      const konflikt = await konfliktText(col, id, vorher);
      if (konflikt) {
        console.error('[Teigecke] Speichern abgelehnt: veralteter Stand', err);
        await neuLaden();
        oeffneNachCol(col, id);      // Formular mit dem frischen Stand
        editFehler(konflikt);
        return;
      }
    }
    editFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(t('err_speichern'), err);
    knoepfe.forEach(function (b) { b.disabled = false; });
  }
}
/* ---------- Abwiegefolge je Wochentag (Teig-Haken) ---------- */
let folgeZustand = null;   // { tag, listen: { '1': [...] } }
function teigIdsAm(wd) { return L.teigeDesTages(S.teige, S.produkte, wd, null).map(function (x) { return x.id; }); }
function folgeListe(wd) {
  const key = String(wd);
  if (!folgeZustand.listen[key]) {
    const ids = teigIdsAm(wd);
    folgeZustand.listen[key] = L.sortiereNachFolge(ids.map(function (id) { return tm()[id]; }), folgeFuer(wd)).map(function (x) { return x.id; });
  }
  return folgeZustand.listen[key];
}
function oeffneFolge() {
  folgeZustand = { tag: S.backtag.getDay(), listen: {} };
  renderFolge();
}
function renderFolge() {
  const wd = folgeZustand.tag;
  const liste = folgeListe(wd);
  const tage = '<div class="chips">' + WT_REIHE.map(function (d) {
    return '<button type="button" class="chip" data-aktion="folge-tag" data-tag="' + d + '" aria-pressed="' + (d === wd) + '">' + WT_KURZ[d] + '</button>';
  }).join('') + '</div>';
  const zeilen = liste.length ? liste.map(function (id, i) {
    const x = tm()[id];
    return '<div class="folge-zeile"><span class="fz-nr">' + (i + 1) + '.</span><span class="fz-name">' + esc(x ? x.name : id) + '</span>' +
      '<button type="button" class="bos-btn" data-aktion="folge-hoch" data-index="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="' + esc(t('folge_hoch')) + '">▲</button>' +
      '<button type="button" class="bos-btn" data-aktion="folge-runter" data-index="' + i + '"' + (i === liste.length - 1 ? ' disabled' : '') + ' aria-label="' + esc(t('folge_runter')) + '">▼</button></div>';
  }).join('') : '<p class="status">' + esc(t('keine_teige_tag')) + '</p>';
  const quelle = '<div class="feld-zeile"><select class="bos-input" id="folgeQuelle">' + WT_REIHE.filter(function (d) { return d !== wd; }).map(function (d) {
    return '<option value="' + d + '">' + WOCHENTAGE[d] + '</option>';
  }).join('') + '</select><button type="button" class="bos-btn" data-aktion="folge-uebernehmen">' + esc(t('folge_uebernehmen')) + '</button></div>';
  oeffneEdit(t('folge_titel'), tage + '<div class="klein">' + esc(t('folge_hilfe', { tag: WOCHENTAGE[wd] })) + '</div>' + zeilen +
    '<div class="unterkopf">' + esc(t('folge_von_tag')) + '</div>' + quelle,
    [{ aktion: 'folge-speichern', text: t('speichern'), klasse: 'bos-btn--amber' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
}
async function speichereFolge() {
  if (!S.haken.teige) { editFehler(t('err_perm')); return; }
  const vorher = (S.einstellungen && S.einstellungen.id) ? S.einstellungen : null;
  const folge = Object.assign({}, (vorher && vorher.abwiegefolge) || {});
  Object.keys(folgeZustand.listen).forEach(function (k) { folge[k] = folgeZustand.listen[k].slice(); });
  const daten = Object.assign({}, vorher || {}, { abwiegefolge: folge });
  await fuehreSchreibenAus(COL.einstellungen, 'allgemein', daten, vorher ? 'aendern' : 'anlegen', vorher, t('gespeichert'));
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-aktion],[data-tab]');
  if (!el || el.disabled) return;
  if (el.hasAttribute('data-tab') && !el.hasAttribute('data-aktion')) { S.tab = el.getAttribute('data-tab'); render(); return; }
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id'), rolle = el.getAttribute('data-rolle');
  const datum = rolle === 'morgen' ? S.backtagMorgen : S.backtag;
  switch (a) {
    /* Einsammeln (wie Stufe 1) */
    case 'teig-waehlen': {
      const ids = auswahl(datum).ids.slice();
      const i = ids.indexOf(id);
      if (i === -1) ids.push(id); else ids.splice(i, 1);
      setzeLokalTag(datum, { auswahl: ids });
      render(); break;
    }
    case 'auswahl-zurueck': setzeLokalTag(datum, { auswahl: null }); render(); break;
    case 'abhaken': {
      const feld = 'haken_' + rolle;
      const h = Object.assign({}, lokalTag(datum)[feld] || {});
      if (h[id]) delete h[id]; else h[id] = true;
      const teil = {}; teil[feld] = h;
      setzeLokalTag(datum, teil);
      el.setAttribute('aria-pressed', h[id] ? 'true' : 'false');
      break;
    }
    case 'nicht-gefunden': toast(t('nicht_gefunden_info')); break;
    /* Teige, Karte */
    case 'karte-oeffnen': oeffneKarte(rolle, id); break;
    case 'karte-zu': schliesseKarte(); break;
    case 'karte-zurueck': karteNav(-1); fokusErstesFeld(); break;
    case 'karte-vor': karteNav(1); fokusErstesFeld(); break;
    case 'karte-weiter': if (karteNav(1)) fokusErstesFeld(); else { schliesseKarte(); toast(t('letzter_teig')); } break;
    case 'karte-reiter': if (S.karte) { S.karte.reiter = el.getAttribute('data-reiter'); renderKarte(true); } break;
    case 'anp-zurueck': {
      const k = S.karte; if (!k) break;
      const teig = tm()[k.liste[k.index]], feld = el.getAttribute('data-anp');
      if (feld === 'kesselrest') { const d = { kesselrest: {} }; d.kesselrest[teig.id] = FV().delete(); schreibeNacht(heuteStr(), d); }
      else if (feld.indexOf('einwaage:') === 0) schreibeAnpassung(teig.id, ['einwaage', feld.slice(9)], null);
      else schreibeAnpassung(teig.id, [feld], null);
      break;
    }
    case 'tab-plus': if (S.karte && S.karte.entwurf) { S.karte.entwurf.tabelle.push({ aussenC: null, wasserC: null, hefeDeltaG: null }); renderKarte(true); } break;
    case 'tab-minus': if (S.karte && S.karte.entwurf) { S.karte.entwurf.tabelle.splice(Number(el.getAttribute('data-zeile')), 1); renderKarte(true); } break;
    case 'regel-speichern': speichereRegel(); break;
    case 'temp-modus': {
      const modus = el.getAttribute('data-modus'), tmp = temperaturHeute();
      if (modus === tmp.modus) break;
      const jetzt = new Date();
      schreibeNacht(heuteStr(), { temperatur: { modus: modus === 'manuell' ? 'manuell' : 'auto', wertC: modus === 'manuell' ? tmp.wertC : null,
        quelle: modus === 'manuell' ? 'manuell' : 'automatisch', zeit: String(jetzt.getHours()).padStart(2, '0') + ':' + String(jetzt.getMinutes()).padStart(2, '0') } })
        .then(function () { if (modus === 'auto') holeWetter(); });
      break;
    }
    case 'sauer-bestaetigen': {
      const n = parseZahl(wert('sauerAngesetzt'));
      if (!L.istZahl(n) || n < 0) { toast(t('v_zahl')); break; }
      const st = sauerteig();
      schreibeNacht(heuteStr(), { sauerAnsatz: { kg: n, anstellgutAnteil: st ? st.anstellgutAnteil || null : null } });
      toast(t('gespeichert'));
      break;
    }
    /* Pflege */
    case 'folge-oeffnen': oeffneFolge(); break;
    case 'folge-tag': folgeZustand.tag = Number(el.getAttribute('data-tag')); renderFolge(); break;
    case 'folge-hoch': case 'folge-runter': {
      const key = String(folgeZustand.tag);
      folgeZustand.listen[key] = L.verschiebe(folgeListe(folgeZustand.tag), Number(el.getAttribute('data-index')), a === 'folge-hoch' ? -1 : 1);
      renderFolge(); break;
    }
    case 'folge-uebernehmen': {
      const quelle = Number(wert('folgeQuelle'));
      folgeZustand.listen[String(folgeZustand.tag)] = L.folgeUebernehmen(folgeListe(quelle), teigIdsAm(folgeZustand.tag));
      renderFolge(); break;
    }
    case 'folge-speichern': speichereFolge(); break;
    case 'vorrat-haken': vorratUmschalten(id, false); break;
    case 'vorrat-entfernen': if (editZustand && editZustand.typ === 'vorratFrage') { const vid = editZustand.id; schliesseEdit(); vorratUmschalten(vid, true); } break;
    case 'vorrat-einheit': {
      const offen = document.activeElement && document.activeElement.classList.contains('zahl-eingabe') ? document.activeElement : null;
      if (offen) commitZahl(offen);
      S.vorratEinheit[el.getAttribute('data-lk')] = el.getAttribute('data-einheit'); renderKarte(true); break;
    }
    case 'vorstufe-wahl': { const dw = { vorstufeWahl: {} }; dw.vorstufeWahl[id] = Number(el.getAttribute('data-n')); schreibeNacht(morgenStr(), dw); break; }
    case 'abbrechen': schliesseEdit(); break;
  }
});
document.addEventListener('change', function (e) {
  const el = e.target;
  if (el.classList && el.classList.contains('zahl-eingabe')) commitZahl(el);
  else if (el.hasAttribute && el.hasAttribute('data-anp')) commitAnpassung(el);
  else if (el.id === 'tempManuell') {
    const n = parseZahl(el.value);
    if (n !== null && !L.istZahl(n)) { toast(t('v_zahl')); return; }
    const jetzt = new Date();
    schreibeNacht(heuteStr(), { temperatur: { modus: 'manuell', wertC: n, quelle: 'manuell', zeit: String(jetzt.getHours()).padStart(2, '0') + ':' + String(jetzt.getMinutes()).padStart(2, '0') } });
  }
});
document.addEventListener('toggle', function (e) {
  const k = e.target && e.target.getAttribute && e.target.getAttribute('data-merken');
  if (k) S.aufgeklappt[k] = e.target.open;
}, true);
document.addEventListener('input', function (e) {
  if (e.target.hasAttribute && e.target.hasAttribute('data-entwurf')) entwurfEingabe(e.target);
});
/* Eingabetaste in der Karte: nächstes Zahlenfeld, nach dem letzten der nächste Teig. */
document.getElementById('karteSheet').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' || !e.target.classList.contains('zahl-eingabe')) return;
  e.preventDefault();
  const felder = Array.prototype.slice.call(document.querySelectorAll('#karteBody .zahl-eingabe'));
  const i = felder.indexOf(e.target);
  commitZahl(e.target);
  if (i >= 0 && i < felder.length - 1) { felder[i + 1].focus(); felder[i + 1].select(); }
  else if (karteNav(1)) fokusErstesFeld();
  else { e.target.blur(); toast(t('letzter_teig')); }
});
document.getElementById('pflegeBtn').addEventListener('click', function () {
  if (!S.haken.teige) return;
  S.pflegeModus = !S.pflegeModus;
  render();
});
document.getElementById('editSheet').addEventListener('click', function (e) { if (e.target === this) schliesseEdit(); });
document.getElementById('karteSheet').addEventListener('click', function (e) { if (e.target === this) schliesseKarte(); });

/* ---------- Hilfe (Checkliste §7; kanonische Fassung in der Modul-Doku) ---------- */
const helpData = {
  title: 'Teigecke Nacht — was ist das hier?',
  sections: [
    { heading: 'Wofür ist diese Seite?', text: 'In die Teigecke gehen, Brotzahlen eingeben, loslegen. Die Seite sagt dir je Teig, welche Menge du in WinBack eingibst, wie viel Wasser du weglässt, welche Wassertemperatur und wie viel Hefe passen — und welche Zutaten du brauchst und in welchem Wagen sie stehen. Die einzelnen Mengen zeigt dir weiter WinBack beim Abwiegen. BOS ist der Vermittler, nicht der Rezeptcomputer.' },
    { heading: 'Welcher Tag wird angezeigt?', text: 'Oben steht der Backtag: der Tag, FÜR den gebacken wird. In der Nacht zum Mittwoch ist das Mittwoch. Ab 12 Uhr mittags springt die Seite auf den nächsten Backtag um. Alles, was du „nur für heute Nacht“ geändert hast, ist dann wieder weg, und es gelten die normalen Werte.' },
    { heading: 'Reiter „Teige“: die Liste', text: 'Du siehst die Teige des Backtags in der Reihenfolge, in der sie abgewogen werden. Unter dem Namen stehen die Brote des Teigs, jeweils mit ihrer Einwaage; fehlt eine, steht dort rot „Einwaage fehlt“. Rechts stehen die Anzahl und die Zahl für WinBack. Passt der Teig nicht in einen Kessel, steht dort die Menge je Kessel, zum Beispiel „2 × 106,6 kg“: zweimal 106,6 kg eingeben, nicht die Gesamtmenge. Die steht nur klein darunter („213,2 kg gesamt“). Tippst du einen Teig an, öffnet sich seine Karte. Ein grüner Haken heißt: alle Zahlen stehen. Ein Strich heißt: heute nicht (alle Brote 0) — damit sieht man den Unterschied zu „vergessen“. Ein Warnzeichen heißt: bei einem Brot fehlt die Einwaage, dann rechnet BOS bewusst keine Menge.' },
    { heading: 'Die Karte eines Teigs', text: 'Oben tippst du die Brotzahlen ein, eine Zahl je Brot. Mit der Eingabetaste oder „Weiter“ springst du ins nächste Feld und nach dem letzten zum nächsten Teig — wie eine Diashow. Die Pfeile ‹ › blättern ebenfalls; das ✕ oder ein Tipp neben das Fenster bringt dich zurück zur Liste. Unter den Zahlen stehen zwei große Kästen: links, wie viel Schüttwasser du weglässt, rechts, wie viel kg du in WinBack eingibst. Ist es mehr als in einen Kessel passt, teilt BOS gleichmäßig auf: Dann zeigen beide Kästen und die Hefe die Menge je Kessel („2 × …“), die Gesamtmenge steht nur klein darunter. Darunter stehen Wassertemperatur, Hefe, Einwaage und Kesselrest und klein der Rechenweg. Darunter stehen die Zutaten des Teigs mit ihrem Wagen. Tippt ein Kollege auf einem anderen Gerät, siehst du seine Zahlen sofort.' },
    { heading: 'Warum mehr kg in WinBack als Teig?', text: 'Wer Wasser weglässt, bekommt sonst weniger Teig, und es reicht nicht für alle Brote. Deshalb rechnet BOS die Liter, die du weglässt, auf die Menge drauf: „2 L weniger Wasser → 122 kg statt 120 kg eingeben“. WinBack verteilt dann alle Zutaten auf diese Menge, du lässt die Liter weg, und übrig bleibt genau der Teig, den du brauchst. Auch die Hefe rechnet BOS auf diese Menge, damit sie zu WinBack passt. Wichtig: In WinBack immer die kg-Menge eingeben, nicht Stück.' },
    { heading: 'Reiter „Anpassen“: nur für heute Nacht', text: 'Merkst du am Kessel, dass heute etwas anders ist, darfst du für diese Nacht alles anpassen: Wasserabzug, Wassertemperatur, Hefe, Kesselrest, Einwaage und die Außentemperatur. Das gilt nur bis 12 Uhr mittags und ändert keine Regel. Angepasste Werte sind in der Karte markiert („heute, sonst …“). Mit „↺ Normalwert“ nimmst du eine Anpassung zurück.' },
    { heading: 'Vorrat heute (Baguette, L\'amourette, Zwiebelstangen)', text: 'Diese Teige werden auf Vorrat für den Froster gemacht, nicht nach Backzettel. Sie stehen deshalb nicht von selbst in der Liste. Oben unter „Vorrat heute“ hakst du an, was du heute machst; dann erscheint der Teig in der Liste und in der Diashow, auf allen Geräten. Seine Karte fragt nicht nach der Backzettel-Zahl, sondern nach den Teiglingen, die heute produziert werden: in Blechen bzw. Dielen oder in Stück (Umschalter am Feld). BOS rechnet in Stück um und zeigt beides („4 Bleche = 24 Stück“). Am nächsten Backtag ist nichts mehr angehakt. Nimmst du einen Haken weg, obwohl schon Teiglinge drinstehen, fragt BOS vorher nach und löscht sie dann.' },
    { heading: 'Die Außentemperatur', text: 'Automatisch holt BOS die aktuelle Temperatur für Havelse vom Wetterdienst. Mit dem Umschalter „von Hand“ trägst du sie selbst ein. Jede Nacht steht der Umschalter wieder auf automatisch. Ist der Wetterdienst nicht erreichbar, steht das oben in Rot — dann bitte von Hand eintragen. Aus der Außentemperatur ergeben sich Wassertemperatur und Hefe, sobald für den Teig eine Tabelle gepflegt ist. Solange es keine gibt, steht dort „noch keine Tabelle“ und die Hefe laut Rezept.' },
    { heading: 'Die Regel (dauerhaft)', text: 'Wer den Haken „Teige pflegen“ hat, sieht im Reiter „Anpassen“ unten die dauerhafte Regel: Wasserregel, Tabelle, Einwaagen, Kessel. Die Wasserregel pflegst du an der echten Menge: Die Karte zeigt zum Beispiel „83 Korbbrote: bisher 1,4 L weniger“. War der Teig zu weich, trägst du ein „bei 83 Broten 2 L“ — BOS rechnet das selbst auf jede andere Menge um. Wer den Haken nicht hat, sieht diesen Teil nicht; für die Nacht anpassen darf trotzdem jeder.' },
    { heading: 'Reiter „Vorbereitungen“', text: 'Hier geht es um den nächsten Backtag. Oben steht der Sauer: wie viel du ansetzt, in wie vielen Chargen, und wie viel Anstellgut du vom heutigen Sauer zurückhältst. BOS rundet auf 30-kg-Schritte und nimmt einen 15-kg-Schritt, wenn der 30er deutlich zu viel wäre. Darunter tippst du die Prognose vom Büro-Zettel ein — mit derselben Liste und denselben Karten wie bei den Teigen. Daraus rechnet BOS den Sauer und die Vorstufen (Quellstück und Co.) für morgen. Mit „So angesetzt“ hältst du fest, was du wirklich angesetzt hast; sonst gilt der Vorschlag. Bei Vorstufen in festen Schritten ist auch die kleinere Stufe bewusst wählbar (Erfahrung zählt); reicht sie rechnerisch nicht für die Prognose, wird sie rot gezeigt („reicht nur für … von … Broten“).' },
    { heading: 'Sauer unbekannt und Vorstufen in Schritten', text: 'Steht bei einem Teig noch nicht im Rezept, ob er Sauer braucht (z. B. die neuen Teige ohne Rezept), zeigt der Sauer-Block ihn rot als „Sauer unbekannt“ und rechnet ihn NICHT mit. Wer den Rezept-Haken hat, beantwortet auf der Seite „Teige & Rezepte“ die Frage „Sauerteig im Teig?“ mit ja oder nein. Vorstufen, die in festen Portionen angesetzt werden (z. B. 3 kg Schrot + 9 L Wasser), zeigen statt der genauen kg zwei Möglichkeiten zur Wahl, etwa „5 ×“ oder „6 ×“, jeweils mit „reicht für … Brote“. Vorgewählt ist die größere. Darunter steht, was genau hineinkommt und wie es auf die Behälter verteilt wird. Die Wahl gilt für diese Nacht und wird mit der Prognose gespeichert.' },
    { heading: 'Reicht der Sauer von gestern?', text: 'Sobald alle Brotzahlen von heute stehen, prüft BOS: Bleibt nach den Teigen von heute genug Sauer als Anstellgut für den neuen Ansatz übrig? Wenn nicht, steht dort ein roter Hinweis mit den Zahlen, bevor der Sauer verteilt ist. Was dann zu tun ist, entscheidest du.' },
    { heading: 'Reiter „Einsammeln“', text: '„Einsammeln“ zeigt, was du für die Teige heute Nacht und für die Vorstufen von morgen einsammeln musst, sortiert nach Ort; vor jeder Gruppe steht die Kennung des Orts (z. B. B01), wie sie auf dem Schild steht. Abhaken gilt nur auf diesem Gerät. Orte, Zutaten und Schilder pflegst du nicht mehr hier, sondern auf der Seite „Orte“ (im Launcher unter „Teigecke“); mit dem Haken „Wagen & Zutaten“ steht unten ein Link dorthin.' },
    { heading: 'Wer darf was ändern?', text: 'Anzeigen und die Zahlen der Nacht eintragen darf jeder Teigmacher. Dauerhaft ändern hängt an drei Haken in der Kontenverwaltung: „Wagen & Zutaten pflegen“ (Orte, Zuhause der Zutaten, Gebinde, Schilder — auf der Seite „Orte“), „Teige pflegen“ (Wasserregel, Tabelle, Einwaagen, Kessel, Abwiegefolge) und „Rezepte pflegen“ (Teige anlegen und Rezepte eintippen — auf der Seite „Teige & Rezepte“, faktisch nur Ulf). Wer den Haken Teige hat, sieht hier oben „✎ Pflegen“ (Abwiegefolge); mit Haken Teige oder Rezepte steht unter der Liste der Link „Teige & Rezepte“. Die Datenbank prüft jeden Haken selbst.' },
    { heading: 'Wird etwas überschrieben?', text: 'Dauerhafte Änderungen bekommen vorher eine Sicherung der alten Fassung, in einem Schritt. Hat jemand anderes denselben Eintrag inzwischen geändert, lehnt die Datenbank ab, und die Seite sagt „Inzwischen von … geändert, neu geladen, bitte erneut speichern“. Die Brotzahlen der Nacht speichert BOS Feld für Feld: Tippen zwei Geräte verschiedene Brote ein, geht nichts verloren. Tippen beide dasselbe Brot, gilt die spätere Eingabe — beide sehen sie sofort.' },
    { heading: 'Ohne Netz', text: 'Fällt das Netz weg, bleibt alles auf dem Bildschirm, und oben steht „Ohne Verbindung — Stand von …“. Brotzahlen und Anpassungen kannst du weiter eintragen, sie werden übertragen, sobald das Netz wieder da ist. Dauerhafte Änderungen gehen ohne Netz nicht. Wichtig: Die Seite ohne Netz nicht neu laden — dann kann sie sich nicht öffnen.' },
    { heading: 'Teige anlegen und Rezepte', text: 'Neue Teige, Rezepte, „Startdaten einlesen“ und das Archiv der Teige liegen seit dem 08.10. auf der Seite „Teige & Rezepte“ (im Launcher unter „Teigecke“). Mit dem Haken Teige oder Rezepte steht unter der Liste der Teige ein Link dorthin, ebenso im roten Kasten, wenn ein Brot auf einen Teig zeigt, den es nicht gibt. Hier in der Nacht wird nur gerechnet; die Nacht merkt nicht, ob ein Teig aus den Startdaten oder aus der Strecke kommt.' },
    { heading: 'Neue Brote und Zuordnung zum Teig', text: 'Aus welchem Teig ein Brot gemacht wird, steht am Produkt (Feld „Aus Teig“). Gesetzt wird es auf der Seite „Teige & Rezepte“ beim Eintippen des Rezepts oder im Produkt-Editor. Neue Brote legst du im Produkt-Editor an. Die Nacht liest die Produkte aus der Datenbank; eine Änderung ist nach dem nächsten Laden der Seite da.' },
    { heading: 'Wenn etwas schiefgeht', text: 'Fehler erscheinen oben in einem roten Kasten, mit der echten Meldung des Systems. „Keine Berechtigung“ hat drei mögliche Gründe: Dir fehlt der passende Haken (bzw. für die Nachtwerte die Rolle), du bist mit dem Generalschlüssel 👑 angemeldet (der schreibt in der Teigecke nie), oder die Regeln in der Firebase-Konsole sind älter als die Seite. Für den dritten Fall prüft die Seite beim Laden still den Regelstand; passt er nicht, steht oben ein roter Hinweis mit der Regeldatei, die eingesetzt werden muss. „Keine Verbindung“ heißt: WLAN weg. Bitte den Text vom roten Kasten abfotografieren und Ulf schicken.' }
  ]
};
function renderHilfe() {
  document.getElementById('hilfeTitel').textContent = helpData.title;
  document.getElementById('hilfeInhalt').innerHTML = helpData.sections.map(function (s) {
    return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>';
  }).join('');
}
document.getElementById('hilfeBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = false; });
document.getElementById('hilfeZuBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = true; });
document.getElementById('hilfeSheet').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
