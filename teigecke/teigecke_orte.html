'use strict';
/* ==================================================================
   Teigecke · Orte — Seitenlogik. Gerüst: teigecke_seite.js. Rechnen und
   Schild: teigecke_logik.js (mit node testbar).
   ================================================================== */
/* ---------- Kurzwege ---------- */
const zm = function () { return L.nachId(S.zutaten); };
const om = function () { return L.nachId(S.orte); };
function pflegtWagen() { return S.pflegeModus && S.haken.wagen && online(); }
function ortText(o) { return o.kennung + (o.bereichName ? ' · ' + o.bereichName : '') + (o.name ? ' · ' + o.name : ''); }
function standHeute() {
  const h = new Date();   /* lokal rechnen, nie toISOString() */
  return String(h.getDate()).padStart(2, '0') + '.' + String(h.getMonth() + 1).padStart(2, '0') + '.' + h.getFullYear();
}

/* ---------- QR-Code: Adresse und Zeichnen kommen aus ../bos_qr.js ----------
   Adresse = Wurzel von BOS + Pfad dieser Seite aus der Registry + ?ort=Kennung.
   Kein Feld, kein Speicherwert. Maßgeblich für „mit Code oder ohne“ ist
   BOS_QR.darfAusgeben(): nur https und nicht lokal. Solange BOS nicht online
   ist, wird das Schild OHNE Code gedruckt, mit leerem Feld (Ulf, 03.10.2026). */
function qrErlaubt() {
  if (!window.BOS_QR) throw new Error('bos_qr.js nicht geladen');
  return window.BOS_QR.darfAusgeben(window.location.href);
}
function qrPfad() {

async function speichereEdit() {
  const z = editZustand;
  if (!z) return;
  if (z.typ === 'ort') return speichereOrt();
  if (z.typ !== 'zutat') return;
  const name = wert('fName'), ortId = wert('fOrt'), gebText = wert('fGebinde'), einheit = wert('fEinheit'), gruppe = wert('fGruppe');
  let fehler = pruefeText(t('f_name'), name, 60);
  if (!fehler && L.namensKonflikt(S.zutaten, name, z.id)) fehler = t('v_name_doppelt', { wert: name });
  let geb;
  if (!fehler && gebText) { geb = parseZahl(gebText); if (!(geb > 0)) fehler = t('v_gebinde'); }
  const daten = { name: name, ortId: ortId, gebindeEinheit: einheit, geloescht: false };
  if (L.GRUPPEN.indexOf(gruppe) !== -1) daten.gruppe = gruppe;
  if (L.istZahl(geb) && geb > 0) daten.gebindeGroesse = geb;
  if (fehler) { editFehler(fehler); return; }
  const vorher = z.id ? (zm()[z.id] || null) : null;
  await fuehreSchreibenAus(COL.zutaten, z.id, daten, z.id ? 'aendern' : 'anlegen', vorher, t('gespeichert'));
}
async function speichereOrt() {
  const z = editZustand;
  const name = wert('fName'), beschreibung = wert('fBeschreibung'), sortText = wert('fSort');
  let fehler = name.length > 60 ? t('v_zu_lang', { feld: t('f_name_ort'), max: 60 }) : '';
  let sort;
  if (!fehler && sortText) { sort = parseZahl(sortText); if (!L.istZahl(sort)) fehler = t('v_sort'); }
  const basis = { name: name, art: z.art, beschreibung: beschreibung, geloescht: false };
  if (L.istZahl(sort)) basis.sort = sort;
  if (z.id) {
    /* Ändern: Kennung, Bereich und Schild-Reihenfolge bleiben, wie sie sind. */
    const alt = om()[z.id];
    if (!alt) { editFehler(t('suche_nichts', { kennung: z.id })); return; }
    if (fehler) { editFehler(fehler); return; }
    const daten = Object.assign({ kennung: alt.kennung, bereich: alt.bereich, bereichName: alt.bereichName || '' }, basis);
    if (Array.isArray(alt.schildFolge)) daten.schildFolge = alt.schildFolge;
    await fuehreSchreibenAus(COL.orte, z.id, daten, 'aendern', alt, t('gespeichert'));
    return;
  }
  const w = bereichWahl();
  if (!fehler && !L.bereichGueltig(w.bereich)) fehler = t('v_bereich');
  if (!fehler && !w.name) fehler = t('v_pflicht', { feld: t('f_bereich_wort') });
  if (!fehler && w.name.length > 30) fehler = t('v_zu_lang', { feld: t('f_bereich_wort'), max: 30 });
  if (fehler) { editFehler(fehler); return; }
  const knoepfe = document.querySelectorAll('#editKnoepfe button');
  knoepfe.forEach(function (b) { b.disabled = true; });
  document.getElementById('editInfo').textContent = '…';
  try {
    const start = L.naechsteNummer(S.orte, w.bereich);
    const k = await schreibeNeuEindeutig(COL.orte, function (versuch) {
      const kennung = L.kennungBilden(w.bereich, start + versuch);
      if (!kennung) return null;
      return { id: L.ortIdAus(kennung), kennung: kennung, daten: Object.assign({ kennung: kennung, bereich: w.bereich, bereichName: w.name }, basis) };
    });
    schliesseEdit();
    toast(t('ort_angelegt', { kennung: k.kennung }));
    S.treffer = k.id;
    render();
  } catch (err) {
    document.getElementById('editInfo').textContent = '';
    editFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(t('err_speichern'), err);
    knoepfe.forEach(function (b) { b.disabled = false; });
  }
}
async function archiviereEdit() {
  const z = editZustand;
  if (!z || !z.id) return;
  if (z.typ === 'ort') {
    const dort = L.zutatenAmOrt(z.id, S.zutaten);
    if (dort.length) { editFehler(t('sperre_ort', { liste: dort.map(function (x) { return x.name; }).join(', ') })); return; }
    const ort = om()[z.id];
    await fuehreSchreibenAus(COL.orte, z.id, Object.assign({}, ort, { geloescht: true }), 'archivieren', ort, t('archiviert'));
  } else if (z.typ === 'zutat') {
    const teige = L.teigeMitZutat(z.id, S.teige);
    if (teige.length) { editFehler(t('sperre_zutat', { liste: teige.map(function (x) { return x.name; }).join(', ') })); return; }
    const zut = zm()[z.id];
    await fuehreSchreibenAus(COL.zutaten, z.id, Object.assign({}, zut, { geloescht: true }), 'archivieren', zut, t('archiviert'));
  }
}
async function stelleWiederHer(name, id) {
  const dok = L.nachId(S[name])[id];
  if (!dok) return;
  if (!S.haken[HAKEN_FUER[COL[name]]]) { zeigeFehler(t('wiederherstellen'), { message: t('err_haken_fehlt') }); return; }
  if (name === 'zutaten' && L.namensKonflikt(S.zutaten, dok.name, id)) { zeigeFehler(t('wiederherstellen'), { message: t('v_name_doppelt', { wert: dok.name }) }); return; }
  try {
    await schreibe(COL[name], id, Object.assign({}, dok, { geloescht: false }), 'wiederherstellen', dok);
    toast(t('wiederhergestellt'));
  } catch (err) {
    if (err && err.code === 'permission-denied') {
      const konflikt = await konfliktText(COL[name], id, dok);
      if (konflikt) { console.error('[Teigecke] Wiederherstellen abgelehnt: veralteter Stand', err); zeigeFehler(t('wiederherstellen'), { message: konflikt }); return; }
    }
    zeigeFehler(t('err_speichern'), err);
  }
}

/* ---------- Mehrere Schreibvorgänge nacheinander (jeder mit Sicherung) ----------
   Für „Zutaten hierher holen“, „Wort des Bereichs ändern“ und das Einlesen.
   Bricht beim ersten Fehler ab und sagt, wie weit es kam. */
async function schreibeReihe(titel, auftraege, fertigText) {
  const knoepfe = document.querySelectorAll('#editKnoepfe button');
  knoepfe.forEach(function (b) { b.disabled = true; });
  const info = document.getElementById('editInfo');
  let i = 0;
  try {
    for (const a of auftraege) {
      i++; info.textContent = t('reihe_laeuft', { i: i, n: auftraege.length });
      await schreibe(a.col, a.id, a.daten, a.aktion, a.vorher, true);
    }
    schliesseEdit();
    toast(fertigText);
    render();
  } catch (err) {
    info.textContent = t('reihe_abbruch', { i: i, n: auftraege.length });
    editFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(titel, err);
    knoepfe.forEach(function (b) { b.disabled = false; });
  }
}

async function speichereHolen() {

/* ---------- Startdaten: nur noch neue ZUTATEN (Ulf, 03.10.2026) ----------
   Orte werden von Hand angelegt (BOS vergibt die Nummer); Teige liest die
   Nachtseite bzw. später „Teige & Rezepte“ ein. */
let importZustand = null;
function starteImport() { const i = document.getElementById('importDatei'); i.value = ''; i.click(); }
document.getElementById('importDatei').addEventListener('change', function (e) {
  const datei = e.target.files && e.target.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onerror = function () { zeigeFehler(t('import_titel'), leser.error || new Error('Datei nicht lesbar')); };
  leser.onload = function () {
    let json;
    try { json = JSON.parse(leser.result); }
    catch (err) { oeffneEdit(t('import_titel'), '<p class="sheet-fehler">' + esc(t('import_json', { msg: err.message })) + '</p>', [{ aktion: 'abbrechen', text: t('schliessen') }]); return; }
    const hinweise = [];
    let nurZutaten = json;
    if (json && typeof json === 'object' && !Array.isArray(json)) {
      if (Array.isArray(json.orte) && json.orte.length) hinweise.push(t('import_orte_nicht', { n: json.orte.length }));
      const mitOrt = Array.isArray(json.zutaten) ? json.zutaten.filter(function (x) { return x && x.ort; }).length : 0;
      if (mitOrt) hinweise.push(t('import_ort_ignoriert', { n: mitOrt }));
      if (Array.isArray(json.teige) && json.teige.length) hinweise.push(t('import_teige_nicht', { n: json.teige.length }));
      nurZutaten = { version: json.version, zutaten: Array.isArray(json.zutaten) ? json.zutaten.map(function (x) {
        if (!x || typeof x !== 'object') return x;
        const k = Object.assign({}, x); delete k.ort; return k;
      }) : json.zutaten };
    }
    const ergebnis = L.importPlan(nurZutaten, { orte: [], zutaten: S.zutaten, teige: [] }, []);
    const neu = ergebnis.plan.zutaten.filter(function (x) { return x.aktion === 'neu'; });
    const vorhanden = ergebnis.plan.zutaten.length - neu.length;
    if (neu.length && !S.haken.wagen) ergebnis.fehler.push(t('import_haken_fehlen', { liste: t('haken_wagen') }));
    importZustand = { neu: neu };
    let html = '<p class="sheet-info">' + esc(t('import_zusammenfassung_zutaten', { zutaten: neu.length, vorhanden: vorhanden })) + '</p>';
    if (ergebnis.fehler.length) html += '<p class="sheet-fehler">' + esc(t('import_fehler_titel')) + '</p><ul class="import-liste">' + ergebnis.fehler.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    const alleHinweise = hinweise.concat(ergebnis.hinweise);
    if (alleHinweise.length) html += '<p class="sheet-info">' + esc(t('import_hinweise_titel')) + '</p><ul class="import-liste">' + alleHinweise.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    const knoepfe = [];
    if (!ergebnis.fehler.length && neu.length) knoepfe.push({ aktion: 'import-los', text: t('import_los', { n: neu.length }), klasse: 'bos-btn--amber' });
    else if (!ergebnis.fehler.length) html += '<p class="sheet-info">' + esc(t('import_nichts')) + '</p>';
    knoepfe.push({ aktion: 'abbrechen', text: t('abbrechen') });
    editZustand = { typ: 'import' };
    oeffneEdit(t('import_titel'), html, knoepfe);
  };
  leser.readAsText(datei);
});
async function fuehreImportAus() {
  if (!importZustand) return;
  const auftraege = importZustand.neu.map(function (e) { return { col: COL.zutaten, id: null, daten: L.zutatDokument(e.daten, {}), aktion: 'anlegen', vorher: null }; });
  importZustand = null;
  await schreibeReihe(t('import_titel'), auftraege, t('import_fertig', { n: auftraege.length }));
}

/* ---------- Drucken (immer über bos_druck.js, nie direkt) ----------
   Die Schrift der Zutatenliste wird je Schild eingepasst: größte Schrift,
   bei der nichts über das Blatt läuft (gemessen in einem unsichtbaren
   Nachbau mit demselben CSS). Passt es selbst mit der kleinsten Schrift
   nicht, wird das VOR dem Druck gesagt, nicht abgeschnitten. */
function messeSchild(ort, zutaten, qr, stand, qrLeer) {
  const halter = document.getElementById('schildMessung');
  let pt = L.SCHILD_SCHRIFT_MAX_PT, passt = false;
  for (; pt >= L.SCHILD_SCHRIFT_MIN_PT; pt--) {
    halter.innerHTML = '<style>' + L.SCHILD_CSS + '</style>' + L.schildHTML(ort, zutaten, { stand: stand, qrSvg: qr, qrLeer: qrLeer, schriftPt: pt });
    const s = halter.querySelector('.schild'), liste = halter.querySelector('.schild-liste'), fuss = halter.querySelector('.schild-fuss');
    if (!liste) { passt = true; break; }
    passt = s.scrollHeight <= s.clientHeight + 1 && s.scrollWidth <= s.clientWidth + 1 &&
      liste.getBoundingClientRect().bottom <= fuss.getBoundingClientRect().top + 0.5;
    if (passt) break;
  }
  halter.innerHTML = '';
  return { pt: Math.max(pt, L.SCHILD_SCHRIFT_MIN_PT), passt: passt };
}
function druckeSchilder(orte, trotzdem) {
  try {
    if (!orte.length) { toast(t('keine_schilder')); return; }
    if (!window.BOS_DRUCK) throw new Error('bos_druck.js nicht geladen');
    const inhalt = L.ortInhalt(S.orte, S.zutaten), stand = standHeute();
    const mitCode = qrErlaubt();   /* wirft sichtbar, wenn bos_qr.js fehlt */
    const zuVoll = [];
    const seiten = orte.map(function (o) {
      const zutaten = L.zutatenInSchildFolge(o, inhalt[o.id] || []);
      const qr = mitCode ? qrFuer(o.kennung) : '';
      const m = messeSchild(o, zutaten, qr, stand, !mitCode);
      if (!m.passt) zuVoll.push(o.kennung + ' (' + zutaten.length + ')');
      return L.schildHTML(o, zutaten, { stand: stand, qrSvg: qr, qrLeer: !mitCode, schriftPt: m.pt });
    });
    if (zuVoll.length && !trotzdem) {
      editZustand = { typ: 'druckfrage', orte: orte.map(function (o) { return o.id; }) };
      oeffneEdit(t('druck_zu_voll_titel'), '<p class="sheet-fehler">' + esc(t('druck_zu_voll', { liste: zuVoll.join(', '), pt: L.SCHILD_SCHRIFT_MIN_PT })) + '</p>',
        [{ aktion: 'druck-trotzdem', text: t('druck_trotzdem'), klasse: 'gefahr' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
      return;
    }
    if (!mitCode) toast(t('qr_ohne_toast'));
    window.BOS_DRUCK.drucken({
      inhaltHTML: seiten.join(''), appName: 'Teigecke Orte', mitKopf: false, farbig: false,
      extraCSS: L.SCHILD_CSS + L.SCHILD_DRUCK_CSS, ausrichtung: 'landscape'
    });
  } catch (err) { zeigeFehler(t('err_drucken'), err); }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id');
  switch (a) {
    case 'suchen': { const f = document.getElementById('sucheFeld'); S.sucheText = f.value; f.blur(); zeigeOrt(f.value); break; }
    case 'schild': druckeSchilder([om()[id]].filter(Boolean)); break;
    case 'alle-schilder': druckeSchilder(L.aktiv(S.orte).slice().sort(L.kennungVergleich)); break;
    case 'druck-trotzdem': { const ids = (editZustand && editZustand.orte) || []; schliesseEdit(); druckeSchilder(ids.map(function (x) { return om()[x]; }).filter(Boolean), true); break; }
    case 'neu-ort': oeffneOrt(null); break;
    case 'bearbeiten-ort': oeffneOrt(id); break;
    case 'neu-zutat': oeffneZutat(null); break;
    case 'bearbeiten-zutat': oeffneZutat(id); break;
    case 'ort-art':
      if (editZustand) { editZustand.art = el.getAttribute('data-art'); document.querySelectorAll('#fArt .chip').forEach(function (c) { c.setAttribute('aria-pressed', c.getAttribute('data-art') === editZustand.art ? 'true' : 'false'); }); }
      break;
    case 'holen': oeffneHolen(id); break;
    case 'holen-speichern': speichereHolen(); break;
    case 'schildfolge': oeffneSchildFolge(id); break;
    case 'sf-hoch': case 'sf-runter':
      if (editZustand && editZustand.typ === 'schildfolge') { editZustand.liste = L.verschiebe(editZustand.liste, Number(el.getAttribute('data-index')), a === 'sf-hoch' ? -1 : 1); zeichneSchildFolge(); }
      break;
    case 'sf-speichern': speichereSchildFolge(false); break;
    case 'sf-alphabet': speichereSchildFolge(true); break;
    case 'bereich-wort': oeffneBereichWort(el.getAttribute('data-bereich')); break;
    case 'bereich-wort-speichern': speichereBereichWort(); break;
    case 'chip': {
      if (!editZustand || !editZustand.auswahl) break;
      const menge = editZustand.auswahl[el.getAttribute('data-feld')];
      if (menge.has(id)) menge.delete(id); else menge.add(id);
      el.setAttribute('aria-pressed', menge.has(id) ? 'true' : 'false');
      break;
    }
    case 'speichern': speichereEdit(); break;
    case 'archivieren': archiviereEdit(); break;
    case 'abbrechen': schliesseEdit(); break;
    case 'wiederherstellen': stelleWiederHer(el.getAttribute('data-col'), id); break;
    case 'archiv-umschalten': S.zeigeArchiv = !S.zeigeArchiv; render(); break;
    case 'startdaten': starteImport(); break;
    case 'import-los': fuehreImportAus(); break;
  }
});

document.addEventListener('input', function (e) {

    { heading: 'Wofür ist diese Seite?', text: 'Hier richtest du die Teigecke ein: Orte anlegen, jeder Zutat ihr Zuhause geben, Schilder drucken. Das ist Arbeit in Ruhe, nicht für nebenbei am Kneter. Nachts sagt „Teigecke Nacht“ beim Einsammeln nur noch, an welchem Ort etwas steht.' },
    { heading: 'Was ist eine Kennung?', text: 'Jeder Ort hat eine Kennung aus einem Buchstaben und einer Nummer, zum Beispiel B01. Der Buchstabe ist der Bereich (B = Backstube, K = Kühlung …), die Nummer zählt BOS von selbst hoch: B01, B02, B03. Einmal B01, immer B01 — die Kennung bleibt bei ihrem Ort, egal was sich an seinem Inhalt ändert. Fällt ein Ort weg, bleibt seine Nummer leer; ein neuer Ort bekommt immer die nächste Nummer am Ende.' },
    { heading: 'Einen Ort anlegen', text: 'Oben „✎ Pflegen“ einschalten, dann „＋ Ort“. Bereich wählen oder mit „neuer Bereich“ einen Buchstaben und ein Wort dazu festlegen. Die Kennung siehst du als Vorschau, tippen kannst du sie nicht. Name, Beschreibung und „Reihenfolge im Gang“ sind freiwillig. „Reihenfolge im Gang“ sortiert die Orte nachts in der Einsammelliste: kleinere Zahl = weiter vorn.' },
    { heading: 'Zutaten ein Zuhause geben', text: 'Oben steht „Noch ohne Zuhause“ mit allen Zutaten, die noch nirgends wohnen. Am schnellsten geht es am Ort selbst: „＋ Zutaten hierher“, alle antippen, die dorthin gehören, „Hierher holen“. Einzelne Zutaten änderst du durch Antippen (Name, Zuhause, Gebinde). Neue Zutaten legst du mit „＋ Zutat“ an oder liest sie mit „Zutaten einlesen“ aus der Startdaten-Datei ein.' },
    { heading: 'Gruppe einer Zutat', text: 'In „Zutat bearbeiten“ steht als viertes Feld die Gruppe (Mehle & Schrote, Körner & Saaten, Flüssiges, Salz & Backmittel, Vorstufen & Anstellgut, Kühlung, Silo, Sonstiges). Sie sortiert die Auswahl, wenn du ein Rezept eintippst. Ohne Angabe gilt „Sonstiges“. Zutaten der Gruppe Silo dosiert WinBack: Sie brauchen kein Zuhause und stehen deshalb nicht unter „Noch ohne Zuhause“, sondern in der Karte „Aus dem Silo“.' },
    { heading: 'Reihenfolge auf dem Schild', text: 'Mit „↕ Reihenfolge“ schiebst du die Zutaten eines Orts mit den Pfeilen ▲▼ in die Reihenfolge, in der sie auf dem Schild stehen sollen. Ohne eigene Reihenfolge stehen sie alphabetisch. Das hat nichts mit der „Reihenfolge im Gang“ zu tun.' },
    { heading: 'Schilder drucken', text: '„🖨 Schild“ druckt das Schild eines Orts, „Alle Schilder drucken“ alle hintereinander: DIN A4 quer, ein Ort je Blatt. Links groß die Kennung, rechts die Zutaten mit Gebinde, unten links ein QR-Code (solange BäckereiOS noch nicht online ist: ein leeres Feld). Die Schrift wird so groß gewählt, wie es auf das Blatt passt. Passt es gar nicht, sagt die Seite das vor dem Druck. Im Druckdialog auf „Querformat“ achten.' },
    { heading: 'Der QR-Code', text: 'Wer den QR-Code mit dem Handy scannt, landet nach der Anmeldung direkt auf der Karte dieses Orts: Zutat ändern, Schild neu drucken, fertig. Du kannst eine Kennung auch oben ins Suchfeld tippen. Solange BäckereiOS noch nicht online ist, druckt die Seite das Schild ohne Code: an seiner Stelle bleibt ein leeres Feld. Die Seite sagt das oben und beim Drucken. Nach dem Online-Gang die Schilder einmal neu drucken, dann ist der Code drauf.' },
    { heading: 'Wort eines Bereichs ändern', text: 'Neben dem Bereich steht „Wort ändern“. Das neue Wort gilt für alle Orte des Bereichs; danach die Schilder neu drucken. Der Buchstabe bleibt, sobald ein Bereich einen Ort hat.' },
    { heading: 'Archivieren statt löschen', text: 'Gelöscht wird nichts. Einen Ort kannst du erst archivieren, wenn dort keine Zutat mehr wohnt; eine Zutat erst, wenn sie in keinem Teig mehr steht. Archiviertes steht unten im Archiv und lässt sich wiederherstellen.' },
    { heading: 'Wer darf was?', text: 'Sehen darf die Orte jeder mit Konto. Ändern kann nur, wer in der Kontenverwaltung den Haken „🧺 Wagen & Zutaten“ hat. Die Haken „Teige“ und „Rezepte“ gelten hier nicht.' },
    { heading: 'Wenn etwas schiefgeht', text: 'Fehler erscheinen oben in einem roten Kasten, mit der echten Meldung des Systems. „Keine Berechtigung“ hat drei mögliche Gründe: Dir fehlt der Haken, du bist mit dem Generalschlüssel 👑 angemeldet (der schreibt hier nie), oder die Firestore-Regeln sind älter als diese Seite — dann steht oben ein roter Hinweis mit der Regeldatei, die eingesetzt werden muss. „Inzwischen von … geändert“ heißt: jemand war schneller; die Seite hat neu geladen, einfach noch einmal speichern. Ohne Netz lässt sich hier nichts ändern.' }
  ]
};
function renderHilfe() {
  document.getElementById('hilfeTitel').textContent = helpData.title;
  document.getElementById('hilfeInhalt').innerHTML = helpData.sections.map(function (s) {
    return '<div class="sec"><h3>' + esc(s.heading) + '</h3><p>' + esc(s.text) + '</p></div>';
  }).join('');
}
document.getElementById('hilfeBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = false; });
document.getElementById('hilfeZuBtn').addEventListener('click', function () { document.getElementById('hilfeSheet').hidden = true; });
document.getElementById('hilfeSheet').addEventListener('click', function (e) { if (e.target === this) this.hidden = true; });

start().catch(function (err) { zeigeFehler(t('err_unbehandelt'), err); });
</script>
