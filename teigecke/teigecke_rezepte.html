/* ---------- Zustand ---------- */
const S = {
  kennung: null, haken: { wagen: false, teige: false, rezepte: false }, rolle: null,
  ansicht: 'liste', zeigeArchiv: false,
  orte: [], zutaten: [], teige: [], teigwerte: {}, rezeptmengen: [],
  produkte: [], produkteOk: false, produkteAusSpiegel: null,
  geladen: false,
  verbindung: { ausCache: {}, ausstehend: {}, letzteServerZeit: null },
  regelstand: 'unbekannt',  // 'passt' | 'alt' | 'unbekannt' (pruefeRegelstand)

<script>
'use strict';
/* ==================================================================
   Teigecke · Teige & Rezepte — Seitenlogik. Gerüst: teigecke_seite.js.
   Rechnen: teigecke_logik.js (Strecke ab v0.11, mit node testbar).
   ================================================================== */
/* ---------- Kurzwege ---------- */
const tm = function () { return L.nachId(S.teige); };
const zm = function () { return L.nachId(S.zutaten); };
const pm = function () { return L.produktMap(S.produkte); };
function produktName(k) { const p = pm()[k]; return p ? p.name : k; }
function teigName(k) { const x = tm()[k]; return x ? x.name : k; }
function sauerteig() { return L.aktiv(S.teige).filter(function (x) { return x.istSauerteig; })[0] || null; }
function istAdmin() { return S.rolle === 'admin'; }
function darfRezepte() { return S.haken.rezepte && online(); }
function fmt(x, stellen) { return L.istZahl(x) ? x.toFixed(stellen).replace('.', ',') : '–'; }
function fmtKg(x) { return fmt(x, 1) + ' kg'; }
function zahlText(x) { return L.istZahl(x) ? String(x).replace('.', ',') : ''; }
/* Werte je kg: kleine Zahlen, deshalb mehr Stellen (0,01375). */
function fmtJeKg(x) { return L.istZahl(x) ? String(Math.round(x * 100000) / 100000).replace('.', ',') : '–'; }

/* ---------- Laden: Produkte (bos_produkte.js), Konto mit Rolle ----------
   ladeProdukte: kopiert aus teigecke_nacht.html (Stand 07.10.2026), ohne
   das Entfernen des alten Spiegels (den gab es auf dieser Seite nie). */
async function ladeProdukte() {
  try {
    if (!window.BOS_PRODUKTE) throw new Error('bos_produkte.js ist nicht geladen — Seite neu laden (neue Fassung noch nicht online?)');
    const e = await window.BOS_PRODUKTE.lade({ sicht: 'aktive' });
    S.produkte = e.liste; S.produkteOk = true;
    S.produkteAusSpiegel = (e.quelle === 'geraetekopie') ? (e.kopieZeit || e.stand) : null;
    if (e.quelle === 'geraetekopie' && e.grund) zeigeFehler(t('err_laden', { was: 'Produktliste' }), e.grund);
  } catch (err) {
    zeigeFehler(t('err_laden', { was: 'Produktliste' }), err);
    S.produkte = []; S.produkteOk = false;
  }
}
/* Rolle für das Umhängen der Brote (Regel: produkte nur mit Rolle admin, RK §16).
   Das Gerüst liest nur die Haken; die Rolle steht im selben Konto-Dokument. */
async function ladeRolle() {
  S.rolle = null;
  if (!S.kennung) return;
  try {
    const konto = await window.BOS_ACCOUNTS.ladeKonto(window.db, S.kennung);
    S.rolle = (konto && konto.role) || null;
  } catch (err) { zeigeFehler(t('err_konto'), err); }
}
function abonniereStamm() {
  abos.forEach(function (ab) { ab(); });
  abos = [
    aboCollection('orte', function (a) { S.orte = a; }),          /* nur für „Startdaten einlesen“ (kopiert) */
    aboCollection('zutaten', function (a) { S.zutaten = a; }),
    aboCollection('teige', function (a) { S.teige = a; }),
    aboCollection('teigwerte', function (a) { S.teigwerte = L.nachId(a); })
  ];
  /* Rezeptmengen werden NICHT abonniert: Sie kommen nur beim Öffnen eines
     Rezepts (Haken Rezepte), einzeln, und bleiben im Arbeitsspeicher. */
}
async function start() {
  wendeI18nAn();
  renderHilfe();
  if (!window.db || !window.BOS_AUTH_READY) {
    zeigeFehler(t('err_laden', { was: 'bos_firebase_config.js' }), new Error('window.db oder window.BOS_AUTH_READY fehlt'));
    return;
  }
  let nutzer = null;
  try { nutzer = await window.BOS_AUTH_READY; }
  catch (err) { zeigeFehler(t('err_laden', { was: 'Anmeldung' }), err); return; }
  S.kennung = (nutzer && nutzer.email) ? nutzer.email.split('@')[0] : null;
  if (!S.kennung) toast(t('kein_konto'));
  await Promise.all([ladeProdukte(), ladeKonto(), ladeRolle()]);
  abonniereStamm();
  S.geladen = true;
  document.getElementById('ladeStatus').hidden = true;
  render();
  if (S.kennung) pruefeRegelstand();
}
window.addEventListener('online', planeRender);
window.addEventListener('offline', planeRender);
/* Ungespeicherte Eingabe in der Strecke: der Browser fragt nach. */
window.addEventListener('beforeunload', function (e) {
  if (S.ansicht === 'strecke' && S.strecke && S.strecke.geaendert) { e.preventDefault(); e.returnValue = ''; }
});
async function neuLaden() { render(); }
function oeffneNachCol(col, id) {
  if (col !== COL.teige) return;
  const x = tm()[id];
  if (editZustand && editZustand.typ === 'archiv-teig') oeffneArchivFrage();
  else if (x && x.istSauerteig) oeffneSauer(id);
}

/* ---------- Rendern ---------- */
function render() {
  if (!S.geladen) return;
  renderVerbindung();
  document.getElementById('ansichtListe').hidden = S.ansicht !== 'liste';
  document.getElementById('ansichtStrecke').hidden = S.ansicht !== 'strecke';
  if (S.ansicht === 'strecke') { aktualisiereLauf(); return; }   /* die Strecke zeichnet sich nur selbst neu (Eingaben bleiben) */
  if (fokusIn(document.querySelector('main'))) { renderAufgeschoben = true; return; }
  renderListe();
}
function teigZeileHTML(x) {
  const brote = L.produkteDesTeigs(x.id, S.produkte);
  const marken = (L.istRumpf(x) ? '<span class="badge rot">' + esc(t('marke_rumpf')) + '</span> ' : '') +
    (S.produkteOk && !brote.length ? '<span class="badge">' + esc(t('marke_ohne_brot')) + '</span>' : '');
  const inhalt = '<span class="lz-name"><b>' + esc(x.name) + ' <span class="badge">' + esc(x.id) + '</span></b>' +
    '<small>' + esc(brote.map(function (p) { return p.name; }).join(', ') || t('teig_keine_produkte')) + '</small>' +
    (marken ? '<small>' + marken + '</small>' : '') + '</span>';
  if (!darfRezepte()) return '<div class="liste-zeile-rahmen"><div class="liste-zeile rz-zeile rz-nur-lesen">' + inhalt + '</div></div>';
  return '<div class="liste-zeile-rahmen"><button type="button" class="liste-zeile rz-zeile" data-aktion="strecke-oeffnen" data-id="' + esc(x.id) + '">' + inhalt +
    '<span class="rz-stift" aria-hidden="true">✎</span></button></div>';
}
function broteOhneTeigHTML() {
  if (!S.produkteOk) return '';
  const b = L.broteOhneTeig(S.produkte, S.teige);
  const n = b.fehlenderTeig.length + b.ohneTeig.length;
  if (!n) return '';
  let html = '<details class="hinweis baustelle" id="broteOhneTeig"><summary>' + esc(t('brote_ohne_teig_titel', { n: n })) + '</summary><div>' +
    '<p class="klein">' + esc(t('brote_ohne_teig_text')) + '</p>';
  if (b.fehlenderTeig.length) html += '<p><b>' + esc(t('brote_fehlender_teig')) + '</b> ' + esc(b.fehlenderTeig.map(function (p) { return p.name + ' → ' + p.ausTeig; }).join(', ')) + '</p>';
  if (b.ohneTeig.length) html += '<p><b>' + esc(t('brote_ganz_ohne')) + '</b> ' + esc(b.ohneTeig.map(function (p) { return p.name; }).join(', ')) + '</p>';
  return html + '</div></details>';
}
function sauerKarteHTML() {
  const st = sauerteig();
  if (!st) return '<div class="karte"><div class="karte-kopf"><div><h3>' + esc(t('sauer_karte')) + '</h3><div class="karte-unter">' + esc(t('sauer_kein')) + '</div></div></div></div>';
  const zeilen = [L.istZahl(st.anstellgutAnteil) ? t('sauer_anstellgut', { wert: zahlText(st.anstellgutAnteil) }) : t('sauer_anstellgut_fehlt')];
  if (st.hinweisOben) zeilen.push(t('sauer_hinweis', { text: st.hinweisOben }));
  if ((st.beiBedarf || []).length) zeilen.push(t('sauer_bei_bedarf', { liste: st.beiBedarf.map(zutatName).join(', ') }));
  return '<div class="karte rz-sauer"><div class="karte-kopf"><div><h3>' + esc(t('sauer_karte')) + ' · ' + esc(st.name) + ' <span class="badge">' + esc(st.id) + '</span></h3>' +
    zeilen.map(function (z) { return '<div class="karte-unter">' + esc(z) + '</div>'; }).join('') + '</div>' +
    (darfRezepte() ? '<div class="karte-knoepfe"><button type="button" class="bos-btn" data-aktion="sauer-bearbeiten" data-id="' + esc(st.id) + '" aria-label="' + esc(t('e_titel_sauer')) + '">✎</button></div>' : '') +
    '</div></div>';
}
function zutatName(zid) { const z = zm()[zid]; return z ? z.name : zid; }
function renderListe() {
  const el = document.getElementById('ansichtListe');
  let html = '';
  if (S.kennung && !S.haken.rezepte) html += '<div class="hinweis blau">' + esc(t('nur_lesen')) + '</div>';
  if ((S.haken.rezepte || S.haken.teige) && online()) {
    html += '<div class="pflege-leiste">' +
      (S.haken.rezepte ? '<button type="button" class="bos-btn bos-btn--amber" data-aktion="neu-teig">' + esc(t('neu_teig')) + '</button>' : '') +
      '<button type="button" class="bos-btn" data-aktion="startdaten">' + esc(t('startdaten')) + '</button></div>';
  } else if ((S.haken.rezepte || S.haken.teige) && !online()) html += '<p class="klein">' + esc(t('offline_pflege')) + '</p>';
  html += broteOhneTeigHTML();
  html += sauerKarteHTML();
  const teige = L.aktiv(S.teige).filter(function (x) { return !x.istSauerteig; })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); });
  html += '<section class="block"><div class="block-kopf"><h2 class="bos-title">' + esc(t('liste_titel', { n: teige.length })) + '</h2></div>' +
    (teige.length ? '<div class="teig-liste">' + teige.map(teigZeileHTML).join('') + '</div>' : '<p class="status">' + esc(t('liste_leer')) + '</p>') + '</section>';
  if (darfRezepte()) html += archivHTML('teige');
  el.innerHTML = html;
}

/* ---------- Archiv — kopiert aus teigecke_nacht.html (archivHTML, teigKarteHTML) ---------- */
function archivHTML(name) {
  const arch = (S[name] || []).filter(function (x) { return x.geloescht; });
  let html = '<div class="pflege-leiste"><button type="button" class="link-btn" data-aktion="archiv-umschalten">' + esc(t(S.zeigeArchiv ? 'archiv_verbergen' : 'archiv_zeigen')) + ' (' + esc(COL[name]) + ': ' + arch.length + ')</button></div>';
  if (!S.zeigeArchiv) return html;
  if (!arch.length) return html + '<p class="status">' + esc(t('archiv_leer')) + '</p>';
  return html + arch.map(function (x) {
    if (name === 'teige') return teigKarteHTML(x, true);
    return '<div class="karte archiviert"><div class="karte-kopf"><div><h3>' + esc(x.name) + '</h3></div><div class="karte-knoepfe">' +
      '<button type="button" class="bos-btn" data-aktion="wiederherstellen" data-col="zutaten" data-id="' + esc(x.id) + '">' + esc(t('wiederherstellen')) + '</button></div></div></div>';
  }).join('');
}
function teigKarteHTML(teig, archiv) {
  const brote = L.produkteDesTeigs(teig.id, S.produkte).map(function (p) { return p.name; }).join(', ');
  const knopf = archiv
    ? '<button type="button" class="bos-btn" data-aktion="wiederherstellen" data-col="teige" data-id="' + esc(teig.id) + '">' + esc(t('wiederherstellen')) + '</button>'
    : '<button type="button" class="bos-btn" data-aktion="strecke-oeffnen" data-id="' + esc(teig.id) + '">✎</button>';
  return '<div class="karte' + (archiv ? ' archiviert' : '') + '"><div class="karte-kopf"><div><h3>' + esc(teig.name) + ' <span class="badge">' + esc(teig.id) + '</span></h3>' +
    '<div class="karte-unter">' + esc(brote || t('teig_keine_produkte')) + '</div></div><div class="karte-knoepfe">' + knopf + '</div></div></div>';
}
/* stelleWiederHer: kopiert aus teigecke_nacht.html; err_perm → err_haken_fehlt wie auf „Orte“. */
async function stelleWiederHer(name, id) {
  const dok = L.nachId(S[name])[id];
  if (!dok) return;
  if (!S.haken[HAKEN_FUER[COL[name]]]) { zeigeFehler(t('wiederherstellen'), { message: t('err_haken_fehlt') }); return; }
  let fehler = '';
  if (L.namensKonflikt(S[name], dok.name, id)) fehler = t('v_name_doppelt', { wert: dok.name });
  if (!fehler && name === 'teige' && dok.istSauerteig && sauerteig()) fehler = t('v_zwei_sauerteige', { name: sauerteig().name });
  if (fehler) { zeigeFehler(t('wiederherstellen'), { message: fehler }); return; }
  try {
    await schreibe(COL[name], id, Object.assign({}, dok, { geloescht: false }), 'wiederherstellen', dok);
    toast(t('wiederhergestellt'));
  } catch (err) {
    if (err && err.code === 'permission-denied') {
      const konflikt = await konfliktText(COL[name], id, dok);
      if (konflikt) { console.error('[Teigecke] Wiederherstellen abgelehnt: veralteter Stand', err); zeigeFehler(t('wiederherstellen'), { message: konflikt }); return; }
    }
    zeigeFehler(t('err_speichern'), err);
  }
}

/* ---------- Sauerteig: kleine eigene Karte, nicht die Strecke ---------- */
function oeffneSauer(id) {
  const x = tm()[id];
  if (!x) return;
  editZustand = { typ: 'sauer', id: id, auswahl: { beiBedarf: new Set(x.beiBedarf || []) } };
  const zutaten = L.aktiv(S.zutaten).slice().sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); });
  const eintraege = zutaten.map(function (y) { return { id: y.id, text: y.name, an: editZustand.auswahl.beiBedarf.has(y.id) }; });
  editZustand.auswahl.beiBedarf.forEach(function (zid) { if (!zm()[zid] || zm()[zid].geloescht) eintraege.push({ id: zid, text: t('unbekannt') + ' (' + zid + ')', an: true, warn: true }); });
  oeffneEdit(t('e_titel_sauer'),
    feldHTML(t('f_name'), eingabe('fName', x.name, 'maxlength="60"')) +
    feldHTML(t('f_anstellgut'), eingabe('fAnstellgut', zahlText(x.anstellgutAnteil), 'inputmode="decimal"'), t('f_anstellgut_hilfe')) +
    feldHTML(t('f_hinweis_oben'), eingabe('fHinweisOben', x.hinweisOben, 'maxlength="200"'), t('f_hinweis_oben_hilfe')) +
    feldHTML(t('f_bei_bedarf'), chipAuswahlHTML('beiBedarf', eintraege), t('f_bei_bedarf_hilfe')),
    [{ aktion: 'sauer-speichern', text: t('speichern'), klasse: 'bos-btn--amber' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
}
async function speichereSauer() {
  const z = editZustand;
  if (!z || z.typ !== 'sauer') return;
  const alt = tm()[z.id];
  if (!alt) return;
  const name = wert('fName');
  let fehler = pruefeText(t('f_name'), name, 60);
  if (!fehler && L.namensKonflikt(S.teige, name, z.id)) fehler = t('v_name_doppelt', { wert: name });
  const ag = parseZahl(wert('fAnstellgut'));
  if (!fehler && ag !== null && !(L.istZahl(ag) && ag > 0 && ag < 1)) fehler = t('v_anstellgut');
  if (fehler) { editFehler(fehler); return; }
  const daten = Object.assign({}, alt, { name: name, hinweisOben: wert('fHinweisOben'), beiBedarf: Array.from(z.auswahl.beiBedarf) });
  if (ag === null) delete daten.anstellgutAnteil; else daten.anstellgutAnteil = ag;
  await fuehreSchreibenAus(COL.teige, z.id, daten, 'aendern', alt, t('gespeichert'));
}

/* ==================================================================
   DIE STRECKE (Anweisung §4 B). Zustand nur im Arbeitsspeicher:
   S.strecke = { z, schritt, max, geaendert, mengenAlt, sp, konflikt }
   z = Zustand aus teigecke_logik.js (streckeLeer / streckeAusBestand).
   ================================================================== */
async function oeffneStrecke(id) {
  if (!S.haken.rezepte) { zeigeFehler(t('titel'), { message: t('nur_lesen') }); return; }
  let mengen = null;
  if (id) {
    const teig = tm()[id];
    if (!teig) return;
    /* Rezeptmengen: einzeln, frisch vom Server, nur in den Arbeitsspeicher. */
    try {
      const snap = await window.db.collection(COL.rezeptmengen).doc(id).get({ source: 'server' });
      mengen = snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null;
    } catch (err) {
      zeigeFehler(t('s_err_mengen'), err);
      toast(t('s_mengen_nicht_ladbar'));
      return;
    }
  }
  const z = id ? L.streckeAusBestand(tm()[id], S.teigwerte[id] || null, mengen, S.produkte, S.zutaten) : L.streckeLeer(S.zutaten);
  S.strecke = { z: z, schritt: 1, max: 1, geaendert: false, mengenAlt: mengen, sp: null, konflikt: '', fehler: [], uebernommen: {} };
  S.rezeptmengen = mengen ? [mengen] : [];
  S.ansicht = 'strecke';
  zeichneStrecke();
  render();
  window.scrollTo(0, 0);
}
function schliesseStrecke() {
  S.strecke = null; S.rezeptmengen = [];      /* Mengen aus dem Arbeitsspeicher räumen */
  S.ansicht = 'liste';
  document.getElementById('ansichtStrecke').innerHTML = '';
  render();
  window.scrollTo(0, 0);
}
function frageVerlassen() {
  if (!S.strecke || !S.strecke.geaendert) { schliesseStrecke(); return; }
  editZustand = { typ: 'verlassen' };
  oeffneEdit(t('s_verwerfen_titel'), '<p class="sheet-info">' + esc(t('s_verwerfen_text')) + '</p>',
    [{ aktion: 'verwerfen', text: t('s_verwerfen_ja'), klasse: 'gefahr' }, { aktion: 'abbrechen', text: t('s_verwerfen_nein') }]);
}
function speichertGerade() { return !!(S.strecke && S.strecke.sp && (S.strecke.sp.rezept === 'laeuft' || S.strecke.sp.brote === 'laeuft')); }

/* Fehlerkennung aus L.pruefeSchritt → Text */
function fehlerTexte(kennungen) {
  const z = S.strecke.z;
  return kennungen.map(function (f) {
    const teil = f.split(':'), n = Number(teil[1]) + 1;
    switch (teil[0]) {
      case 'name_fehlt': return t('v_name_fehlt');
      case 'name_lang': return t('v_name_lang');
      case 'kennung_ungueltig': return t('v_kennung_ungueltig');
      case 'kennung_belegt': return t('v_kennung_belegt', { k: L.kennungAus(z.name) });
      case 'name_doppelt': return t('v_name_gleich', { name: String(z.name).trim() });
      case 'einwaage': return t('v_einwaage', { name: produktName(teil[1]) });
      case 'sauer_frage': return t('v_sauer_frage');
      case 'sauer_kg': return t('v_sauer_kg');
      case 'vorstufe_frage': return t('v_vorstufe_frage');
      case 'vorstufe_name': return t('v_vorstufe_name');
      case 'vorstufe_kg': return t('v_vorstufe_kg');
      case 'vorstufe_je_behaelter': return t('v_je_behaelter');
      case 'vorstufe_zeile': return t('v_vorstufe_zeile', { n: n });
      case 'schuettwasser': return t('v_schuettwasser');
      case 'hefe_kg': return t('v_hefe_kg');
      case 'zeile': return t('v_zeile', { n: n });
      default: return f;
    }
  });
}
/* Vorwärts nur über geprüfte Schritte; zurück immer, ohne Verlust. */
function geheZu(ziel) {
  const st = S.strecke;
  if (!st || speichertGerade()) return;
  ziel = Math.max(1, Math.min(SCHRITTE, ziel));
  if (ziel > st.schritt) {
    for (let s = st.schritt; s < ziel; s++) {
      const f = fehlerTexte(L.pruefeSchritt(st.z, s, { teige: S.teige })).concat(zusatzFehler(s));
      if (f.length) { st.schritt = s; st.fehler = f; zeichneStrecke(); return; }
    }
  }
  st.schritt = ziel; st.max = Math.max(st.max, ziel); st.fehler = [];
  if (ziel >= 2) wartendeAnhaken();
  zeichneStrecke();
  window.scrollTo(0, 0);
}
/* Ergänzend zur Logik: eine Menge ohne Zutat zählt nirgends mit — lieber fragen. */
function zusatzFehler(schritt) {
  const z = S.strecke.z, f = [];
  if (schritt === 3 && z.vorstufe.ja === true) z.vorstufe.zeilen.forEach(function (r, i) { if (!r.zutatId && r.menge !== null) f.push(t('v_zeile_ohne_zutat_vs', { n: i + 1 })); });
  if (schritt === 4) {
    if (z.hefe.kg !== null && !z.hefe.zutatId) f.push(t('v_hefe_ohne_zutat'));
    z.zeilen.forEach(function (r, i) { if (!r.zutatId && r.menge !== null) f.push(t('v_zeile_ohne_zutat', { n: i + 1 })); });
    const v = sortFehler(); if (v) f.push(v);
  }
  return f;
}
function sortFehler() { const s = S.strecke.z.sort; return (s !== null && !L.istZahl(s)) ? t('v_sort') : ''; }

function zeichneStrecke() {
  const st = S.strecke, z = st.z;
  const el = document.getElementById('ansichtStrecke');
  const titel = z.neu ? t('s_titel_neu') : t('s_titel', { name: teigName(z.kennung) });
  const leiste = '<ol class="rz-schritte">' + [1, 2, 3, 4, 5].map(function (n) {
    const zustand = n === st.schritt ? 'aktiv' : (n <= st.max ? 'besucht' : '');
    return '<li><button type="button" class="rz-schritt ' + zustand + '" data-aktion="schritt" data-n="' + n + '"' + (n === st.schritt ? ' aria-current="step"' : '') + '>' +
      '<span class="rz-nr">' + n + '</span><span class="rz-wort">' + esc(t('s_schritt_' + n)) + '</span></button></li>';
  }).join('') + '</ol>';
  const koerper = [null, schritt1HTML, schritt2HTML, schritt3HTML, schritt4HTML, schritt5HTML][st.schritt]();
  const fehler = st.fehler.length ? '<div class="hinweis rot" id="streckeFehler" role="alert">' + st.fehler.map(esc).join('<br>') + '</div>' : '<div id="streckeFehler" hidden></div>';
  const nav = '<div class="rz-nav">' +
    (st.schritt > 1 ? '<button type="button" class="bos-btn" data-aktion="schritt-zurueck">' + esc(t('s_zurueck')) + '</button>' : '<span></span>') +
    (st.schritt < SCHRITTE ? '<button type="button" class="bos-btn bos-btn--amber" data-aktion="schritt-weiter">' + esc(t('s_weiter')) + '</button>' : '') + '</div>';
  el.innerHTML = '<div class="rz-kopf"><h2 class="bos-title">' + esc(titel) + '</h2>' +
    '<button type="button" class="link-btn" data-aktion="strecke-abbrechen">' + esc(t('s_abbrechen')) + '</button></div>' +
    leiste + fehler + '<div class="rz-koerper">' + koerper + '</div>' +
    '<div class="rz-lauf" id="rzLauf" role="status"></div>' + nav;
  aktualisiereLauf();
}
/* Laufleiste „Summe bisher“ ab Schritt 3 — ohne neu zu zeichnen. */
function aktualisiereLauf() {
  const el = document.getElementById('rzLauf');
  if (!el || !S.strecke) return;
  const z = S.strecke.z;
  if (S.strecke.schritt < 3) { el.hidden = true; return; }
  const s = L.streckeSumme(z);
  el.hidden = false;
  el.textContent = s.hatMengen ? t('s_summe_bisher', { kg: fmtKg(s.kg) }) + (s.vollstaendig ? '' : ' ' + t('s_summe_unvollstaendig')) : t('s_summe_leer');
}

/* ---- Bausteine ---- */
function zahlFeld(pfad, wertZahl, extra) {
  return '<input class="bos-input rz-zahl" data-z="' + pfad + '" data-art="zahl" inputmode="decimal" value="' + esc(zahlText(wertZahl)) + '" ' + (extra || '') + '>';
}
function textFeld(pfad, text, extra) {
  return '<input class="bos-input" data-z="' + pfad + '" data-art="text" value="' + esc(text == null ? '' : text) + '" ' + (extra || '') + '>';
}
function jaNein(aktion, wertJa) {
  return '<div class="umschalter rz-janein" role="group">' + [[true, 'ja'], [false, 'nein']].map(function (o) {
    return '<button type="button" data-aktion="' + aktion + '" data-wert="' + o[0] + '" aria-pressed="' + (wertJa === o[0]) + '">' + esc(t(o[1])) + '</button>';
  }).join('') + '</div>';
}
/* Zutatenauswahl, vorsortiert nach Gruppe (Anweisung §4 C). „＋ neue Zutat“ steht
   direkt in der Auswahl (ohne Haken 🧺 grau, mit Grund). */
function zutatAuswahl(attr, gewaehlt, mitWasser) {
  const aktive = L.nachId(L.aktiv(S.zutaten));
  let html = '<select class="bos-input rz-zutat" ' + attr + '><option value="">' + esc(t('s_zutat_waehlen')) + '</option>';
  if (mitWasser) html += '<option value="' + L.WASSER_ID + '"' + (gewaehlt === L.WASSER_ID ? ' selected' : '') + '>' + esc(t('s_wasser')) + '</option>';
  L.zutatenNachGruppe(S.zutaten).forEach(function (g) {
    html += '<optgroup label="' + esc(t('gruppe_' + g.gruppe)) + '">' + g.zutaten.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === gewaehlt ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('') + '</optgroup>';
  });
  if (gewaehlt && gewaehlt !== L.WASSER_ID && !aktive[gewaehlt]) html += '<option value="' + esc(gewaehlt) + '" selected>' + esc(t('unbekannt') + ' (' + gewaehlt + ')') + '</option>';
  const darf = S.haken.wagen && online();
  html += '<option value="__neu__"' + (darf ? '' : ' disabled') + '>' + esc(t(S.haken.wagen ? 's_neue_zutat' : 's_neue_zutat_ohne')) + '</option>';
  return html + '</select>';
}
function einheitAuswahl(attr, einheit) {
  return '<select class="bos-input rz-einheit" ' + attr + '>' + ['kg', 'L'].map(function (e) {
    return '<option value="' + e + '"' + (einheit === e ? ' selected' : '') + '>' + e + '</option>';
  }).join('') + '</select>';
}
function siloHinweis(zid) { const x = zm()[zid]; return x && L.istSilo(x) ? '<div class="klein rz-silo">' + esc(t('s4_silo')) + '</div>' : ''; }

/* ---- Schritt 1: Name ---- */
/* Brote, deren ausTeig schon auf diese (noch nicht angelegte) Kennung zeigt — z. B. die
   sechs Rumpf-Brote aus der Produkt-Config (Punkt 51). Sie gehören zu diesem Teig. */
function wartendeBrote(kennung) { return kennung ? S.produkte.filter(function (p) { return p.ausTeig === kennung; }) : []; }
function kennungText(z) {
  if (!z.neu) return t('s1_kennung_fest', { k: z.kennung });
  const k = L.kennungAus(z.name), w = wartendeBrote(k);
  return t('s1_kennung_neu', { k: k || '…' }) + (w.length ? t('s1_wartende_brote', { liste: w.map(function (p) { return p.name; }).join(', ') }) : '');
}
/* Beim Schritt in die Brote (neuer Teig): wartende Brote anhaken. Ändert sich der Name,
   fallen die vorher automatisch angehakten wieder heraus, solange niemand sie angefasst hat. */
function wartendeAnhaken() {
  const st = S.strecke, z = st.z;
  if (!z.neu) return;
  const k = L.kennungAus(z.name);
  if (st.autoKennung === k) return;
  Object.keys(z.brote).forEach(function (lk) { if (z.brote[lk].auto) delete z.brote[lk]; });
  wartendeBrote(k).forEach(function (p) { if (!z.brote[p.legacyKey]) z.brote[p.legacyKey] = { an: true, einwaageG: null, auto: true }; });
  st.autoKennung = k;
}
function schritt1HTML() {
  const z = S.strecke.z;
  return feldHTML(t('s1_frage'), textFeld('name', z.name, 'maxlength="60" autocomplete="off" id="rzName"'), t('s1_hilfe')) +
    '<div class="feld"><div class="kennung-vorschau rz-kennung" id="rzKennung">' + esc(kennungText(z)) + '</div>' +
    '<div class="feld-hilfe">' + esc(t('s1_kennung_hilfe')) + '</div></div>';
}
/* ---- Schritt 2: Brote ---- */
function brotZeileHTML(p) {
  const z = S.strecke.z, b = z.brote[p.legacyKey] || { an: false, einwaageG: null };
  const kennung = z.neu ? L.kennungAus(z.name) : z.kennung;
  const hierAngehaengt = !!kennung && p.ausTeig === kennung;   /* auch: wartende Brote eines neuen Teigs */
  let unter = '';
  if (p.ausTeig && p.ausTeig !== kennung) unter = tm()[p.ausTeig] && !tm()[p.ausTeig].geloescht ? t('s2_haengt_an', { teig: teigName(p.ausTeig) }) : t('s2_haengt_an_fehlend', { teig: p.ausTeig });
  const darfHaken = istAdmin();
  const darfEinwaage = b.an && (darfHaken || hierAngehaengt);
  return '<div class="rz-brot' + (b.an ? ' an' : '') + '">' +
    '<button type="button" class="vorrat-haken rz-brot-haken" data-aktion="brot-an" data-lk="' + esc(p.legacyKey) + '" aria-pressed="' + !!b.an + '"' + (darfHaken ? '' : ' disabled') + '>' +
      '<span class="vh-kasten" aria-hidden="true">' + (b.an ? '✓' : '') + '</span><span class="rz-brot-name">' + esc(p.name) +
      (unter ? '<small>' + esc(unter) + '</small>' : '') + (S.strecke.uebernommen[p.legacyKey] ? '<small>' + esc(t('s2_einwaage_uebernommen')) + '</small>' : '') + '</span></button>' +
    (b.an ? '<label class="rz-einwaage"><span class="klein">' + esc(t('s2_einwaage')) + '</span>' +
      '<input class="bos-input rz-zahl" data-brot="' + esc(p.legacyKey) + '" inputmode="numeric" value="' + esc(zahlText(b.einwaageG)) + '"' + (darfEinwaage ? '' : ' disabled') + '></label>' : '') +
    '</div>';
}
function schritt2HTML() {
  const z = S.strecke.z;
  const brote = L.teigeckeBrote(S.produkte).slice();
  const drin = {}; brote.forEach(function (p) { drin[p.legacyKey] = true; });
  /* Brote aus der Suche oder anderer Kategorie, die schon in der Strecke stehen */
  Object.keys(z.brote).forEach(function (lk) { const p = pm()[lk]; if (p && !drin[lk]) { brote.push(p); drin[lk] = true; } });
  brote.sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); });
  let html = '<p class="rz-frage">' + esc(t('s2_frage')) + '</p><p class="feld-hilfe">' + esc(t('s2_hilfe')) + '</p>';
  if (!istAdmin()) html += '<div class="hinweis blau">' + esc(t('s2_ohne_admin')) + '</div>';
  if (!S.haken.teige) html += '<div class="hinweis">' + esc(t('s2_ohne_teige')) + '</div>';
  if (!S.produkteOk) html += '<div class="hinweis rot">' + esc(t('err_laden', { was: 'Produktliste' })) + '</div>';
  html += brote.length ? '<div class="rz-brote">' + brote.map(brotZeileHTML).join('') + '</div>' : '<p class="status">' + esc(t('s2_keine_brote')) + '</p>';
  if (istAdmin()) {
    html += '<div class="feld rz-suche"><label class="bos-label" for="rzSuche">' + esc(t('s2_suche')) + '</label>' +
      '<input class="bos-input" id="rzSuche" autocomplete="off" placeholder="' + esc(t('s2_suche_platz')) + '"><div id="rzTreffer" class="chips"></div></div>';
  }
  if (!Object.keys(z.brote).some(function (lk) { return z.brote[lk].an; })) html += '<div class="hinweis">' + esc(t('s2_ohne_brot')) + '</div>';
  return html;
}
function zeigeTreffer(text) {
  const el = document.getElementById('rzTreffer');
  if (!el) return;
  const n = L.norm(text);
  if (n.length < 2) { el.innerHTML = ''; return; }
  const z = S.strecke.z;
  const treffer = S.produkte.filter(function (p) { return p.kategorie !== 'Brot' && !(z.brote[p.legacyKey] && z.brote[p.legacyKey].an) && L.norm(p.name).indexOf(n) !== -1; });
  el.innerHTML = treffer.length ? treffer.slice(0, 12).map(function (p) {
    return '<button type="button" class="chip" data-aktion="brot-an" data-lk="' + esc(p.legacyKey) + '">＋ ' + esc(p.name) + (p.kategorie ? ' · ' + esc(p.kategorie) : '') + '</button>';
  }).join('') + (treffer.length > 12 ? '<span class="klein">' + esc(t('s2_suche_mehr')) + '</span>' : '') : '<span class="klein">' + esc(t('s2_suche_nichts')) + '</span>';
}
function brotUmschalten(lk) {
  const z = S.strecke.z;
  if (!istAdmin()) return;
  const p = pm()[lk];
  const b = z.brote[lk];
  if (b) delete b.auto;
  if (b && b.an) { b.an = false; }
  else {
    let g = b && L.istZahl(b.einwaageG) ? b.einwaageG : null;
    /* Einwaage vom bisherigen Teig übernehmen (dasselbe Brot wiegt gleich viel) — sichtbar markiert */
    if (g === null && p && p.ausTeig && S.teigwerte[p.ausTeig] && S.teigwerte[p.ausTeig].einwaage && L.istZahl(S.teigwerte[p.ausTeig].einwaage[lk])) {
      g = S.teigwerte[p.ausTeig].einwaage[lk]; S.strecke.uebernommen[lk] = true;
    }
    z.brote[lk] = { an: true, einwaageG: g };
  }
  S.strecke.geaendert = true;
  zeichneStrecke();
}
/* ---- Schritt 3: Sauer und Vorstufe ---- */

/* ---- Schritt 5: Zusammenfassung ---- */
/* Was beim Speichern geschrieben würde — dieselbe Rechnung für Anzeige und Speichern. */
function plan() {
  const st = S.strecke, z = st.z;
  const kennung = z.neu ? L.kennungAus(z.name) : z.kennung;
  const altTeig = z.neu ? null : (tm()[kennung] || null);
  const altTw = S.teigwerte[kennung] || null;
  const altM = st.mengenAlt;
  const zk = Object.assign({}, z, { kennung: kennung });
  const teig = L.teigAusStrecke(zk, altTeig, S.zutaten);
  const tw = L.teigwerteAusStrecke(zk, altTw, S.produkte);
  let m = L.mengenAusStrecke(zk);
  if (!m && altM) m = { eingabe: {} };   /* alle Mengen gelöscht: auch das ist eine Änderung */
  /* Brote: Vorschau aus der Produktliste (gespeichert wird frisch vom Server, Teil D) */
  const brote = [];
  Object.keys(z.brote).forEach(function (lk) {
    const p = pm()[lk], b = z.brote[lk];
    if (!p) return;
    if (b.an && p.ausTeig !== kennung) brote.push({ lk: lk, von: p.ausTeig || '', nach: kennung });
    else if (!b.an && p.ausTeig === kennung) brote.push({ lk: lk, von: kennung, nach: '' });
  });
  return {
    kennung: kennung, teig: teig, altTeig: altTeig, tw: tw, altTw: altTw, m: m, altM: altM, brote: brote,
    teigAendern: !altTeig || !L.dokGleich(teig, altTeig),
    twAendern: !!tw && (!altTw || !L.dokGleich(tw, altTw)),
    mAendern: !!m && (!altM || !L.dokGleich(m, altM))
  };
}

/* ---------- Eingaben in der Strecke (ohne neu zu zeichnen) ---------- */
function setzePfad(pfad, w) {
  const z = S.strecke.z, teile = pfad.split('.');
  let o = z;
  for (let i = 0; i < teile.length - 1; i++) o = o[teile[i]];
  o[teile[teile.length - 1]] = w;
}
/* '' → null, sonst Zahl; ungültig bleibt NaN (die Schrittprüfung meldet es). */
function zahlAus(text) { const n = parseZahl(text); return n; }
function eingabeStrecke(el) {
  const st = S.strecke;
  if (!st) return;
  if (el.hasAttribute('data-z')) {
    const pfad = el.getAttribute('data-z'), art = el.getAttribute('data-art');
    if (art === 'auswahl') return;   /* über change */
    setzePfad(pfad, art === 'zahl' ? zahlAus(el.value) : el.value);
    if (pfad === 'name') {
      const k = document.getElementById('rzKennung');
      if (k && st.z.neu) k.textContent = kennungText(st.z);
    }
  } else if (el.hasAttribute('data-brot')) {
    const b = st.z.brote[el.getAttribute('data-brot')];
    if (b) { b.einwaageG = zahlAus(el.value); delete b.auto; delete st.uebernommen[el.getAttribute('data-brot')]; }
  } else if (el.hasAttribute('data-zeile') && el.getAttribute('data-sp') === 'menge') {
    zeilenListe(el.getAttribute('data-zeile'))[Number(el.getAttribute('data-i'))].menge = zahlAus(el.value);
  } else if (el.id === 'rzSuche') { zeigeTreffer(el.value); return; }
  else return;
  st.geaendert = true;
  aktualisiereLauf();
  aktualisiereZusammenfassung();
}
function zeilenListe(art) { return art === 'vorstufe' ? S.strecke.z.vorstufe.zeilen : S.strecke.z.zeilen; }
/* Auswahlfelder (Zutat, Einheit). „＋ neue Zutat“ öffnet das Blatt. */
function auswahlStrecke(el) {
  const st = S.strecke;
  if (!st) return;
  let ziel = null;   /* { setze(id) } */
  if (el.getAttribute('data-z') === 'hefe.zutatId') ziel = { alt: st.z.hefe.zutatId, setze: function (id) { st.z.hefe.zutatId = id; } };
  else if (el.hasAttribute('data-zeile')) {
    const r = zeilenListe(el.getAttribute('data-zeile'))[Number(el.getAttribute('data-i'))];
    if (el.getAttribute('data-sp') === 'einheit') { r.einheit = el.value === 'L' ? 'L' : 'kg'; st.geaendert = true; return; }
    ziel = { alt: r.zutatId, setze: function (id) {
      r.zutatId = id;
      if ('name' in r) r.name = id === L.WASSER_ID ? t('s_wasser') : (zm()[id] ? zm()[id].name : '');
    } };
  }
  if (!ziel) return;
  if (el.value === '__neu__') { el.value = ziel.alt || ''; oeffneNeueZutat(ziel); return; }
  ziel.setze(el.value);
  st.geaendert = true;
  zeichneStrecke();   /* Silo-Hinweis, Summe */
}

async function speichereNeueZutat() {
  const z = editZustand;

  if (fehler) { editFehler(fehler); return; }

  if (L.GRUPPEN.indexOf(gruppe) !== -1) daten.gruppe = gruppe;

  try {

/* ==================================================================
   SPEICHERN — zwei Schritte (Anweisung §4 B „Speichern“, Bauplan §5)
   1 Rezept: EIN Vorgang aus Teig + Teigwerte (nur einwaage) + Rezeptmengen,
     je mit Sicherung (schreibeMehrere). Unverändertes = kein Schreiben.
   2 Brote: Produkte und Stand frisch vom Server, nur Feld ausTeig, über
     ../bos_produkte_schreiben.js (höchstens 10 je Vorgang).
   Ein Fehler am Brot reißt das Rezept nicht mit. Ohne gelungenes Rezept
   werden keine Brote umgehängt (ein neuer Teig muss erst da sein).
   ================================================================== */
async function speichereStrecke() {
  const st = S.strecke;
  if (!st || speichertGerade()) return;
  for (let s = 1; s <= 4; s++) {
    const f = fehlerTexte(L.pruefeSchritt(st.z, s, { teige: S.teige })).concat(zusatzFehler(s));
    if (f.length) { st.schritt = s; st.fehler = f; zeichneStrecke(); return; }
  }
  st.konflikt = '';
  st.sp = { rezept: 'laeuft', rezeptText: '', brote: 'wartet', broteText: '' };
  zeichneStrecke();
  const ok = await schrittRezept();
  if (ok) await schrittBrote();
}
async function schrittRezept() {
  const st = S.strecke;
  st.sp.rezept = 'laeuft'; st.sp.rezeptText = ''; st.konflikt = '';
  zeichneStrecke();
  const p = plan();
  const auftraege = [];
  if (p.teigAendern) auftraege.push({ col: COL.teige, id: p.kennung, daten: p.teig, aktion: p.altTeig ? 'aendern' : 'anlegen', vorher: p.altTeig });
  const hinweise = [];
  if (p.twAendern) {
    if (S.haken.teige) auftraege.push({ col: COL.teigwerte, id: p.kennung, daten: p.tw, aktion: p.altTw ? 'aendern' : 'anlegen', vorher: p.altTw });
    else hinweise.push(t('sp_teigwerte_ohne'));
  }
  if (p.mAendern) auftraege.push({ col: COL.rezeptmengen, id: p.kennung, daten: p.m, aktion: p.altM ? 'aendern' : 'anlegen', vorher: p.altM });
  if (!auftraege.length) {
    st.sp.rezept = 'nichts'; st.sp.rezeptText = hinweise.join(' ');
    nachRezept(p.kennung);
    return true;
  }
  try {
    await schreibeMehrere(auftraege);
    st.sp.rezept = 'ok'; st.sp.rezeptText = hinweise.join(' ');
    /* Neue Grundlage für ein weiteres Speichern: Mengen frisch (mit Sicherung), Teig und Teigwerte kommen live. */
    if (p.mAendern) await ladeMengenNeu(p.kennung);
    nachRezept(p.kennung);
    return true;
  } catch (err) {
    st.sp.rezept = 'fehler';
    if (err && err.code === 'permission-denied') {
      for (const a of auftraege) {
        const k = a.col === COL.rezeptmengen ? await konfliktMengen(a.id, a.vorher) : ((await konfliktText(a.col, a.id, a.vorher)) ? werHat(a.col, a.id) : null);
        if (k) { st.konflikt = t('sp_konflikt', { wer: k }); break; }
      }
    }
    st.sp.rezeptText = fehlerText(t('err_speichern'), err);
    if (!st.konflikt) zeigeFehler(t('sp_rezept'), err);
    else console.error('[Teigecke] Rezept abgelehnt: veralteter Stand', err);
    zeichneStrecke();
    return false;
  }
}
/* Nach gelungenem Rezept: ein neuer Teig hat jetzt seine feste Kennung. */
function nachRezept(kennung) {
  const z = S.strecke.z;
  if (z.neu) { z.neu = false; z.kennung = kennung; }
  zeichneStrecke();
}
async function ladeMengenNeu(kennung) {
  try {
    const snap = await window.db.collection(COL.rezeptmengen).doc(kennung).get({ source: 'server' });
    S.strecke.mengenAlt = snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null;
  } catch (err) { zeigeFehler(t('s_err_mengen'), err); }
}
/* Wer hat zuletzt geändert? konfliktText (Gerüst) hat den frischen Stand schon in S übernommen. */
function werHat(col, id) {
  const dok = col === COL.teigwerte ? S.teigwerte[id] : L.nachId(S.teige)[id];
  return (dok && dok.geaendertVon) || '?';
}
/* Konflikt bei den Rezeptmengen: wie konfliktText (Gerüst), aber die Mengen
   liegen nicht in S, sondern in der Strecke. Liefert den Namen oder null. */
async function konfliktMengen(id, vorher) {
  if (!vorher) return null;
  let frisch = null;
  try {
    const snap = await window.db.collection(COL.rezeptmengen).doc(id).get({ source: 'server' });
    frisch = snap.exists ? Object.assign({ id: snap.id }, snap.data()) : null;
  } catch (err) { zeigeFehler(t('err_gegenlesen'), err); return null; }
  if (!L.istVeraltet(vorher, frisch)) return null;
  S.strecke.mengenAlt = frisch;
  return (frisch && frisch.geaendertVon) || '?';
}
async function schrittBrote() {
  const st = S.strecke, z = st.z;
  const kennung = z.kennung;
  if (!plan().brote.length && !Object.keys(z.brote).length) { st.sp.brote = 'nichts'; fertigPruefen(); return; }
  if (!istAdmin()) {
    st.sp.brote = plan().brote.length ? 'uebersprungen' : 'nichts';
    st.sp.broteText = plan().brote.length ? t('sp_ohne_rolle') : '';
    fertigPruefen(); return;
  }
  st.sp.brote = 'laeuft'; st.sp.broteText = '';
  zeichneStrecke();
  let erledigt = 0, gesamt = 0;
  try {
    if (!window.BOS_PRODUKTE || !window.BOS_PRODUKTE_SCHREIBEN) throw new Error('bos_produkte.js / bos_produkte_schreiben.js nicht geladen');
    /* frisch vom Server, nie die Gerätekopie (Anweisung §4 D) */
    const e = await window.BOS_PRODUKTE.lade({ sicht: 'roh', nurServer: true, frisch: true });
    const aenderungen = L.ausTeigAenderungen(kennung, z.brote, e.liste);
    gesamt = aenderungen.length;
    if (!gesamt) { st.sp.brote = 'nichts'; await ladeProdukte(); fertigPruefen(); return; }
    const standRef = window.db.collection(window.BOS_PRODUKTE_SCHREIBEN.STAND_COLLECTION).doc(window.BOS_PRODUKTE_SCHREIBEN.STAND_DOK);
    const standSnap = await standRef.get({ source: 'server' });
    let stand = standSnap.exists && typeof standSnap.data().nummer === 'number' ? standSnap.data().nummer : null;
    let existiert = standSnap.exists;
    for (const teil of L.teile(aenderungen, window.BOS_PRODUKTE_SCHREIBEN.HOECHSTENS_JE_VORGANG)) {
      const erg = await mitZeitlimit(window.BOS_PRODUKTE_SCHREIBEN.schreibe({ kennung: S.kennung, geladenerStand: stand, standExistiert: existiert, eintraege: teil }));
      stand = erg.neuerStand; existiert = true; erledigt += teil.length;
    }
    st.sp.brote = 'ok'; st.sp.broteText = t('sp_brote_ok', { n: erledigt, stand: stand });
    await ladeProdukte();    /* der Stand ist gestiegen: neue Liste holen */
    fertigPruefen();
  } catch (err) {
    st.sp.brote = 'fehler';
    const teil = erledigt ? t('sp_brote_teil', { i: erledigt, n: gesamt }) + ' ' : '';
    st.sp.broteText = teil + (window.BOS_PRODUKTE && err && err.meldung ? window.BOS_PRODUKTE.fehlerText(err) : fehlerText(t('err_speichern'), err)) +
      (err && err.code === 'permission-denied' ? ' · ' + t('sp_brote_perm') : '');
    zeigeFehler(t('sp_brote'), err);
    if (erledigt) await ladeProdukte();
    zeichneStrecke();
  }
}
function fertigPruefen() {
  const st = S.strecke;
  if (speichernFertig()) { st.geaendert = false; toast(t('sp_fertig')); }
  zeichneStrecke();
}

/* ---------- Teig archivieren (aus „Hinweise & Sonstiges“) ---------- */
function oeffneArchivFrage() {
  const st = S.strecke;
  if (!st || st.z.neu) return;
  const teig = tm()[st.z.kennung];
  if (!teig) return;
  editZustand = { typ: 'archiv-teig', id: teig.id };
  oeffneEdit(t('ar_titel', { name: teig.name }), '<p class="sheet-info">' + esc(t('ar_text')) + '</p>',
    [{ aktion: 'archiv-ja', text: t('archivieren'), klasse: 'gefahr' }, { aktion: 'abbrechen', text: t('abbrechen') }]);
}
/* archiviereEdit: Teig-Zweig kopiert aus teigecke_nacht.html. */
async function archiviereTeig() {
  const z = editZustand;
  if (!z || z.typ !== 'archiv-teig') return;
  const brote = L.produkteDesTeigs(z.id, S.produkte);
  if (brote.length) { editFehler(t('sperre_teig', { liste: brote.map(function (p) { return p.name; }).join(', ') })); return; }
  const teig = tm()[z.id];
  await fuehreSchreibenAus(COL.teige, z.id, Object.assign({}, teig, { geloescht: true }), 'archivieren', teig, t('archiviert'));
  if (document.getElementById('editSheet').hidden) schliesseStrecke();   /* gelungen: Blatt zu → zurück zur Liste */
}

/* ---------- Startdaten — kopiert aus teigecke_nacht.html (Stand 07.10.2026) ---------- */
let importZustand = null;
function starteImport() { const i = document.getElementById('importDatei'); i.value = ''; i.click(); }
document.getElementById('importDatei').addEventListener('change', function (e) {
  const datei = e.target.files && e.target.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onerror = function () { zeigeFehler(t('import_titel'), leser.error || new Error('Datei nicht lesbar')); };
  leser.onload = function () {
    let json;
    try { json = JSON.parse(leser.result); }
    catch (err) { oeffneEdit(t('import_titel'), '<p class="sheet-fehler">' + esc(t('import_json', { msg: err.message })) + '</p>', [{ aktion: 'abbrechen', text: t('schliessen') }]); return; }
    const ergebnis = L.importPlan(json, { orte: S.orte, zutaten: S.zutaten, teige: S.teige }, S.produkte);
    const plan = ergebnis.plan;
    const neu = function (liste) { return liste.filter(function (x) { return x.aktion === 'neu'; }); };
    const teigwerte = neu(plan.teige).filter(function (x) { return L.teigwerteDokument(x.daten) && !S.teigwerte[x.daten.kennung]; });
    const anzahl = neu(plan.teige).length + teigwerte.length;
    const vorhanden = plan.teige.length - neu(plan.teige).length;
    /* Orte und Zutaten liest diese Seite nicht ein (03.10.2026). Neue Zutaten
       in der Datei: erst auf „Orte“ einlesen, sonst fehlen sie den Teigen. */
    if (neu(plan.zutaten).length) ergebnis.fehler.push(t('import_zutaten_erst', { n: neu(plan.zutaten).length }));
    if (neu(plan.orte).length) ergebnis.hinweise.push(t('import_orte_nicht', { n: neu(plan.orte).length }));
    /* Jeder Teil braucht seinen Haken — fehlt einer, wird gar nichts geschrieben. */
    const fehlend = [];
    if (neu(plan.teige).length && !S.haken.rezepte) fehlend.push(t('haken_rezepte'));
    if (teigwerte.length && !S.haken.teige) fehlend.push(t('haken_teige'));
    if (fehlend.length) ergebnis.fehler.push(t('import_haken_fehlen', { liste: fehlend.join(', ') }));
    importZustand = { plan: plan, anzahl: anzahl };
    let html = '<p class="sheet-info">' + esc(t('import_zusammenfassung', { teige: neu(plan.teige).length, werte: teigwerte.length, vorhanden: vorhanden })) + '</p>';
    if (ergebnis.fehler.length) html += '<p class="sheet-fehler">' + esc(t('import_fehler_titel')) + '</p><ul class="import-liste">' + ergebnis.fehler.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    if (ergebnis.einwaagen.length) {
      html += '<p class="sheet-info"><strong>' + esc(t('import_einwaagen_titel')) + '</strong></p><table class="einwaage-tabelle">' + ergebnis.einwaagen.map(function (e) {
        return '<tr><td>' + esc(e.teig) + '</td><td>' + esc(e.produkt) + '</td><td class="' + (e.gramm === null ? 'rot' : '') + '">' + (e.gramm === null ? esc(t('einwaage_fehlt_kurz')) : e.gramm + ' g') + '</td></tr>';
      }).join('') + '</table>';
    }
    if (ergebnis.hinweise.length) html += '<p class="sheet-info">' + esc(t('import_hinweise_titel')) + '</p><ul class="import-liste">' + ergebnis.hinweise.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul>';
    const knoepfe = [];
    if (!ergebnis.fehler.length && anzahl > 0) knoepfe.push({ aktion: 'import-los', text: t('import_los', { n: anzahl }), klasse: 'bos-btn--amber' });
    else if (!ergebnis.fehler.length) html += '<p class="sheet-info">' + esc(t('import_nichts')) + '</p>';
    knoepfe.push({ aktion: 'abbrechen', text: t('abbrechen') });
    oeffneEdit(t('import_titel'), html, knoepfe);
  };
  leser.readAsText(datei);
});
async function fuehreImportAus() {
  if (!importZustand) return;
  const plan = importZustand.plan, n = importZustand.anzahl;
  const knoepfe = document.querySelectorAll('#editKnoepfe button');
  knoepfe.forEach(function (b) { b.disabled = true; });
  const info = document.getElementById('editInfo');
  const zutatId = {};
  L.aktiv(S.zutaten).forEach(function (z) { zutatId[L.norm(z.name)] = z.id; });
  let i = 0;
  const schritt = function () { i++; info.textContent = t('import_laeuft', { i: i, n: n }); };
  try {
    /* Eins nach dem anderen, jedes mit eigener Sicherung: bleibt unter der
       Zugriffsgrenze der Regel und ist bei Abbruch wiederholbar. */
    for (const e of plan.teige) { if (e.aktion !== 'neu') continue; schritt();
      await schreibe(COL.teige, e.daten.kennung, L.teigDokument(e.daten, zutatId), 'anlegen', null, true); }
    for (const e of plan.teige) {
      const w = e.aktion === 'neu' ? L.teigwerteDokument(e.daten) : null;
      if (!w || S.teigwerte[e.daten.kennung]) continue;
      schritt();
      await schreibe(COL.teigwerte, e.daten.kennung, w, 'anlegen', null, true);
    }
    info.textContent = t('import_fertig', { n: n });
    importZustand = null;
    document.getElementById('editKnoepfe').innerHTML = '<button type="button" class="bos-btn" data-aktion="abbrechen">' + esc(t('schliessen')) + '</button>';
  } catch (err) {
    info.textContent = t('import_abbruch', { i: i, n: n });
    editFehler(fehlerText(t('err_speichern'), err));
    zeigeFehler(t('import_titel'), err);
    knoepfe.forEach(function (b) { b.disabled = false; });
  }
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', function (e) {
  const el = e.target.closest('[data-aktion]');
  if (!el || el.disabled) return;
  const a = el.getAttribute('data-aktion'), id = el.getAttribute('data-id');
  const st = S.strecke;
  switch (a) {
    /* Liste */
    case 'neu-teig': oeffneStrecke(null); break;
    case 'strecke-oeffnen': oeffneStrecke(id); break;
    case 'sauer-bearbeiten': oeffneSauer(id); break;
    case 'sauer-speichern': speichereSauer(); break;
    case 'archiv-umschalten': S.zeigeArchiv = !S.zeigeArchiv; render(); break;
    case 'wiederherstellen': stelleWiederHer(el.getAttribute('data-col'), id); break;
    case 'startdaten': starteImport(); break;
    case 'import-los': fuehreImportAus(); break;
    /* Strecke */
    case 'strecke-abbrechen': if (!speichertGerade()) frageVerlassen(); break;
    case 'verwerfen': schliesseEdit(); schliesseStrecke(); break;
    case 'strecke-fertig': schliesseStrecke(); break;
    case 'schritt': geheZu(Number(el.getAttribute('data-n'))); break;
    case 'schritt-weiter': if (st) geheZu(st.schritt + 1); break;
    case 'schritt-zurueck': if (st) geheZu(st.schritt - 1); break;
    case 'brot-an': if (st) { brotUmschalten(el.getAttribute('data-lk')); } break;
    case 'sauer-antwort': if (st) { st.z.sauer.antwort = el.getAttribute('data-wert') === 'true'; st.geaendert = true; zeichneStrecke(); } break;
    case 'vorstufe-antwort': if (st) {
      st.z.vorstufe.ja = el.getAttribute('data-wert') === 'true';
      if (st.z.vorstufe.ja && !st.z.vorstufe.zeilen.length) st.z.vorstufe.zeilen.push({ zutatId: '', name: '', menge: null, einheit: 'kg' });
      st.geaendert = true; zeichneStrecke();
    } break;
    case 'zeile-plus': if (st) {
      const art = el.getAttribute('data-art');
      zeilenListe(art).push(art === 'vorstufe' ? { zutatId: '', name: '', menge: null, einheit: 'kg' } : { zutatId: '', menge: null, einheit: 'kg' });
      st.geaendert = true; zeichneStrecke();
    } break;
    case 'zeile-weg': if (st) { zeilenListe(el.getAttribute('data-art')).splice(Number(el.getAttribute('data-i')), 1); st.geaendert = true; zeichneStrecke(); } break;
    case 'bei-bedarf': if (st) {
      const liste = st.z.beiBedarf, i = liste.indexOf(id);
      if (i === -1) liste.push(id); else liste.splice(i, 1);
      el.setAttribute('aria-pressed', i === -1 ? 'true' : 'false'); st.geaendert = true;
      aktualisiereZusammenfassung();
    } break;
    case 'teig-archivieren': oeffneArchivFrage(); break;
    case 'archiv-ja': archiviereTeig(); break;
    case 'strecke-speichern': speichereStrecke(); break;
    case 'wdh-rezept': if (st && !speichertGerade()) schrittRezept().then(function (ok) { if (ok && st.sp.brote !== 'ok') return schrittBrote(); }); break;
    case 'wdh-brote': if (st && !speichertGerade()) schrittBrote(); break;
    case 'konflikt-behalten': if (st) { st.konflikt = ''; speichereStrecke(); } break;
    case 'konflikt-neu': if (st) { const k = st.z.kennung; st.geaendert = false; schliesseStrecke(); oeffneStrecke(k); } break;
    /* Blätter */
    case 'neuzutat-speichern': speichereNeueZutat(); break;
    case 'chip': {
      if (!editZustand || !editZustand.auswahl) break;
      const menge = editZustand.auswahl[el.getAttribute('data-feld')];
      if (menge.has(id)) menge.delete(id); else menge.add(id);
      el.setAttribute('aria-pressed', menge.has(id) ? 'true' : 'false');
      break;
    }
    case 'abbrechen': schliesseEdit(); break;
  }
});
